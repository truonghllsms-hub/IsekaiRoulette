ult_mage_breakthrough","races":["human"],"stages":["adult"],"require":{"flags":["mage"]},"weight":7,"text":"Một tia sáng giác ngộ lóe lên trong đầu khi bạn đang giải mã một cuốn cổ thư. Bạn đã thành công tự sáng tạo ra một thần chú tấn công cấp cao, nâng vị thế của mình lên hàng pháp sư thượng cấp tại Tháp Ngà.","effects":{"INT":2,"wealth":15,"joy":10}},{"id":"human_adult_child_fever","races":["human"],"stages":["adult"],"require":{"flags":["has_child"]},"weight":8,"text":"Đứa con nhỏ của bạn lên cơn sốt mê man giữa đêm đông giá rét. Khoảnh khắc ôm thân hình bé nhỏ nóng hầm hập, bạn nhận ra mọi quyền lực hay tiền tài thế gian đều vô nghĩa trước nụ cười của con trẻ.","effects":{"health":-5,"wealth":-10,"joy":-15}},{"id":"human_adult_plague_doctor_help","races":["human"],"stages":["adult"],"eras":["dark_age"],"weight":10,"text":"Dịch bệnh càn quét tàn khốc, các nhà thờ Thánh Quang đều quá tải. Một vị y sĩ kiệt sức nhờ bạn khoác lên bộ đồ mỏ quạ tẩm thảo mộc để mang thuốc đến những khu ổ chuột đang thoi thóp.","choices":[{"label":"Liều mạng tiến vào vùng tâm dịch","check":{"stat":"INT","target":6},"success":{"text":"Sự cẩn trọng và pha chế thuốc chuẩn xác giúp bạn cứu sống hàng chục mạng người mà không bị lây nhiễm. Nhân loại gọi bạn là sứ giả của sự sống giữa kỷ nguyên tăm tối.","effects":{"INT":1,"LUCK":1,"joy":15,"flags":["plague_savior"]},"moment":"Trở thành người hùng y sĩ cứu vớt mạng người trong đại dịch đen tối."},"fail":{"text":"Sự bất cẩn trong lúc tháo găng tay khiến bạn vô tình nhiễm phải mầm bệnh. Cơn ho nôn ra máu bắt đầu hành hạ cơ thể đang dần suy nhược của bạn.","effects":{"health":-30,"joy":-20}}},{"label":"Đóng cửa trốn trong nhà để tự vệ","text":"Bạn mặc kệ tiếng rên rỉ bên ngoài, chốt chặt mọi cánh cửa để bảo vệ bản thân. Đôi khi sự ích kỷ là lớp khiên vững chắc nhất của con người.","effects":{"health":5,"joy":-10}}]},{"id":"human_adult_war_promotion","races":["human"],"stages":["adult"],"eras":["holy_war"],"require":{"flags":["frontline_soldier"]},"weight":7,"text":"Trong một trận xáp lá cà đẫm máu, bạn may mắn chém đứt đầu gã chỉ huy phe địch và cắm lên ngọn giáo. Chiến công vang dội này lập tức mang về cho bạn một huân chương và vị trí đội trưởng Thánh Vệ Quân.","effects":{"STR":1,"wealth":20,"joy":10,"flags":["military_officer"]}},{"id":"human_adult_gambling_loss","races":["human"],"stages":["adult"],"once":false,"weight":5,"text":"Sức cám dỗ của sới bạc tại Đấu Trường Huyết Sa khiến bạn không giữ được lý trí, nướng sạch tiền lương tháng vào những ván bài đen đỏ. Nỗi ân hận muộn màng gặm nhấm tâm can kẻ thua cuộc.","effects":{"wealth":-15,"joy":-10}},{"id":"human_adult_court_intrigue_trap","races":["human"],"stages":["adult"],"require":{"flags":["clerk"]},"weight":9,"text":"Bạn tình cờ phát hiện sổ sách tham ô khổng lồ của ngài Bộ trưởng Ngân khố thành phố. Vị quan lớn này ngay lập tức ngầm gửi một túi đầy Tinh Bạc đến nhà bạn kèm theo một lời đe dọa úp mở.","choices":[{"label":"Tố cáo thẳng lên Giáo hội Thánh Quang","check":{"stat":"INT","target":8},"success":{"text":"Bằng sự nhanh trí và hồ sơ chặt chẽ, bạn đưa gã tham quan lên đoạn đầu đài và được thăng chức thay thế vị trí của hắn. Quyền lực vĩ đại rốt cuộc đã nằm gọn trong lòng bàn tay.","effects":{"INT":1,"wealth":25,"joy":15,"flags":["high_official"]},"moment":"Lật đổ tham quan và bước chân vào giới thượng lưu Sanctus."},"fail":{"text":"Mạng lưới quyền lực của hắn quá mạnh. Đơn tố cáo bị ỉm đi, còn bạn thì bị đuổi việc và đánh tàn phế một chân trong ngõ hẻm bởi đám côn đồ được thuê mướn.","effects":{"health":-20,"wealth":-10,"joy":-25,"unflags":["clerk","job"]}}},{"label":"Ngậm miệng ăn tiền giữ im lặng","text":"Bạn cất kỹ túi tiền và giả vờ như chưa từng xem qua cuốn sổ. Tiền bạc làm nhòa đi ranh giới đạo đức, biến bạn thành đồng phạm trong im lặng.","effects":{"wealth":30,"joy":-5,"flags":["corrupt"]}}]},{"id":"human_adult_swamp_gas_sick","races":["human"],"stages":["adult"],"once":false,"weight":5,"text":"Trong một lần băng qua ranh giới Đầm Lầy Tử Khí, bạn hít phải chướng khí độc hại khiến phổi đau rát như lửa đốt. Trải nghiệm thập tử nhất sinh nhắc nhở ranh giới mong manh giữa con người và thiên nhiên cuồng nộ.","effects":{"health":-12,"joy":-5}},{"id":"human_adult_dark_magic_backlash","races":["human"],"stages":["adult"],"require":{"flags":["dark_magic"]},"weight":7,"text":"Những thực thể tà ác từ Vực Thẳm Phân Tầng bất ngờ nổi loạn đòi nợ máu. Bạn phải cắn răng dùng chính sức sống của mình để trấn áp ma lực hắc ám đang cào xé trong huyết quản.","effects":{"health":-15,"INT":1,"joy":-10}},{"id":"human_adult_yggdrasil_pilgrim_bless","races":["human"],"stages":["adult"],"require":{"flags":["yggdrasil_mark"]},"weight":6,"text":"Vết bớt trên vai bỗng phát sáng khi bạn thực hiện chuyến hành hương sâu vào Đại Ngàn Lục Bảo. Cây Thế Giới ban cho bạn một luồng sinh khí tinh khiết, tẩy sạch mọi bệnh tật và mệt mỏi trần gian.","effects":{"health":20,"LUCK":1,"joy":10}},{"id":"human_adult_drunken_brawl_2","races":["human"],"stages":["adult"],"once":false,"weight":5,"text":"Đã qua tuổi bốc đồng nhưng bạn vẫn bị vướng vào một cuộc ẩu đả ngớ ngẩn tại quán rượu. Một chiếc ghế gỗ đập thẳng vào lưng khiến bạn đau điếng mất mấy ngày mới khỏi.","effects":{"health":-5,"wealth":-2}},{"id":"human_adult_merchant_scam_peace","races":["human"],"stages":["adult"],"eras":["peace"],"weight":6,"text":"Thời bình sinh ra lắm kẻ gian thương, bạn vô tình mua nhầm một lô vũ khí làm từ Tinh Bạc giả rẻ tiền. Bài học đắt giá về sự cả tin trên thương trường Aethelgard tốn của bạn không ít của cải.","effects":{"wealth":-15,"joy":-5}},{"id":"human_adult_demon_temptation_lord","races":["human"],"stages":["adult"],"eras":["demon_lord"],"weight":9,"text":"Đại tướng của Ma Vương xuất hiện trong giấc mộng, đề nghị ban cho bạn sự bất tử và của cải tiêu ba đời không hết nếu bạn chịu mở cổng thành Sanctus từ bên trong.","choices":[{"label":"Giữ vững nhân tính, cự tuyệt ác quỷ","check":{"stat":"INT","target":7},"success":{"text":"Ý chí sắt đá của loài người đập tan ảo ảnh ma quái. Bạn tỉnh dậy đẫm mồ hôi nhưng tâm hồn thanh thản rực sáng lòng tự hào về dòng máu kiêu hãnh của mình.","effects":{"INT":1,"LUCK":1,"joy":5}},"fail":{"text":"Lời nguyền của ác quỷ vì bị cự tuyệt đã giáng xuống tâm trí, gây ra những cơn đau đầu như búa bổ kéo dài nhiều tháng trời, rút cạn sinh lực phàm nhân.","effects":{"health":-15,"joy":-15}}},{"label":"Chấp nhận bán rẻ đồng loại","text":"Bạn đồng ý thỏa hiệp. Tuy nhận được phần thưởng khổng lồ từ thế lực hắc ám, nhưng sâu thẳm trong linh hồn bạn đã hoàn toàn mục nát và thối rữa.","effects":{"wealth":40,"joy":-25,"flags":["traitor","dark_aura"]}}]},{"id":"human_adult_bounty_hunted_run","races":["human"],"stages":["adult"],"require":{"flags":["outlaw"]},"weight":7,"text":"Danh tiếng tồi tệ khiến bạn lọt vào tầm ngắm của Hội Bóng Đêm. Những cuộc truy sát nửa đêm buộc bạn phải sống chui lủi như chuột nhắt, không một giấc ngủ nào được trọn vẹn bình yên.","effects":{"health":-10,"joy":-15,"AGI":1}},{"id":"human_adult_affair_resist_choice","races":["human"],"stages":["adult"],"require":{"flags":["married"]},"weight":8,"text":"Một quý tộc lộng lẫy và quyền lực tại thủ đô tỏ ra si mê và ngỏ ý muốn bạn trở thành nhân tình bóng tối của y, hứa hẹn một cuộc sống xa hoa nhung lụa.","choices":[{"label":"Kiên quyết từ chối để bảo vệ gia đình","check":{"stat":"INT","target":5},"success":{"text":"Bằng những lời lẽ khéo léo nhưng dứt khoát, bạn giữ được phẩm giá và tình yêu trung thủy. Sự thanh thản trong lương tâm đáng giá hơn mọi kho tàng trên lục địa.","effects":{"joy":10,"LUCK":1}},"fail":{"text":"Sự từ chối vụng về và gay gắt khiến kẻ quyền thế Phật ý, y âm thầm sử dụng quyền lực để chèn ép công việc làm ăn của bạn đến bờ vực phá sản.","effects":{"wealth":-20,"joy":-10}}},{"label":"Lén lút qua lại vì danh vọng","text":"Bạn lún sâu vào vũng bùn ái tình vụng trộm. Tiền bạc rủng rỉnh hơn nhưng bạn luôn sống trong nơm nớp lo sợ ngày sự thật vỡ lở phá nát tổ ấm.","effects":{"wealth":20,"joy":-15,"flags":["adulterer"]}}]},{"id":"human_adult_noble_funding_shop","races":["human"],"stages":["adult"],"require":{"flags":["noble_favor"]},"weight":6,"text":"Gia tộc quý tộc mà bạn từng mang ơn năm xưa bất ngờ gửi một khoản tiền lớn làm vốn kinh doanh. Sự chống lưng mạnh mẽ này giúp bạn nhanh chóng mở rộng cơ ngơi trên những con phố sầm uất nhất.","effects":{"wealth":30,"joy":15}},{"id":"human_adult_mercenary_veteran_scar","races":["human"],"stages":["adult"],"require":{"flags":["mercenary_camp"]},"weight":7,"text":"Một vết sẹo dài vắt ngang mặt từ trận chiến với tộc orc trở thành huy chương vinh dự của bạn. Trải qua bao máu và nước mắt, bạn giờ đây là một lính đánh thuê lão luyện khiến kẻ thù phải dè chừng.","effects":{"STR":1,"wealth":15,"joy":5}},{"id":"human_adult_beast_attack_road_choice","races":["human"],"stages":["adult"],"once":false,"weight":9,"text":"Chiếc xe ngựa của bạn bị một bầy Huyết Lang đói khát phục kích trên đường tới Thảo Nguyên Gió Hú. Đàn sói mắt đỏ au gầm gừ thu hẹp vòng vây xung quanh con mồi phàm nhân đơn độc.","choices":[{"label":"Tút kiếm chiến đấu tới cùng","check":{"stat":"STR","target":6},"success":{"text":"Kỹ năng chiến đấu điêu luyện giúp bạn liên tiếp chém hạ những con sói đầu đàn. Bầy thú hoảng sợ tan tác, để lại chiến lợi phẩm là những bộ lông Huyết Lang đắt tiền.","effects":{"STR":1,"wealth":15,"joy":5}},"fail":{"text":"Bạn bị bầy sói quật ngã và xé rách nhiều mảng da thịt. Phải nhờ đến một đoàn kỵ binh tuần tra đi ngang qua nổ súng giải vây, bạn mới giữ lại được mạng sống tàn tạ.","effects":{"health":-20,"joy":-15}}},{"label":"Tháo ngựa phi thân bỏ chạy","text":"Bạn vội vàng cắt dây cương, cưỡi ngựa chạy trối chết bỏ lại toàn bộ hành lý và xe kéo. Giữ được mạng sống nhưng tài sản tích cóp coi như trôi sông đổ biển.","effects":{"wealth":-20,"joy":-10,"AGI":1}}]},{"id":"human_middle_aging_joints","races":["human"],"stages":["middle"],"once":false,"weight":7,"text":"Sương giá mùa Săn Bão ùa về làm các khớp xương của bạn nhức mỏi dữ dội. Thời gian tàn nhẫn đang dần rút cạn sinh lực của tuổi trẻ, nhắc nhở về sự hữu hạn của kiếp người ngắn ngủi.","effects":{"health":-8,"STR":-1,"joy":-5}},{"id":"human_middle_gray_hair_mirror","races":["human"],"stages":["middle"],"weight":6,"text":"Đứng trước gương đồng, bạn phát hiện ra những sợi tóc bạc trắng đầu tiên lấp ló trên mái đầu. Một nửa đời người đã trôi qua như bóng câu qua cửa sổ, mang theo bao nụ cười và nước mắt.","effects":{"joy":-3,"INT":1}},{"id":"human_middle_child_leave_home","races":["human"],"stages":["middle"],"require":{"flags":["has_child"]},"weight":7,"text":"Đứa con mà bạn hằng yêu thương nay đã khôn lớn, khoác ba lô lên vai rời khỏi mái ấm để tự viết nên bản sử thi của riêng mình. Sự trống trải bao trùm căn nhà nhỏ, nhưng cũng xen lẫn niềm tự hào khôn tả.","effects":{"joy":-10,"wealth":-5},"moment":"Tự hào nhìn con cái trưởng thành rời vòng tay cha mẹ."},{"id":"human_middle_teach_apprentice_choice","races":["human"],"stages":["middle"],"require":{"flags":["job"]},"weight":9,"text":"Một thiếu niên nghèo khó, đôi mắt sáng rực khát vọng quỳ trước cửa nhà bạn, tha thiết xin được theo học nghề để đổi đời.","choices":[{"label":"Nhận làm học trò và dốc lòng truyền thụ","check":{"stat":"INT","target":6},"success":{"text":"Với kinh nghiệm dày dạn, bạn dìu dắt đứa trẻ trở thành một người thợ tài ba. Di sản và tay nghề của bạn từ nay đã có người kế thừa xứng đáng trên lục địa Aethelgard.","effects":{"INT":1,"joy":15,"flags":["has_apprentice"]}},"fail":{"text":"Bản tính nóng nảy và phương pháp dạy dỗ khắc nghiệt khiến đứa trẻ không chịu nổi áp lực, ăn cắp một ít tiền rồi bỏ trốn trong đêm. Niềm tin vào con người đôi khi bị phản bội cay đắng.","effects":{"wealth":-5,"joy":-10}}},{"label":"Đóng cửa từ chối phiền phức","text":"Bạn mệt mỏi xua tay đuổi cậu bé đi, tự nhủ rằng tuổi trung niên chỉ cần sự yên tĩnh chứ không cần thêm gánh nặng bao đồng.","effects":{"joy":-5,"health":3}}]},{"id":"human_middle_risky_investment_sea","races":["human"],"stages":["middle"],"eras":["peace"],"weight":9,"text":"Một tay thương nhân khét tiếng rủ bạn góp toàn bộ số vốn liếng tiết kiệm cả đời vào một chuyến tàu viễn dương nguy hiểm nhưng hứa hẹn siêu lợi nhuận tới Đảo Tro Tàn.","choices":[{"label":"Cược một ván lớn cuối đời","check":{"stat":"LUCK","target":7},"success":{"text":"Nữ thần may mắn đã mỉm cười rạng rỡ. Chuyến tàu trở về đầy ắp hỏa thạch và trân châu, biến bạn trở thành một trong những người giàu có nhất thành phố Sanctus chỉ sau một đêm.","effects":{"wealth":40,"LUCK":1,"joy":20}},"fail":{"text":"Hung tin ập về như sét đánh ngang tai: con tàu đã bị thủy quái nhấn chìm cùng toàn bộ hàng hóa. Cơ ngơi cả đời tích cóp phút chốc hóa thành bọt biển mặn chát.","effects":{"wealth":-35,"health":-15,"joy":-25}}},{"label":"Giữ chặt tiền trong túi, an hưởng tuổi già","text":"Bạn lắc đầu từ chối sự cám dỗ, bằng lòng với cuộc sống bình dị hiện tại. Tiền tài dẫu ít nhưng đổi lại là giấc ngủ bình yên không vướng bận âu lo.","effects":{"health":5,"joy":5}}]},{"id":"human_middle_old_wound_ache","races":["human"],"stages":["middle"],"require":{"flags":["adventurer"]},"once":false,"weight":7,"text":"Mỗi khi Thảo Nguyên Gió Hú nổi cơn dông, những vết sẹo cũ từ thuở mạo hiểm giả lại nhức nhối tận xương tủy. Đó là cái giá đắt đỏ mà tuổi trẻ bồng bột đã để lại trên thân thể đang dần rệu rã của bạn.","effects":{"health":-5,"joy":-3}},{"id":"human_middle_mentor_clerks","races":["human"],"stages":["middle"],"require":{"flags":["high_official"]},"weight":6,"text":"Bạn đứng trên bục cao, truyền đạt nghệ thuật cai trị và quản lý thuế khóa cho tầng lớp quan lại trẻ tuổi của Sanctus. Quyền lực thật sự không nằm ở thanh gươm, mà ở khả năng thao túng những con số trên giấy da.","effects":{"INT":1,"joy":5}},{"id":"human_middle_holy_war_sponsor","races":["human"],"stages":["middle"],"eras":["holy_war"],"require":{"below":{"wealth":-20},"flags":["merchant_kin"]},"weight":8,"text":"Nhà thờ kêu gọi quyên góp cho Chiến Tranh Tuyến Đầu, bạn hào phóng xuất kho hàng trăm Lõi Mana và vũ khí để tài trợ. Không thể tự mình ra trận, bạn dùng tiền bạc để mua lấy sự kính trọng và danh tiếng yêu nước.","effects":{"wealth":-30,"joy":10,"flags":["war_sponsor"]}},{"id":"human_middle_dark_age_militia","races":["human"],"stages":["middle"],"eras":["dark_age"],"weight":8,"text":"Khi cái đói khiến lưu manh lộng hành, bạn đứng ra tập hợp dân binh trong khu phố, lập chiến lũy bảo vệ chút lương thực mọn mằn cuối cùng. Trong hoàn cảnh khốn cùng, một con người bình thường cũng có thể trở thành người dẫn đường vĩ đại.","effects":{"STR":1,"health":-5,"joy":5,"flags":["local_leader"]}},{"id":"human_middle_demon_spy_confront","races":["human"],"stages":["middle"],"eras":["demon_lord"],"weight":10,"text":"Bạn tình cờ phát hiện tên hàng xóm hiền lành thực chất là một Succubus đột lốt người đang âm mưu bỏ độc vào nguồn nước của thành phố.","choices":[{"label":"Rút vũ khí tiêu diệt ác quỷ","check":{"stat":"STR","target":7},"success":{"text":"Bằng kinh nghiệm xương máu của nửa đời người, bạn chém rụng đầu con quỷ trước khi nó kịp niệm chú. Chiến công thầm lặng này đã cứu sống hàng ngàn dân thường vô tội.","effects":{"STR":1,"joy":10,"flags":["demon_slayer"]},"moment":"Giết ác quỷ ẩn nấp, cứu nguồn nước của Sanctus."},"fail":{"text":"Tuổi tác làm chậm nhịp phản xạ, bạn trúng phải độc hương của Succubus và gục ngã xuống sàn. May mắn thay, tiếng động đã thu hút đội tuần tra Thánh Vệ Quân đến kịp lúc để giành lại mạng sống cho bạn.","effects":{"health":-25,"STR":-1,"joy":-15}}},{"label":"Lén lút báo tin cho Thánh Vệ Quân","text":"Biết mình không còn sung sức, bạn cẩn trọng luồn ra cửa sau đi báo tin. Quân đội kéo đến tóm gọn con quỷ, bạn nhận được chút tiền thưởng nhỏ và sự an toàn tuyệt đối.","effects":{"wealth":10,"LUCK":1}}]},{"id":"human_middle_write_grimoire","races":["human"],"stages":["middle"],"require":{"flags":["mage"]},"weight":7,"text":"Bạn bắt đầu chắp bút viết nên cuốn ma đạo thư của riêng mình, ghi chép lại những cấm thuật đã lĩnh hội cả đời. Tri thức là cách duy nhất để nhân loại vượt qua giới hạn của cái chết.","effects":{"INT":2,"joy":10,"flags":["grimoire_author"]},"moment":"Hoàn thành cuốn ma đạo thư để đời, lưu danh tại Tháp Ngà."},{"id":"human_middle_pass_hammer","races":["human"],"stages":["middle"],"require":{"flags":["master_smith"]},"weight":7,"text":"Nhìn đôi tay rung rẩy không còn giữ vững chiếc búa tạ, bạn quyết định trao lại lò rèn cho người đồ đệ xuất sắc nhất. Thời khắc lùi về hậu trường dẫu xót xa nhưng là một quy luật tất yếu của sinh tử.","effects":{"STR":-1,"wealth":20,"joy":-5}},{"id":"human_middle_villa_purchase","races":["human"],"stages":["middle"],"require":{"below":{"wealth":-40}},"weight":6,"text":"Với số của cải kếch xù tích lũy được, bạn tậu một trang viên rộng lớn rợp bóng cây xanh ở vùng ngoại ô yên tĩnh. Sau bao giông bão, cuối cùng bạn cũng có một chốn lui về hoàn mỹ để an hưởng nửa đời còn lại.","effects":{"wealth":-35,"joy":25,"health":10,"flags":["villa_owner"]}},{"id":"human_middle_severe_illness","races":["human"],"stages":["middle"],"weight":9,"text":"Một cơn đột quỵ kinh hoàng ập đến trong đêm, đánh gục cơ thể từng một thời cường tráng của bạn. Tử thần đang gõ cửa, đe dọa kết thúc trang sử thi hãy còn dang dở.","choices":[{"label":"Nghiến răng chống chọi với bệnh tật","check":{"stat":"STR","target":8},"success":{"text":"Sức sống ngoan cường của loài người một lần nữa chiến thắng tử thần. Bạn tỉnh dậy sau ba ngày hôn mê, cơ thể tuy suy nhược nhưng ngọn lửa sinh mệnh vẫn tiếp tục bừng cháy.","effects":{"health":-15,"LUCK":1}},"fail":{"text":"Sự kiệt quệ của tuổi tác không cho phép bạn vượt qua cơn bạo bệnh tàn khốc này.","death":"Bạn trút hơi thở cuối cùng trên giường bệnh, vĩnh viễn khép lại đôi mắt nhìn đời ở tuổi {age}."}},{"label":"Dốc toàn bộ gia sản thuê Thánh y chữa trị","text":"Bạn tiêu tán gần hết cơ đồ để mời được vị Giám mục cao cấp nhất của Giáo hội dùng phép thuật chữa lành. Sinh mạng được giữ lại, nhưng gia tài nay đã cạn kiệt.","effects":{"wealth":-40,"health":15,"joy":-10}}]},{"id":"human_middle_silver_anniversary","races":["human"],"stages":["middle"],"require":{"flags":["married"]},"weight":7,"text":"Bạn cùng người bạn đời kỷ niệm hàng chục năm chung sống, mái tóc cả hai đã điểm sương nhưng ánh mắt trao nhau vẫn vẹn nguyên tình cảm thuở ban đầu. Tình yêu đích thực là phép màu vĩ đại nhất của nhân loại.","effects":{"joy":20,"health":5}},{"id":"human_middle_sunset_watch","races":["human"],"stages":["middle"],"once":false,"weight":5,"text":"Ngồi lặng yên trên hiên nhà ngắm ánh hoàng hôn đỏ rực buông xuống Đồng Bằng Thánh Quang, bạn cảm nhận được sự nhỏ bé của bản ngã. Những oán hận tham sân si thuở trẻ bỗng chốc tan biến vào hư không.","effects":{"joy":10,"INT":1}},{"id":"human_middle_political_sides","races":["human"],"stages":["middle"],"require":{"flags":["high_official"]},"weight":9,"text":"Triều đình Sanctus chao đảo vì cuộc tranh giành quyền lực giữa Thái tử và Công tước phương Bắc. Là một nhân vật cộm cán, bạn bị bắt buộc phải chọn phe trong ván cờ chính trị đẫm máu này.","choices":[{"label":"Đánh cược ủng hộ Công tước phương Bắc","check":{"stat":"INT","target":8},"success":{"text":"Tầm nhìn sắc sảo giúp bạn chọn đúng minh chúa. Cuộc đảo chính thành công rực rỡ, đưa bạn vươn lên tột đỉnh vinh quang, trở thành một trong những công thần khai quốc thế hệ mới.","effects":{"INT":1,"wealth":40,"flags":["duke_ally"]},"moment":"Phò tá Công tước phương Bắc, vươn lên tột đỉnh quyền lực."},"fail":{"text":"Phe Công tước thất bại thảm hại. Bạn bị lính của Thái tử bắt giam, tịch thu phần lớn tài sản và bị đày ải làm một kẻ thường dân không chốn dung thân.","effects":{"wealth":-40,"joy":-30,"unflags":["high_official","noble"]}}},{"label":"Cáo ốm rút lui khỏi triều đình","text":"Bạn khôn khéo giả bệnh, nộp đơn từ quan lui về ở ẩn. Không có được quyền lực tối thượng nhưng bạn đã giữ cho bản thân và gia tộc bình an vô sự qua cơn bão táp.","effects":{"wealth":-10,"joy":5,"unflags":["high_official"]}}]},{"id":"human_middle_betrayal_investigation","races":["human"],"stages":["middle"],"require":{"flags":["military_officer"]},"weight":8,"text":"Bạn phát hiện ra phó quan của mình đang lén lút tuồn vũ khí cho quân phiến loạn ở Thảo Nguyên Gió Hú. Sự phản bội từ người từng kề vai sát cánh như một nhát dao đâm thẳng vào tim bạn.","choices":[{"label":"Tự tay hành quyết kẻ phản bội","check":{"stat":"STR","target":6},"success":{"text":"Lưỡi gươm công lý không chớp mắt chém rơi đầu kẻ phản trắc. Bạn giữ vững được kỷ luật quân đội, nhưng tâm hồn lại mang thêm một vết sẹo chẳng thể xóa nhòa.","effects":{"joy":-10,"STR":1}},"fail":{"text":"Tên phó quan ranh mãnh đã lường trước sự việc, hắn đâm bạn một nhát trọng thương rồi bỏ trốn, để lại bạn gục trên vũng máu của chính mình.","effects":{"health":-20,"joy":-15}}},{"label":"Giải giáp hắn và giao cho tòa án binh","text":"Bạn chọn cách xử lý theo đúng quân pháp, tránh phải tự tay vấy máu người quen. Hắn bị treo cổ công khai, còn bạn thì chìm trong men rượu để quên đi nỗi buồn nhân thế.","effects":{"joy":-5,"health":-3}}]},{"id":"human_elder_grandchild_born","races":["human"],"stages":["elder"],"require":{"flags":["has_child"]},"weight":8,"text":"Đứa cháu nội đầu tiên cất tiếng khóc chào đời, thân hình bé xíu nằm gọn trong vòng tay chai sạn của bạn. Dòng máu gia tộc tiếp tục chảy mãi, chứng minh sự trường tồn vĩ đại của sinh mệnh con người.","effects":{"joy":25,"health":5,"flags":["has_grandchild"]},"moment":"Bế trên tay đứa cháu nội đầu tiên, viên mãn tuổi xế chiều."},{"id":"human_elder_failing_senses","races":["human"],"stages":["elder"],"once":false,"weight":8,"text":"Đôi mắt từng tinh tường nhìn thấu vạn dặm nay bỗng mờ đục, hàm răng rụng dần khiến việc nhai thịt nướng trở thành dĩ vãng. Lão hóa là một nhà tù giam lỏng mà nhân loại không cách nào phá vỡ.","effects":{"health":-10,"STR":-1,"AGI":-1,"joy":-10}},{"id":"human_elder_storytelling_kids","races":["human"],"stages":["elder"],"eras":["peace"],"once":false,"weight":6,"text":"Bầy trẻ con xóm giềng quây quần bên đống lửa, say sưa nghe bạn kể về những trận chiến hiển hách xa xưa. Chút hào quang quá khứ rực rỡ trở thành món quà tinh thần quý giá truyền lại cho thế hệ mai sau.","effects":{"joy":10,"INT":1}},{"id":"human_elder_church_prayers","races":["human"],"stages":["elder"],"eras":["holy_war"],"weight":7,"text":"Không còn sức cầm gươm, bạn quỳ gối dưới bức tượng Nữ thần Lumina hàng giờ liền để cầu nguyện bình an cho những lính trẻ đang đổ máu ngoài sa trường. Đức tin là chỗ dựa cuối cùng khi thể xác đã cạn kiệt.","effects":{"joy":5,"health":-3,"LUCK":1}},{"id":"human_elder_harsh_winter_survive","races":["human"],"stages":["elder"],"eras":["dark_age"],"weight":8,"text":"Mùa Săn Bão ập đến với cái rét cắt da cắt thịt. Chút lương thực ôi thiu và chiếc chăn mỏng manh barely giữ cho thân già thoi thóp qua ngày. Sống sót ở tuổi này đôi khi còn khó hơn cả việc ra trận đánh ma vương.","effects":{"health":-15,"joy":-10}},{"id":"human_elder_demon_evacuation_refuse","races":["human"],"stages":["elder"],"eras":["demon_lord"],"weight":9,"text":"Quân Đoàn Hủy Diệt áp sát ngoại ô, kèn lệnh sơ tán réo rắt. Gia đình cố lôi bạn lên xe ngựa tháo chạy, nhưng nhìn căn nhà gắn bó cả đời người, bạn chần chừ không muốn bước.","choices":[{"label":"Ở lại tử thủ cùng ngôi nhà","check":{"stat":"STR","target":6},"success":{"text":"Bạn giương cây nỏ cũ bắn gục hai tên ma vật định phóng hỏa căn nhà, cầm cự đủ lâu để đội kỵ binh Thánh Vệ tới ứng cứu. Dù thân già yếu ớt, bạn chứng minh mình không phải một kẻ dễ bắt nạt.","effects":{"STR":1,"joy":15,"flags":["stubborn_survivor"]}},"fail":{"text":"Khí lực khô cạn không cho phép bạn giương nổi cây nỏ. Đám ma vật phá cửa xông vào, nhe nanh múa vuốt lao đến chỗ ông lão đơn độc.","death":"Ngọn lửa ma quái thiêu rụi căn nhà gỗ, mang theo cả linh hồn của kẻ bám víu kỷ niệm về với cát bụi lúc {age} tuổi."}},{"label":"Nuốt nước mắt rời đi cùng con cháu","text":"Bạn quay lưng bước lên xe, bất lực nhìn tổ ấm cả đời phút chốc bị chìm trong biển lửa ác quỷ. Dẫu mất tất cả, nhưng gia đình vẫn bình an bên nhau.","effects":{"wealth":-20,"joy":-15,"health":5}}]},{"id":"human_elder_lost_mana_connection","races":["human"],"stages":["elder"],"require":{"flags":["mage"]},"weight":7,"text":"Khi cố gắng thi triển một câu thần chú làm ấm phòng, ngón tay bạn chỉ lóe lên tia lửa yếu ớt rồi tắt lịm. Sự liên kết với cội nguồn ma pháp đã dần khô cạn theo năm tháng sinh mệnh.","effects":{"INT":-1,"joy":-10}},{"id":"human_elder_see_own_sword","races":["human"],"stages":["elder"],"require":{"flags":["master_smith"]},"weight":6,"text":"Trong một dịp dạo chợ, bạn bắt gặp một dũng sĩ trẻ tự hào đeo thanh kiếm Huyết Kim có khắc ấn tín của bạn năm xưa. Di sản của bạn đã và đang tiếp tục bảo vệ nền hòa bình của nhân loại.","effects":{"joy":15}},{"id":"human_elder_attic_relic","races":["human"],"stages":["elder"],"weight":8,"text":"Khi dọn dẹp tầng gác xép bụi bặm, bạn tình cờ tìm thấy một chiếc rương cổ giấu kín sau lớp ván gỗ mục nát, bên trong phát ra một thứ ánh sáng ma mị nhàn nhạt.","choices":[{"label":"Mở khóa bằng chút sức tàn","check":{"stat":"LUCK","target":6},"success":{"text":"Chiếc rương chứa một mảnh Thánh tích tinh khiết, xua tan mọi đau đớn bệnh tật trên cơ thể già nua. Một phước lành kỳ diệu đến vào những năm tháng cuối đời.","effects":{"LUCK":1,"health":25,"joy":20}},"fail":{"text":"Bụi độc ma thuật tỏa ra từ ổ khóa khiến bạn ho sặc sụa và ngã gục. Trò đùa tai ác của số phận cướp đi chút sinh lực mỏng manh còn sót lại.","effects":{"health":-20,"joy":-10}}},{"label":"Khóa kín lại rương và đem vứt","text":"Với trí tuệ của kẻ trải đời, bạn hiểu rằng những món đồ ma quái thường mang họa nhiều hơn phúc. Sự cẩn trọng một lần nữa giữ cho bạn an toàn.","effects":{"INT":1,"joy":-3}}]},{"id":"human_elder_garden_tending","races":["human"],"stages":["elder"],"once":false,"weight":5,"text":"Thú vui duy nhất của bạn giờ đây là tỉa tót những bụi hoa hồng gai trước hiên nhà. Nhìn những mầm non vươn lên từ đất cằn cỗi, tâm hồn người già tìm thấy một sự bình yên thanh tịnh vô bờ bến.","effects":{"joy":8,"health":3}},{"id":"human_elder_graveyard_visit","races":["human"],"stages":["elder"],"once":false,"weight":6,"text":"Chống gậy lê bước ra nghĩa trang của thị trấn, bạn lặng lẽ nhổ cỏ trên mộ của những cố nhân xa xưa. Bạn nhận ra mình là một trong những kẻ cuối cùng của thời đại cũ còn sót lại trên cõi dương gian.","effects":{"joy":-5,"INT":1}},{"id":"im_wings","races":["imp"],"stages":["infant"],"weight":10,"text":"Bạn vỗ đôi cánh dơi nhỏ xíu lần đầu tiên và bay lên được một gang tay. Rồi một con Chó Địa Ngục ngoạm lấy đuôi bạn kéo xuống.","effects":{"AGI":1,"health":-3}},{"id":"im_prank","races":["imp"],"stages":["child"],"weight":8,"text":"Bạn giấu chiếc mũ sắt của một lính gác quỷ vào vạc dầu sôi. Cả Ma giới cười ầm lên, trừ gã lính gác và cái đít của bạn sau đó.","effects":{"joy":8,"health":-5}},{"id":"im_summoned","races":["imp"],"stages":["teen"],"weight":10,"require":{"notFlags":["familiar_pet"]},"text":"Một vòng tròn ma thuật bùng sáng dưới chân, kéo bạn lên nhân giới. Một Pháp sư loài người nhìn bạn bằng ánh mắt của kẻ vừa mua được cây chổi mới.","effects":{"INT":1,"flags":["familiar_pet"]},"moment":"Bị triệu hồi lên nhân giới"},{"id":"im_ms_master_dead","races":["imp"],"stages":["teen","adult"],"weight":10,"require":{"flags":["familiar_pet"]},"text":"Giữa đêm khuya, một lưỡi dao găm cắm phập vào lưng chủ nhân của bạn. Lão Pháp sư ngã gục, khế ước giữa hai người run rẩy như sợi chỉ sắp đứt.","choices":[{"label":"Cướp của rồi chuồn","text":"Bạn vơ vét mọi đồng vàng trong tháp rồi bay qua cửa sổ. Tự do, và giàu có.","effects":{"wealth":25,"unflags":["familiar_pet"]}},{"label":"Cướp linh hồn lão","check":{"stat":"INT","target":6},"success":{"text":"Bạn há miệng hút lấy linh hồn đang rời khỏi xác lão. Khế ước vỡ tan, và ma lực của lão giờ là của bạn.","effects":{"INT":2,"flags":["soul_thief"],"unflags":["familiar_pet"]},"moment":"Nuốt linh hồn chủ nhân"},"fail":{"text":"Khế ước phản phệ, xé toạc một bên cánh của bạn.","effects":{"health":-40,"unflags":["familiar_pet"]}}},{"label":"Cứu mạng lão","text":"Bạn đốt lửa cầm máu cho lão suốt đêm. Lão sống sót, và lần đầu tiên gọi bạn bằng tên. Ma giới sẽ khinh bỉ bạn mãi mãi.","effects":{"joy":15,"flags":["kindhearted"]},"moment":"Cứu mạng chủ nhân"}]},{"id":"im_ms_demon_slave","races":["imp"],"stages":["child","teen"],"weight":9,"text":"Một High Demon túm lấy cổ bạn và tuyên bố từ nay bạn là tay sai của hắn.","choices":[{"label":"Luồn cúi nịnh bợ","text":"Bạn gãi lưng cho hắn mỗi sáng và khen sừng hắn mỗi tối. Bạn sống, và sống khá an toàn.","effects":{"health":5,"joy":-5}},{"label":"Trộm báu vật rồi trốn","check":{"stat":"AGI","target":9},"success":{"text":"Bạn đánh cắp viên hồng ngọc yêu thích của hắn và biến mất vào hư không. Cả Ma giới dán chân dung bạn khắp nơi.","effects":{"wealth":40,"flags":["wanted"]},"moment":"Trộm báu vật của một High Demon"},"fail":{"text":"Hắn bắt được bạn khi bạn chỉ còn cách cửa một sải cánh.","death":"High Demon bóp nát bạn như bóp một con ruồi, ở tuổi {age}."}},{"label":"Đào ngũ lên mặt đất","text":"Bạn trốn qua một khe nứt và chui lên mặt đất. Từ nay, bạn là kẻ bị cả Ma giới truy nã.","effects":{"joy":5,"flags":["wanted"]}}]},{"id":"im_ms_contract","races":["imp"],"stages":["adult","middle"],"weight":9,"text":"Một kẻ tuyệt vọng quỳ trước mặt bạn trong nghĩa địa, hai tay dâng lên giọt máu của chính mình. Hắn muốn một khế ước.","choices":[{"label":"Lừa lấy linh hồn","text":"Bạn trao cho hắn một điều ước rỗng tuếch và lấy đi linh hồn thật. Thêm một viên ngọc trong bộ sưu tập.","effects":{"INT":2,"wealth":10}},{"label":"Trao sức mạnh thật","text":"Bạn ban cho hắn sức mạnh thực sự. Mười năm sau, hắn trở thành bạo chúa của cả một vương quốc.","effects":{"joy":5,"flags":["tyrant_maker"]},"moment":"Tạo ra một Bạo chúa"},{"label":"Cười nhạo rồi bay đi","text":"Bạn cười sằng sặc và bay vút vào màn đêm. Trêu người vẫn là thú vui lớn nhất đời bạn.","effects":{"joy":8}}]},{"id":"im_ms_seal","races":["imp"],"stages":["middle","elder"],"weight":7,"text":"Trong một phế tích bị lãng quên, bạn phát hiện một phong ấn cổ đại đang rạn nứt. Thứ gì đó bên dưới đang thở.","choices":[{"label":"Phá phong ấn","check":{"stat":"LUCK","target":6},"success":{"text":"Phong ấn vỡ tan, thứ bên dưới thoát ra và gieo rắc hỗn loạn khắp vùng. Nó cảm ơn bạn bằng một rương vàng.","effects":{"wealth":20,"flags":["chaos_bringer"]},"moment":"Giải phóng quái vật bị phong ấn"},"fail":{"text":"Thứ bên dưới đói, và bạn ở gần nhất.","effects":{"health":-40}}},{"label":"Hấp thụ năng lượng đen","text":"Bạn hút lấy dòng năng lượng rò rỉ. Đầu óc bạn sáng bừng, dù thân thể đau như bị thiêu đốt.","effects":{"INT":3,"health":-10}},{"label":"Bán tin cho Giáo hội","text":"Giáo hội trả bạn một túi vàng. Ma giới gọi bạn là Kẻ chỉ điểm.","effects":{"wealth":30,"flags":["informant"]}}]},{"id":"im_old","races":["imp"],"stages":["elder"],"weight":8,"text":"Cánh bạn trụi lông, đuôi gãy một khúc. Nhưng dưới gầm giường, đống vàng ăn cắp cả đời vẫn lấp lánh như thuở nào.","effects":{"joy":8}},{"id":"imp_infant_soul_scraps","races":["imp"],"stages":["infant"],"weight":5,"require":{"flags":["hellborn"]},"text":"Bạn lén lút liếm láp những vụn linh hồn rơi vãi dưới sàn nhà ngập ngụa hắc ám. Hương vị đắng chát của sự sống lụi tàn thắp lên ngọn lửa nhận thức đầu tiên trong tâm trí bạn.","effects":{"INT":1,"joy":5}},{"id":"imp_infant_hellhound_bully","races":["imp"],"stages":["infant"],"weight":5,"once":false,"text":"Một bầy chó săn địa ngục gầm gừ lao tới, ngoạm lấy đôi cánh dơi non nớt của bạn và quăng quật không thương tiếc. Kẻ yếu tại Ma giới chỉ có thể cắn răng chịu đựng để lớn lên.","effects":{"health":-10,"joy":-5}},{"id":"imp_infant_cauldron_dip","races":["imp"],"stages":["infant"],"weight":4,"once":false,"text":"Trượt chân rơi tõm vào vạc dầu đun sôi, làn da đỏ au của bạn không hề cháy rụi mà lại hấp thụ nhiệt lượng hừng hực. Ngọn lửa nguyên thủy đang tôi luyện lớp vỏ bọc yếu ớt này.","effects":{"STR":1,"health":-5}},{"id":"imp_infant_dark_gnaw","races":["imp"],"stages":["infant"],"eras":["dark_age"],"weight":4,"text":"Giữa kỷ nguyên bệnh dịch lan tràn, bạn phải gặm nhấm một khúc xương mục nát nhuốm đầy tử khí để chống lại cơn đói. Bóng tối ăn mòn thể xác, nhưng cũng hun đúc ý chí sinh tồn.","effects":{"health":-8,"joy":-10,"STR":1}},{"id":"imp_infant_wand_poke","races":["imp"],"stages":["infant"],"weight":5,"require":{"flags":["familiar_pet"]},"text":"Một tên pháp sư tập sự dùng đũa phép chọc mạnh vào người bạn, phóng ra những tia điện giật tung người. Nỗi đau thể xác nhắc nhở bạn về thân phận nô lệ hèn mọn chốn trần gian.","effects":{"health":-15,"INT":1,"joy":-10}},{"id":"imp_infant_cape_grab","races":["imp"],"stages":["infant"],"weight":8,"text":"Một Thượng Đẳng Ma Tộc lướt qua mang theo uy áp hủy diệt, vạt áo choàng đen tuyền của hắn quệt gần chỗ bạn. Số phận vẫy gọi kẻ liều lĩnh bấu víu lấy quyền lực.","choices":[{"label":"Nhảy lên bám lấy vạt áo","check":{"stat":"AGI","target":5},"success":{"text":"Bạn bám chặt lấy lớp vải ma thuật, được mang bay vút qua những tầng Vực Thẳm và nhặt được vài tinh thể quý giá. Quyền lực che chở kẻ nhanh nhạy.","effects":{"wealth":15,"LUCK":1},"moment":"Bạn đã dũng cảm đu bám một Thượng Đẳng Ma Tộc."},"fail":{"text":"Bạn trượt tay, ngã nhào xuống dòng dung nham cuộn trào bên dưới trong ánh nhìn dửng dưng của kẻ bề trên.","death":"Năm {age} tuổi, sinh mệnh nhỏ bé của bạn tan chảy trong dòng dung nham Vực Thẳm vì một cú nhảy tự mãn."}},{"label":"Rụt rè trốn vào đống tro tàn","text":"Bạn cuộn tròn người lại, tàng hình vào đống tro xám xịt để tránh bị dẫm nát. Sự hèn nhát đôi khi là tấm khiên vững chắc nhất.","effects":{"joy":-5,"AGI":1}}]},{"id":"imp_child_hide_weapon","races":["imp"],"stages":["child"],"weight":5,"once":false,"text":"Bạn tàng hình chớp nhoáng, nẫng mất cây rìu chiến của một gã Ngưu Đầu Nhân và giấu nó dưới đống phân dơi. Tiếng gầm rú điên loạn của hắn là bản giao hưởng tuyệt hảo nhất cho sự ranh ma của bạn.","effects":{"AGI":1,"joy":10}},{"id":"imp_child_flee_crusade","races":["imp"],"stages":["child"],"eras":["holy_war"],"weight":6,"text":"Thánh Vệ Quân tràn xuống Vực Thẳm, bạn bị cuốn theo dòng thác ma vật hoảng loạn dẫm đạp lên nhau chạy trốn. Ánh sáng của Nữ thần Lumina thiêu đốt da thịt, khắc sâu mối thù truyền kiếp.","effects":{"health":-20,"AGI":1}},{"id":"imp_child_sulfur_high","races":["imp"],"stages":["child"],"weight":4,"once":false,"text":"Bạn tìm thấy một kẽ nứt phun khói lưu huỳnh đặc quánh và hít lấy hít để một hơi dài. Ảo giác lâng lâng che mờ đi thực tại tàn khốc, dẫu phổi bạn đang kêu gào trong đau đớn.","effects":{"joy":15,"health":-5}},{"id":"imp_child_eavesdrop_curses","races":["imp"],"stages":["child"],"weight":5,"require":{"flags":["hellborn"]},"text":"Nấp trên xà nhà nứt nẻ, bạn lẩm nhẩm học theo những lời nguyền rủa tà ác mà bọn yêu thuật sư giao tiếp. Tri thức cấm kỵ chầm chậm ngấm vào dòng máu rực lửa của bạn.","effects":{"INT":1,"LUCK":1}},{"id":"imp_child_steal_coins","races":["imp"],"stages":["child"],"eras":["peace"],"weight":6,"text":"Lợi dụng lễ hội giao thương, bạn luồn lách qua chân dòng người và nẫng được vài Đồng Cẩm Thạch lấp lánh từ túi một thương nhân loài người. Khởi đầu của một tay đạo chích huyền thoại hay chỉ là trò vặt vãnh?","effects":{"wealth":10,"joy":5,"AGI":1}},{"id":"imp_teen_clean_tower","races":["imp"],"stages":["teen"],"weight":5,"require":{"flags":["familiar_pet"]},"once":false,"text":"Bị ném cho một chiếc giẻ rách, bạn phải nai lưng cọ rửa vô số bậc thang xoắn ốc của Tháp Ma Pháp Bạch Ngà. Dưới khế ước sai vặt, vinh quang ma thuật chỉ là những giọt mồ hôi đắng ngắt.","effects":{"joy":-15,"STR":1,"health":-5}},{"id":"imp_teen_war_messenger","races":["imp"],"stages":["teen"],"eras":["demon_lord"],"weight":7,"once":false,"text":"Bay sát mặt đất, bạn vội vã đưa bức thư da người qua chiến trường rực lửa cho Quân Đoàn Hủy Diệt. Mũi tên ánh sáng xé gió lướt qua cánh, tử thần luôn đồng hành trên mỗi nhịp thở.","effects":{"AGI":2,"health":-15,"wealth":10}},{"id":"imp_teen_contract_loophole","races":["imp"],"stages":["teen"],"weight":7,"require":{"notFlags":["unbound_imp"]},"text":"Bằng sự tinh quái bẩm sinh, bạn phát hiện một lỗ hổng ngôn ngữ trong khế ước máu trói buộc linh hồn mình. Xiềng xích vô hình kêu răng rắc rồi vỡ vụn, trả lại cho bạn bầu trời tự do đẫm máu.","effects":{"INT":2,"flags":["unbound_imp"]},"moment":"Tự tay phá vỡ xiềng xích khế ước bằng trí tuệ xảo quyệt."},{"id":"imp_teen_howling_steppe","races":["imp"],"stages":["teen"],"weight":5,"require":{"flags":["unbound_imp"]},"text":"Bạn vỗ đôi cánh tự do lượn lờ trên Thảo Nguyên Gió Hú, hít căng lồng ngực mùi vị của bầu trời không bị giới hạn. Khoảnh khắc này, một tiểu quỷ cũng có thể ôm ấp mộng tưởng vĩ đại.","effects":{"joy":25,"LUCK":1}},{"id":"imp_teen_taste_potion","races":["imp"],"stages":["teen"],"weight":6,"once":false,"text":"Nhân lúc không có ai, bạn lè lưỡi nếm thử giọt chất lỏng lấp lánh rỉ ra từ chiếc vạc độc dược. Lục phủ ngũ tạng như bị thiêu đốt, nhưng ma năng trong huyết quản dường như lại cuộn trào mãnh liệt hơn.","effects":{"health":-20,"INT":1,"LUCK":1}},{"id":"imp_teen_starving_trade","races":["imp"],"stages":["teen"],"eras":["dark_age"],"weight":5,"text":"Lợi dụng nạn đói lan tràn, bạn dùng một mẩu bánh mì thiu để đổi lấy món trang sức gia truyền từ một kẻ hấp hối. Lòng tham vô đáy của loài quỷ nở rộ giữa kỷ nguyên tăm tối.","effects":{"wealth":20,"joy":5}},{"id":"imp_teen_spy_mages","races":["imp"],"stages":["teen"],"weight":6,"require":{"flags":["familiar_pet"]},"text":"Kích hoạt khả năng tàng hình chớp nhoáng, bạn đu bám trên trần nhà để nghe lén bí mật của một vị trưởng lão ma pháp. Thông tin chính là thứ vũ khí sắc bén nhất của kẻ yếu.","effects":{"INT":1,"flags":["informant"]}},{"id":"imp_teen_kicked_knight","races":["imp"],"stages":["teen"],"eras":["peace"],"weight":5,"once":false,"text":"Đang nhởn nhơ xin ăn tại thủ đô Sanctus, một Hiệp sĩ Thánh Quang chán ghét tung cú đá trời giáng hất văng bạn vào tường gạch. Hòa bình của nhân loại chưa bao giờ dành cho ma vật.","effects":{"health":-25,"joy":-10}},{"id":"imp_teen_sell_secret","races":["imp"],"stages":["teen"],"weight":6,"require":{"flags":["informant"]},"text":"Bạn lén tuồn cuộn giấy da chứa bí mật ma pháp cho một đặc sứ của Hội Bóng Đêm, đổi lấy một túi Tinh Bạc rủng rỉnh. Lệnh truy nã đã được ban hành, nhưng rủi ro đi kèm với giàu sang.","effects":{"wealth":30,"flags":["wanted"]},"moment":"Bán đứng phe ánh sáng để chuộc lợi, trở thành kẻ bị săn lùng."},{"id":"imp_teen_blood_contract","races":["imp"],"stages":["teen"],"weight":9,"text":"Một thiếu niên loài người tuyệt vọng vẽ trận đồ máu tại Đầm Lầy Tử Khí, quỳ lạy cầu xin bạn ban cho sức mạnh để trả thù. Kẻ yếu đuối đang tự dâng linh hồn mình cho loài quỷ.","choices":[{"label":"Lập khế ước lừa gạt lấy linh hồn","check":{"stat":"INT","target":7},"success":{"text":"Với những điều khoản rắc rối được cài cắm tinh vi, bạn cắn nuốt trọn vẹn linh hồn hắn mà chẳng tốn giọt ma năng nào. Chào mừng đến với nghệ thuật hắc ám, kẻ lừa gạt.","effects":{"wealth":25,"flags":["soul_thief"]},"moment":"Lần đầu tiên lừa gạt và cắn nuốt thành công một linh hồn con người."},"fail":{"text":"Khế ước phản phệ! Kiến thức ma pháp hạn hẹp khiến bạn bị trận đồ cuốn lấy, linh hồn tổn thương nặng nề và phải chật vật mới thoát ra được.","effects":{"health":-30,"joy":-15}}},{"label":"Cười nhạo và vỗ cánh bỏ đi","text":"Một linh hồn rẻ rách chẳng bõ bèn gì với rủi ro dính líu đến thù hận nhân loại. Bạn nhổ nước bọt vào trận đồ rồi bay đi.","effects":{"AGI":1,"joy":5}}]},{"id":"imp_adult_stolen_plans","races":["imp"],"stages":["adult"],"eras":["demon_lord"],"weight":7,"require":{"flags":["informant"],"AGI":5},"text":"Nhờ tài tàng hình và sự lanh lẹ, bạn đột nhập vào doanh trại Thánh Vệ Quân và đánh cắp thành công bản đồ hành quân tuyến đầu. Bóng tối của Ma Vương ngày càng bành trướng nhờ những đôi cánh dơi bé nhỏ như bạn.","effects":{"wealth":20,"joy":10,"flags":["chaos_bringer"]}},{"id":"imp_adult_scam_souls","races":["imp"],"stages":["adult"],"weight":6,"require":{"flags":["soul_thief"]},"once":false,"text":"Bạn lảng vảng quanh các khu ổ chuột, dùng những lời hứa hẹn hão huyền để gạt gẫm linh hồn của những kẻ cùng cực. Mùi vị của sự dối trá ngon ngọt hơn bất kỳ thứ sơn hào hải vị nào trên trần thế.","effects":{"INT":1,"wealth":15,"joy":5}},{"id":"imp_adult_betrayal","races":["imp"],"stages":["adult"],"weight":7,"require":{"flags":["familiar_pet"]},"text":"Bạn âm thầm đánh tráo nguyên liệu trong vạc thuốc của tên pháp sư loài người, khiến một vụ nổ ma thuật xé toạc ngọn tháp. Dẫm lên cái xác cháy đen của kẻ từng làm chủ mình, bạn khẽ mỉm cười đón lấy tự do.","effects":{"INT":1,"joy":20,"unflags":["familiar_pet"],"flags":["unbound_imp","wanted"]}},{"id":"imp_adult_black_market","races":["imp"],"stages":["adult"],"eras":["peace"],"weight":5,"once":false,"text":"Lợi dụng thời bình, bạn luồn lách vào Vực Thẳm Phân Tầng, trở thành một tay môi giới chợ đen sừng sỏ bán máu rồng và vảy tiên cá. Trí tuệ ranh ma giúp bạn nhét đầy túi những Lõi Mana quý giá.","effects":{"wealth":25,"INT":1}},{"id":"imp_adult_escape_plan","races":["imp"],"stages":["adult"],"weight":5,"require":{"flags":["unbound_imp"]},"text":"Giấu mình dưới một hầm ngục bỏ hoang, bạn vẽ những trận đồ triệu hồi ngược, ấp ủ âm mưu mở cổng không gian trốn về Ma giới. Tiếng gọi của quê hương rực lửa vẫn luôn văng vẳng trong huyết quản.","effects":{"INT":2,"joy":5}},{"id":"imp_adult_courtship","races":["imp"],"stages":["adult"],"weight":4,"text":"Bạn bay lượn vòng quanh, múa điệu vờn cánh đầy hoang dại để thu hút sự chú ý của một Tiểu quỷ có cặp sừng cong quyến rũ. Ngay cả những tạo vật bị ruồng bỏ nhất cũng có quyền khao khát hơi ấm đồng loại.","effects":{"joy":15,"health":5}},{"id":"imp_adult_fire_upgrade","races":["imp"],"stages":["adult"],"weight":6,"once":false,"text":"Cố gắng hội tụ ma năng từ Đảo Tro Tàn, bạn nâng cấp được ngọn lửa vặt vãnh của mình thành một quả cầu hỏa ngục có khả năng thiêu rụi thép nguội. Kẻ thù giờ đây sẽ phải dè chừng cơn phẫn nộ của loài quỷ đỏ.","effects":{"STR":2,"health":-5}},{"id":"imp_adult_inquisitor_trap","races":["imp"],"stages":["adult"],"weight":8,"require":{"flags":["wanted"]},"text":"Lệnh truy nã đã dẫn một toán Giáo trưởng Thánh Quang đến tận sào huyệt của bạn. Những mũi giáo ánh sáng bủa vây mọi ngóc ngách, chặn đứng đường lùi của một sinh linh tà ác.","choices":[{"label":"Tàng hình và luồn lách qua khe hở lưỡi giáo","check":{"stat":"AGI","target":8},"success":{"text":"Thân hình nhỏ bé và sự nhanh nhẹn tuyệt đỉnh giúp bạn hóa thành một làn khói xám, lọt qua vòng vây chết chóc trong gang tấc. Bạn để lại phía sau những tiếng chửi rủa bất lực của đám người mộ đạo.","effects":{"AGI":2,"joy":10},"moment":"Tẩu thoát ngoạn mục khỏi vòng vây của Giáo hội Thánh Quang."},"fail":{"text":"Ánh sáng thần thánh vô hiệu hóa phép tàng hình, một mũi thương xuyên thấu qua cánh dơi ghim chặt bạn xuống nền đất lạnh lẽo.","death":"Năm {age} tuổi, bạn bị Giáo hội thiêu sống trên giàn hỏa thiêu vì tội trạng chống lại ánh sáng Nữ thần."}},{"label":"Đầu hàng và xin ký khế ước làm bầy tớ","text":"Bạn cụp đôi cánh dơi, vứt bỏ mọi sự kiêu hãnh để quỳ rạp xuống liếm giày gã Giáo trưởng. Đổi lấy mạng sống, bạn phải đeo chiếc vòng cổ giam cầm ma năng và chịu kiếp nô lệ một lần nữa.","effects":{"joy":-30,"health":-10,"flags":["familiar_pet"],"unflags":["unbound_imp"]}}]},{"id":"imp_middle_corrupt_knight","races":["imp"],"stages":["middle"],"weight":6,"require":{"INT":6,"flags":["soul_thief"]},"text":"Bằng những lời thì thầm ma quỷ mỗi đêm, bạn đã gieo rắc sự hoài nghi vào tâm trí một Hiệp sĩ Thánh Quang, biến hắn thành một bạo chúa tàn độc. Nghệ thuật thao túng tâm lý chính là quyền lực tối cao của kẻ không có sức mạnh cơ bắp.","effects":{"INT":2,"joy":15,"flags":["tyrant_maker"]}},{"id":"imp_middle_hoard_gold","races":["imp"],"stages":["middle"],"weight":5,"once":false,"text":"Đêm qua đêm, bạn say sưa đếm lại số Đồng Cẩm Thạch và Tinh Bạc giấu kĩ dưới gầm chiếc giường ẩm mốc. Niềm vui nhỏ nhoi của một lão quỷ là nhìn tài sản lớn dần, mặc kệ thế giới đang sụp đổ ngoài kia.","effects":{"wealth":10,"joy":5}},{"id":"imp_middle_goblin_disciple","races":["imp"],"stages":["middle"],"weight":6,"text":"Bạn thu nhận một gã Goblin hôi hám làm đệ tử sai vặt, tận hưởng cảm giác được làm kẻ bề trên sau nửa đời người bị sai bảo. Hắn lén lút cống nạp cho bạn những món đồ ăn trộm rẻ tiền nhưng đầy thành ý.","effects":{"joy":10,"LUCK":1}},{"id":"imp_middle_scavenger","races":["imp"],"stages":["middle"],"eras":["holy_war"],"weight":5,"once":false,"text":"Bay lượn tầm thấp trên chiến trường rực lửa ngập xác chết, bạn nhanh tay thu thập vũ khí, giáp trụ gãy nát của cả hai phe để bán đồng nát. Chiến tranh là địa ngục với trần thế, nhưng lại là mỏ vàng của ma tộc lanh lợi.","effects":{"wealth":20,"health":-5}},{"id":"imp_middle_plague_doctor","races":["imp"],"stages":["middle"],"eras":["dark_age"],"weight":6,"text":"Bạn khoác lên mình chiếc áo choàng đen và mặt nạ quạ, mạo danh một thầy thuốc dịch bệnh đi lại nghênh ngang giữa phố thị loài người. Vừa bòn rút tiền của bệnh nhân, bạn vừa tận hưởng cảnh tượng sinh mệnh lụi tàn.","effects":{"INT":1,"wealth":25,"joy":10}},{"id":"imp_middle_stiff_wings","races":["imp"],"stages":["middle"],"weight":4,"text":"Cơn gió buốt lạnh từ Thảo Nguyên Gió Hú khiến khớp xương cánh của bạn nhức mỏi, những chiếc lông tơ ma thuật rụng tơi tả. Dấu hiệu tuổi tác bắt đầu đuổi kịp vòng đời ngắn ngủi của giống loài Tiểu quỷ.","effects":{"AGI":-2,"health":-10}},{"id":"imp_middle_dark_moon_cult","races":["imp"],"stages":["middle"],"weight":5,"require":{"flags":["chaos_bringer"]},"text":"Bạn được mời dự buổi hiến tế bí mật của Hắc Nguyệt Hội, nơi con người tôn sùng ma vật như những vị thần mới. Ngồi vắt vẻo trên bệ đá, bạn nhếch mép cười nhạo sự hèn mọn và ngu xuẩn của nhân loại.","effects":{"joy":15,"INT":1,"wealth":10}},{"id":"imp_middle_broken_horn","races":["imp"],"stages":["middle"],"weight":4,"text":"Trong một vụ tranh giành địa bàn làm ăn ngầm, bạn bị một tên Orc giáng chùy gãy mất một bên sừng kiêu hãnh. Cơn đau thấu xương nhắc nhở bạn rằng chốn ma giới không bao giờ có chỗ cho sự bất cẩn.","effects":{"STR":-1,"health":-15,"joy":-10}},{"id":"imp_middle_demon_promotion","races":["imp"],"stages":["middle"],"weight":8,"require":{"INT":7},"text":"Đại Ác Quỷ cai quản Vực Thẳm mở một bài kiểm tra tàn khốc để cất nhắc một Tiểu quỷ lên làm tay sai trung cấp. Nếu thành công, bạn sẽ có quyền lực ra lệnh cho đồng loại; nếu thất bại, linh hồn bạn sẽ làm mồi cho ngọn lửa vĩnh cửu.","choices":[{"label":"Dùng mưu hèn kế bẩn triệt hạ đối thủ","check":{"stat":"INT","target":9},"success":{"text":"Bạn cài bẫy nổ ma thuật vào đường đua, thổi bay toàn bộ đối thủ cạnh tranh trước vạch đích. Sự tàn nhẫn và xảo quyệt của bạn khiến Đại Ác Quỷ phá lên cười thích thú, ban cho bạn ấn chú thăng cấp.","effects":{"STR":2,"INT":2,"joy":25,"flags":["tyrant_maker"]},"moment":"Gian lận và tàn nhẫn để thăng cấp thành tay sai đắc lực của Đại Ác Quỷ."},"fail":{"text":"Trò bịp bợm của bạn bị nhìn thấu. Thay vì được thăng cấp, bạn bị Đại Ác Quỷ nhai nghiến một nửa đôi cánh rồi ném xuống Đầm Lầy Tử Khí chờ chết.","effects":{"health":-40,"AGI":-3,"joy":-20}}},{"label":"Từ bỏ cơ hội, giữ mạng là trên hết","text":"Bạn lén lút rút lui khỏi cuộc thi đẫm máu ngay trước khi nó bắt đầu. Sự hèn nhát đôi khi lại là bí quyết trường thọ duy nhất của loài quỷ yếu ớt.","effects":{"joy":-5,"LUCK":1}}]},{"id":"imp_elder_evil_advisor","races":["imp"],"stages":["elder"],"weight":6,"require":{"flags":["tyrant_maker"]},"text":"Với tuổi đời và kinh nghiệm lọc lõi, bạn giờ đây thảnh thơi ngồi trên vai một Lãnh chúa tàn bạo, rỉ vào tai hắn những mưu đồ chính trị độc ác nhất. Dù thân xác đã già nua trụi cánh, quyền lực bóng tối trong tay bạn lại rực rỡ hơn bao giờ hết.","effects":{"INT":2,"wealth":30,"joy":20}},{"id":"imp_elder_fading_fire","races":["imp"],"stages":["elder"],"weight":5,"text":"Hơi thở của bạn không còn nhả ra khói lưu huỳnh, ngọn lửa ma thuật trong lồng ngực đang lụi tàn dần theo thời gian. Bạn cuộn tròn trong một góc tối, bình thản đón chờ bánh xe luân hồi của Hư Vô một lần nữa lăn qua.","effects":{"health":-30,"STR":-2,"AGI":-2}},{"id":"kb_first_pick","races":["kobold"],"stages":["child"],"weight":10,"text":"Chiếc cuốc chim được đặt vào đôi tay bé nhỏ của bạn, nặng hơn cả thân mình. Từ hôm nay, lòng đất là định mệnh của bạn.","effects":{"STR":1},"moment":"Cầm cuốc chim lần đầu"},{"id":"kb_ore_nose","races":["kobold"],"stages":["child","teen"],"weight":7,"text":"Chiếc mũi của bạn bắt được một mùi hương kim loại lạnh lẽo sau vách đá. Bạn đào suốt đêm và chạm tới một mạch bạc lấp lánh.","effects":{"wealth":10,"LUCK":1}},{"id":"kb_dragon_idol","races":["kobold"],"stages":["teen","adult"],"weight":5,"text":"Bạn quỳ trước Tượng Rồng thô kệch của bầy, dâng lên mẩu quặng đẹp nhất. Bạn thề rằng một ngày nào đó sẽ được chiêm ngưỡng Rồng thật.","effects":{"joy":5}},{"id":"kb_ms_collapse","races":["kobold"],"stages":["child","teen","adult"],"weight":9,"text":"Một tiếng rắc khô khốc vọng xuống từ trần đá. Chỉ trong chớp mắt, cả đường hầm rung chuyển như một con quái thú đang trở mình.","choices":[{"label":"Chống đỡ xà nhà","check":{"stat":"STR","target":6},"success":{"text":"Bạn gồng mình đỡ lấy thanh xà mục cho đến khi con Kobold cuối cùng thoát ra. Từ đó, bầy đàn gọi tên bạn với sự kính nể.","effects":{"STR":1,"joy":10,"flags":["respected"]},"moment":"Cứu cả bầy khỏi sập hầm"},"fail":{"text":"Thanh xà gãy đôi, đè nát một bên vai bạn.","effects":{"health":-30,"STR":-1}}},{"label":"Tự đào lối thoát","check":{"stat":"AGI","target":5},"success":{"text":"Móng vuốt của bạn cào xé đất đá như điên dại. Bạn trồi lên giữa ánh trăng, một mình.","effects":{"AGI":1}},"fail":{"text":"Đường hầm nhỏ sập theo, vùi bạn trong bóng tối suốt ba ngày ròng.","effects":{"health":-25}}},{"label":"Gào khóc gọi Mẹ","text":"Tiếng gọi của bạn chìm giữa tiếng đá đổ ầm ầm.","death":"Không ai đến. Bạn yên nghỉ dưới lòng mỏ ở tuổi {age}."}]},{"id":"kb_ms_merchant","races":["kobold"],"stages":["adult","middle"],"weight":8,"text":"Một đoàn xe của Thương Đoàn Sói Bạc chở đầy quặng quý băng qua cửa mỏ, hộ tống bởi những tay lính đánh thuê mặt sẹo.","choices":[{"label":"Ném bom khói rồi chạy","check":{"stat":"AGI","target":5},"success":{"text":"Màn khói đen phủ kín con đường. Khi nó tan đi, bạn đã ở sâu trong địa đạo cùng một túi lương khô.","effects":{"wealth":10,"AGI":1}},"fail":{"text":"Một mũi tên xuyên qua màn khói, cắm vào đùi bạn.","effects":{"health":-20}}},{"label":"Dụ vào bãi mìn","check":{"stat":"INT","target":6},"success":{"text":"Từng cỗ xe nổ tung giữa trận địa bẫy bạn dày công sắp đặt. Kho báu của Thương Đoàn giờ thuộc về bầy Kobold.","effects":{"wealth":30,"joy":10},"moment":"Phục kích Thương Đoàn Sói Bạc"},"fail":{"text":"Chúng phát hiện dây kích nổ và lần theo nó đến tận chỗ bạn nấp.","effects":{"health":-30}}},{"label":"Đầu hàng làm cu li","text":"Bạn khuân vác cho Thương Đoàn suốt một năm. Đổi lại, bạn được thấy thế giới bên ngoài hầm mỏ.","effects":{"wealth":5,"joy":-5,"INT":1,"flags":["porter"]}}]},{"id":"kb_ms_scale","races":["kobold"],"stages":["teen","adult"],"weight":6,"text":"Giữa đống đá vụn, một mảnh vảy Rồng rụng lấp lánh như than hồng. Hơi ấm từ nó khiến máu trong huyết quản bạn sôi lên.","choices":[{"label":"Nuốt để tiến hóa","check":{"stat":"STR","target":6},"success":{"text":"Mảnh vảy tan chảy trong bụng bạn như dung nham. Khi cơn đau qua đi, lớp vảy của bạn đã nhuốm sắc đỏ của Rồng.","effects":{"STR":2,"INT":1,"flags":["dragonkin"]},"moment":"Thức tỉnh Huyết thống Rồng"},"fail":{"text":"Mảnh vảy cứa nát nội tạng. Bạn nằm thoi thóp suốt một mùa.","effects":{"health":-40}}},{"label":"Hiến cho Tù trưởng","text":"Tù trưởng nâng mảnh vảy lên cao giữa tiếng reo hò. Bạn được phong làm Giám sát mỏ.","effects":{"wealth":10,"flags":["overseer"]},"moment":"Được phong làm Giám sát mỏ"},{"label":"Giấu làm của riêng","text":"Bạn giấu mảnh vảy dưới ổ rơm. Đêm nào nó cũng sưởi ấm giấc ngủ của bạn.","effects":{"wealth":15,"LUCK":1}}]},{"id":"kb_ms_purge","races":["kobold"],"stages":["teen","adult","middle"],"weight":7,"text":"Tiếng tù và của Thánh Vệ Quân vang dội khắp hầm mỏ. Cuộc Đại Thanh Trừng đã giáng xuống bầy Kobold, và lưỡi gươm Thánh Quang không chừa một ai.","choices":[{"label":"Bỏ chạy một mình","text":"Bạn cắm đầu chạy vào địa đạo sâu nhất, mặc tiếng kêu thảm thiết của đồng loại sau lưng. Bạn sống, nhưng mang vết nhơ của kẻ hèn nhát.","effects":{"joy":-10,"flags":["coward"]}},{"label":"Nấp dưới xác đồng bọn","check":{"stat":"LUCK","target":6},"success":{"text":"Bạn nằm im dưới lớp xác lạnh ngắt suốt một ngày một đêm. Khi bình minh lên, cả hầm mỏ chỉ còn mình bạn.","effects":{"joy":-10}},"fail":{"text":"Một mũi giáo dò xét đâm xuyên lớp xác và cắm sâu vào sườn bạn.","effects":{"health":-35}}},{"label":"Thức tỉnh máu Rồng","check":{"stat":"STR","target":9},"success":{"text":"Máu Rồng trong huyết quản bạn bùng cháy. Lớp vảy đỏ rực phủ kín toàn thân, và bạn đứng sừng sững giữa tro tàn của những kẻ đi săn.","effects":{"STR":3,"health":10,"flags":["dragonkin"]},"moment":"Hóa thành Kobold Long Huyết"},"fail":{"text":"Ngọn lửa trong huyết quản thiêu rụi chính bạn trước khi kịp chạm tới kẻ thù.","death":"Bạn hóa thành tro giữa cuộc Đại Thanh Trừng, ở tuổi {age}."}}]},{"id":"kb_elder_map","races":["kobold"],"stages":["elder"],"weight":8,"text":"Đôi tay run rẩy, bạn vạch lại bản đồ bãi bẫy lên vách hang cho lũ trẻ. Đó là di sản duy nhất mà một Kobold có thể để lại.","effects":{"joy":8,"INT":1},"moment":"Truyền lại bản đồ bẫy"},{"id":"kobold_infant_eat_clay","races":["kobold"],"stages":["infant"],"weight":5,"text":"Bạn nhai ngấu nghiến bùn đất sét ướt sũng để xoa dịu cơn đói cồn cào đang xé rách dạ dày. Định mệnh đắng chát ban cho bạn bài học sinh tồn đầu tiên: ở đáy vực sâu, bùn lầy chính là ân điển của thần linh.","effects":{"STR":1,"health":-3,"joy":-5}},{"id":"kobold_infant_giant_spider","races":["kobold"],"stages":["infant"],"once":false,"weight":6,"text":"Trong bóng tối, đôi mắt đỏ rực của Nhện Khổng Lồ lướt qua khi bạn nín thở vùi mình dưới lớp xỉ than. Hơi thở của tử thần chỉ lướt qua, nhưng nỗi khiếp nhược đã ăn sâu vào linh hồn yếu ớt.","effects":{"AGI":1,"joy":-3,"flags":["coward"]}},{"id":"kobold_infant_demon_bark","races":["kobold"],"stages":["infant"],"eras":["demon_lord"],"weight":5,"text":"Tiếng kèn hiệu của Quân Đoàn Hủy Diệt rung chuyển lòng đất, bầy đàn rít lên ép bạn phải sủa báo động trước tiền đồn. Bóng tối ma quỷ bao trùm lục địa, biến giống loài bạn thành những quân cờ rẻ rúng nhất.","effects":{"joy":-10,"health":-5,"flags":["demon_slave"]}},{"id":"kobold_infant_fight_mold","races":["kobold"],"stages":["infant"],"weight":5,"require":{"below":{"joy":40}},"text":"Bạn dùng chút sức lực mỏng manh để giật lấy tai nấm mốc meo từ tay một đứa trẻ đồng loại, mặc cho máu tứa ra từ nanh vuốt. Quyền sinh sát nơi Hư Vô đôi khi chỉ được quyết định bằng một ngụm thức ăn ôi thiu.","effects":{"STR":1,"health":5}},{"id":"kobold_infant_meat_shield","races":["kobold"],"stages":["infant"],"once":false,"weight":4,"require":{"health":30},"text":"Những kẻ lớn hơn hất văng bạn ra tiền tuyến làm bia thịt đỡ những mũi tên hoang lạc trong đợt xâm lăng của lũ goblin. Sự nhát gan bẩm sinh trớ trêu thay lại kích phát bản năng uốn éo, giúp bạn né tránh được lưỡi hái tử thần.","effects":{"AGI":2,"health":-10,"joy":-5}},{"id":"kobold_infant_shiny_trap","races":["kobold"],"stages":["infant"],"weight":8,"text":"Một ánh sáng lấp lánh phản chiếu từ vách đá cheo leo khơi dậy bản năng đánh hơi quặng mỏ sâu thẳm trong huyết quản bạn. Định mệnh vẫy gọi bạn đối mặt với cám dỗ đầu đời.","choices":[{"label":"Liều lĩnh leo vách đá","check":{"stat":"AGI","target":4},"success":{"text":"Đôi vuốt non nớt bám chặt vách đá, bạn cạy được một mẩu Tinh Bạc nguyên chất sáng rực rỡ.","effects":{"wealth":15,"joy":10},"moment":"Chạm tay vào Tinh Bạc ngay từ khi chưa mở mắt rõ ràng."},"fail":{"text":"Bàn tay rớm máu trượt khỏi vách đá, cơ thể nhỏ bé của bạn chìm vào bóng tối sâu thẳm dưới đáy vực.","death":"Bị nghiền nát vì tham lam một mảnh quặng ở tuổi {age}."}},{"label":"Cúp đuôi gọi bầy","text":"Bạn rên rỉ gọi bầy đến đào bới, nhận lại những cái tát điếng người vì làm ồn, nhưng giữ được mạng sống nhỏ nhoi.","effects":{"joy":-5,"flags":["coward"]}}]},{"id":"kobold_child_heavy_basket","races":["kobold"],"stages":["child"],"once":false,"weight":6,"text":"Bạn oằn mình vác giỏ quặng thô nặng trĩu trên lưng tứa máu, lê từng bước dọc theo đường hầm quạnh hiu. Số mệnh của cẩu đầu nhân là bài ca bi tráng của những nô lệ bị nghiền nát dưới bánh xe lao động tàn khốc.","effects":{"STR":2,"health":-5,"flags":["porter"]}},{"id":"kobold_child_dig_trap","races":["kobold"],"stages":["child"],"weight":5,"text":"Bị ném vào một hố sâu, bạn phải hì hục đào một hầm chông ngầm để chống lại sự xâm nhập của dực nhân. Từng hạt bụi đất rơi xuống gieo mầm cho nghệ thuật bẫy rập vĩ đại trong tâm trí bạn.","effects":{"INT":1,"AGI":1,"joy":-3}},{"id":"kobold_child_whip_lazy","races":["kobold"],"stages":["child"],"weight":4,"require":{"below":{"joy":30}},"text":"Ngọn roi da ma thú quất thẳng vào lưng khi đôi tay bạn rã rời ngưng cuốc. Đau đớn và máu tanh là thứ đức tin duy nhất mà những kẻ cai lý mỏ ban phát cho những linh hồn lười biếng.","effects":{"STR":1,"health":-8,"joy":-5}},{"id":"kobold_child_scrap_iron","races":["kobold"],"stages":["child"],"eras":["holy_war"],"once":false,"weight":5,"text":"Những lưỡi gươm gãy nát rớt xuống từ chiến trường Thánh Vệ Quân trên mặt đất được bạn lén lút thu thập. Dưới thời chiến loạn, phế liệu đẫm máu của kẻ bề trên lại là báu vật đổi mạng của kẻ bần hàn.","effects":{"wealth":8,"LUCK":1}},{"id":"kobold_child_crushed_limb","races":["kobold"],"stages":["child"],"weight":5,"require":{"below":{"AGI":5}},"text":"Một phiến đá bất thần lăn xuống đè nát một phần chi dưới, bỏ lại bạn với đôi chân tật nguyền giữa bầy đàn vô cảm. Kẻ yếu đuối không có chỗ đứng, định mệnh buộc bạn phải mài giũa trí óc để bù đắp cơ bắp rách nát.","effects":{"AGI":-2,"INT":2,"health":-15,"flags":["crippled"]}},{"id":"kobold_teen_rusty_trap","races":["kobold"],"stages":["teen"],"once":false,"weight":6,"text":"Bạn tỉ mẩn ráp lại một chiếc bẫy gấu rỉ sét bằng những bánh răng gãy nát thu nhặt từ bãi phế liệu. Nghệ thuật sát sinh tàn độc ẩn nấp dưới bùn lầy chính là khúc khải hoàn vĩ đại của kẻ yếu thế.","effects":{"INT":1,"AGI":1,"flags":["trap_maker"]}},{"id":"kobold_teen_smoke_bomb","races":["kobold"],"stages":["teen"],"eras":["peace"],"weight":5,"text":"Giữa thời bình tĩnh lặng, bạn tranh thủ tận dụng phân dơi và bột diêm sinh để bào chế những quả bom khói cay nồng. Bóng tối và nghệ thuật lẩn trốn luôn là lá chắn thần thánh bảo hộ giống loài thấp kém.","effects":{"INT":2,"joy":5}},{"id":"kobold_teen_surface_scout","races":["kobold"],"stages":["teen"],"weight":5,"text":"Lần đầu tiên trồi lên mặt đất trinh sát, ánh mặt trời chói lọi của Thảo Nguyên Gió Hú làm mù lòa đôi mắt quen với hắc ín. Thế giới bên ngoài quá đỗi kỳ vĩ, vùi dập cái tôi bé mọn của bạn xuống tận cùng cát bụi.","effects":{"LUCK":1,"health":-3,"flags":["overworld_kobold"]}},{"id":"kobold_teen_loot_corpse","races":["kobold"],"stages":["teen"],"eras":["dark_age"],"weight":6,"text":"Xác chết trương phình của một Mạo hiểm giả gục ngã vì dịch bệnh trở thành mỏ vàng để bạn vơ vét từng đồng Tinh Bạc. Kỷ nguyên tăm tối không có chỗ cho lòng thương xót, định mệnh chỉ mỉm cười với kẻ sống sót cuối cùng.","effects":{"wealth":12,"joy":-5}},{"id":"kobold_teen_dragon_resonance","races":["kobold"],"stages":["teen"],"weight":7,"require":{"flags":["dragon_blessed"]},"text":"Tượng rồng cổ đại phát ra tiếng gầm trầm đục, cộng hưởng với huyết thống sâu thẳm ẩn giấu trong tim bạn. Lớp vảy non bắt đầu cứng lại và ánh lên sắc đỏ, báo hiệu một bước tiến hóa dị thường đang ươm mầm.","effects":{"STR":2,"health":15,"flags":["dragonkin"]}},{"id":"kobold_teen_coal_cough","races":["kobold"],"stages":["teen"],"weight":5,"require":{"below":{"health":50}},"text":"Những cơn ho ra bụi than và máu đen hành hạ buồng phổi yếu ớt của bạn hằng đêm. Cái giá của việc khai phá Lò Rèn Vĩnh Cửu là tuổi thọ bị bào mòn tàn nhẫn theo từng nhịp thở thoi thóp.","effects":{"health":-10,"STR":-1}},{"id":"kobold_teen_evolution_path","races":["kobold"],"stages":["teen"],"weight":8,"text":"Đứng trước Ngã rẽ tiến hóa, bầy đàn dồn ép bạn phải chọn lấy một con đường định mệnh để phụng sự hoặc bị đào thải.","choices":[{"label":"Uống máu thằn lằn độc hóa Chiến Binh","check":{"stat":"STR","target":6},"success":{"text":"Cơn đau xé rách cơ bắp, nhưng lớp vảy sừng tua tủa mọc ra. Bạn đã bước chân vào hàng ngũ những kẻ được nể sợ trong hầm mỏ.","effects":{"STR":4,"health":20,"flags":["respected"]},"moment":"Sống sót qua cơn bạo bệnh để hóa thành Chiến binh vảy sừng."},"fail":{"text":"Cơ thể gầy gò của bạn co giật và vỡ nát dưới kịch độc, bỏ lại một xác chết héo hon không ai tiếc thương.","death":"Chết vì cưỡng ép tiến hóa vượt quá giới hạn ở tuổi {age}."}},{"label":"An phận làm Kỹ sư bẫy","text":"Bạn lùi lại, chấp nhận kiếp sống hèn mọn luồn cúi nhưng mài giũa trí óc để sáng tạo ra những công cụ giết chóc lạnh lùng.","effects":{"INT":3,"AGI":2,"health":-5}}]},{"id":"kobold_adult_scale_hardened","races":["kobold"],"stages":["adult"],"weight":7,"require":{"flags":["dragonkin"]},"text":"Lớp vảy sừng trên người bạn hóa thành màu đỏ rực, cứng như thép nguội và tản ra uy áp rồng nhạt nhòa. Bầy đàn kính sợ cúi đầu, vinh danh bạn như một vị thủ lĩnh thực thụ của thế giới ngầm.","effects":{"STR":2,"joy":15,"flags":["respected"]}},{"id":"kobold_adult_mate_nest","races":["kobold"],"stages":["adult"],"weight":6,"text":"Bản năng duy trì nòi giống trỗi dậy, bạn giao phối chớp nhoáng với một bạn tình trong góc hầm ẩm thấp. Đứa con sinh ra sẽ sớm bị ném vào guồng quay lao động, nhưng đó là cách duy nhất để huyết mạch thấp hèn kéo dài.","effects":{"joy":10,"wealth":-5}},{"id":"kobold_adult_black_market","races":["kobold"],"stages":["adult"],"weight":5,"text":"Bạn lén lút mang những vụn tinh thạch giấu trong lớp da vảy đi giao dịch với lũ yêu tinh của Hội Bóng Đêm. Tiếng đồng Cẩm Thạch va vào nhau leng keng là khúc ca ngọt ngào nhất xua tan cái lạnh lẽo chốn u minh.","effects":{"wealth":15,"INT":1,"joy":5}},{"id":"kobold_adult_defend_mine","races":["kobold"],"stages":["adult"],"once":false,"weight":5,"text":"Đám lính đánh thuê tham lam tràn vào hầm mỏ, bạn ẩn mình trong bóng tối và giật dây bẫy đá. Tiếng la hét của những kẻ xâm nhập nhuộm đỏ vách hang, khẳng định chủ quyền tàn nhẫn của bầy cẩu đầu nhân.","effects":{"STR":1,"joy":5,"wealth":8}},{"id":"kobold_adult_blood_pact","races":["kobold"],"stages":["adult"],"weight":5,"require":{"flags":["coward"]},"text":"Sự khiếp nhược trước bóng tối vô tận khiến bạn cứa cổ tay, hiến tế máu tươi cho Hắc Nguyệt Hội đổi lấy bùa chú hộ mệnh. Linh hồn bạn dần tha hóa dưới sự mù quáng của tà thần, đổi lại chút yên tâm dối trá.","effects":{"joy":8,"LUCK":1,"health":-5}},{"id":"kobold_adult_holy_war_meat","races":["kobold"],"stages":["adult"],"eras":["holy_war"],"once":false,"weight":6,"text":"Thánh Vệ Quân rọi ánh sáng thanh trừng xuống Vực Thẳm, bầy đàn điên cuồng đẩy bạn ra phía trước làm rào chắn kỵ binh. Trong thời đại chiến tranh tôn giáo, sinh mạng của tà vật rẻ mạt hơn cả bụi cám.","effects":{"health":-15,"AGI":1,"joy":-10}},{"id":"kobold_adult_master_trap","races":["kobold"],"stages":["adult"],"weight":6,"require":{"flags":["trap_maker"]},"text":"Bạn hoàn thiện một hệ thống bẫy liên hoàn kết hợp nỏ đá và độc dược bao bọc lấy hang ổ. Kiệt tác sát sinh vô hình này đánh dấu sự trưởng thành tột bậc của một nghệ nhân trong bóng tối.","effects":{"INT":2,"joy":12,"flags":["overseer"]}},{"id":"kobold_adult_goblin_raid","races":["kobold"],"stages":["adult"],"eras":["peace"],"weight":5,"text":"Lợi dụng thời bình vắng bóng mạo hiểm giả, bầy đàn tổ chức cuộc đột kích đẫm máu vào hang ổ của lũ Goblin lân cận. Lục địa vĩ đại không bao giờ chép lại những trận chiến bùn lầy này, nhưng đó là bản hùng ca của tà vật.","effects":{"wealth":12,"STR":1,"health":-8}},{"id":"kobold_adult_rival_challenge","races":["kobold"],"stages":["adult"],"weight":8,"text":"Một gã cẩu đầu nhân đực vạm vỡ từ bầy khác xâm phạm lãnh thổ, gầm gừ thách thức quyền thống trị hầm mỏ của bạn. Luật rừng trên lục địa Aethelgard chỉ vinh danh kẻ tàn nhẫn nhất.","choices":[{"label":"Lao vào cắn xé sinh tử","check":{"stat":"STR","target":7},"success":{"text":"Bạn cắm phập nanh vào cổ họng kẻ thách thức, tắm trong máu tươi để khẳng định ngôi vương tuyệt đối.","effects":{"STR":2,"joy":15,"wealth":10},"moment":"Xé xác kẻ thách thức để bảo vệ ngai vàng tăm tối."},"fail":{"text":"Vuốt sắc của kẻ thù cào toạc lồng ngực bạn, tước đoạt vĩnh viễn mọi thứ từ sinh mạng đến danh dự.","death":"Bị đồng loại cắn đứt yết hầu trong cuộc tranh giành quyền lực ở tuổi {age}."}},{"label":"Cúp đuôi nhường lãnh thổ","text":"Bản tính nhát gan trỗi dậy, bạn luồn cúi bò sang một đường hầm hoang tàn khác để giữ lại cái mạng quèn.","effects":{"joy":-20,"wealth":-15,"unflags":["respected"]}}]},{"id":"kobold_middle_overseer_whip","races":["kobold"],"stages":["middle"],"weight":6,"require":{"flags":["respected"]},"text":"Với vị thế giám sát, bạn lạnh lùng vung roi da đập nát lưng những thợ đào nhí đang gục ngã vì kiệt sức. Lịch sử bạo tàn lặp lại, kẻ từng bị chà đạp nay đã trở thành bạo chúa khát máu nhất hầm mỏ.","effects":{"wealth":10,"joy":5,"INT":-1}},{"id":"kobold_middle_demon_smuggle","races":["kobold"],"stages":["middle"],"eras":["demon_lord"],"weight":6,"text":"Dưới bóng đen của Ma Vương giáng thế, bạn bí mật đào đường hầm dẫn quỷ binh đột kích Thánh Đô Sanctus để đổi lấy Huyết Kim. Bán đứng cả lục địa miễn là bầy đàn được no bụng, đó là triết lý sinh tồn tàn độc của bạn.","effects":{"wealth":25,"joy":10,"flags":["demon_ally"]}},{"id":"kobold_middle_mithril_vein","races":["kobold"],"stages":["middle"],"weight":5,"text":"Chiếc mũi thính nhạy sục sạo trúng một kẽ nứt ánh lên sắc xanh lấp lánh của quặng Mithril nguyên bản. Kho báu của Thần Linh lọt vào tay sinh vật mọn hèn này dường như là một trò đùa dai của định mệnh.","effects":{"wealth":40,"LUCK":2}},{"id":"kobold_middle_power_struggle","races":["kobold"],"stages":["middle"],"weight":5,"require":{"flags":["crippled"]},"text":"Mất đi sức mạnh thể chất, bạn lén bỏ bột nấm độc vào phần thịt của gã trưởng bầy để đoạt quyền lãnh đạo từ trong bóng tối. Trí tuệ đen tối đôi khi sắc bén hơn bất kỳ chiếc vuốt rồng nào.","effects":{"INT":2,"joy":15,"flags":["overseer"]}},{"id":"kobold_middle_teach_dig","races":["kobold"],"stages":["middle"],"once":false,"weight":4,"text":"Bạn truyền dạy cách vung cuốc nương theo thớ đá cho lũ cún thằn lằn đang run rẩy tập sự. Nhìn ánh mắt trong veo của chúng sắp bị bụi than nhuốm đục, trái tim cằn cỗi của bạn thoáng chút xót xa.","effects":{"joy":5,"INT":1}},{"id":"kobold_middle_famine_cannibal","races":["kobold"],"stages":["middle"],"eras":["dark_age"],"weight":6,"text":"Nạn đói càn quét khắp Lò Rèn Vĩnh Cửu, bạn lạnh lùng hạ lệnh xẻ thịt những cá thể ốm yếu nhất trong bầy để đun súp. Kỷ nguyên tăm tối ép buộc mọi sinh linh phải đánh mất phần nhân tính cuối cùng.","effects":{"health":15,"joy":-15,"flags":["cannibal"]}},{"id":"kobold_middle_dragon_hoard","races":["kobold"],"stages":["middle"],"weight":5,"require":{"wealth":30},"text":"Bạn gom góp hàng đống đồng Tinh Bạc và Lõi Mana thành một ổ nằm, cuộn mình ngủ trên đó như một Cự Long thực thụ. Ảo tưởng vĩ cuồng này giúp bạn xoa dịu nỗi tủi nhục của thân phận chui lủi dưới bùn lầy.","effects":{"joy":15,"LUCK":1}},{"id":"kobold_middle_gas_leak","races":["kobold"],"stages":["middle"],"weight":5,"text":"Cuốc của bạn vô tình bổ trúng một mạch khí ga rò rỉ ngột ngạt từ Đầm Lầy Tử Khí. Kẻ vô tình giẫm đạp lên thi thể đồng loại để ngoi lên mặt đất tẩu thoát sẽ là kẻ được định mệnh vớt vát.","effects":{"health":-10,"joy":-10,"AGI":1}},{"id":"kobold_middle_elf_envoy","races":["kobold"],"stages":["middle"],"weight":8,"text":"Một Tuần Lâm Trọng Vệ từ Đại Ngàn Lục Bảo lọt vào hầm mỏ truy tìm tà khí, gương mặt tinh linh tràn ngập sự khinh bỉ. Mũi tên xanh lá giương lên mang theo sát khí thanh trừng của Tự Nhiên Giáo.","choices":[{"label":"Kích hoạt bẫy sập khổng lồ","check":{"stat":"INT","target":8},"success":{"text":"Đất đá ập xuống nghiền nát tinh linh cao ngạo, bạn đoạt lấy chiếc cung khảm ngọc bích cống nạp cho bầy.","effects":{"wealth":20,"joy":15,"flags":["elf_slayer"]},"moment":"Chôn vùi kẻ tự xưng là sứ giả ánh sáng dưới lớp đá nhơ bẩn."},"fail":{"text":"Mũi tên ma thuật xuyên thủng sọ bạn trước khi hệ thống bẫy kịp bung chốt.","death":"Bị thanh tẩy bởi cung thủ tinh linh ở tuổi {age}."}},{"label":"Đẩy đồng loại làm mồi nhử","text":"Bạn hèn hạ nấp sau lưng đám lính gác, cuống cuồng tẩu thoát qua hầm bí mật mặc cho chúng bị đồ sát đằng sau.","effects":{"health":-5,"joy":-12,"wealth":-5}}]},{"id":"kobold_elder_toothless","races":["kobold"],"stages":["elder"],"once":false,"weight":5,"text":"Răng nanh rụng lả tả, vảy sừng xơ xác, bạn bị đám thanh niên trong bầy xô ngã dã man để tranh giành phần thịt vụn. Vòng lặp định mệnh nghiệt ngã đã đưa bạn trở về vị thế của kẻ yếu ớt, vô dụng nhất.","effects":{"STR":-2,"health":-10,"joy":-10}},{"id":"kobold_elder_black_lung","races":["kobold"],"stages":["elder"],"weight":6,"require":{"below":{"health":30}},"text":"Mỗi tiếng ho đều tống ra từng cục máu đen đặc quánh và bột than đá tích tụ suốt hàng thập kỷ cày cuốc. Án tử hình thầm lặng của nghề thợ mỏ đang cào xé buồng phổi cằn cỗi của một trưởng lão.","effects":{"health":-15,"AGI":-1}},{"id":"kobold_elder_dragon_myth","races":["kobold"],"stages":["elder"],"eras":["peace"],"weight":5,"text":"Dưới ánh lửa bập bùng, bạn thều thào kể cho đám cún thằn lằn nghe về truyền thuyết Rồng Thần sải cánh che khuất mặt trời. Trong thời bình tĩnh lặng, những giấc mơ hoang đường là di sản vĩ đại duy nhất bạn để lại.","effects":{"INT":1,"joy":10}},{"id":"kobold_elder_final_stand","races":["kobold"],"stages":["elder"],
