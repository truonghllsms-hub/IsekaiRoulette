false,"weight":6,"text":"Ngồi tựa lưng vào phiến đá rêu phong, bạn nhàn nhã ngắm nhìn mặt trời lặn nhuộm đỏ Thảo Nguyên Gió Hú. Thời gian giờ trôi qua thật bình yên nhẹ bẫng.","effects":{"joy":10,"health":5}},{"id":"beastman_elder_3","races":["beastman"],"stages":["elder"],"eras":["peace"],"once":false,"weight":5,"text":"Bạn ngồi chễm chệ trên mô đất cao, kể cho đám Thú nhân non nớt nghe về những trận săn rồng đất thuở trước. Tiếng ồ lên thán phục của chúng như liều thuốc tiên xoa dịu tuổi già.","effects":{"INT":1,"joy":10}},{"id":"beastman_elder_4","races":["beastman"],"stages":["elder"],"eras":["holy_war"],"weight":7,"text":"Nhìn những hàng dài người tị nạn lê lết lánh nạn qua Thảo Nguyên Gió Hú, bạn thầm tạ ơn Tự Nhiên vì đã che chở cho bầy đàn suốt bao thập kỷ khói lửa.","effects":{"joy":5,"INT":1}},{"id":"beastman_elder_5","races":["beastman"],"stages":["elder"],"eras":["dark_age"],"weight":8,"text":"Dịch bệnh hắc ám cướp đi nhiều sinh mạng cường tráng, nhưng cơ thể già cỗi ngậm đầy thảo dược của bạn lại trơ như đá tảng. Tuổi thọ của bạn trở thành một điều kỳ diệu.","effects":{"health":15,"joy":-5,"STR":-1}},{"id":"beastman_elder_6","races":["beastman"],"stages":["elder"],"eras":["demon_lord"],"weight":8,"text":"Mỗi lần Quân Đoàn Hủy Diệt kéo đến, chướng khí lại làm những vết sẹo cũ rỉ máu đau buốt. Bạn nghiến răng chịu đựng, không để tiếng rên rỉ làm lung lay nhuệ khí lứa trẻ.","effects":{"health":-10,"joy":-10,"STR":-1}},{"id":"beastman_elder_7","races":["beastman"],"stages":["elder"],"once":false,"weight":5,"text":"Đích thân vót mũi tên gỗ cho một chiến binh trẻ. Đôi tay nhăn nheo nhưng chuẩn xác rèn ra những vũ khí mang theo linh hồn của gió.","effects":{"INT":1,"joy":5}},{"id":"beastman_elder_8","races":["beastman"],"stages":["elder"],"weight":8,"text":"Thủ lĩnh mới của bầy cung kính đem dâng cho bạn phần thịt sườn ngon nhất sau buổi đi săn. Sự tôn trọng của bầy đàn là huân chương chói lọi nhất đời bạn.","effects":{"health":10,"joy":15}},{"id":"beastman_elder_9","races":["beastman"],"stages":["elder"],"weight":7,"text":"Bạn thực hiện chuyến hành hương cuối cùng đến Cây Thế Giới Yggdrasil. Chạm tay vào lớp vỏ sần sùi ngàn năm, bạn cảm thấy linh hồn mình sắp hòa quyện vào Đại Ngàn.","effects":{"joy":20,"INT":1,"LUCK":1}},{"id":"beastman_elder_10","races":["beastman"],"stages":["elder"],"weight":7,"text":"Một học giả loài người lặn lội từ Tháp Ngà đến để ghi chép lại sử thi truyền miệng của tộc Thú nhân. Bạn hãnh diện kể về thời đại hoàng kim của mình.","effects":{"INT":2,"joy":10,"wealth":5}},{"id":"beastman_elder_11","races":["beastman"],"stages":["elder"],"weight":8,"text":"Cắn phải một miếng thịt sấy quá cứng, chiếc răng nanh từng cắn đứt yết hầu kẻ thù lỏng lẻo rồi rụng mất. Thời gian quả là lưỡi đao tàn nhẫn nhất.","effects":{"health":-5,"STR":-1,"joy":-10}},{"id":"beastman_elder_12","races":["beastman"],"stages":["elder"],"eras":["peace"],"weight":7,"text":"Lễ hội Lửa Trại vinh danh các Trưởng lão. Nhấp ngụm rượu cần nồng ấm, bạn mỉm cười nhìn dòng máu của mình nảy nở mạnh mẽ trên thảo nguyên.","effects":{"joy":25,"health":5}},{"id":"beastman_elder_13","races":["beastman"],"stages":["elder"],"eras":["dark_age"],"weight":8,"text":"Giấu bớt phần củ rừng héo hon của mình để san sẻ cho đứa cháu nội đang khóc vì đói. Người già như chiếc lá rụng, hy sinh để làm phân bón cho chồi non.","effects":{"health":-15,"joy":15,"INT":1}},{"id":"beastman_elder_14","races":["beastman"],"stages":["elder"],"weight":7,"require":{"flags":["gladiator"]},"text":"Tìm lại tấm khiên đồng rỉ sét từ thời lăn lộn ở Đấu Trường Huyết Sa. Những tiếng hò reo cuồng loạn ngày ấy vọng về như một giấc mộng đẫm máu vừa tan.","effects":{"joy":-5,"INT":1}},{"id":"beastman_elder_15","races":["beastman"],"stages":["elder"],"eras":["holy_war"],"weight":7,"text":"Giáo hội Thánh Quang cử giáo sĩ đến thuyết phục bạn rửa tội trước khi nhắm mắt. Bạn khạc nhổ vào đống kinh thánh mớ ba mớ bảy ấy, một mực trung thành với Tự Nhiên.","effects":{"INT":1,"joy":5}},{"id":"beastman_elder_16","races":["beastman"],"stages":["elder"],"weight":8,"text":"Đào lại cái hố bí mật chôn giấu tài sản thời thanh xuân vẫy vùng. Lôi ra được vài Đồng Cẩm Thạch xỉn màu, bạn cười khà khà vứt cho bọn trẻ mua kẹo.","effects":{"wealth":10,"joy":10}},{"id":"beastman_elder_17","races":["beastman"],"stages":["elder"],"once":false,"weight":5,"text":"Nhìn đôi Thú nhân trẻ âu yếm cọ mũi vào nhau bên bờ suối, bạn thở dài nhớ về người bạn đời đã khuất. Cô đơn ở tuổi xế bóng tĩnh lặng như đáy Vực Thẳm.","effects":{"joy":-10,"INT":1}},{"id":"beastman_elder_18","races":["beastman"],"stages":["elder"],"eras":["demon_lord"],"weight":8,"text":"Tiếng gầm rú của Ma Vương xé nát bầu trời đêm. Trái với lũ trẻ hoảng loạn, bạn bình thản lấy vạt áo lau sáng lại mũi giáo gỗ, chờ đợi trận chiến cuối cùng.","effects":{"INT":2,"joy":5,"flags":["fearless_elder"]}},{"id":"beastman_elder_19","races":["beastman"],"stages":["elder"],"weight":8,"text":"Trúng gió lạnh trong mùa Săn Bão. Cơn ho rũ rượi kéo dài hàng tuần vắt kiệt sinh lực mong manh cuối cùng trong cỗ máy nhục thể cằn cỗi.","effects":{"health":-20,"STR":-1,"AGI":-1}},{"id":"beastman_elder_20","races":["beastman"],"stages":["elder"],"eras":["peace"],"once":false,"weight":6,"text":"Ngồi lúi húi đẽo gọt một con rồng đất bằng gỗ tặng đứa chắt vừa chào đời. Hạnh phúc của loài Thú nhân đến tuổi này đơn giản đến thế là cùng.","effects":{"joy":15,"INT":1}},{"id":"beastman_elder_21","races":["beastman"],"stages":["elder"],"weight":7,"text":"Nghe tin gã tộc trưởng hàng xóm — kỳ phùng địch thủ một thời — vừa trút hơi thở cuối cùng. Bạn lẳng lặng rót một bát rượu vẩy xuống đất tiễn đưa cố nhân.","effects":{"joy":-10,"INT":1}},{"id":"beastman_elder_22","races":["beastman"],"stages":["elder"],"weight":7,"text":"Cố sức cõng một bó củi lớn nhưng đi được nửa đường thì khụyu gối. Bạn thở dốc, chua xót thừa nhận giới hạn bạo chúa của sự lão hóa.","effects":{"STR":-2,"health":-10,"joy":-15}},{"id":"beastman_elder_23","races":["beastman"],"stages":["elder"],"eras":["dark_age"],"weight":8,"text":"Lương thực cạn kiệt, bầy đàn tranh cãi xem có nên bỏ lại những người già yếu. Bạn đứng dậy, dõng dạc nói rằng mình sẽ tự đi vào rừng chờ cái chết để bớt gánh nặng.","effects":{"joy":-25,"INT":1,"flags":["martyr_mindset"]}},{"id":"beastman_elder_24","races":["beastman"],"stages":["elder"],"weight":7,"text":"Những giấc mộng chập chờn thường xuyên đưa bạn về vùng ánh sáng bạc, nơi linh hồn các dã thú tổ tiên đang cất tiếng tru gọi tên bạn về với Vô Cực.","effects":{"LUCK":1,"joy":5}},{"id":"beastman_elder_25","races":["beastman"],"stages":["elder"],"weight":8,"text":"Bạn quyết định phân phát nốt số Tinh Bạc và Lõi Mana tích cóp cả đời cho thế hệ sau. Rũ bỏ vướng bận trần tục, linh hồn bạn nhẹ như lông vũ.","effects":{"wealth":-50,"joy":25,"INT":1}},{"id":"beastman_elder_26","races":["beastman"],"stages":["elder"],"weight":8,"text":"Cố gắng gầm lên để thị uy một con lửng mật lảng vảng, nhưng âm thanh phát ra chỉ là một chuỗi khò khè ho khan. Con thú nhỏ lườm bạn rồi đủng đỉnh bỏ đi.","effects":{"STR":-1,"joy":-10}},{"id":"beastman_elder_27","races":["beastman"],"stages":["elder"],"eras":["holy_war"],"weight":7,"text":"Bắt gặp một lính Thánh Vệ Quân bị thương nặng đang hấp hối cạnh bụi cây râm bụt. Không còn thù hận, bạn đưa cho hắn một bầu nước cạn trước khi nhắm mắt.","effects":{"INT":2,"joy":5}},{"id":"beastman_elder_28","races":["beastman"],"stages":["elder"],"eras":["peace"],"once":false,"weight":6,"text":"Ngước nhìn bầu trời sao chi chít trên Thảo Nguyên Gió Hú. Những ngôi sao rụng mang theo hơi thở của tổ tiên dường như đang vẫy gọi bạn về với Vô Cực.","effects":{"joy":10,"INT":1}},{"id":"beastman_elder_29","races":["beastman"],"stages":["elder"],"eras":["holy_war"],"weight":8,"text":"Đoàn Thánh Vệ Quân diễu hành đằng xa ngoài bìa rừng. Bạn thở dài nhắm mắt, bánh xe chiến tranh của loài người đã nghiền nát hết thế hệ này đến thế hệ khác.","effects":{"joy":-5,"INT":1}},{"id":"beastman_elder_30","races":["beastman"],"stages":["elder"],"eras":["dark_age"],"weight":8,"text":"Đích thân dạy lũ trẻ cách lột vỏ thông trắng để nhai cầm hơi. Kinh nghiệm đẫm nước mắt của thế hệ trước trở thành phao cứu sinh cho chồi non.","effects":{"health":5,"joy":-5}},{"id":"beastman_elder_31","races":["beastman"],"stages":["elder"],"eras":["demon_lord"],"weight":8,"text":"Bầu trời nứt nẻ tuôn trào chướng khí tím rịm. Ngay cả sinh khí của Tự Nhiên cũng đang thoi thóp, kéo theo nhịp đập yếu ớt nơi lồng ngực cằn cỗi của bạn.","effects":{"health":-10,"joy":-10}},{"id":"beastman_elder_32","races":["beastman"],"stages":["elder"],"weight":6,"text":"Một ngày rảnh rỗi, bạn chống gậy đến thăm nấm mồ của người bạn đời thân thiết nhất. Xương cốt dẫu hóa cát bụi, tình yêu hoang dã vẫn nồng nàn như gió thảo nguyên.","effects":{"joy":10,"INT":1}},{"id":"beastman_elder_33","races":["beastman"],"stages":["elder"],"weight":7,"require":{"INT":5},"text":"Nhờ sự thông thái nức tiếng, bạn được mời làm chủ tế Lễ Đặt Tên cho một lứa sinh linh Thú nhân mới. Mỗi cái tên là một lời chúc phúc vĩnh hằng.","effects":{"joy":15,"LUCK":1}},{"id":"beastman_elder_34","races":["beastman"],"stages":["elder"],"weight":7,"text":"Bạn thèm một miếng thịt nướng nhưng tỳ vị phản chủ, nôn thốc nôn tháo. Nhục thể già nua đang dần từ chối nguồn sống để sửa soạn trở về với cát bụi.","effects":{"health":-10,"STR":-1,"joy":-5}},{"id":"beastman_elder_35","races":["beastman"],"stages":["elder"],"eras":["peace"],"once":false,"weight":5,"text":"Dùng rễ cây khô và lông chim ưng rụng tết thành những chiếc bùa hộ mệnh. Sự điềm tĩnh nhẹ nhàng bao phủ lều trại của bạn lúc xế chiều.","effects":{"joy":10,"INT":1}},{"id":"beastman_elder_36","races":["beastman"],"stages":["elder"],"weight":8,"text":"Nhiều lần giật mình tỉnh giấc lúc nửa đêm vì ảo giác tiếng kèn săn bắn vọng lại. Tâm trí đôi lúc đi lạc khỏi thực tại, bay về quá khứ vàng son rực lửa.","effects":{"joy":5,"health":-5}},{"id":"beastman_elder_37","races":["beastman"],"stages":["elder"],"eras":["holy_war"],"weight":7,"text":"Bỏ ngoài tai định kiến, bạn ném vài củ khoai nướng cho đám tù binh loài người đang bị áp giải ngang qua. Đứng trước lưỡi hái tử thần, vạn vật đều đáng thương.","effects":{"joy":10,"LUCK":1}},{"id":"beastman_elder_38","races":["beastman"],"stages":["elder"],"weight":7,"require":{"wealth":20},"text":"Dốc cạn tiền túi cuối cùng để mua một vò rượu lùn ủ ngàn hoa. Uống một ngụm, bao cay đắng ngọt bùi của một đời anh hùng trôi tuột xuống cổ họng.","effects":{"wealth":-20,"joy":25}},{"id":"beastman_elder_39","races":["beastman"],"stages":["elder"],"eras":["dark_age"],"weight":7,"text":"Cúm mùa ác tính quét qua. Kháng thể dạn dày của bạn vẫn vững như bàn thạch, nhưng bạn lại phải xót xa chứng kiến vài chồi non của tộc gục ngã.","effects":{"health":10,"joy":-15}},{"id":"beastman_elder_40","races":["beastman"],"stages":["elder"],"eras":["demon_lord"],"weight":8,"text":"Một con tiểu quỷ thối tha mò vào lều của bạn cắn trộm thức ăn. Không tốn một giọt mồ hôi, bạn giật dây bẫy lưới tóm gọn nó rồi ném ra ngoài bãi rác.","effects":{"INT":1,"joy":5}},{"id":"beastman_elder_41","races":["beastman"],"stages":["elder"],"weight":8,"text":"Ánh nắng ban mai xuyên qua kẽ lá rọi ấm đôi bàn tay nhăn nheo gầy guộc. Cảm nhận rõ từng nhịp đập chậm dần trong ngực, bạn thanh thản mỉm cười đón nhận thiên mệnh.","effects":{"joy":10,"INT":1}},{"id":"beastman_elder_choice_1","races":["beastman"],"stages":["elder"],"weight":9,"text":"Trưởng tộc trẻ tuổi đem lễ vật đến xin bạn lời khuyên: Thương Đoàn Sói Bạc muốn ngã giá mua đứt một vùng đồng cỏ thiêng để xây dựng thương điếm.","choices":[{"label":"Gợi ý ký khế ước cho thuê","check":{"stat":"INT","target":7},"success":{"text":"Trí tuệ minh mẫn của bạn chỉ ra lỗ hổng trong luật của Sanctus. Bạn xúi trưởng tộc cho thuê đất thu phí hàng năm, vơ vét được kho lương thực lớn mà đất vẫn thuộc về bầy.","effects":{"INT":1,"wealth":30,"joy":20,"flags":["wise_elder"]},"moment":"Hiến kế sắc sảo cho bầy đàn"},"fail":{"text":"Bạn nhầm lẫn các điều khoản do đã lâu không giao thương. Đám thương nhân lừa ký khế ước gài bẫy, cuỗm mất vùng đất thiêng với cái giá bèo bọt.","effects":{"wealth":10,"joy":-25,"health":-10}}},{"label":"Gõ gậy quát tháo, kiên quyết từ chối","text":"Bạn nhắc nhở vị thủ lĩnh trẻ rằng máu của tổ tiên tưới trên mảnh đất này không thể quy ra bằng Tinh Bạc hay Huyết Kim. Tộc giữ lại được sự tôn nghiêm.","effects":{"INT":1,"joy":10}}]},{"id":"beastman_elder_choice_2","races":["beastman"],"stages":["elder"],"eras":["holy_war"],"weight":8,"text":"Một kỵ sĩ Thánh Vệ Quân bị thương nặng lạc vào bìa rừng cạnh túp lều của bạn. Hắn nằm thoi thóp, lảm nhảm gọi tên Nữ thần Lumina trong cơn mê sảng.","choices":[{"label":"Cứu rỗi bằng y thuật hoang dã","check":{"stat":"LUCK","target":7},"success":{"text":"Số mạng hắn chưa tận. Hắn tỉnh dậy, lặng người đi khi biết một Thú nhân đã cứu mình. Hắn bái lạy bạn và để lại thanh kiếm nạm Huyết Kim làm tạ lễ.","effects":{"wealth":25,"joy":15,"LUCK":1},"moment":"Cứu sống kỵ sĩ Thánh Vệ Quân"},"fail":{"text":"Hắn hoảng loạn khi thấy Thú nhân tiếp cận, rút dao găm đâm sượt qua sườn bạn rồi lết đi. Làm ơn mắc oán, bạn phải tự cầm máu cho mình.","effects":{"health":-20,"joy":-15}}},{"label":"Bỏ mặc kẻ thù chầu trời","text":"Dòng máu con người đã đổ quá nhiều trên quê hương bạn. Bạn lạnh lùng đứng nhìn hắn trút hơi thở cuối cùng, rồi tháo lấy tấm áo choàng lông cừu đắp cho đỡ lạnh.","effects":{"wealth":5,"health":5,"joy":-5}}]},{"id":"beastman_elder_choice_3","races":["beastman"],"stages":["elder"],"weight":9,"text":"Một thầy lang hắc ám gõ cửa, chìa ra một viên đan dược ngào ngạt mùi ma thuật. Hắn hứa nó sẽ hồi quang phản chiếu sinh lực bạn trong một năm trước khi tim ngừng đập.","choices":[{"label":"Nuốt đan dược đổi lấy thanh xuân ngắn ngủi","check":{"stat":"STR","target":6},"success":{"text":"Cơ bắp khô héo bỗng cuồn cuộn trỗi dậy! Bạn xé toạc áo, cầm binh khí lao ra thảo nguyên gầm vang. Trận săn cuối cùng của bạn khắc sâu vào sử thi vĩnh hằng.","effects":{"STR":3,"health":-15,"joy":30,"flags":["final_glory"]},"moment":"Cháy rực một lần cuối rồi tàn phai"},"fail":{"text":"Thể xác tàn tạ không thể chứa chấp thứ ma lực cuồng bạo. Trái tim già nua của bạn đập loạn nhịp rồi vỡ tung lồng ngực.","death":"Nhục thể khô cằn vỡ vụn dưới sức mạnh cưỡng ép, bạn chết vì đột quỵ ở tuổi {age} mang theo nuối tiếc thanh xuân vĩnh viễn chưa trọn vẹn."}},{"label":"Nhạt nhẽo hất viên đan dược đi","text":"Sinh lão bệnh tử là vòng lặp tất yếu của Tự Nhiên. Bạn mỉm cười khinh bỉ những kẻ cố cãi lại thiên mệnh và thanh thản bước qua cám dỗ.","effects":{"INT":2,"joy":15}}]},{"id":"beastman_elder_choice_4","races":["beastman"],"stages":["elder"],"eras":["dark_age","demon_lord"],"weight":8,"text":"Dịch sởi quỷ ám khiến bầy trẻ con lịm dần. Thuốc giải duy nhất là Tuyết Liên Hoa trên đỉnh vách đá Dãy Núi Răng Cưa, nơi đám thợ săn trẻ không biết đường lên.","choices":[{"label":"Đích thân leo vách hái thuốc","check":{"stat":"AGI","target":8},"success":{"text":"Bằng ý chí sắt đá vượt qua thể lực cạn kiệt, bạn lách qua tử thần nhổ được gốc liên hoa. Lũ trẻ được cứu, bạn trở thành vị thánh sống được toàn tộc quỳ lạy.","effects":{"joy":30,"health":-15,"LUCK":2,"flags":["saint_of_the_clan"]},"moment":"Lên núi thiêng tìm thuốc cứu bầy"},"fail":{"text":"Tay chân lẩy bẩy, móng vuốt đã cùn không thể găm vào vách đá, bạn trượt chân rơi thẳng xuống từ độ cao ngót nghét năm mươi thước.","death":"Cơ thể gầy guộc đập vào vách đá vỡ vụn. Bạn hi sinh lẫm liệt để tìm đường sống cho thế hệ sau ở tuổi {age}, tên bạn thành truyền thuyết bất tử."}},{"label":"Vẽ bản đồ, để thế hệ trẻ tự đi","text":"Truyền đạt lại đường đi và kinh nghiệm là việc duy nhất người già làm được. Dẫu chậm trễ khiến vài đứa trẻ mất mạng, nhưng phần lớn vẫn được cứu sống.","effects":{"INT":1,"joy":-5,"health":5}}]},{"id":"beastman_elder_choice_5","races":["beastman"],"stages":["elder"],"weight":10,"text":"Một linh hồn tinh linh sói trắng — sứ giả của Tự Nhiên — xuất hiện bên gối bạn trong một đêm rằm. Nó báo hiệu chuyến đi săn cuối cùng đã điểm.","choices":[{"label":"Chống gậy đứng lên đi theo tinh linh","check":{"stat":"LUCK","target":5},"success":{"text":"Để lại tấm áo khoác và cây trượng ở cửa lều, bạn bước vào màn sương bạc. Linh hồn bạn thanh thản hòa vào Đại Ngàn, bỏ lại xác phàm nhẹ tênh trên cỏ vắng.","effects":{"joy":35,"INT":2,"flags":["peaceful_ascension"]},"moment":"Thăng hoa linh hồn cùng tinh linh sói"},"fail":{"text":"Bạn cố vươn tay theo, nhưng đôi chân bại liệt phản bội ý chí. Bạn gục ngã ngay ngưỡng cửa, thoi thóp thở hắt ra trong tiếc nuối tột cùng.","effects":{"health":-30,"joy":-25}}},{"label":"Luyến tiếc ở lại ngắm nhìn con cháu","text":"Bạn vái lạy từ chối tinh linh, cố dùng phần sức tàn lụi cuối cùng nán lại dương gian thêm một chặng nữa chỉ vì không nỡ rời xa máu mủ.","effects":{"health":-10,"STR":-1,"joy":10}}]},{"id":"c_first_word","tags":["humanoid"],"excludeRaces":["vampire","ghoul"],"stages":["infant"],"weight":10,"text":"Bạn nói được từ đầu tiên. Không ai đồng ý đó là từ gì.","effects":{"INT":1}},{"id":"c_first_steps","tags":["humanoid"],"excludeRaces":["vampire","ghoul"],"stages":["infant"],"weight":10,"text":"Bạn tự đứng dậy và đi được bốn bước. Rồi ngã.","effects":{"AGI":1}},{"id":"c_sick_child","stages":["infant","child"],"weight":6,"text":"Bạn ốm một trận nặng. Có ai đó thức trắng ba đêm bên bạn.","effects":{"health":-12,"joy":3}},{"id":"c_past_life","stages":["child","teen"],"weight":4,"text":"Bạn mơ thấy một thế giới có những cỗ xe sắt chạy không cần ngựa. Tỉnh dậy, bạn thấy nhớ nơi đó lạ lùng.","effects":{"INT":1},"moment":"Mơ về kiếp trước"},{"id":"c_friend","tags":["humanoid"],"stages":["child"],"weight":8,"text":"Bạn có một người bạn thân. Hai đứa chia nhau mọi thứ, kể cả những trận đòn.","effects":{"joy":10,"flags":["has_friend"]}},{"id":"c_friend_leave","stages":["teen","adult"],"weight":6,"require":{"flags":["has_friend"]},"text":"Người bạn thân của bạn chuyển đi nơi khác. Bạn đứng nhìn theo đến khi không thấy nữa.","effects":{"joy":-10,"unflags":["has_friend"]}},{"id":"c_read","tags":["civil"],"stages":["child","teen"],"weight":6,"text":"Bạn học được cách đọc. Chữ đầu tiên bạn tự đọc là tên một quán rượu.","effects":{"INT":2}},{"id":"c_coin","stages":["child","teen","adult"],"weight":4,"text":"Bạn nhặt được một đồng xu khắc hình lạ. Bạn giữ nó rất lâu.","effects":{"LUCK":1,"wealth":2}},{"id":"c_winter","once":false,"weight":2,"text":"Mùa đông năm ấy dài bất thường. Ai cũng gầy đi.","effects":{"health":-5}},{"id":"c_quiet_year","once":false,"weight":3,"text":"Một năm êm ả. Bạn gần như không nhớ gì về nó, và đó là điều tốt.","effects":{"joy":4}},{"id":"c_rest","once":false,"weight":6,"require":{"below":{"health":55}},"text":"Bạn nghỉ ngơi suốt một mùa. Cơ thể hồi lại dần.","effects":{"health":12}},{"id":"c_storm","tags":["humanoid"],"stages":["child","teen","adult","middle"],"weight":3,"text":"Một cơn bão đi qua. Bạn mất vài thứ, nhưng người vẫn nguyên vẹn.","effects":{"wealth":-5}},{"id":"c_injury","stages":["adult","middle"],"once":false,"weight":2,"text":"Bạn bị thương ở chân. Vết thương lành, nhưng trời trở lạnh là lại nhức.","effects":{"health":-8,"AGI":-1}},{"id":"c_plague","stages":["child","adult","middle"],"eras":["dark_age"],"excludeRaces":["slime","ghoul","vampire","lizardman"],"weight":8,"text":"Dịch bệnh lan tới nơi bạn sống. Ngày nào cũng có tiếng chuông báo tang.","effects":{"health":-20,"joy":-10}},{"id":"c_cave","tags":["humanoid"],"stages":["teen","adult"],"weight":5,"text":"Bạn tìm thấy lối vào một hang động lạ. Bên trong có ánh sáng le lói.","choices":[{"label":"Bước vào","check":{"stat":"AGI","target":6},"success":{"text":"Bạn lách qua những tảng đá và tìm thấy một chiếc rương cũ. Bên trong có vàng.","effects":{"wealth":25},"moment":"Tìm thấy kho báu trong hang"},"fail":{"text":"Đá dưới chân bạn sụt xuống. Bạn bò ra được sau hai ngày.","effects":{"health":-25}}},{"label":"Bỏ đi","text":"Bạn quay về. Cả đời bạn vẫn tự hỏi trong đó có gì.","effects":{"joy":-3}}]},{"id":"c_love","tags":["humanoid"],"stages":["teen","adult"],"weight":7,"require":{"notFlags":["partner"]},"text":"Có một người luôn đứng ở chỗ bạn hay đi qua. Họ nhìn bạn lâu hơn mức bình thường.","choices":[{"label":"Bắt chuyện","check":{"stat":"LUCK","target":5},"success":{"text":"Hai người nói chuyện đến tận tối. Rồi rất nhiều buổi tối sau đó.","effects":{"joy":15,"flags":["partner"]},"moment":"Gặp người thương"},"fail":{"text":"Hóa ra họ đang đợi người khác.","effects":{"joy":-5}}},{"label":"Lặng lẽ đi qua","text":"Bạn đi qua. Ngày mai bạn cũng sẽ đi qua.","effects":{"joy":-2}}]},{"id":"c_marry","stages":["adult","middle"],"weight":9,"require":{"flags":["partner"],"notFlags":["married"]},"text":"Bạn và người ấy quyết định sống cùng nhau. Không có nhẫn, chỉ có một lời hứa.","effects":{"joy":15,"flags":["married"]},"moment":"Kết đôi"},{"id":"c_child","stages":["adult","middle"],"weight":8,"require":{"flags":["married"]},"text":"Bạn có một đứa con. Nó khóc to hơn bạn tưởng.","effects":{"joy":12,"wealth":-5,"flags":["parent"]},"moment":"Lần đầu làm cha mẹ"},{"id":"c_partner_dies","stages":["middle","elder","ancient"],"weight":5,"require":{"flags":["married"]},"text":"Người bạn đời của bạn ra đi trước. Căn nhà bỗng trở nên quá rộng.","effects":{"joy":-25,"unflags":["married"],"flags":["widowed"]},"moment":"Mất người bạn đời"},{"id":"c_grandchild","stages":["elder"],"weight":6,"require":{"flags":["parent"]},"text":"Con bạn dẫn về một đứa bé. Nó có đôi mắt giống hệt bạn.","effects":{"joy":15},"moment":"Được bế cháu"},{"id":"c_war","tags":["civil"],"stages":["adult"],"eras":["holy_war","demon_lord"],"weight":10,"text":"Chiến tranh nổ ra. Lính chiêu mộ đi gõ cửa từng nhà.","choices":[{"label":"Nhập ngũ","check":{"stat":"STR","target":6},"success":{"text":"Bạn trở về sau hai năm, với một huân chương và ít lời hơn trước.","effects":{"wealth":20,"STR":1,"flags":["veteran"]},"moment":"Trở về từ chiến trận"},"fail":{"text":"Bạn trở về với một vết sẹo dài và những giấc mơ không yên.","effects":{"health":-35,"joy":-10,"flags":["veteran"]}}},{"label":"Trốn lính","check":{"stat":"AGI","target":5},"success":{"text":"Bạn trốn dưới hầm suốt hai mùa. Khi bạn chui ra, chiến tranh đã hết.","effects":{"joy":-5}},"fail":{"text":"Bạn bị bắt và phải lao dịch một năm.","effects":{"health":-10,"wealth":-10}}}]},{"id":"c_elder_tales","stages":["elder","ancient"],"once":false,"weight":2,"tags":["humanoid"],"text":"Lũ trẻ quanh đây hay đến nghe bạn kể chuyện. Mỗi lần kể, câu chuyện lại hay hơn một chút.","effects":{"joy":5}},{"id":"c_cough","stages":["elder"],"weight":5,"text":"Mùa đông nào bạn cũng ho nhiều hơn mùa trước.","effects":{"health":-10}},{"id":"c_kingdom_falls","stages":["ancient","middle","elder"],"require":{"flags":[]},"races":["slime","vampire","ghoul","dragon","high_demon","elf"],"weight":4,"text":"Một vương quốc gần đó sụp đổ. Bạn vẫn nhớ ngày nó được dựng lên.","effects":{"INT":1},"moment":"Chứng kiến một vương quốc sụp đổ"},{"id":"c_world_changes","stages":["ancient"],"once":false,"weight":3,"text":"Thế giới thay đổi. Bạn thì không thay đổi nhiều lắm.","effects":{"joy":-1}},{"id":"era_peace_festival","eras":["peace"],"tags":["humanoid"],"stages":["child","teen","adult"],"weight":5,"text":"Mùa Lửa Trại năm ấy, lễ hội được tổ chức khắp các làng mạc. Dưới ánh đuốc bập bùng, bạn nhảy múa cho đến khi trăng lặn.","effects":{"joy":10,"wealth":-3}},{"id":"era_peace_trade","eras":["peace"],"stages":["adult","middle"],"weight":5,"text":"Thương lộ thông suốt, hàng hóa từ khắp Aethelgard đổ về. Một năm sung túc hiếm hoi trong đời bạn.","effects":{"wealth":10,"joy":3}},{"id":"era_war_refugee","eras":["holy_war"],"stages":["child","teen","adult"],"weight":6,"text":"Khói lửa chiến tranh tràn đến quê hương bạn. Bạn cùng hàng ngàn kẻ khác lê bước trên con đường chạy nạn, mang theo những gì có thể.","effects":{"health":-10,"wealth":-10,"joy":-10},"moment":"Chạy nạn chiến tranh"},{"id":"era_dark_famine","eras":["dark_age"],"once":false,"weight":4,"text":"Nạn đói siết chặt lấy vùng đất. Bạn đã quên mất cảm giác no bụng là như thế nào.","effects":{"health":-10,"joy":-5}},{"id":"era_dark_cult","eras":["dark_age"],"tags":["humanoid"],"stages":["teen","adult"],"weight":6,"text":"Giữa đêm tối, một kẻ trùm áo choàng đen tìm đến bạn. Hắn thì thầm về Hắc Nguyệt Hội, về con đường thoát khỏi sinh lão bệnh tử.","choices":[{"label":"Gia nhập Hắc Nguyệt Hội","text":"Bạn nhỏ máu lên vầng trăng đen khắc trên tế đàn. Những bí mật của Vực Thẳm Cổ Thần dần hé mở trước mắt bạn.","effects":{"INT":2,"joy":-5,"flags":["cultist"]},"moment":"Gia nhập Hắc Nguyệt Hội"},{"label":"Tố giác hắn","check":{"stat":"LUCK","target":5},"success":{"text":"Thánh Vệ Quân bắt gọn cả giáo đoàn nhờ lời khai của bạn. Bạn nhận được một túi bạc và ánh mắt căm hờn từ bóng tối.","effects":{"wealth":15}},"fail":{"text":"Giáo đoàn biết bạn là kẻ tố giác trước cả Thánh Vệ Quân.","effects":{"health":-25}}}]},{"id":"era_demon_lord_heroes","eras":["demon_lord"],"tags":["civil"],"stages":["teen","adult"],"weight":10,"text":"Chuông nhà thờ vang lên khắp lục địa. Giáo hội Thánh Quang hiệu triệu mọi chiến binh tập kết dưới ngọn cờ Anh hùng để chống lại Ma Vương.","choices":[{"label":"Gia nhập đoàn Anh hùng","check":{"stat":"STR","target":8},"success":{"text":"Bạn sát cánh cùng các Anh hùng qua trăm trận chiến. Tên bạn được khắc lên tượng đài giữa Thủ đô Sanctus.","effects":{"wealth":30,"joy":15,"flags":["hero"]},"moment":"Chiến đấu cùng đoàn Anh hùng chống Ma Vương"},"fail":{"text":"Quân đoàn quỷ tràn qua chiến tuyến như một cơn lũ đen.","death":"Bạn ngã xuống trong cuộc chiến chống Ma Vương ở tuổi {age}, một trong vạn cái tên không ai kịp khắc lên bia đá."}},{"label":"Ở lại bảo vệ quê nhà","text":"Bạn ở lại, dựng hàng rào gỗ quanh làng và canh gác mỗi đêm. Ngôi làng của bạn là một trong số ít nơi còn đứng vững.","effects":{"health":-10,"joy":5}}]},{"id":"era_demon_lord_legion","eras":["demon_lord"],"tags":["monster"],"stages":["teen","adult","middle"],"weight":10,"text":"Tiếng tù và của Ma Vương vang vọng từ Cửa Ngục Than Khóc. Quân Đoàn Hủy Diệt đang chiêu mộ mọi ma vật để tràn lên mặt đất.","choices":[{"label":"Gia nhập Quân Đoàn","check":{"stat":"STR","target":7},"success":{"text":"Bạn hành quân dưới lá cờ đen, tàn sát những thành trì loài người từng khinh miệt giống loài của bạn.","effects":{"wealth":25,"STR":1,"flags":["demon_army"]},"moment":"Gia nhập Quân Đoàn Hủy Diệt"},"fail":{"text":"Bạn bị đẩy lên tuyến đầu làm bia đỡ đạn.","death":"Bạn chết trong đợt xung phong đầu tiên của Quân Đoàn Hủy Diệt, ở tuổi {age}."}},{"label":"Lẩn trốn","check":{"stat":"AGI","target":5},"success":{"text":"Bạn trốn sâu trong lòng đất cho đến khi tiếng tù và tắt hẳn.","effects":{"joy":-5}},"fail":{"text":"Lũ đốc binh quỷ lôi bạn ra và đánh đập vì tội đào ngũ.","effects":{"health":-30}}}]},{"id":"era_hero_summoned","eras":["demon_lord","holy_war"],"tags":["monster"],"stages":["child","teen","adult"],"weight":4,"text":"Giáo hội triệu hồi những \"Người được chọn\" từ một thế giới khác. Họ mang theo những sức mạnh phi lý, và quét sạch ma vật cấp thấp như quét lá rụng.","effects":{"health":-20,"joy":-10},"moment":"Sống sót qua cuộc tàn sát của Người được chọn"},{"id":"demon_infant_horn_buds","races":["demon"],"stages":["infant"],"weight":10,"text":"Những chỏm sừng non đầu tiên nhú lên trên trán, mang theo cơn đau xé rách da thịt. Đó là dấu ấn vĩnh cửu của Vực Thẳm đánh dấu sự hiện diện của bạn trên thế giới này.","effects":{"STR":1,"health":-5}},{"id":"demon_infant_miasma_breath","races":["demon"],"stages":["infant"],"weight":8,"text":"Bạn vô thức hít một hơi thật sâu làn chướng khí dày đặc xung quanh. Thay vì ho sặc sụa, phổi bạn nở rộ đón nhận nguồn sức mạnh tăm tối tột cùng.","effects":{"health":5,"STR":1}},{"id":"demon_infant_abyss_cry","races":["demon"],"stages":["infant"],"once":false,"weight":5,"text":"Tiếng khóc của bạn vô tình tạo ra âm vang của một chú ngữ ma quỷ cổ đại. Những bóng ma nhỏ trong góc phòng vội vã cúi rạp mình phục tùng.","effects":{"INT":1,"joy":5}},{"id":"demon_infant_starvation","races":["demon"],"stages":["infant"],"eras":["dark_age"],"weight":6,"text":"Kỷ nguyên Tăm Tối khiến nguồn Lõi Mana cạn kiệt, bạn phải nhai những khúc xương khô khốc để sống qua ngày. Cái đói gặm nhấm cả thể xác lẫn linh hồn tà ác của bạn.","effects":{"health":-15,"joy":-10}},{"id":"demon_infant_cultist_worship","races":["demon"],"stages":["infant"],"weight":4,"require":{"flags":["thanh_tu_hac_nguyet"]},"text":"Những tín đồ Hắc Nguyệt dâng lên nôi của bạn những tế vật nhuốm máu rực rỡ. Ánh mắt cuồng tín của họ bồi đắp sự ngạo mạn sớm nở trong tâm trí bạn.","effects":{"joy":10,"wealth":10}},{"id":"demon_infant_lava_milk","races":["demon"],"stages":["infant"],"weight":7,"text":"Người chăm sóc ép bạn uống thứ nhũ dịch chắt lọc từ tinh hỏa dung nham. Cổ họng bạn như bị nung chảy, nhưng dòng máu sôi sục sức mạnh mới.","effects":{"STR":2,"health":-5}},{"id":"demon_infant_shadow_play","races":["demon"],"stages":["infant"],"eras":["peace"],"once":false,"weight":5,"text":"Dưới bầu trời Thời Bình trong trẻo giả tạo, bạn chơi đùa cùng những tinh linh bóng tối trốn dưới tán cây gắt gỏng. Bánh xe thời gian xoay những nhịp yên ả hiếm hoi.","effects":{"joy":8,"AGI":1}},{"id":"demon_infant_crusader_hide","races":["demon"],"stages":["infant"],"eras":["holy_war"],"weight":8,"text":"Ánh sáng chói lòa của Thánh Vệ Quân quét qua hang động nơi bạn đang ẩn náu. Bạn nín thở, cắn chặt môi đến bật máu để không phát ra tiếng động nào.","effects":{"AGI":2,"joy":-15,"flags":["am_anh_anh_sang"]}},{"id":"demon_infant_fever","races":["demon"],"stages":["infant"],"weight":8,"text":"Cơn sốt ma lực hành hạ cơ thể bé nhỏ, vảy sừng mỏng manh rịn ra những giọt mồ hôi đen đặc. Sinh mệnh thoi thóp bám víu lấy ranh giới mong manh của tử sinh.","effects":{"health":-20}},{"id":"demon_infant_red_moon","races":["demon"],"stages":["infant"],"weight":6,"text":"Lần đầu tiên bạn ngước nhìn Huyết Nguyệt treo lơ lửng trên bầu trời Aethelgard. Một tri thức cổ xưa và kỳ bí lặng lẽ chảy vào tâm trí non nớt của bạn.","effects":{"INT":2,"joy":5}},{"id":"demon_infant_orphan_survival","races":["demon"],"stages":["infant"],"weight":5,"require":{"flags":["tre_mo_coi"]},"text":"Không có ai che chở, bạn tự mình nhặt nhạnh rêu độc và xác côn trùng để lấp đầy dạ dày rỗng. Định mệnh buộc bạn phải lớn lên bằng sự tàn nhẫn.","effects":{"STR":1,"health":-5}},{"id":"demon_infant_first_blood_choice","races":["demon"],"stages":["infant"],"weight":10,"text":"Nghi thức Tắm Máu đầu đời bắt đầu. Trước mặt bạn là bát huyết thỏ rừng an toàn và vũng máu sủi bọt của một quái thú Vực Thẳm hung bạo.","choices":[{"label":"Tắm máu quái thú","check":{"stat":"STR","target":5},"success":{"text":"Máu quái thú đốt cháy da thịt, nhưng bạn nghiến răng hấp thụ toàn bộ tà năng cuồng bạo. Sức mạnh nguyên thủy lấp đầy huyết quản.","effects":{"STR":3,"health":-10,"flags":["huyet_ke_vuc_tham"]},"moment":"Hấp thụ máu quái thú Vực Thẳm khi còn sơ sinh."},"fail":{"text":"Cơ thể nhỏ bé không thể chịu nổi lượng tà năng khổng lồ, mạch máu bạn vỡ vụn dưới áp lực tàn khốc.","death":"Bị tà năng quái thú xé nát cơ thể từ bên trong ở tuổi {age}."}},{"label":"Tắm máu thỏ rừng","text":"Bạn ngoan ngoãn chọn bát máu thỏ an toàn. Làn da êm dịu hấp thụ sinh khí mỏng manh, một sự khởi đầu nhạt nhẽo nhưng chắc chắn.","effects":{"health":10,"STR":1}}]},{"id":"demon_child_magic_practice","races":["demon"],"stages":["child"],"weight":10,"text":"Bạn lén học cách tập hợp ma năng từ không khí xung quanh, tạo ra những đóm lửa đen nhỏ bé nhảy múa trên đầu ngón tay. Khát khao quyền lực bắt đầu nảy mầm.","effects":{"INT":2}},{"id":"demon_child_lord_aura","races":["demon"],"stages":["child"],"eras":["demon_lord"],"weight":8,"text":"Tiếng kèn hiệu triệu của Ma Vương Giáng Thế vang vọng qua các tầng thứ nguyên. Dòng máu trong bạn sôi lên, đáp lại tiếng gọi của chiến tranh và tàn sát.","effects":{"STR":2,"joy":10}},{"id":"demon_child_street_fight","races":["demon"],"stages":["child"],"once":false,"weight":7,"text":"Bạn vướng vào một cuộc ẩu đả đẫm máu với những đứa trẻ ma tộc khác để tranh giành một mảnh Lõi Mana vỡ. Kẻ mạnh nuốt kẻ yếu là quy luật duy nhất ở đây.","effects":{"STR":1,"health":-8,"wealth":5}},{"id":"demon_child_hunt_lizards","races":["demon"],"stages":["child"],"once":false,"weight":7,"text":"Bạn lang thang vùng ven Đầm Lầy Tử Khí, phóng lao săn những con thằn lằn gai tẩm độc. Dù hôi hám, chúng mang lại một ít Đồng Cẩm Thạch khi đem bán.","effects":{"AGI":1,"wealth":8}},{"id":"demon_child_old_rune","races":["demon"],"stages":["child"],"weight":6,"require":{"INT":5},"text":"Trí tuệ vượt trội giúp bạn giải mã được một phiến đá vỡ chứa cổ ngữ tà ám tại phế tích tàn tạ. Một tri thức cấm kỵ vừa được hé lộ.","effects":{"INT":2,"flags":["hieu_biet_co_ngu"]}},{"id":"demon_child_scale_molt","races":["demon"],"stages":["child"],"weight":10,"text":"Kỳ lột vảy đầu tiên vô cùng đau đớn, máu rịn ra trên mọi tấc da thịt. Lớp vảy sừng mới mọc lên đen bóng và cứng cáp như thép nguội.","effects":{"health":-15,"STR":2,"flags":["vay_thep"]}},{"id":"demon_child_light_bomb","races":["demon"],"stages":["child"],"eras":["holy_war"],"weight":8,"text":"Một quả pháo sáng ma pháp của Thánh Vệ Quân nổ tung ngay cạnh nơi bạn ẩn nấp. Phép thuật hệ Quang thanh tẩy thiêu đốt một mảng lưng bạn, để lại sẹo vĩnh viễn.","effects":{"health":-20,"joy":-15}},{"id":"demon_child_steal_core_choice","races":["demon"],"stages":["child"],"weight":9,"text":"Một tên lính gác ma tộc to lớn đang ngủ say, Lõi Mana lấp lánh rơi hờ trên đùi hắn. Ánh sáng của viên đá thôi thúc lòng tham trong tâm hồn ác quỷ của bạn.","choices":[{"label":"Liều mình trộm Lõi Mana","check":{"stat":"AGI","target":6},"success":{"text":"Bóng tối che chở bước chân không trọng lượng của bạn. Bạn đoạt lấy viên đá và tẩu thoát trước khi con quái vật kịp chớp mắt.","effects":{"wealth":20,"AGI":1},"moment":"Thực hiện thành công phi vụ trộm Lõi Mana đầu đời."},"fail":{"text":"Bạn lỡ giẫm lên cành cây khô. Tên een_elven_trick","races":["demon"],"stages":["teen"],"weight":6,"text":"Một tù binh Tinh Linh dùng lời lẽ đường mật lừa bạn lơi lỏng cảnh giác rồi đánh lén tẩu thoát. Cú sốc nhục nhã này là bài học đắt giá về sự tàn nhẫn cần thiết của ác quỷ.","effects":{"health":-15,"joy":-15,"INT":1}},{"id":"demon_teen_forge_weapon","races":["demon"],"stages":["teen"],"weight":7,"require":{"wealth":30},"text":"Bạn vung tiền tại Lò Rèn Vĩnh Cửu, ép một thợ rèn nô lệ đánh cho mình thanh kiếm hợp kim tẩm hắc ín. Khí giới mới tỏa ra sát khí lạnh buốt đầy uy lực.","effects":{"wealth":-30,"STR":3,"flags":["vu_khi_hac_am"]}},{"id":"demon_teen_clash_priest_choice","races":["demon"],"stages":["teen"],"weight":10,"text":"Đang bay lượn ở biên giới, bạn chạm trán một tu sĩ cấp cao của Giáo hội Thánh Quang. Ánh sáng thiêng liêng rực rỡ từ quyền trượng lão chĩa thẳng vào sinh mệnh tăm tối của bạn.","choices":[{"label":"Đâm bổ xuống tấn công","check":{"stat":"AGI","target":7},"success":{"text":"Bạn lách qua tia sáng chết chóc trong tấc gang, vung móng vuốt xé toạc cổ họng tu sĩ. Chiếc nhẫn Thánh giá của lão trở thành chiến lợi phẩm đắt giá.","effects":{"AGI":2,"wealth":25,"flags":["ke_giet_tu_si"]},"moment":"Tự tay sát hại một tu sĩ cấp cao của Thánh Quang lúc thiếu thời."},"fail":{"text":"Tốc độ của bạn không đủ nhanh. Cột sáng thiêng liêng xuyên lủng lồng ngực, thiêu rụi trái tim ma tộc của bạn thành tro.","death":"Bị thanh tẩy bởi quyền trượng Thánh Quang ở tuổi {age}."}},{"label":"Gấp cánh lẩn trốn","text":"Bạn thu mình lao xuống vực sâu, mượn bóng tối dày đặc để thoát thân. Chút vảy lưng bị sém nắng nhưng mạng sống vẫn được bảo toàn.","effects":{"health":-5,"joy":-5}}]},{"id":"demon_teen_stolen_grimoire_choice","races":["demon"],"stages":["teen"],"weight":9,"text":"Tháp tà thuật của bộ lạc có cất giấu một quyển Hắc Thư cấm kỵ. Bạn thèm khát những ma pháp hủy diệt không được truyền dạy công khai bên trong.","choices":[{"label":"Lẻn vào phá trận pháp","check":{"stat":"INT","target":6},"succes ếp hạ gục ba đấu sĩ ma tộc khổng lồ chỉ trong một đêm. Tiếng hò reo man dại của khán đài là bản thánh ca tụng xưng sức mạnh vô song của bạn.","effects":{"STR":1,"joy":15,"wealth":25}},{"id":"demon_adult_famine_despair","races":["demon"],"stages":["adult"],"eras":["dark_age"],"weight":8,"text":"Kỷ Nguyên Tăm Tối tước đi mọi nguồn ma năng trên lục địa. Bạn phải tự lột đi vài mảnh vảy của chính mình để nấu thành thứ canh lỏng cầm cự qua những tháng ngày tuyệt vọng.","effects":{"health":-20,"joy":-20}},{"id":"demon_adult_demon_lord_vanguard","races":["demon"],"stages":["adult"],"eras":["demon_lord"],"weight":10,"require":{"flags":["linh_quan_doan"]},"text":"Dưới trướng Ma Vương Giáng Thế, bạn cầm cờ tiên phong đạp đổ bức tường thành vững chãi của vương quốc loài người. Khói lửa hủy diệt thắp sáng nụ cười tàn nhẫn trên môi bạn.","effects":{"STR":2,"joy":20,"wealth":30}},{"id":"demon_adult_black_moon_ritual","races":["demon"],"stages":["adult"],"weight":6,"require":{"flags":["thanh_tu_hac_nguyet"]},"text":"Bạn đứng chủ tế trong Đêm Hắc Nguyệt, hiến tế hàng chục sinh linh để dâng lên vực thẳm. Quyền năng hắc ám được củng cố, khiến ánh mắt bạn giờ đây chứa đầy uy phong bạo chúa.","effects":{"INT":2,"joy":15,"flags":["chu_te_hac_am"]}},{"id":"demon_adult_volcano_bath","races":["demon"],"stages":["adult"],"weight":7,"text":"Ngâm mình giữa dòng dung nham ở Đảo Tro Tàn, bạn thanh tẩy cơ thể khỏi mọi tạp chất yếu ớt cuối cùng. Cơ bắp vạm vỡ giờ đây cứng cáp và trơ lì chẳng kém gì Huyết Kim nguyên khối.","effects":{"STR":2,"health":15}},{"id":"demon_adult_shadow_assassin","races":["demon"],"stages":["adult"],"weight":7,"require":{"flags":["do_de_bong_dem"]},"text":"Nhận hợp đồng ám sát một quý tộc loài người quyền thế. Bạn tan vào cái bóng của ông ta và ra tay không để lại một giọt máu, đem về một rương đầy ngập Tinh Bạc.","effects":{"AGI":2,"wealth":35,"joy":10}},{"id":"demon_adult_love_betrayal","races":["demon"],"stages":["adult"],"weight":6,"text":"Người tình ma tộc mà bạn hết lòng say đắm đã quay lưng bán đứng bạn cho một Tướng quân Vực thẳm. Trái tim rỉ máu nhận ra rằng, ở thế giới này, tình yêu chỉ là trò đùa của kẻ yếu.","effects":{"joy":-30,"health":-10,"INT":1}},{"id":"demon_adult_bone_weapon","races":["demon"],"stages":["adult"],"weight":6,"text":"Bạn dành hàng tháng ròng rã mài giũa xương sọ của một con rồng đất thành món vũ khí mới. Tiếng gầm gừ u oán của loài rồng dường như vẫn còn vương vấn trên từng nhát chém vấy máu.","effects":{"STR":2,"wealth":-15}},{"id":"demon_adult_corpse_swamp","races":["demon"],"stages":["adult"],"once":false,"weight":5,"text":"Lội qua những vũng bùn nồng nặc mùi xác thối ở Đầm Lầy Tử Khí, bạn thu thập được loài nấm ma túy hiếm có để điều chế kịch độc. Môi trường khắc nghiệt không ngừng rèn giũa trí óc sắc bén.","effects":{"INT":1,"wealth":15}},{"id":"demon_adult_light_sickness","races":["demon"],"stages":["adult"],"eras":["peace"],"weight":7,"text":"Một sự kiện ngoại giao giả tạo Thời Bình buộc bạn nán lại ở vùng Đồng Bằng Thánh Quang quá lâu. Ánh mặt trời chói chang làm bỏng rát lớp vảy sừng, khiến cơ thể suy nhược và chậm chạp hẳn đi.","effects":{"health":-20,"AGI":-1}},{"id":"demon_adult_rebellion_choice","races":["demon"],"stages":["adult"],"weight":10,"text":"Lãnh chúa vùng biên giới cai trị bằng sự thiển cận và tàn bạo quá mức. Một nhóm phiến quân ma tộc bí mật dâng lên bạn thanh gươm, tôn bạn làm thủ lĩnh để lật đổ gã.","choices":[{"label":"Phất cờ khởi nghĩa đẫm máu","check":{"stat":"STR","target":9},"success":{"text":"Bạn chẻ đôi hộp sọ tên Lãnh chúa ngay giữa sảnh đường, cắm đầu hắn lên ngai vàng. Toàn bộ kho báu và quyền lực của vùng đất này giờ thuộc về bạn.","effects":{"STR":2,"wealth":40,"flags":["lanh_chua_ma_toc"]},"moment":"Lật đổ và giết chết Lãnh chúa ma tộc để lên ngôi trị vì."},"fail":{"text":"Lực lượng phiến quân bị mai phục và tàn sát. Bạn bị tên Lãnh chúa bẻ gãy tứ chi và quăng xuống hầm gai nhọn chịu cực hình đến chết.","death":"Bị hành quyết thê thảm trong cuộc khởi nghĩa bất thành năm {age} tuổi."}},{"label":"Mật báo để lĩnh thưởng","text":"Bạn bán đứng nhóm phiến quân cho Lãnh chúa, dập tắt mầm mống phản loạn. Khoản tiền thưởng lớn không bù đắp được sự ghẻ lạnh của đồng bào.","effects":{"wealth":30,"joy":-15}}]},{"id":"demon_adult_treasure_hunt_choice","races":["demon"],"stages":["adult"],"weight":9,"text":"Một tấm bản đồ cổ da người chỉ đường đến hầm mộ ngầm của Tháp Ma Pháp Bạch Ngà. Nhưng những cạm bẫy ánh sáng ở đó đủ sức thiêu rụi bất kỳ ác quỷ nào bén mảng đến.","choices":[{"label":"Đột nhập giải mã cạm bẫy","check":{"stat":"INT","target":8},"success":{"text":"Trí não nhạy bén giúp bạn vô hiệu hóa trận pháp thanh tẩy. Bạn bước ra khỏi tháp với những thánh vật bị biến chất, mang giá trị nghiên cứu khổng lồ.","effects":{"INT":2,"wealth":35,"flags":["dao_mo_thanh_quang"]},"moment":"Khám phá thành công hầm mộ Tháp Ma Pháp Bạch Ngà."},"fail":{"text":"Một ấn chú Ánh Sáng nổ tung khi bạn vừa chạm tay vào phong ấn. Cơ thể bạn bị phỏng nặng, đôi mắt suýt mù lòa vì cường quang chói lọi.","effects":{"health":-30,"INT":-1,"joy":-15}}},{"label":"Bán lại bản đồ cho kẻ khác","text":"Bạn nhượng lại tấm bản đồ cho một gã pháp sư hắc ám liều lĩnh để đổi lấy tiền mặt, an toàn tận hưởng sự nhàn rỗi trong quán rượu.","effects":{"wealth":15,"joy":5}}]},{"id":"demon_adult_succubus_mate_choice","races":["demon"],"stages":["adult"],"weight":9,"text":"Nữ chúa của tộc Mị Ma đưa ra lời đề nghị kết ấn hôn phối huyết mạch. Quyền lực và khoái lạc vẫy gọi, nhưng cái giá phải trả là sự ràng buộc sinh mệnh vĩnh viễn.","choices":[{"label":"Chấp nhận kết ấn phu thê","check":{"stat":"LUCK","target":7},"success":{"text":"Nghi thức hôn phối diễn ra êm đẹp. Sự ủng hộ từ gia tộc Mị Ma mang lại cho bạn khối tài sản khổng lồ và những đêm dài đắm chìm trong hoan lạc.","effects":{"joy":25,"wealth":30,"LUCK":1,"flags":["hon_phoi_mi_ma"]},"moment":"Kết hôn với Nữ chúa Mị Ma, nắm giữ quyền lực chốn hoan lạc."},"fail":{"text":"Trong lúc giao hoan, khí tức hắc ám của nàng lấn át và ăn mòn tinh huyết của bạn. Bạn kiệt quệ và nhận ra mình chỉ là món đồ chơi bị bòn rút.","effects":{"health":-25,"joy":-20,"STR":-1}}},{"label":"Cự tuyệt sự trói buộc","text":"Bạn lạnh lùng từ chối lời mời gọi bọc đường. Nữ chúa tức giận rút lui, để lại trong bạn sự nhẹ nhõm dù đánh mất một cơ hội tiến thân.","effects":{"joy":-5,"AGI":1}}]},{"id":"demon_adult_crusader_ambush_choice","races":["demon"],"stages":["adult"],"weight":9,"text":"Một đoàn xe vận chuyển Thánh vật của Giáo hội đang đi qua Thảo Nguyên Gió Hú. Việc cướp nó sẽ mang lại vinh quang tột đỉnh, nhưng hộ tống là hàng chục Thánh Vệ Quân tinh nhuệ.","choices":[{"label":"Tổ chức phục kích quy mô","check":{"stat":"AGI","target":8},"success":{"text":"Mũi lao từ trong bóng tối của bạn găm trúng yết hầu chỉ huy địch. Đám ma thú xông lên làm gỏi đoàn xe, đem về chiến lợi phẩm rực rỡ máu và vàng.","effects":{"STR":1,"wealth":40,"joy":20},"moment":"Chỉ huy cuộc phục kích đẫm máu cướp Thánh vật của Giáo hội."},"fail":{"text":"Đội hộ tống cảnh giác tung ra lưới ma pháp hệ Quang diện rộng. Phục kích thất bại, bạn chật vật rút lui với cơ thể đầy những lỗ thủng rỉ máu cháy khét.","effects":{"health":-35,"wealth":-10}}},{"label":"Chờ đợi con mồi dễ hơn","text":"Nhận thấy sự chênh lệch lực lượng, bạn hạ lệnh rút lui. Cẩn trọng là chìa khóa để một ác quỷ sống sót hàng thế kỷ.","effects":{"INT":1,"joy":-5}}]},{"id":"demon_middle_horn_break","races":["demon"],"stages":["middle"],"weight":8,"text":"Trong một trận tử chiến với sinh vật Vực Thẳm khổng lồ, một bên sừng kiêu hãnh của bạn bị bẻ gãy. Nỗi nhục nhã đi kèm cơn đau buốt thấu óc sẽ kéo dài suốt nhiều năm.","effects":{"health":-20,"joy":-20,"STR":1,"flags":["gay_sung"]}},{"id":"demon_middle_mentor_young","races":["demon"],"stages":["middle"],"eras":["peace"],"once":false,"weight":6,"text":"Tại Đấu Trường Huyết Sa trong Thời Bình, bạn bắt đầu truyền dạy kỹ năng chiến đấu tàn nhẫn cho lứa ma tộc trẻ. Nhìn chúng xé xác nhau khiến tâm hồn cằn cỗi của bạn tìm lại chút niềm vui.","effects":{"joy":10,"wealth":20}},{"id":"demon_middle_dark_plague_survivor","races":["demon"],"stages":["middle"],"eras":["dark_age"],"weight":7,"text":"Dịch bệnh Hắc Ám tàn phá lục địa, bạn ho ra máu đen ròng rã suốt nhiều tháng trời. Nhưng sức sống dẻo dai của một ác quỷ trưởng thành đã giúp bạn vượt qua và miễn nhiễm vĩnh viễn.","effects":{"health":15,"INT":1,"flags":["mien_nhiem_dich_benh"]}},{"id":"demon_middle_holy_war_commander","races":["demon"],"stages":["middle"],"eras":["holy_war"],"weight":9,"text":"Bạn được phong làm Tư lệnh của một cánh quân trong Chiến Tranh Tuyến Đầu. Đứng trên đỉnh đồi rực lửa, bạn lạnh lùng hạ lệnh cho hàng vạn ma vật nghiền nát phòng tuyến của con người.","effects":{"STR":2,"wealth":30,"joy":15,"flags":["tu_lenh_ma_quan"]}},{"id":"demon_middle_lord_council","races":["demon"],"stages":["middle"],"eras":["demon_lord"],"weight":10,"text":"Ma Vương triệu tập hội đồng chiến tranh. Lần đầu tiên trong đời, bạn được ngồi chung bàn với những sinh vật quyền năng nhất Aethelgard, ung dung chia chác bản đồ thế giới bằng máu.","effects":{"INT":2,"joy":25,"wealth":20}},{"id":"demon_middle_abyss_whisper_madness","races":["demon"],"stages":["middle"],"weight":7,"text":"Những giọng nói điên loạn từ đáy Vực Thẳm ngày đêm gặm nhấm tâm trí khi tuổi tác dần cao. Bạn phải tiêu tốn Lõi Mana thượng hạng để thiền định, trấn áp sự cuồng loạn chực chờ bùng nổ.","effects":{"joy":-15,"wealth":-20,"INT":1}},{"id":"demon_middle_wealthy_merchant","races":["demon"],"stages":["middle"],"once":false,"weight":7,"text":"Mối làm ăn ngầm ngày càng mở rộng, bạn giờ đây kiểm soát cả một tuyến đường buôn lậu cổ vật ma thuật. Lượng Huyết Kim thu về hàng năm đủ để bạn trải thảm khắp hang động của mình.","effects":{"wealth":40,"INT":1}},{"id":"demon_middle_forge_masterpiece","races":["demon"],"stages":["middle"],"weight":8,"require":{"wealth":40},"text":"Đổ gần nửa gia tài vào Lò Rèn Vĩnh Cửu, bạn tạo ra thanh bảo kiếm rực hắc hỏa. Kiệt tác này không chỉ là vũ khí, mà là biểu tượng quyền lực tuyệt đối để đè bẹp mọi kẻ chống đối.","effects":{"wealth":-40,"STR":3,"joy":10,"flags":["so_huu_bao_kiem"]}},{"id":"demon_middle_betrayal_scars","races":["demon"],"stages":["middle"],"weight":7,"text":"Tên phó quan thân tín bất ngờ đâm lén bạn bằng chủy thủ tẩm độc ánh sáng. Bạn tự tay nghiền nát sọ hắn, nhưng vết thương tàn phá nghiêm trọng sinh lực tuổi trung niên.","effects":{"health":-25,"joy":-15,"STR":1}},{"id":"demon_middle_yggdrasil_blight","races":["demon"],"stages":["middle"],"eras":["dark_age"],"weight":8,"text":"Kỷ Nguyên Tăm Tối khiến rễ Cây Thế Giới Yggdrasil thối rữa và hung bạo, tấn công sào huyệt của bạn. Vất vả thiêu rụi chúng bằng hắc hỏa, kho tàng của bạn hao hụt đáng kể.","effects":{"health":-10,"wealth":-15,"INT":1}},{"id":"demon_middle_succubus_heir","races":["demon"],"stages":["middle"],"weight":6,"require":{"flags":["hon_phoi_mi_ma"]},"text":"Đứa con lai mang dòng máu Mị Ma âm mưu hạ độc cha mình để đoạt quyền. Phế truất nó bằng thiết luật tàn nhẫn, bạn cảm nhận sâu sắc sự bạc bẽo của huyết thống ác quỷ.","effects":{"joy":-20,"health":-10,"INT":2}},{"id":"demon_middle_abyss_gate","races":["demon"],"stages":["middle"],"weight":7,"text":"Vô tình xé rách một khe nứt nhỏ nối với Vực Thẳm Phân Tầng, hắc khí dội ngược vào tâm trí bạn. Sức mạnh khổng lồ được hấp thụ, đổi bằng những chùm sinh mệnh bị rút ngắn.","effects":{"STR":2,"INT":2,"health":-15}},{"id":"demon_middle_arena_owner","races":["demon"],"stages":["middle"],"weight":5,"require":{"wealth":60},"text":"Bằng lượng Huyết Kim khổng lồ, bạn mua đứt một phần Đấu Trường Huyết Sa. Trở thành ông trùm thao túng sinh tử, mọi trận chiến giờ đây đều chảy vàng vào túi bạn.","effects":{"wealth":-40,"joy":25,"flags":["ong_trum_dau_truong"]}},{"id":"demon_middle_crusader_prisoner","races":["demon"],"stages":["middle"],"eras":["holy_war"],"weight":8,"text":"Bắt sống được một chỉ huy Thánh Vệ Quân, bạn giam hắn dưới ngục tối và dùng cực hình tàn nhẫn nhất. Sự kiên định của hắn sụp đổ, nhường chỗ cho tiếng thét tuyệt vọng làm bạn thỏa mãn.","effects":{"joy":15,"STR":1,"INT":1}},{"id":"demon_middle_holy_siege_choice","races":["demon"],"stages":["middle"],"weight":10,"text":"Thánh Vệ Quân điều động ba tiểu đoàn cắm cờ ánh sáng bủa vây sào huyệt của bạn. Thánh quang chói lòa cả một góc rừng, dồn bạn vào bước đường cùng tăm tối.","choices":[{"label":"Tử thủ bằng hắc ma pháp","check":{"stat":"INT","target":8},"success":{"text":"Bạn triệu hồi cơn bão lửa hắc ám thiêu rụi phân nửa quân thù, cắm đầu tên chỉ huy lên giáo nhọn, buộc đám tàn quân tháo chạy trong kinh hoàng.","effects":{"STR":2,"wealth":20,"flags":["ke_diet_thanh_quan"]},"moment":"Một tay hủy diệt cuộc bao vây quy mô lớn của Thánh Vệ Quân."},"fail":{"text":"Ma trận phòng thủ quá tải và sụp đổ. Hàng ngàn mũi tên mang thánh quang đâm xuyên qua cơ thể vạm vỡ của bạn.","death":"Bị thiêu rụi dưới mưa tên ánh sáng của Thánh Vệ Quân năm {age} tuổi."}},{"label":"Bỏ lại cơ ngơi để tháo chạy","text":"Bạn ngậm đắng nuốt cay từ bỏ kho báu tích cóp bao năm, dùng đường hầm bí mật để lẩn trốn, giữ lấy mạng sống già dặn nhưng dày dạn kinh nghiệm.","effects":{"wealth":-40,"joy":-20,"AGI":2}}]},{"id":"demon_middle_dark_ritual_choice","races":["demon"],"stages":["middle"],"weight":9,"text":"Một mật thư cổ chỉ dẫn cấm thuật: hiến tế hàng ngàn sinh linh để gột rửa tuổi tác, khôi phục thanh xuân cường tráng nhưng rủi ro phản phệ vỡ nát linh hồn cực cao.","choices":[{"label":"Tiến hành Huyết Tế mạo hiểm","check":{"stat":"LUCK","target":7},"success":{"text":"Máu của kẻ yếu nuôi dưỡng kẻ mạnh. Vảy sừng của bạn bóng loáng trở lại, sức lực trào dâng cuồn cuộn như thuở đôi mươi.","effects":{"health":30,"STR":2,"joy":15},"moment":"Thực hiện thành công Huyết Tế cải lão hoàn đồng."},"fail":{"text":"Nghi thức vỡ lở, sự phẫn nộ của hàng vạn oán linh xé toạc ranh giới tâm trí, cắn nuốt sạch sẽ thần thức của bạn.","death":"Linh hồn bị oán linh xé xác trong nghi thức Huyết Tế lúc {age} tuổi."}},{"label":"Khước từ tà ,{"id":"dr_egg_mana","races":["dragon"],"stages":["infant"],"weight":8,"text":"Ma lực từ lòng núi lửa thấm vào quả trứng, từng chút một. Những người thợ săn trứng rồng đi ngang qua đều cảm thấy một cơn ớn lạnh khó tả.","effects":{"STR":1,"health":5}},{"id":"dr_first_breath","races":["dragon"],"stages":["child"],"weight":10,"text":"Lần đầu tiên, một luồng lửa bùng ra từ cổ họng bạn. Cả một khu rừng hóa tro, và bạn hiểu rằng thế giới này được tạo ra để quỳ dưới chân mình.","effects":{"STR":2},"moment":"Hơi thở rồng đầu tiên"},{"id":"dr_hoard","races":["dragon"],"stages":["teen","adult"],"weight":8,"text":"Bạn san phẳng một tòa thành và mang về hang ổ cả kho báu của nó. Đêm ấy, bạn ngủ trên một núi vàng.","effects":{"wealth":40,"joy":10},"moment":"Bắt đầu tích trữ kho báu"},{"id":"dr_human_form","races":["dragon"],"stages":["teen"],"weight":8,"require":{"INT":8},"text":"Bạn học được cách khoác lên mình hình hài nhân loại. Giữa phiên chợ của loài người, không ai biết kẻ đang mỉm cười kia có thể thiêu rụi cả thành phố.","effects":{"INT":2,"flags":["shapeshifter"]},"moment":"Hóa hình thành người"},{"id":"dr_ms_heroes","races":["dragon"],"stages":["teen","adult","middle"],"weight":10,"text":"Một tổ đội Anh hùng huyền thoại lẻn vào hang ổ của bạn, đôi mắt chúng sáng rực khi nhìn thấy núi vàng.","choices":[{"label":"Thiêu rụi tất cả","check":{"stat":"STR","target":12},"success":{"text":"Ngọn lửa của bạn nuốt chửng cả tổ đội. Bộ giáp nóng chảy của chúng trở thành vật trang trí mới trên vách hang.","effects":{"wealth":30,"joy":10},"moment":"Thiêu rụi một tổ đội Anh hùng"},"fail":{"text":"Một mũi tên phá giáp găm sâu vào cánh bạn. Chúng chạy thoát cùng một phần kho báu.","effects":{"health":-40,"wealth":-20}}},{"label":"Hóa người lừa chúng","check":{"stat":"INT","target":10},"success":{"text":"Bạn hóa thành một ông lão dẫn đường, dẫn chúng đi vòng quanh hang suốt ba ngày rồi mới hiện nguyên hình. Đó là ba ngày thú vị nhất thế kỷ.","effects":{"INT":1,"joy":15},"moment":"Đùa giỡn với các Anh hùng"},"fail":{"text":"Gã Pháp sư nhìn thấu lớp ngụy trang của bạn ngay từ đầu.","effects":{"health":-25}}},{"label":"Tiếp tục ngủ","text":"Bạn ngủ say không hay biết. Khi tỉnh dậy, một rương vàng đã biến mất, và cơn thịnh nộ của bạn thiêu rụi ba ngôi làng vô tội.","effects":{"wealth":-30,"joy":-5}}]},{"id":"dr_ms_demon_lord","races":["dragon"],"stages":["adult","middle"],"weight":8,"text":"Một sứ giả quỷ quỳ rạp trước hang ổ của bạn. Ma Vương muốn bạn trở thành một trong các Tai Ương, cùng hắn nhấn chìm nhân loại.","choices":[{"label":"Khinh bỉ từ chối","text":"Bạn thổi một hơi, và sứ giả hóa thành tro. Rồng không phục vụ bất kỳ ai.","effects":{"joy":5,"flags":["proud"]}},{"label":"Nhận lời làm Tai Ương","text":"Hàng ngàn tấn vàng được cống nạp. Bầu trời phía trên các vương quốc loài người nhuộm một màu đỏ lửa.","effects":{"wealth":50,"flags":["calamity"]},"moment":"Trở thành một Tai Ương của Ma Vương"},{"label":"Bắt Ma Vương quỳ lạy","check":{"stat":"STR","target":13},"success":{"text":"Ma Vương đích thân đến, và cúi đầu trước bạn. Cả Vực Thẳm chấn động.","effects":{"wealth":30,"joy":15},"moment":"Bắt Ma Vương phải quỳ lạy"},"fail":{"text":"Ma Vương không quen quỳ lạy. Trận chiến khiến bạn mất một mảng vảy lớn.","effects":{"health":-40}}}]},{"id":"dr_ms_territory","races":["dragon"],"stages":["adult","middle","elder"],"weight":8,"text":"Một con Cổ Long khác đáp xuống Đảo Tro Tàn, bóng cánh của nó che khuất mặt trời. Lãnh thổ này chỉ có chỗ cho một kẻ.","choices":[{"label":"Không chiến sinh tử","check":{"stat":"STR","target":12},"success":{"text":"Hai con rồng xé xác nhau trên tầng mây suốt bảy ngày đêm, khiến thời tiết khắp lục địa đảo lộn. Kẻ còn bay được cuối cùng là bạn.","effects":{"STR":2,"joy":10},"moment":"Đánh bại một Cổ Long khác"},"fail":{"text":"Nó bẻ gãy một bên cánh của bạn, và bạn rơi xuống biển sâu.","death":"Bạn chìm xuống đáy đại dương ở tuổi {age}, và biển cả sôi sục suốt một năm."}},{"label":"Bay đi nơi khác","text":"Bạn nhượng bộ và bay đi tìm một hòn đảo khác. An toàn, nhưng lòng kiêu hãnh của bạn rỉ máu.","effects":{"joy":-10}}]},{"id":"dr_ancient_talk","races":["dragon"],"stages":["middle","elder"],"weight":6,"text":"Bạn đã già đến mức các vị Thần lắng nghe khi bạn cất tiếng. Những quy luật của thế giới hiện ra trước mắt bạn như những sợi chỉ vàng.","effects":{"INT":3},"moment":"Trò chuyện với Thần linh"},{"id":"dragon_infant_telepathy","races":["dragon"],"stages":["infant"],"weight":6,"text":"Dù chưa phá vỏ, nhận thức thai nhi của bạn đã hình thành, tạo ra một sợi dây liên kết ngoại cảm quyền năng với rồng mẹ. Một cảm giác kiêu ngạo tột đỉnh truyền vào tâm trí, khẳng định bạn là sinh vật đứng trên vạn vật.","effects":{"INT":2,"joy":10}},{"id":"dragon_infant_diamond_shell","races":["dragon"],"stages":["infant"],"eras":["dark_age"],"weight":5,"text":"Kỷ Nguyên Tăm Tối bao trùm, ma vật tràn lan cố gắng gặm nhấm quả trứng của bạn nhưng đành bất lực trước lớp vỏ cứng hơn kim cương. Ánh sáng định mệnh tỏa ra từ phôi thai, đẩy lùi mọi tà khí dám vấy bẩn huyết mạch cao quý.","effects":{"health":15,"STR":1}},{"id":"dragon_child_drake_hunt","races":["dragon"],"stages":["child"],"weight":7,"require":{"STR":4},"text":"Chỉ vừa mới phá vỏ không lâu, sức mạnh bẩm sinh của bạn đã ngang ngửa một con quái vật hầm ngục, dễ dàng cắn xé và nuốt chửng những con rồng đất hạ đẳng để nạp năng lượng. Máu của kẻ yếu bồi đắp thêm sự tàn bạo trong bản năng nguyên thủy của bạn.","effects":{"health":20,"STR":2,"flags":["calamity"]}},{"id":"dragon_child_fly","races":["dragon"],"stages":["child"],"weight":6,"text":"Bạn vươn đôi cánh khổng lồ thực hiện chuyến bay đầu tiên, sải cánh rộng lớn che khuất cả một góc Thảo Nguyên Gió Hú. Tiếng gầm xé gió của bạn khiến muôn thú bên dưới phải rạp mình run rẩy trước một vị vua mới.","effects":{"AGI":3,"joy":15}},{"id":"dragon_teen_domain","races":["dragon"],"stages":["teen"],"weight":6,"text":"Với sải cánh giờ đây rộng hàng chục mét, bạn độc chiếm một đỉnh núi tại Dãy Núi Răng Cưa làm lãnh thổ cá nhân tuyệt đối. Bất cứ sinh vật nào dám bước vào ranh giới đều bị thiêu rụi không thương tiếc, khẳng định uy quyền tối thượng.","effects":{"health":10,"wealth":15,"flags":["proud"]}},{"id":"dragon_teen_war_draft","races":["dragon"],"stages":["teen"],"eras":["demon_lord"],"weight":5,"require":{"flags":["calamity"]},"text":"Một tướng lĩnh của Quân Đoàn Hủy Diệt mang theo cống phẩm ngọc ngà, hứa hẹn nhượng lại một nửa lục địa nếu bạn chịu phục vụ Ma Vương. Bạn lạnh lùng vung đuôi đập nát hắn, cướp lấy kho báu bởi loài rồng không bao giờ cúi đầu trước bất kỳ ai.","effects":{"wealth":35,"joy":5},"moment":"Khước từ Ma Vương, khẳng định uy quyền tuyệt đối của rồng."},{"id":"dragon_teen_kingdom_raid","races":["dragon"],"stages":["teen"],"weight":9,"text":"Bay ngang qua Đồng Bằng Thánh Quang, mắt bạn ánh lên lòng tham tột độ khi nhìn thấy thủ đô Sanctus rực rỡ vàng son. Khao khát mãnh liệt muốn vơ vét mọi của cải của nhân loại để xây dựng hang ổ đầu tiên bùng cháy trong huyết quản.","choices":[{"label":"Trực tiếp tàn phá, san phẳng thành trì","check":{"stat":"STR","target":6},"success":{"text":"Hơi thở nguyên thủy của bạn xóa sổ các bức tường thành, đội Thánh Vệ Quân hoàn toàn bất lực. Bạn cắp theo hàng tấn vàng bạc và ngọc quý trở về, đánh dấu sự ra đời của một tai ương mới trên lục địa.","effects":{"wealth":40,"flags":["calamity"]},"moment":"San phẳng một vương quốc chỉ để lấy vàng lót ổ."},"fail":{"text":"Sự kiêu ngạo làm bạn khinh suất trước cạm bẫy ma pháp cấp cao của Giáo hội Thánh Quang, vô số mũi giáo xuyên thủng đôi cánh khiến bạn gục ngã.","death":"Năm {age} tuổi, thi thể khổng lồ của bạn trở thành chiến lợi phẩm vĩ đại nhất của nhân loại, chấm dứt một truyền kỳ chưa kịp nở rộ."}},{"label":"Đậu trên tháp cao, ép chúng triều cống","text":"Bóng đen khổng lồ của bạn phủ kín thành phố, tiếng gầm rung chuyển đất trời đủ khiến nhà vua khiếp đảm dâng lên vô số rương báu để đổi lấy sự bình yên.","effects":{"wealth":25,"joy":10}}]},{"id":"dragon_adult_magic_null","races":["dragon"],"stages":["adult"],"eras":["holy_war"],"weight":7,"text":"Một liên minh mạo hiểm giả tinh nhuệ vây ráp tổ của bạn, phóng ra hàng loạt ma pháp hủy diệt rực sáng cả bầu trời. Nhưng ngay khi chạm vào lớp vảy rồng tuyệt đối, mọi phép thuật dưới cấp 8 đều vỡ vụn thành bọt khí, để lại cho chúng ánh mắt tuyệt vọng.","effects":{"health":20,"INT":2}},{"id":"dragon_adult_slumber","races":["dragon"],"stages":["adult"],"once":false,"weight":8,"text":"Quá mệt mỏi với sự ồn ào của thế giới, bạn cuộn mình trên núi vàng cao ngất ngưởng và chìm vào một giấc ngủ sâu. Hàng trăm năm trôi qua, thời đại xoay vần, nhưng bạn vẫn tĩnh lặng như một bức tượng thần bất diệt.","effects":{"health":30,"joy":-5}},{"id":"dragon_middle_mountain_sleep","races":["dragon"],"stages":["middle"],"weight":6,"text":"Kích thước của bạn đã khổng lồ đến mức khi nằm ngủ trông như một ngọn núi đá sừng sững, rêu phong và cây cổ thụ thậm chí bắt đầu mọc lên trên lớp vảy. Sinh vật nhỏ bé vô tình sinh sống trên lưng bạn mà không hay biết chúng đang nương tựa vào một vị thần.","effects":{"STR":2,"health":25,"AGI":-2}},{"id":"dragon_middle_god_whisper","races":["dragon"],"stages":["middle"],"weight":5,"require":{"INT":6},"text":"Không còn màng đến thế sự hay của cải phàm trần, ý thức của bạn bắt đầu cộng hưởng và hấp thụ trực tiếp các quy luật của thế giới. Thỉnh thoảng, trong cõi mơ, bạn nghe thấy tiếng thì thầm kính trọng từ những Thần linh của Aethelgard.","effects":{"INT":4,"LUCK":2},"moment":"Đạt tới cảnh giới giao hòa cùng Thần linh."},{"id":"dragon_elder_ecosystem","races":["dragon"],"stages":["elder"],"weight":7,"text":"Bạn thở ra một luồng hơi nguyên thủy không mang tính hủy diệt, mà chứa đựng ma lực phồn sinh mạnh mẽ vô song. Nơi luồng khí đi qua trên Đảo Tro Tàn khô cằn bỗng chốc nở rộ thành một hệ sinh thái rực rỡ, biến bạn thành một phần của tự nhiên sáng thế.","effects":{"joy":25,"LUCK":3}},{"id":"dragon_elder_peace_ignore","races":["dragon"],"stages":["elder"],"eras":["peace"],"once":false,"weight":5,"text":"Kỷ nguyên hòa bình lặp lại, các đế chế của nhân loại rầm rộ ăn mừng, trỗi dậy rồi lại lụi tàn trong dòng chảy vô tình của thời gian. Bạn chỉ hé nửa con mắt khổng lồ nhìn xuống nhân thế, lạnh lùng quan sát vạn vật như một hòn đá vĩnh hằng.","effects":{"INT":1,"joy":-5}},{"id":"dragon_elder_dimension_lock","races":["dragon"],"stages":["elder"],"weight":6,"text":"Cảm nhận được thế giới vật lý không còn chịu nổi áp lực từ sự hiện diện của mình, bạn xé rách không gian, tự nhốt bản thân vào một chiều không gian biệt lập. Tại đây, Thủy Tổ Long chìm vào cõi vĩnh hằng, lặng lẽ chờ đợi ngày tận thế để thức tỉnh lần cuối.","effects":{"health":40,"STR":2,"INT":2},"moment":"Rời bỏ thế giới trần tục, ẩn mình chờ đợi Tận Thế."},{"id":"dwarf_infant_beard","races":["dwarf"],"stages":["infant"],"weight":8,"text":"Hàm râu tơ cứng cáp lún phún mọc khi bạn vừa chập chững những bước đầu đời. Dòng máu kiêu hãnh của Dãy Núi Răng Cưa đã sớm trỗi dậy trong hình hài bé nhỏ.","effects":{"STR":1,"joy":5}},{"id":"dwarf_infant_forge_heat","races":["dwarf"],"stages":["infant"],"weight":6,"text":"Bạn lẫm chẫm bò lại gần bệ lò rèn rực lửa mà không hề khóc lóc sợ hãi. Ngọn lửa nguyên thủy dường như công nhận linh hồn của một thợ rèn tương lai.","effects":{"STR":1}},{"id":"dwarf_infant_sparks","races":["dwarf"],"stages":["infant"],"eras":["peace"],"weight":5,"text":"Trong lễ hội Giao Thương Thời Bình, bạn ngước nhìn cơn mưa hoa lửa ma thuật rực rỡ bắn ra từ Tháp Ngà Ma Pháp. Đôi mắt ngây thơ phản chiếu ánh sáng vĩnh cửu của lục địa.","effects":{"INT":1,"joy":5}},{"id":"dwarf_infant_taste_ore","races":["dwarf"],"stages":["infant"],"once":false,"weight":8,"text":"Thay vì mút tay như những đứa trẻ khác, bạn say sưa cắn ngấu nghiến một viên quặng sắt thô ráp. Khẩu vị kỳ lạ này là minh chứng cho một dạ dày đúc bằng đá vôi.","effects":{"health":3,"STR":1}},{"id":"dwarf_infant_rat","races":["dwarf"],"stages":["infant"],"weight":4,"text":"Một con chuột chũi khổng lồ cắn phá nôi của bạn, nhưng bạn đã nắm lấy đuôi nó mà ném văng vào vách đá. Sức mạnh bẩm sinh đã sớm đẩy lùi nguy hiểm đầu đời.","effects":{"STR":1,"health":-3}},{"id":"dwarf_infant_fever","races":["dwarf"],"stages":["infant"],"eras":["dark_age"],"weight":5,"text":"Dịch bệnh Kỷ Nguyên Tăm Tối quét qua hang động, cơ thể bé nhỏ của bạn nóng rực như than hồng. Thần chết đã lảng vảng ngay bên bờ nôi chật hẹp.","effects":{"health":-15,"joy":-10,"flags":["benh_nhiem_doc"]}},{"id":"dwarf_infant_weak","races":["dwarf"],"stages":["infant"],"weight":4,"require":{"flags":["benh_nhiem_doc"],"below":{"health":30}},"text":"Cơn sốt kéo dài mài mòn sinh lực, khiến cơ thể bạn gầy gò và yếu ớt. Bạn chỉ biết nằm thoi thóp chờ đợi sự ban phước mỏng manh của số phận.","effects":{"health":-5,"STR":-1}},{"id":"dwarf_infant_lumina","races":["dwarf"],"stages":["infant"],"weight":3,"text":"Một giáo sĩ của Thánh Quang đi ngang qua và ban phước lành lên vầng trán bám đầy nhọ nồi của bạn. Cảm giác ấm áp dịu dàng thanh tẩy mọi uế khí xung quanh.","effects":{"LUCK":1,"health":5}},{"id":"dwarf_infant_coin","races":["dwarf"],"stages":["infant"],"weight":6,"text":"Thương nhân của Thương Đoàn Sói Bạc tung cho bạn một Đồng Cẩm Thạch sáng lóa. Ánh kim loại lạnh lẽo đã khơi dậy lòng tham vinh hoa nguyên thủy trong huyết quản.","effects":{"wealth":5,"INT":1}},{"id":"dwarf_infant_toy_hammer","races":["dwarf"],"stages":["infant"],"once":false,"weight":7,"text":"Bạn vung vẩy chiếc búa gỗ đồ chơi, nện không ngừng nghỉ vào nền đá tảng uy nghi. Âm thanh cộc cằn đó chính là bản giao hưởng đầu tiên của cuộc đời người thợ rèn.","effects":{"STR":1,"joy":2}},{"id":"dwarf_infant_dark_mine","races":["dwarf"],"stages":["infant"],"weight":8,"text":"Chập chững đuổi theo một con bọ phát sáng, bạn vô tình lạc vào Hầm Ngục Bị Bỏ Hoang. Bóng tối nuốt chửng lối về, mang theo hơi lạnh của những oán linh xa xưa.","choices":[{"label":"Lò dò tiến sâu vào trong thăm dò","check":{"stat":"LUCK","target":6},"success":{"text":"Một tia sáng lấp lánh dẫn lối, bạn vấp phải và nhặt được một viên Lõi Mana rớt lại từ thời thượng cổ.","effects":{"LUCK":1,"wealth":15,"flags":["loi_mana_co"]},"moment":"Thoát khỏi hầm ngục u tối cùng báu vật thượng cổ"},"fail":{"text":"Sàn đá mục nát sụt lở bất ngờ, cuốn thân hình bé nhỏ của bạn rơi thẳng xuống vực sâu hun hút.","death":"Bóng tối Hầm Ngục Bị Bỏ Hoang đã chôn vùi sinh mệnh vô danh ở tuổi {age}."}},{"label":"Khóc rống lên gọi người lớn cứu mạng","text":"Tiếng khóc xé toạc tĩnh lặng, lính canh lập tức lao tới cứu nhưng ngay sau đó bạn phải ăn một trận đòn nảy lửa từ cha mẹ.","effects":{"joy":-5,"health":-3}}]},{"id":"dwarf_child_first_axe","races":["dwarf"],"stages":["child"],"weight":8,"text":"Người trưởng bối vứt xuống nền đá một cây rìu chiến rỉ sét, nặng trịch. Bàn tay nhỏ bé của {name} lần đầu chạm vào kim loại lạnh lẽo, hứa hẹn gánh vác sứ mệnh vĩ đại.","effects":{"STR":1,"joy":5}},{"id":"dwarf_child_hauling","races":["dwarf"],"stages":["child"],"once":false,"weight":9,"text":"Bạn nhễ nhại vác từng giỏ quặng từ Vực Thẳm Phân Tầng mang lên mặt đất rực nắng. Sức nặng của đá tảng đang âm thầm đúc kết nên sự dẻo dai bất diệt trong cơ bắp.","effects":{"STR":1,"health":3}},{"id":"dwarf_child_draft","races":["dwarf"],"stages":["child"],"eras":["holy_war"],"weight":6,"text":"Hồi còi Chiến Tranh Tuyến Đầu rú vang, những bậc cha chú vác vũ khí bước theo Thánh Vệ Quân. Ánh lửa bập bùng soi rõ nỗi sợ hãi và niềm tự hào song hành trong tim bạn.","effects":{"joy":-15,"flags":["thieu_vang_cha"]}},{"id":"dwarf_child_runes","races":["dwarf"],"stages":["child"],"weight":7,"text":"Dưới ánh nến tù mù, bạn miệt mài dùng búa tạc những hằng số cổ ngữ lên bia đá. Tiếng thì thầm của hàng vạn linh hồn tổ tiên như đang cuộn chảy vào tâm trí tĩnh lặng.","effects":{"INT":2,"joy":3}},{"id":"dwarf_child_trade","races":["dwarf"],"stages":["child"],"weight":5,"text":"Bạn lén lấy trộm một mẩu quặng hiếm đổi lấy thanh kẹo ngọt từ lũ trẻ ngoại tộc. Sự ngọt ngào tức thời phải đánh đổi bằng một trận đòn roi nảy lửa nhớ đời.","effects":{"joy":5,"health":-5,"wealth":-3}},{"id":"dwarf_child_redsky","races":["dwarf"],"stages":["child"],"eras":["demon_lord"],"weight":5,"text":"Bầu trời phương Bắc chuyển màu máu khi Ma Vương trỗi dậy, quạ đen rợp trời che khuất ánh sáng mặt trời. Linh cảm về một thời đại diệt vong cắm chặt vào tiềm thức của bạn.","effects":{"joy":-10,"LUCK":-1,"flags":["am_anh_ma_vuong"]}},{"id":"dwarf_child_brawl","races":["dwarf"],"stages":["child"],"weight":8,"text":"Một cuộc ẩu đả giành lãnh địa xảy ra với lũ trẻ nhà bên khiến cả đám thâm tím mặt mày. Máu mũi tuôn rơi nhưng ý chí chiến đấu ngoan cường của người lùn không bao giờ dập tắt.","effects":{"STR":1,"health":-5}},{"id":"dwarf_child_armwrestle","races":["dwarf"],"stages":["child"],"weight":5,"require":{"STR":5},"text":"Chỉ bằng một cú gồng tay, bạn vật ngã tay của đứa trẻ lớn hơn mình ba tuổi xuống bàn. Tiếng reo hò ầm ĩ xung quanh càng củng cố sự kiêu hãnh thống trị trong bạn.","effects":{"joy":10,"LUCK":1}},{"id":"dwarf_child_mine_cart","races":["dwarf"],"stages":["child"],"weight":8,"text":"Bạn cùng nhóm bạn đồng niên trèo lên một chiếc xe goòng chở quặng để trượt dốc cao tốc trong mỏ. Tốc độ kinh hoàng xé toạc màn đêm dưới ánh đuốc chập chờn.","choices":[{"label":"Bình tĩnh dùng chân phanh và bẻ lái góc cua","check":{"stat":"AGI","target":5},"success":{"text":"Chiếc xe goòng lướt qua khúc cua hiểm trở trong sự thán phục của đám trẻ, để lại những tia lửa tóe rực rỡ trên đường ray.","effects":{"AGI":1,"joy":8,"flags":["tay_dua_goong"]},"moment":"Chinh phục đường ray tốc độ cao trong lòng mỏ sâu"},"fail":{"text":"Xe goòng lật nhào vào vách đá, toàn thân bạn bầm dập và gãy vài chiếc xương sườn nhỏ.","death":"Một cú lật xe kinh hoàng đã cướp đi sinh mạng trẻ thơ của {name} vào năm {age} tuổi."}},{"label":"Nhắm tịt mắt và phó mặc cho số phận","text":"Chiếc xe đâm sầm vào đống gỗ vụn, bạn may mắn chỉ bị xây xát nhẹ nhưng sợ xanh mặt.","effects":{"health":-5,"joy":-3}}]},{"id":"dwarf_child_sculpture","races":["dwarf"],"stages":["child"],"weight":6,"text":"Bạn tự tay đục đẽo một bức tượng nhỏ hình con cóc đá để tặng người thân. Đường nét tuy thô kệch nhưng ẩn chứa tâm huyết của một nghệ nhân trẻ tuổi.","effects":{"INT":1,"joy":5}},{"id":"dwarf_child_lost_cave","races":["dwarf"],"stages":["child"],"weight":7,"text":"Trong lúc săn bắt nấm dạ quang, bạn bị tụt xuống một hốc đá sâu ngập đầy khí độc. Hơi thở dần trở nên nặng nhọc và mờ mịt.","choices":[{"label":"Dùng sức bình sinh phá vỡ bức tường đá mỏng","check":{"stat":"STR","target":6},"success":{"text":"Cú đấm cuồng nộ làm vỡ tung lớp thạch nhũ, mở ra một lối thoát chứa đầy không khí trong lành.","effects":{"STR":1,"health":3,"flags":["thoat_hiem_ngoan_muc"]},"moment":"Phá đá cứu mạng trong hốc ngục nghẹt thở"},"fail":{"text":"Đòn đánh bất thành khiến lượng khí độc tràn vào lồng ngực nhiều hơn, ý thức tắt lịm dần.","death":"Sự ngạt thở trong hang sâu đã chấm dứt cuộc đời {name} ở tuổi {age}."}},{"label":"Nằm im chờ đội tuần tra đến cứu","text":"May mắn thay, đội Tuần Lâm Trọng Vệ phát hiện ra bạn kịp thời nhưng bạn bị phạt một trận nhớ đời.","effects":{"health":-10,"joy":-5}}]},{"id":"dwarf_child_anvil_song","races":["dwarf"],"stages":["child"],"once":false,"weight":8,"text":"Tiếng đe búa vang lên đều đặn mỗi ngày dưới sự dìu dắt của các bậc thầy. Bàn tay chai sần bắt đầu hình thành những vết sẹo tự hào đầu tiên.","effects":{"STR":1,"wealth":3}},{"id":"dwarf_child_black_market","races":["dwarf"],"stages":["child"],"weight":5,"text":"Bạn lân la đến gần khu vực giao dịch ngầm của Hội Bóng Đêm, tò mò ngắm nhìn những thứ vũ khí cấm kỵ tỏa ra thứ ánh sáng tà ác.","effects":{"LUCK":-1,"INT":1,"flags":["hieu_biet_cho_den"]}},{"id":"dwarf_child_wolf_pup","races":["dwarf"],"stages":["child"],"weight":6,"text":"Trên Thảo Nguyên Gió Hú, bạn nhặt được một con sói bạc con bị thương nặng do bão tuyết. Bạn quyết định giấu nó trong hang đá để chăm sóc bí mật.","effects":{"joy":8,"AGI":1,"flags":["nuoi_soi_bac"]}},{"id":"dwarf_child_market_scam","races":["dwarf"],"stages":["child"],"weight":6,"text":"Một thương gia lừa gạt bạn bằng một mảnh đồng thau mạ vàng giả mạo. Bạn nhận ra bài học cay đắng đầu tiên về lòng người nơi phố chợ.","effects":{"wealth":-5,"INT":1}},{"id":"dwarf_child_harvest_mushroom","races":["dwarf"],"stages":["child"],"once":false,"weight":8,"text":"Những cây nấm độc khổng lồ mọc trong góc tối ẩm thấp là nguồn lương thực quen thuộc. Việc phân biệt nấm ngon và nấm độc giúp bạn tăng thêm kinh nghiệm sinh tồn.","effects":{"health":3,"INT":1}},{"id":"dwarf_child_arena_spectator","races":["dwarf"],"stages":["child"],"weight":5,"text":"Núp sau cột trụ của Đấu Trường Huyết Sa, bạn chứng kiến những trận tử chiến đẫm máu giữa các chiến binh. Sự tàn khốc đó nung nấu trong lòng sự lì lợm.","effects":{"STR":1,"joy":-3}},{"id":"dwarf_child_storm","races":["dwarf"],"stages":["child"],"eras":["dark_age"],"weight":5,"text":"Cơn bão cát mang theo tà khí từ Đầm Lầy Tử Khí quét qua buôn làng, phá hủy nhiều lều bạt và làm ô nhiễm nguồn nước.","effects":{"health":-8,"wealth":-5}},{"id":"dwarf_child_blessing_ygg","races":["dwarf"],"stages":["child"],"weight":4,"text":"Chuyến hành hương ngắn đến Đại Ngàn Lục Bảo giúp bạn chạm tay vào rễ của Cây Thế Giới Yggdrasil. Năng lượng sinh cành lá xanh tươi tràn ngập cơ thể.","effects":{"health":10,"joy":5}},{"id":"dwarf_child_theft_catch","races":["dwarf"],"stages":["child"],"weight":6,"text":"Bạn bị bắt quả tang khi đang toan lấy trộm củ cải đường của Thương Đoàn Sói Bạc. Chủ tiệm tóm lấy cổ áo và đe dọa giao cho lính canh.","choices":[{"label":"Dùng sự nhanh nhẹn giật mình tẩu thoát vào hẻm tối","check":{"stat":"AGI","target":5},"success":{"text":"Bạn lách người cực nhanh qua khe tường hẹp, để lại tên thương nhân tức tối đứng chửi với theo.","effects":{"AGI":1,"wealth":3,"flags":["ke_moc_tui_tai"]},"moment":"Thoát thân ngoạn mục khỏi tay thương nhân giận dữ"},"fail":{"text":"Bị tóm gọn và nện cho một trận nhừ tử, bạn bị tước sạch số tiền lẻ tro s":["peace"],"weight":7,"text":"Lễ hội Mùa Nảy Mầm rộn rã tiếng cười, vị trưởng lão đáng kính mớm cho bạn một giọt sương mai tinh khiết trên đỉnh Yggdrasil. Năng lượng ấm áp lan tỏa, nuôi dưỡng thể chất yếu ớt của tiên tộc.","effects":{"health":8}},{"id":"elf_infant_swamp_miasma","races":["elf"],"stages":["infant"],"eras":["dark_age"],"weight":8,"text":"Khói xám từ Đầm Lầy Tử Khí tràn tới làm những nụ hoa tiên quanh nôi héo rũ. Bạn ho sặc sụa trong đêm đen, lần đầu tiên cảm nhận được hơi thở của cái chết lẩn khuất.","effects":{"health":-8,"joy":-5}},{"id":"elf_infant_royal_burden","races":["elf"],"stages":["infant"],"weight":5,"require":{"flags":["royal_blood"]},"text":"Trưởng lão đặt chiếc vương miện dệt từ cỏ ma thuật lên vầng trán bé nhỏ của bạn. Sức nặng của danh dự hoàng tộc sớm lấy đi tiếng cười thơ ngây của tuổi sơ sinh.","effects":{"INT":1,"joy":-6}},{"id":"elf_infant_war_horn","races":["elf"],"stages":["infant"],"eras":["holy_war"],"weight":8,"text":"Tiếng tù và chiến trận của Thánh Vệ Quân rền vang, báo hiệu bầy ma vật đang càn quét vùng rìa Thảo Nguyên Gió Hú. Sự sợ hãi tột độ khiến bạn khóc thét giữa vòng tay run rẩy của người bảo mẫu.","effects":{"joy":-8,"health":-2}},{"id":"elf_infant_exile_cold","races":["elf"],"stages":["infant"],"weight":6,"require":{"flags":["exiled"]},"text":"Cơn gió buốt giá xuyên qua lớp chăn mỏng manh nơi xứ nghèo nàn xa xôi. Sinh tồn bên ngoài Đại Ngàn là một thử thách nghiệt ngã đã rèn giũa ý chí của bạn ngay từ tấm bé.","effects":{"health":-6,"STR":1}},{"id":"elf_infant_demon_sky","races":["elf"],"stages":["infant"],"eras":["demon_lord"],"weight":8,"text":"Bầu trời Aethelgard rực đỏ như máu, tà khí của Ma Vương bao trùm cả những vùng đất thiêng liêng nhất. Bạn rùng mình khép chặt mắt khi một tia chớp đen rạch ngang qua bầu trời định mệnh.","effects":{"LUCK":-1,"joy":-10}},{"id":"elf_infant_moss_steps","races":["elf"],"stages":["infant"],"once":false,"weight":7,"text":"Bạn chập chững bước đi trên thảm rêu xanh thẳm huyền bí ":["dark_power"]}},{"id":"ghoul_middle_intellect","races":["ghoul"],"stages":["middle"],"weight":10,"require":{"flags":["ghoul_leader"]},"text":"Nhờ hấp thụ lượng lớn não bộ từ các tu sĩ Giáo hội Thánh Quang, bạn phát triển một dạng trí tuệ mờ nhạt nhưng độc ác. Ánh nhìn vẩn đục giờ đây đã biết tính toán trước khi gieo rắc sự kinh hoàng.","effects":{"INT":4,"joy":10},"moment":"Thức tỉnh trí tuệ hắc ám từ cõi chết vô tri."},{"id":"ghoul_middle_plaguefeast","races":["ghoul"],"stages":["middle"],"eras":["dark_age"],"once":false,"weight":6,"text":"Dịch bệnh hoành hành khắp Đồng Bằng Thánh Quang tạo ra vô số hố chôn người tươi. Bạn lượn lờ như một bóng ma giấu mặt, thản nhiên hưởng thụ yến tiệc giữa kỷ nguyên điêu tàn của loài người.","effects":{"health":20,"wealth":10}},{"id":"ghoul_elder_skeleton","races":["ghoul"],"stages":["elder"],"weight":9,"text":"Thời gian bào mòn tất thảy, lớp thịt rữa nát cuối cùng cũng tiêu biến, để lại một bộ khung xương đen nhánh bốc lên oán khí ngút trời. Bạn vượt ngoài sinh tử luân hồi, trở thành một hiện thân bất diệt của sự hủy diệt.","effects":{"STR":3,"INT":2,"health":40}},{"id":"ghoul_elder_vanguard","races":["ghoul"],"stages":["elder"],"eras":["demon_lord"],"weight":12,"require":{"flags":["dark_power"]},"text":"Chính Ma Vương đã giáng lâm, vươn tay chiêu mộ bộ khô cốt hung bạo của bạn làm tướng tiên phong cho binh đoàn hắc ám. Bước chân tà ác nay giẫm đạp lên ngai vàng Sanctus, viết nên trang sử thi rướm máu cho giống loài Ngạ quỷ.","effects":{"joy":20,"wealth":40,"flags":["demon_vanguard"]},"moment":"Đứng dưới trướng Ma Vương, gieo rắc tai ương cho vạn vật."},{"id":"g_first_meat","races":["goblin"],"stages":["infant"],"weight":10,"text":"Giữa bầy ấu tể gào khóc, bàn tay xanh nhỏ bé của bạn giật được mẩu xương còn dính thịt. Trận chiến đầu tiên của đời bạn, bạn đã thắng.","effects":{"STR":1}},{"id":"g_dark_eyes","races":["goblin"],"stages":["infant"],"weight":8,"text":"Đôi mắt bạn dần quen với bóng tối hang sâu. Nơi kẻ khác chỉ thấy gs":["tamed_pet"]},"moment":"Trở thành linh thú của Pháp sư"},{"label":"Nuốt nấm tử độc","text":"Bạn nhai một nắm nấm tử độc, đôi mắt đỏ ngầu, và lao vào kẻ thù với sức mạnh chưa từng có.","death":"Bạn ngã xuống ở tuổi {age}, nhưng đã kéo theo ba kẻ truy đuổi xuống cõi Hư Vô cùng mình."},{"label":"Nhảy xuống sông ngầm","check":{"stat":"LUCK","target":5},"success":{"text":"Dòng nước cuộn xiết cuốn bạn đi suốt một đêm, rồi đặt bạn lên một bãi cát xa lạ. Bạn còn sống.","effects":{"health":15,"LUCK":1}},"fail":{"text":"Dòng sông ngầm không trả lại những gì nó đã nuốt.","death":"Dòng sông ngầm nhấn chìm bạn ở tuổi {age}."}}]},{"id":"g_oldest","races":["goblin"],"stages":["elder"],"weight":10,"text":"Bạn đã trở thành Goblin già nhất hang. Lũ ấu tể nhìn bạn bằng ánh mắt kinh hãi, như nhìn một huyền thoại sống sót từ thuở hồng hoang.","effects":{"joy":5},"moment":"Goblin già nhất hang"},{"id":"goblin_infant_moss","races":["goblin"],"stages":["infant"],"weight":8,"text":"Từng mảng rêu đá ẩm mốc là thứ duy nhất ngăn bạn khỏi cái chết đói. Bạn cắn xé một đồng loại yếu ớt hơn để giành lấy phần ăn, khắc sâu chân lý tàn khốc của vực thẳm.","effects":{"STR":1,"health":5}},{"id":"goblin_infant_shadow","races":["goblin"],"stages":["infant"],"weight":6,"require":{"notFlags":["chief_son"]},"text":"Những bóng đen khổng lồ của bọn Goblin trưởng thành lướt qua, mang theo mùi tử khí và bạo lực. Bạn nép mình vào khe nứt, học được cách hô hấp nhẹ như hư vô để lẩn trốn sự tàn bạo của đồng loại.","effects":{"AGI":1,"joy":-2}},{"id":"goblin_infant_plague","races":["goblin"],"stages":["infant"],"eras":["dark_age"],"once":false,"weight":5,"text":"Mầm bệnh đen ngòm từ bãi rác sinh hoạt lan tràn khắp hang động tăm tối. Cơ thể ốm yếu của bạn run rẩy trong cơn sốt, nhưng dòng máu dơ bẩn lại bừng lên sức sống dai dẳng kì lạ.","effects":{"health":-5,"LUCK":1}},{"id":"goblin_child_rock","races":["goblin"],"stages":["child"],"eras":["peace"],"weight":7,"text":"Từ bụi rậm Rừng Tân Thủ, bạn ném hòn đá nhọ
