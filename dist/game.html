ứng như đá tảng. Đôi mắt mù lòa, nhưng bạn cảm nhận được từng gợn sóng trên mặt đầm.","effects":{"INT":1,"joy":3}},{"id":"lizardman_infant_cannibal","races":["lizardman"],"stages":["infant"],"weight":6,"text":"Cơn đói cào xé thôi thúc bạn nghiền nát lớp vảy non nớt của chính những kẻ yếu ớt cùng lứa. Luật lệ của đầm lầy khắc nghiệt đã sớm ăn sâu vào bản năng nguyên thủy của bạn.","effects":{"STR":1,"health":5}},{"id":"lizardman_infant_lungs","races":["lizardman"],"stages":["infant"],"weight":5,"text":"Dưới tầng đáy tăm tối của Đầm Lầy Tử Khí, hai buồng phổi kép của bạn bùng nhịp đập, lọc lấy dưỡng khí từ lớp bùn đặc quánh. Bạn đã sẵn sàng cho một kiếp sống vô hình dưới bóng nước đen.","effects":{"AGI":1,"health":5}},{"id":"lizardman_infant_hide_predator","races":["lizardman"],"stages":["infant"],"once":false,"weight":7,"text":"Một bóng đen khổng lồ lướt qua mặt nước, mang theo áp lực vĩ đại của loài thủy quái viễn cổ. Bạn vùi mình sâu vào bùn lầy, nín thở để mặc cho sự rình rập của tử thần trôi qua.","effects":{"AGI":1,"joy":-3}},{"id":"lizardman_infant_first_shed","races":["lizardman"],"stages":["infant"],"weight":6,"text":"Lớp da trơn trượt nứt toác, nhường chỗ cho những phiến vảy gai góc đầu tiên đâm chồi từ xương thịt. Bạn rũ bỏ quá khứ yếu hèn, khoác lên mình tấm áo giáp do tự nhiên ban tặng.","effects":{"STR":1,"health":10}},{"id":"lizardman_infant_dark_water","races":["lizardman"],"stages":["infant"],"eras":["dark_age"],"weight":5,"text":"Dòng nước đầm lầy vẩn đục bởi độc tố tử vong lan tràn từ Kỷ Nguyên Tăm Tối, ăn mòn sinh mệnh muôn loài. Nhờ huyết mạch dị giáo, bạn thản nhiên uống cạn dòng hắc thủy mà vẫn sinh tồn.","effects":{"health":5,"joy":-5}},{"id":"lizardman_child_mud_camo","races":["lizardman"],"stages":["child"],"once":false,"weight":8,"text":"Trét lên mình lớp bùn tanh nồng, bạn hòa làm một với rễ cây đước mục nát, hóa thành một bóng ma chờ thời cơ. Kẻ đi săn chân chính luôn biết cách để sự tĩnh lặng cất lời.","effects":{"AGI":1,"LUCK":1}},{"id":"lizardman_child_holy_scout","races":["lizardman"],"stages":["child"],"eras":["holy_war"],"weight":6,"text":"Từ dưới mặt nước, đôi mắt bò sát của bạn lạnh lùng quan sát gót giày sắt của Thánh Vệ Quân đang giẫm đạp lên vùng ven đầm lầy. Ngọn lửa chiến tranh đã bén mảng đến vùng thánh địa bất khả xâm phạm.","effects":{"INT":1,"joy":-4}},{"id":"lizardman_child_venom_gland","races":["lizardman"],"stages":["child"],"weight":6,"require":{"flags":["poison_blood"]},"text":"Bạn nhai nuốt những con ếch nham thạch kịch độc, ép chất dịch chết chóc dung hợp vào tuyến nọc dưới vòm họng. Lời nguyền độc dược nay đã trở thành vũ khí sắc bén nhất của bạn.","effects":{"STR":1,"health":-5}},{"id":"lizardman_child_tooth_loss","races":["lizardman"],"stages":["child"],"weight":5,"text":"Những chiếc răng cưa vỡ nát khi bạn nhai xương cốt của con thú hoang, ngay lập tức bị đẩy ra bởi hàng nanh mới sắc như dao cạo. Nanh vuốt của bạn sinh ra là để tước đoạt sinh mệnh.","effects":{"STR":1,"health":5}},{"id":"lizardman_child_demon_scavenge","races":["lizardman"],"stages":["child"],"eras":["demon_lord"],"weight":5,"text":"Xác một con quỷ dơi từ Quân Đoàn Hủy Diệt rơi tõm xuống đầm lầy, bạn xé xác nó để lấp đầy dạ dày đang sôi sục. Máu ác quỷ mang vị tanh nồng, khơi dậy cơn thịnh nộ nguyên thủy trong huyết quản.","effects":{"STR":2,"health":-8}},{"id":"lizardman_child_shaman_chant","races":["lizardman"],"stages":["child"],"once":false,"weight":7,"text":"Lắng nghe tiếng tụng niệm trầm đục của vị Tư tế dưới ánh lửa xanh, linh hồn bạn rung động trước huyền thoại về Tà Thần Rắn. Đức tin tàn nhẫn ấy sẽ soi sáng con đường bạo huyết của bạn.","effects":{"INT":1,"joy":5}},{"id":"lizardman_child_tail_whip","races":["lizardman"],"stages":["child"],"weight":6,"require":{"STR":3},"text":"Bạn luyện tập cú quất đuôi xé gió, nghiền nát một gốc cây mục thành trăm mảnh vụn văng tung tóe. Sức mạnh bạo tàn này sẽ là tấm khiên vững chãi nhất cho sinh mạng nhỏ bé của bạn.","effects":{"STR":1,"AGI":1}},{"id":"lizardman_child_blood_baptism","races":["lizardman"],"stages":["child"],"weight":8,"text":"Đêm trăng khuyết, bộ lạc tổ chức Nghi lễ Tắm Máu để công nhận những thợ săn mới. Bạn đứng trước đàn tế, tay lăm lăm ngọn giáo làm từ xương thú, chuẩn bị đoạt lấy sinh mạng đầu tiên.","choices":[{"label":"Nhắm vào con Lợn Rừng Đầm Lầy khổng lồ","check":{"stat":"STR","target":5},"success":{"text":"Lưỡi giáo của bạn xuyên thủng hộp sọ con mãnh thú trong một đòn cuồng bạo. Dòng máu nóng hổi tưới lên vảy, khắc tên bạn vào danh sách những kẻ đồ tể đáng sợ nhất.","effects":{"STR":2,"flags":["butcher"]},"moment":"Tắm máu dã thú khổng lồ trong nghi lễ trưởng thành."},"fail":{"text":"Sức mạnh của bạn chưa đủ để xuyên thủng lớp da dày của mãnh thú. Nó gầm lên, húc cặp nanh sắc nhọn đâm xuyên qua ngực bạn.","death":"Bị dã thú cắn xé trong nghi lễ Tắm Máu ở tuổi {age}."}},{"label":"Giết một con lợn nước nhỏ an toàn","text":"Bạn chọn một sinh vật yếu ớt, dễ dàng cắt cổ nó và bôi chút máu lên trán để hoàn thành nghi lễ. Sự an toàn tẻ nhạt không mang lại vinh quang, nhưng giúp bạn sống sót.","effects":{"joy":-5,"LUCK":1}}]},{"id":"lizardman_teen_ambush_training","races":["lizardman"],"stages":["teen"],"once":false,"weight":7,"text":"Bạn kiên nhẫn ngâm mình dưới nước suốt nhiều ngày đêm, chỉ để mắt và mũi nhô lên chờ đợi một bầy nai gạc sừng đi ngang. Bản ngã của sát thủ được tôi luyện qua sự chờ đợi tĩnh lặng đến nghẹt thở.","effects":{"AGI":1,"INT":1}},{"id":"lizardman_teen_peace_trade","races":["lizardman"],"stages":["teen"],"eras":["peace"],"weight":5,"text":"Trong thời bình, bạn lén lút trao đổi những tấm da cá sấu hoàn hảo để lấy vũ khí sắt từ Thương Đoàn Sói Bạc đi lạc. Những lưỡi đao sắc bén của nhân loại nay phục vụ cho đôi tay đầy móng vuốt của bạn.","effects":{"wealth":15,"flags":["trader"]}},{"id":"lizardman_teen_autotomy","races":["lizardman"],"stages":["teen"],"weight":4,"require":{"below":{"health":40}},"text":"Bị dồn vào đường cùng bởi nanh vuốt kẻ thù, bạn nghiến răng tự ngắt đi chiếc đuôi của mình làm mồi nhử. Nỗi đau xé ruột gan đổi lấy một cơ hội sinh tồn mong manh chốn tử địa.","effects":{"AGI":2,"health":-15}},{"id":"lizardman_teen_blind_spit","races":["lizardman"],"stages":["teen"],"weight":6,"require":{"flags":["poison_blood"]},"text":"Bạn phun một ngụm độc trúng thẳng vào đôi mắt kẻ xâm nhập ngoại lai, khiến gã la hét điên cuồng trong bóng tối vĩnh cửu. Sự tàn độc của loài bò sát không có chỗ cho lòng khoan dung.","effects":{"STR":1,"joy":5}},{"id":"lizardman_teen_holy_raid","races":["lizardman"],"stages":["teen"],"eras":["holy_war"],"weight":6,"require":{"flags":["butcher"]},"text":"Dẫn đầu toán phục kích, bạn nhấn chìm những kỵ binh Thánh Vệ Quân rệu rã xuống đáy đầm lầy không đáy. Những vầng hào quang rực rỡ của Nữ thần Lumina cũng phải tắt lụi trước hàm răng nhuốm máu của bạn.","effects":{"wealth":20,"STR":1}},{"id":"lizardman_teen_scale_rot","races":["lizardman"],"stages":["teen"],"eras":["dark_age"],"weight":5,"text":"Dịch thối vảy quét qua bộ lạc mang theo tiếng khóc than ai oán, nhưng dòng máu kháng độc đã giúp bạn cắn răng trụ vững. Bạn lặng lẽ vứt xác đồng loại xuống vực sâu, lòng quặn thắt trước sinh tử mong manh.","effects":{"health":-10,"joy":-10}},{"id":"lizardman_teen_nest_guard","races":["lizardman"],"stages":["teen"],"once":false,"weight":6,"text":"Dưới ánh trăng bàng bạc mờ ảo, bạn đứng canh gác bên những vũng bùn chứa đầy trứng của bộ lạc. Bảo vệ thế hệ tương lai là bản năng, là trách nhiệm và là danh dự thiêng liêng nhất.","effects":{"joy":4,"health":-3}},{"id":"lizardman_teen_abyssal_temptation","races":["lizardman"],"stages":["teen"],"eras":["demon_lord"],"weight":5,"text":"Sứ giả của Ma Vương lượn lờ buông lời cám dỗ bạn gia nhập đội quân bóng tối thống trị lục địa. Bạn gầm gừ giương vuốt từ chối, bởi đầm lầy này mới là chúa tể duy nhất bạn cúi đầu phục vụ.","effects":{"INT":1,"LUCK":1}},{"id":"lizardman_teen_human_prisoners","races":["lizardman"],"stages":["teen"],"weight":8,"text":"Một nhóm mạo hiểm giả rệu rã đi lạc vào đầm lầy, áo giáp kim loại của chúng sáng lóa dưới ánh trăng mờ. Bản năng sát thủ réo gọi bạn đoạt lấy máu thịt ngoại lai để chứng minh thực lực.","choices":[{"label":"Phục kích bắt sống chúng","check":{"stat":"AGI","target":6},"success":{"text":"Bạn cắn nát gân chân kẻ đi đầu, kéo tuột hắn xuống vùng bùn đen trước sự kinh hoàng của đồng bọn. Chiến lợi phẩm này sẽ làm vui lòng các Tư tế trên Tế Đàn Xương vĩ đại.","effects":{"wealth":15,"joy":10,"flags":["butcher"]},"moment":"Bắt sống mạo hiểm giả loài người để hiến tế tà thần."},"fail":{"text":"Bọn mạo hiểm giả tinh ranh hơn bạn tưởng. Lưỡi gươm bọc thánh quang xé toạc lớp vảy chưa đủ độ cứng cáp của bạn.","death":"Bị mạo hiểm giả chặt đầu bằng thanh kiếm bạc ở tuổi {age}."}},{"label":"Lặn xuống báo động cho chiến binh lớn","text":"Bạn hòa mình vào bóng tối bùn lầy, quay về gọi bầy đàn đến tàn sát. Lựa chọn này an toàn, nhưng tước đi vinh quang cá nhân của bạn.","effects":{"joy":-5}}]},{"id":"lizardman_adult_giant_croc","races":["lizardman"],"stages":["adult"],"weight":7,"text":"Bạn gầm lên dữ dội, lao vào cắn xé con cá sấu bạo chúa đang dám bén mảng tới bãi đẻ trứng của bộ lạc. Chiến thắng đẫm máu này khẳng định vị thế kẻ săn mồi thống trị tuyệt đối của bạn.","effects":{"STR":1,"joy":10,"health":-5}},{"id":"lizardman_adult_mating_fight","races":["lizardman"],"stages":["adult"],"once":false,"weight":6,"text":"Mùa sinh sản đến, máu nóng sục sôi buộc bạn phải tử chiến với những con đực khác để giành quyền duy trì nòi giống. Những vết sẹo chằng chịt mới tạc thêm là minh chứng hùng hồn cho sức mạnh vô song.","effects":{"STR":1,"joy":8,"health":-8}},{"id":"lizardman_adult_merchant_halberd","races":["lizardman"],"stages":["adult"],"eras":["peace"],"weight":6,"require":{"wealth":20},"text":"Nhờ giao thương ngầm với Thương Đoàn Sói Bạc, bạn đổi những viên Lõi Mana hiếm có lấy một cây kích chiến bằng thép đen. Sự kết hợp giữa nọc độc đầm lầy và rèn đúc nhân loại khiến sức mạnh của bạn thăng hoa.","effects":{"wealth":-20,"STR":2}},{"id":"lizardman_adult_holy_crusader","races":["lizardman"],"stages":["adult"],"eras":["holy_war"],"weight":7,"text":"Thánh Vệ Quân giương cao thập tự giá rực lửa thiêu rụi các khu rừng ven rìa đầm lầy. Bạn lạnh lùng nhúng mũi giáo vào nọc kịch độc, chuẩn bị gieo rắc cái chết câm lặng cho bầy người cuồng tín.","effects":{"INT":1,"joy":-5}},{"id":"lizardman_adult_famine_sludge","races":["lizardman"],"stages":["adult"],"eras":["dark_age"],"weight":5,"require":{"below":{"health":50}},"text":"Nạn đói tràn lan khiến mọi sinh vật chết rục, buộc bạn phải nuốt lớp bùn thối và xác rữa để cầm hơi. Huyết mạch kháng độc là phép màu duy nhất giữ cho nhịp tim bạn không vĩnh viễn ngừng đập.","effects":{"health":-10,"LUCK":1}},{"id":"lizardman_adult_demon_steed","races":["lizardman"],"stages":["adult"],"eras":["demon_lord"],"weight":6,"require":{"flags":["butcher"]},"text":"Một con ma thú tàn tạ chạy trốn khỏi Quân Đoàn Hủy Diệt bị bạn dùng bạo lực áp đảo và đánh tới tấp đến khi phải cúi đầu khuất phục. Nó trở thành thú cưỡi hung hãn, nâng tầm kinh hoàng của ác thần đầm lầy.","effects":{"STR":1,"AGI":1}},{"id":"lizardman_adult_blood_poison","races":["lizardman"],"stages":["adult"],"weight":5,"require":{"flags":["poison_blood"]},"text":"Bạn tàn nhẫn rạch cổ tay của chính mình, tẩm dòng máu độc đen ngòm lên từng mũi phi tiêu. Mỗi vết cắt bạn ban phát cho kẻ thù giờ đây đều mang theo bản án hoại tử tàn khốc.","effects":{"STR":1,"health":-8,"joy":5}},{"id":"lizardman_adult_tribal_duel","races":["lizardman"],"stages":["adult"],"weight":9,"text":"Thủ lĩnh bộ lạc đã có dấu hiệu chậm chạp vì tuổi tác, trong khi ngai vàng đắp từ xương cốt không bao giờ dung thứ cho kẻ yếu. Ánh mắt tàn bạo của bạn đã ghim chặt vào chiếc ghế quyền lực đẫm máu ấy.","choices":[{"label":"Thách đấu sinh tử đoạt quyền thủ lĩnh","check":{"stat":"STR","target":8},"success":{"text":"Bạn nghiền nát hộp sọ của gã thủ lĩnh già trong tiếng gầm rú điên loạn của bầy đàn. Bước lên ngai xương, bạn trở thành vị vua tàn bạo mới của Đầm Lầy Tử Khí, nắm giữ vinh quang vô thượng.","effects":{"STR":2,"wealth":30,"joy":20,"flags":["snake_blessed"]},"moment":"Lật đổ thủ lĩnh cũ, đoạt ngai vàng bằng xương và cai trị bộ lạc."},"fail":{"text":"Kinh nghiệm thực chiến của gã thủ lĩnh già đã bù đắp cho sự chậm chạp. Hắn tóm được sơ hở và xé toạc cuống họng của bạn bằng hàm nanh sắc lẹm.","death":"Bị vặn gãy cổ trong trận huyết chiến tranh giành quyền lực bộ lạc ở tuổi {age}."}},{"label":"Cúi đầu thần phục nhẫn nhịn","text":"Bạn cúi gầm mặt, giấu đi tham vọng rực lửa và cam chịu làm một chiến binh tay sai. Bạn sống sót, nhưng lòng kiêu hãnh của dã thú bị tổn thương sâu sắc.","effects":{"joy":-10,"LUCK":1}}]},{"id":"lizardman_middle_snake_vision","races":["lizardman"],"stages":["middle"],"weight":7,"require":{"flags":["snake_blessed"]},"text":"Hít sâu làn khói lam ma mị từ thảo mộc cháy sém, bạn diện kiến ảo ảnh vĩ đại của Tà Thần Rắn đang cuộn mình trên vòm trời sấm sét. Mặc khải tăm tối này khắc vào não bộ bạn trí tuệ của bậc vương giả.","effects":{"INT":2,"joy":15}},{"id":"lizardman_middle_sacrificial_priest","races":["lizardman"],"stages":["middle"],"once":false,"weight":6,"require":{"flags":["snake_blessed"]},"text":"Chủ trì đêm Tế Máu, bạn vung dao xương rạch ngực kẻ thù ngoại lai, móc ra trái tim còn đập thình thịch dâng lên Tế Đàn. Tiếng hoan hô man rợ của bộ lạc như bài ca vinh danh sự sùng bái tà thần cực đoan.","effects":{"joy":12,"health":5}},{"id":"lizardman_middle_final_molt","races":["lizardman"],"stages":["middle"],"weight":8,"text":"Cơn đau buốt thấu tủy ập đến khi bạn lột xác lần cuối cùng, rũ bỏ toàn bộ lớp vảy cũ kỹ xỉn màu. Lớp da mới đóng sừng đen nhánh bóng loáng, biến bạn thành một pháo đài sống bất khả xâm phạm.","effects":{"STR":2,"health":20}},{"id":"lizardman_middle_dawn_guild","races":["lizardman"],"stages":["middle"],"eras":["peace"],"weight":6,"text":"Những kẻ ngu ngốc từ Bình Minh Hội lén lút lẻn vào đầm lầy săn lùng hoa ma pháp hiếm có. Bằng trí tuệ lõi đời, bạn giăng hàng loạt bẫy gai độc, thu thập một mẻ chiến lợi phẩm kếch xù.","effects":{"INT":1,"wealth":20,"joy":5}},{"id":"lizardman_middle_inquisitor_hunt","races":["lizardman"],"stages":["middle"],"eras":["holy_war"],"weight":6,"text":"Ánh lửa dị giáo phán quyết rực sáng từ những đội tuần tra của Giáo Hội Thánh Quang. Lấy đại cuộc làm trọng, bạn lạnh lùng hạ lệnh cho toàn bộ lạc chôn mình dưới bùn đen nhịn thở suốt cả tuần trăng.","effects":{"AGI":1,"joy":-8,"health":-5}},{"id":"lizardman_middle_toxic_fumes","races":["lizardman"],"stages":["middle"],"eras":["dark_age"],"weight":5,"require":{"flags":["poison_blood"]},"text":"Khí độc địa ngục bốc lên từ khe nứt tàn phá phổi muôn loài, nhưng lại rót sức sống cuồng bạo vào buồng phổi dị biến của bạn. Giữa thời đại tăm tối mịt mù, bạn vươn lên thành sinh vật hùng mạnh đến khó tin.","effects":{"STR":1,"health":15}},{"id":"lizardman_middle_demon_pact_reject","races":["lizardman"],"stages":["middle"],"eras":["demon_lord"],"weight":5,"text":"Sứ giả Ma Vương hạ mình dâng lên khế ước chiêu mộ bằng huyết ấn tà ác. Bạn khinh bỉ bẻ gãy cổ tên ác quỷ, tuyên bố vùng đầm lầy ngập ngụa này chỉ có một chúa tể duy nhất.","effects":{"STR":1,"joy":10}},{"id":"lizardman_middle_war_wounds","races":["lizardman"],"stages":["middle"],"weight":5,"require":{"below":{"health":40}},"text":"Những tàn dư từ hàng chục năm chém giết sinh tử bắt đầu hành hạ xương cốt bạn mỗi khi gió buốt thổi về từ Dãy Núi Răng Cưa. Cơ thể vĩ đại dường như đang dần phải cúi đầu trước sự tàn nhẫn của thời gian.","effects":{"health":-15,"STR":-1}},{"id":"lizardman_middle_teaching_youth","races":["lizardman"],"stages":["middle"],"once":false,"weight":6,"text":"Bạn đứng lặng lẽ dưới bóng cây cổ thụ mục rỗng, giám sát lũ nòng nọc vảy sừng tập lặn không tiếng động. Di sản tàn bạo của dòng máu bò sát sẽ được lưu truyền mãi mãi qua những thế hệ khát máu tiếp theo.","effects":{"INT":1,"joy":8}},{"id":"lizardman_middle_blood_magic","races":["lizardman"],"stages":["middle"],"weight":8,"text":"Một cuốn ma đạo thư thối rữa lấy từ xác vị hắc pháp sư phát ra âm thanh cưa cứa vào màng nhĩ. Nó hứa hẹn một sức mạnh cấm kỵ vô thượng nếu bạn dám dùng chính máu thịt mình làm vật dẫn.","choices":[{"label":"Rạch tay mạo hiểm luyện hắc ma pháp","check":{"stat":"INT","target":7},"success":{"text":"Bạn cắn răng chịu đựng khi ma thuật hắc ám bò trườn dưới lớp da, hòa tan vào dòng máu độc. Quyền năng nguyền rủa này nâng tâm trí bạn lên một chân trời đáng sợ mới.","effects":{"INT":3,"health":-15,"flags":["poison_blood"]},"moment":"Khai mở hắc ma pháp cấm kỵ bằng máu thịt đầm lầy."},"fail":{"text":"Ma lực vượt xa sự kiểm soát của một sinh vật bò sát thô kệch. Lời nguyền phản phệ khiến toàn thân bạn nổ tung trong cơn đau xé ruột gan.","death":"Bị tà thuật hắc ám thiêu rụi huyết quản và linh hồn ở tuổi {age}."}},{"label":"Đạp cuốn sách xuống hố bùn không đáy","text":"Bạn khịt mũi khinh miệt trước thứ tà thuật yếu đuối của con người, nhẫn tâm ném nó chìm nghỉm vào bóng đêm vĩnh hằng. Không có ma pháp nào thực tế bằng móng vuốt cả.","effects":{"joy":-3,"STR":1}}]},{"id":"lizardman_middle_yggdrasil_sap","races":["lizardman"],"stages":["middle"],"weight":8,"text":"Một rễ phụ khổng lồ của Cây Thế Giới Yggdrasil đâm xuyên qua vùng đầm lầy, rỉ ra những giọt nhựa cây xanh ngọc phát sáng. Sinh lực thánh khiết của tự nhiên tỏa ra hấp lực khó cưỡng.","choices":[{"label":"Nuốt trọn giọt nhựa cây thiêng liêng","check":{"stat":"LUCK","target":8},"success":{"text":"Nguồn năng lượng uy nghiêm thanh tẩy dòng máu vẩn đục, cường hóa xương tủy bạn trở nên bất hoại. Bạn hấp thụ sinh lực thần thánh mà không đánh mất bản tính tàn bạo của mình.","effects":{"health":35,"STR":1,"joy":10},"moment":"Hấp thụ nhựa Cây Thế Giới để vươn tới cực hạn sinh mệnh."},"fail":{"text":"Dòng máu độc tà ác của bạn xung đột cực đoan với thánh năng thanh khiết từ Yggdrasil. Cơ thể bạn bốc cháy trong ngọn lửa xanh diệt vong.","death":"Thân xác nổ tung do nuốt chửng thánh năng Yggdrasil vượt quá giới hạn dung nạp năm {age} tuổi."}},{"label":"Giao dịch bí mật với Tự Nhiên Giáo","text":"Bạn cử tay sai báo tin cho đám tu sĩ yêu thiên nhiên. Đổi lại, bộ lạc nhận được vô số rương đầy ắp Tinh Bạc mà không chịu rủi ro nào.","effects":{"wealth":30}}]},{"id":"lizardman_elder_oracle","races":["lizardman"],"stages":["elder"],"weight":10,"text":"Cơ bắp teo tóp và lớp vảy hóa đá không cho phép bạn săn mồi nữa, nhưng giác quan rung động đã đạt tới ngưỡng siêu việt. Bạn ngự trị trên bục cao, trở thành bức tượng sống thông tuệ được cả bộ lạc quỳ lạy sùng bái.","effects":{"INT":2,"AGI":-3,"joy":15}},{"id":"mn_horns","races":["minotaur"],"stages":["infant"],"weight":10,"text":"Đôi sừng non nhú lên trên vầng trán bạn. Bạn húc vỡ tảng đá đầu tiên trong đời, và mê cung đáp lại bằng một tiếng vọng trầm đục.","effects":{"STR":1}},{"id":"mn_first_axe","races":["minotaur"],"stages":["teen"],"weight":10,"text":"Từ sắt vụn của những kẻ xâm nhập, bạn rèn nên chiếc rìu chiến hai lưỡi đầu tiên. Nó nặng như một cỗ xe, và vừa vặn trong tay bạn.","effects":{"STR":2},"moment":"Rèn chiếc rìu chiến đầu tiên"},{"id":"mn_ms_lost","races":["minotaur"],"stages":["child","teen"],"weight":8,"text":"Mê cung lặng lẽ đổi hình. Những hành lang quen thuộc biến mất, và lần đầu tiên bạn không biết đường về.","choices":[{"label":"Đập tường mở lối","check":{"stat":"STR","target":7},"success":{"text":"Bạn húc xuyên ba bức tường đá liền. Mê cung không giam được bạn, nó chỉ có thể nhường đường.","effects":{"STR":1}},"fail":{"text":"Bức tường cổ không hề suy suyển. Đầu bạn ong ong suốt nhiều ngày.","effects":{"health":-15}}},{"label":"Lắng nghe tiếng gió","check":{"stat":"AGI","target":5},"success":{"text":"Bạn khép mắt, lắng nghe hơi thở khe khẽ của mê cung, và tìm thấy lối về.","effects":{"AGI":1,"INT":1}},"fail":{"text":"Bạn lang thang bảy ngày trong bóng tối trước khi tình cờ tìm thấy căn phòng của mình.","effects":{"health":-10,"joy":-10}}},{"label":"Gầm thét chờ con mồi","text":"Bạn đứng yên và gầm lên. Một con Goblin xui xẻo lạc vào, và bạn có bữa tối.","effects":{"STR":1,"health":5}}]},{"id":"mn_ms_rage","races":["minotaur"],"stages":["teen","adult"],"weight":8,"text":"Một kẻ xâm nhập phất chiếc áo choàng tẩm ma lực khiêu khích. Dù đôi mắt mù màu, bạn vẫn cảm thấy nó cháy rực như máu tươi.","choices":[{"label":"Lao vào húc chết","text":"Bạn xuyên qua ba lớp bẫy chông để nghiền nát hắn. Chiến thắng, nhưng thân thể bạn đầy những vết thương.","effects":{"health":-25,"STR":1,"flags":["berserker"]}},{"label":"Kìm nén, ném búa","check":{"stat":"AGI","target":5},"success":{"text":"Bạn nghiến răng kìm lại cơn điên và ném chiếc búa. Kẻ khiêu khích gục ngã trước khi kịp chạm vào bẫy của hắn.","effects":{"INT":1,"joy":5},"moment":"Làm chủ cơn điên màu máu"},"fail":{"text":"Chiếc búa trượt mục tiêu, và cơn điên vẫn chiếm lấy bạn.","effects":{"health":-15}}},{"label":"Hất đồng loại ra đỡ","text":"Bạn hất một Minotaur non lên đỡ đòn rồi tấn công. Kẻ địch chết, và đồng loại kia cũng vậy.","effects":{"joy":-10,"flags":["ruthless"]}}]},{"id":"mn_ms_heroes","races":["minotaur"],"stages":["adult","middle"],"weight":10,"text":"Cánh cửa đá phòng Boss rung lên. Một tổ đội Anh hùng giáp trụ sáng loáng bước vào, thanh kiếm của kẻ dẫn đầu rực ánh Thánh Quang.","choices":[{"label":"Tử chiến chặn cửa","check":{"stat":"STR","target":10},"success":{"text":"Rìu chiến của bạn quét ngang như cơn lốc. Khi bụi lắng xuống, bộ giáp của các Anh hùng nằm la liệt quanh ngai đá của bạn.","effects":{"wealth":30,"STR":1,"flags":["boss_legend"]},"moment":"Đánh bại một tổ đội Anh hùng"},"fail":{"text":"Thánh kiếm xuyên qua lồng ngực bạn.","death":"Bạn chết đứng trước cửa phòng báu vật ở tuổi {age}, chưa lùi một bước."}},{"label":"Đuổi theo bóng ảo","text":"Bạn lao theo cái bóng ảo của gã Pháp sư, cặp sừng cắm sâu vào vách đá. Để thoát thân, bạn phải bẻ gãy chính chiếc sừng kiêu hãnh của mình.","effects":{"STR":-2,"health":-20,"flags":["hornless"]}},{"label":"Nhường vàng cho qua","check":{"stat":"INT","target":6},"success":{"text":"Bạn bước sang một bên, để chúng lấy đi một phần kho báu. Bạn còn sống, nhưng tín ngưỡng hộ vệ trong bạn đã rạn nứt.","effects":{"wealth":-15,"joy":-10,"flags":["oathbreaker"]}},"fail":{"text":"Chúng nhận vàng, rồi vẫn đâm lén bạn sau lưng.","effects":{"health":-30,"wealth":-15}}}]},{"id":"mn_ms_mercenary","races":["minotaur"],"stages":["adult","middle"],"weight":7,"text":"Một sứ giả của thương đoàn tà ác quỳ trước bạn, hứa hẹn thịt tươi mỗi ngày nếu bạn chịu làm lính đánh thuê cho chúng.","choices":[{"label":"Ăn thịt sứ giả","text":"Bạn từ chối theo cách của Minotaur. Mê cung vẫn là của bạn.","effects":{"STR":1,"health":5}},{"label":"Theo Thương đoàn","text":"Lần đầu tiên, bạn bước ra khỏi mê cung và nhìn thấy bầu trời.","effects":{"wealth":25,"joy":10,"flags":["mercenary"],"unflags":["maze_guardian"]},"moment":"Rời mê cung theo Thương đoàn"},{"label":"Bắt cống nạp vũ khí","check":{"stat":"INT","target":4},"success":{"text":"Chúng run rẩy dâng lên một cây rìu thép đen. Bạn cho chúng đi qua.","effects":{"wealth":15,"STR":1}},"fail":{"text":"Chúng giả vờ đồng ý, rồi tẩm độc vào thịt.","effects":{"health":-25}}}]},{"id":"mn_blind","races":["minotaur"],"stages":["elder"],"weight":8,"text":"Đôi mắt bạn mờ đục hoàn toàn. Nhưng chỉ cần một tiếng bước chân, chiếc rìu già nua vẫn vung lên chính xác như thuở nào.","effects":{"AGI":1,"joy":3},"moment":"Lão ngưu mù vẫn giữ cửa"},{"id":"minotaur_infant_raw_meat","races":["minotaur"],"stages":["infant"],"weight":6,"text":"Bạn gào thét cắn xé những tảng thịt sống đỏ hỏn, nhai nghiến ngấu cả xương lẫn tủy. Sứ mệnh của một kẻ tàn sát đã được gieo mầm từ những giọt máu tanh tưởi đầu đời.","effects":{"STR":1,"health":5},"moment":"Tập nhai thịt sống"},{"id":"minotaur_infant_ring","races":["minotaur"],"stages":["infant"],"weight":5,"require":{"health":15},"text":"Một chiếc khuyên sắt nung đỏ được đâm xuyên qua vách ngăn mũi, đánh dấu bạn là kẻ canh giữ lãnh thổ tuyệt đối. Sự đau đớn khắc sâu thêm bản năng bạo lực nguyên thủy vào tận sâu thẳm tâm trí.","effects":{"STR":1,"joy":-5}},{"id":"minotaur_child_wander","races":["minotaur"],"stages":["child"],"once":false,"weight":6,"text":"Chỉ bằng khứu giác bóng tối, bạn dò dẫm bước qua những ngã rẽ hiểm hóc của mê cung tĩnh lặng. Bóng tối không hề đáng sợ, mà nó đang thầm thì trao cho bạn đặc quyền cai trị vương quốc ngầm này.","effects":{"AGI":1,"INT":1}},{"id":"minotaur_child_log_weapon","races":["minotaur"],"stages":["child"],"eras":["dark_age"],"weight":5,"text":"Giữa kỷ nguyên tăm tối, bạn bẻ gãy một cột trụ gỗ mục nát làm vũ khí để đập nát bầy quỷ lùn đói khát dám bám theo. Tiếng gãy vụn của xương cốt vang lên như bản giao hưởng vinh danh sức mạnh cơ bắp của bạn.","effects":{"STR":2,"joy":5,"flags":["ruthless"]},"moment":"Đập nát bầy quỷ lùn"},{"id":"minotaur_teen_skull_trophy","races":["minotaur"],"stages":["teen"],"weight":7,"text":"Bạn xé xác một mạo hiểm giả tập sự xấu số và tự hào treo hộp sọ rỉ máu của hắn lên vách đá. Định mệnh đã khắc họa hình hài bạn trở thành cơn ác mộng mà phàm nhân phải muôn đời khiếp sợ.","effects":{"STR":1,"joy":5}},{"id":"minotaur_teen_arena","races":["minotaur"],"stages":["teen"],"eras":["peace"],"weight":6,"text":"Bị ném vào Đấu Trường Huyết Sa mua vui, bạn dẫm nát mọi dã thú dám cản đường bằng cặp guốc vĩ đại. Dưới ánh sáng hòa bình giả tạo, bạn chứng minh rằng bạo lực thuần túy mới là chân lý tuyệt đối.","effects":{"STR":2,"health":-5,"flags":["gladiator_bull"]},"moment":"Vang danh tại Đấu Trường"},{"id":"minotaur_teen_holy_war","races":["minotaur"],"stages":["teen"],"eras":["holy_war"],"weight":5,"require":{"STR":4},"text":"Khi Thánh Vệ Quân rầm rập tiến vào lãnh địa, bạn vung vũ khí lao thẳng vào đội hình rực sáng của chúng với tiếng gầm rung chuyển đất trời. Sừng nhọn của quỷ dữ hả hê vấy máu những kẻ tự xưng là công lý.","effects":{"health":-10,"wealth":15,"flags":["berserker"]}},{"id":"minotaur_adult_boss_lair","races":["minotaur"],"stages":["adult"],"weight":8,"require":{"STR":6},"text":"Quật ngã những quái vật khổng lồ khác, bạn hiên ngang ngồi lên ngai vàng bằng xương rồng ở trung tâm tầng mê cung. Bánh xe số mệnh chính thức tôn phong bạn thành một Tinh anh mà vạn kẻ không dám bén mảng.","effects":{"wealth":20,"joy":10,"flags":["boss_legend"]},"moment":"Trở thành Boss của mê cung"},{"id":"minotaur_adult_stomp","races":["minotaur"],"stages":["adult"],"once":false,"weight":5,"text":"Mỗi cú giậm chân dồn phẫn nộ của bạn tạo ra những cơn địa chấn cục bộ làm nứt toác nền đá sẫm màu. Đất mẹ Aethelgard dường như cũng phải rùng mình quy phục trước uy vũ bạo tàn của bạn.","effects":{"STR":1,"health":-2}},{"id":"minotaur_adult_illusion","races":["minotaur"],"stages":["adult"],"weight":6,"require":{"below":{"INT":5}},"text":"Một nhóm pháp sư Hắc Nguyệt Hội cố tạo ảo ảnh ru ngủ tâm trí bạn, nhưng ma pháp lập tức tan vỡ trước bộ não miễn nhiễm ảo giác. Bạn bổ đôi kẻ xướng ngôn, chứng minh mưu hèn kế bẩn không thể cản bước sức mạnh.","effects":{"joy":5,"health":5}},{"id":"minotaur_middle_scars","races":["minotaur"],"stages":["middle"],"weight":7,"require":{"flags":["boss_legend"]},"text":"Lớp da dày của bạn chằng chịt vết sẹo ma pháp và dấu kiếm chém rách thịt từ vô số cuộc tử chiến. Đứng sừng sững giữa sảnh đường, bạn trông như một bức tượng đài bất hoại về sự hủy diệt vĩnh hằng.","effects":{"STR":2,"health":-5}},{"id":"minotaur_middle_gold_horn","races":["minotaur"],"stages":["middle"],"weight":5,"require":{"health":20},"text":"Tước đoạt thánh giá vàng nguyên khối từ một Thánh Kỵ Sĩ, bạn đun chảy và đúc bọc lên đôi sừng của mình. Ánh kim quang lấp lánh trên đầu ác thú chính là sự nhạo báng tột cùng dành cho Nữ thần Lumina.","effects":{"wealth":30,"joy":8,"flags":["oathbreaker"]},"moment":"Mạ vàng đôi sừng đẫm máu"},{"id":"minotaur_middle_demon_lord","races":["minotaur"],"stages":["middle"],"eras":["demon_lord"],"weight":6,"text":"Một sứ giả của Quân Đoàn Hủy Diệt mang theo sắc lệnh từ Ma Vương, triệu tập sức mạnh địa chấn của bạn để nghiền nát nhân loại. Linh hồn bạn gào thét trong sung sướng khi cánh cổng tàn sát vĩ đại nhất mở ra.","effects":{"STR":3,"joy":-5,"flags":["mercenary"]}},{"id":"minotaur_elder_fading_sight","races":["minotaur"],"stages":["elder"],"weight":8,"text":"Cặp mắt đỏ ngầu nay mờ đục hoàn toàn vì thời gian, đẩy bạn vào bóng tối vĩnh hằng của một sinh mệnh đang lụi tàn. Nhưng chính trong màn đêm u tối ấy, khứu giác khát máu lại càng trở nên nhạy bén đến đáng sợ.","effects":{"AGI":-2,"INT":-1,"flags":["blind_bull"]}},{"id":"minotaur_elder_lost_maze","races":["minotaur"],"stages":["elder"],"once":false,"weight":6,"require":{"flags":["blind_bull"]},"text":"Sự già nua lú lẫn khiến bạn đi lạc trong chính vương quốc mê cung mà mình từng cai trị bằng nỗi sợ hãi. Sự đơn độc lạnh lẽo dần gặm nhấm đi từng mảnh linh hồn hoang dại của vị bạo chúa.","effects":{"joy":-8,"INT":-1}},{"id":"minotaur_elder_broken_horn","races":["minotaur"],"stages":["elder"],"weight":7,"text":"Một đòn hiểm hóc từ Mạo hiểm giả kỳ cựu đã phạt gãy một bên sừng kiêu hãnh của bạn, hất tung dòng máu già nua lên vách đá. Bạn rống lên tiếng gầm xé gan ruột, hiểu rằng thời khắc của định mệnh đang buông màn.","effects":{"STR":-2,"health":-15,"flags":["hornless"]},"moment":"Gãy đi chiếc sừng kiêu hãnh"},{"id":"minotaur_elder_last_stand","races":["minotaur"],"stages":["elder"],"weight":8,"require":{"below":{"health":30}},"text":"Dựa vào thính giác mờ mịt, bạn gồng mình vung cây rìu chiến vỡ nát cho một cú giáng tuyệt vọng cuối cùng. Dù sinh mệnh sắp cạn kiệt, bức tượng đài của quỷ dữ kiên quyết không cúi đầu trước lưỡi hái tử thần.","effects":{"STR":2,"health":-10}},{"id":"oc_first_scar","races":["orc"],"stages":["infant"],"weight":10,"text":"Người anh cùng lứa cào một vết dài trên má bạn trong lúc tranh miếng thịt sống. Mẹ bạn mỉm cười: vết sẹo đầu đời là dấu hiệu của một chiến binh.","effects":{"STR":1},"moment":"Vết sẹo đầu đời"},{"id":"oc_boar_hunt","races":["orc"],"stages":["child"],"weight":9,"text":"Bạn theo đoàn thợ săn hạ một con lợn rừng khổng lồ. Chiếc nanh của nó được treo trên cổ bạn từ hôm ấy.","effects":{"STR":1,"joy":5}},{"id":"oc_tattoo","races":["orc"],"stages":["teen"],"weight":8,"text":"Lão Pháp sư xăm lên ngực bạn những hoa văn bằng máu và tro. Mỗi đường mực là một lời thề với Chiến thần.","effects":{"STR":1,"health":-5}},{"id":"oc_ms_arena","races":["orc"],"stages":["teen","adult"],"weight":14,"require":{"flags":["gladiator"]},"text":"Trận chung kết sinh tử tại Đấu Trường Huyết Sa. Hàng vạn quý tộc gào thét trên khán đài, đối diện bạn là nhà vô địch loài người.","choices":[{"label":"Nghiền nát nhà vô địch","check":{"stat":"STR","target":10},"success":{"text":"Rìu của bạn bổ đôi khiên của hắn, rồi bổ đôi hắn. Theo luật đấu trường, bạn được trả tự do.","effects":{"joy":20,"flags":["freed"],"unflags":["gladiator"]},"moment":"Giành tự do trên Đấu Trường Huyết Sa"},"fail":{"text":"Lưỡi giáo của nhà vô địch tìm được khe hở trên ngực bạn.","death":"Bạn ngã xuống nền cát đẫm máu ở tuổi {age}, giữa tiếng reo hò vô cảm."}},{"label":"Kích động nổi loạn","check":{"stat":"INT","target":5},"success":{"text":"Bạn hướng rìu lên khán đài và gầm lên. Hàng trăm nô lệ phá xích, và Đấu Trường Huyết Sa chìm trong biển lửa.","effects":{"joy":15,"flags":["rebel"],"unflags":["gladiator"]},"moment":"Lãnh đạo cuộc nổi loạn nô lệ"},"fail":{"text":"Lính canh dập tắt cuộc nổi loạn trước khi nó kịp bùng lên.","effects":{"health":-40}}},{"label":"Buông vũ khí","text":"Bạn buông rìu và ngẩng mặt nhìn trời.","death":"Bạn chọn cái chết vinh quang thay vì làm trò tiêu khiển, ở tuổi {age}."}]},{"id":"oc_ms_human_attack","races":["orc"],"stages":["teen","adult"],"weight":9,"text":"Đoàn kỵ binh loài người tràn qua thảo nguyên, giáo mác dựng đứng như một rừng thép. Bộ lạc của bạn nằm ngay trên đường tiến quân.","choices":[{"label":"Tử thủ bảo vệ bộ lạc","check":{"stat":"STR","target":9},"success":{"text":"Bạn đứng chắn trước những kẻ yếu suốt một ngày một đêm. Khi đoàn kỵ binh rút lui, cả bộ lạc hô vang tên bạn.","effects":{"joy":15,"flags":["honorable"]},"moment":"Tử thủ bảo vệ bộ lạc"},"fail":{"text":"Bức tường thép nghiền qua bạn.","death":"Bạn ngã xuống trước lều của bộ lạc ở tuổi {age}, rìu vẫn nắm chặt trong tay."}},{"label":"Rút lui phục kích","check":{"stat":"AGI","target":6},"success":{"text":"Bạn dụ kỵ binh vào rừng sâu và phục kích từng toán một. Chiến thắng, dù những lão chiến binh gọi đó là hèn nhát.","effects":{"wealth":10,"joy":-5}},"fail":{"text":"Kỵ binh đuổi kịp bạn ở bìa rừng.","effects":{"health":-25}}},{"label":"Một mình xông vào","check":{"stat":"STR","target":12},"success":{"text":"Bạn lao vào giữa ngàn quân như một cơn bão máu. Đội hình kỵ binh tan vỡ, và các thi sĩ loài người sẽ còn kể về bạn trong ác mộng.","effects":{"STR":2,"joy":20},"moment":"Một mình phá tan đội kỵ binh"},"fail":{"text":"Bạn biến mất giữa biển giáo mác.","death":"Bạn tử chiến giữa ngàn quân ở tuổi {age}. Bộ lạc sẽ hát tên bạn muôn đời."}}]},{"id":"oc_ms_duel","races":["orc"],"stages":["adult","middle"],"weight":10,"require":{"notFlags":["warchief"]},"text":"Bạn ném rìu xuống chân Tù trưởng. Cuộc Huyết Đấu tranh ngôi đã bắt đầu, và cả bộ lạc vây thành vòng tròn.","choices":[{"label":"Bổ đôi đầu đối thủ","check":{"stat":"STR","target":10},"success":{"text":"Một nhát rìu duy nhất. Bạn bước qua xác lão Tù trưởng và ngồi lên ngai da sói.","effects":{"wealth":30,"joy":15,"flags":["warchief"]},"moment":"Lên ngôi Tù trưởng"},"fail":{"text":"Bạn bại trận, bị tước rìu và lưu đày khỏi bộ lạc.","effects":{"health":-30,"joy":-20,"flags":["exiled"]}}},{"label":"Thắng nhưng tha mạng","check":{"stat":"STR","target":9},"success":{"text":"Bạn đè lão xuống đất rồi thu rìu lại. Lòng người ngả về phía bạn, và lão tự nguyện nhường ngôi.","effects":{"joy":20,"flags":["honorable","warchief"]},"moment":"Thắng Huyết Đấu và tha mạng đối thủ"},"fail":{"text":"Lão không đáp lại lòng nhân từ của bạn. Bạn bị lưu đày.","effects":{"health":-35,"flags":["exiled"]}}}]},{"id":"oc_ms_demon_alliance","races":["orc"],"stages":["adult","middle"],"weight":7,"text":"Sứ giả của Ma Vương đặt trước mặt bạn một chén máu quỷ đen sánh. Uống nó, bạn sẽ có sức mạnh vô song, và một chủ nhân mới.","choices":[{"label":"Uống máu quỷ","text":"Máu quỷ thiêu đốt huyết quản bạn. Khi cơn đau qua đi, bạn đã trở thành một Ác thú bạo tàn của Quân Đoàn Hủy Diệt.","effects":{"STR":3,"INT":-1,"flags":["demon_army"]},"moment":"Gia nhập Quân Đoàn Hủy Diệt"},{"label":"Chém đầu sứ giả","text":"Bạn hất đổ chén máu và chém phăng đầu sứ giả. Orc không quỳ trước ai.","effects":{"joy":10,"flags":["free_orc"]}},{"label":"Đòi cống nạp vũ khí","check":{"stat":"INT","target":5},"success":{"text":"Ma Vương gửi tới một xe rìu thép đen để mua lòng trung thành của bạn. Bạn nhận rìu, và vẫn chưa trả lời.","effects":{"wealth":25}},"fail":{"text":"Sứ giả không thích bị mặc cả.","effects":{"health":-25}}}]},{"id":"oc_old_shame","races":["orc"],"stages":["elder"],"weight":8,"text":"Cơ bắp bạn teo tóp, những vết thương cũ nhức nhối mỗi đêm. Với một Orc, sống đến tuổi này là một nỗi nhục.","effects":{"joy":-10,"STR":-1}},{"id":"orc_infant_raw_meat","races":["orc"],"stages":["infant"],"once":false,"weight":5,"text":"Bầu sữa của bạn là bát máu thú tanh nồng và những tảng thịt sống dai nhách. Hương vị nguyên thủy ấy rèn đúc nên cơ thể vạm vỡ mang màu định mệnh, chuẩn bị cho những trận cuồng phong.","effects":{"STR":1,"health":5}},{"id":"orc_infant_sibling_bite","races":["orc"],"stages":["infant"],"weight":5,"text":"Bạn gầm gừ cắn xé bắp tay của đứa anh cùng lứa để giành lấy miếng thịt ngon nhất. Bánh xe sinh tồn tàn khốc của tộc Orc đã sớm nghiền nát sự ngây thơ, đánh thức bản năng thú dữ.","effects":{"STR":1,"joy":-3}},{"id":"orc_infant_war_drums","races":["orc"],"stages":["infant"],"eras":["holy_war"],"weight":5,"text":"Trong giấc ngủ chập chờn, tiếng trống trận từ Thảo Nguyên Gió Hú vang dội trong huyết quản, thiêu đốt tâm trí non nớt. Bạn siết chặt nắm tay bé nhỏ, lắng nghe tiếng gọi của vinh quang đẫm máu.","effects":{"AGI":1}},{"id":"orc_child_heavy_axe","races":["orc"],"stages":["child"],"weight":5,"text":"Bạn vác trên vai cây rìu rèn từ Lò Rèn Vĩnh Cửu, nặng nề hơn cả trọng lượng cơ thể mình. Từng giọt mồ hôi rơi xuống mảnh đất cằn cỗi đúc kết nên một chiến binh không biết cúi đầu.","effects":{"STR":2,"AGI":-1}},{"id":"orc_child_beaten_training","races":["orc"],"stages":["child"],"once":false,"weight":5,"text":"Một cựu binh già giáng cú đấm nát bấy quai hàm để dạy bạn bài học vỡ lòng về nỗi đau rát thịt da. Cơ thể ứa máu nhưng đôi mắt bạn rực sáng ngọn lửa kiêu hãnh của loài ác thú.","effects":{"health":-5,"STR":1}},{"id":"orc_child_goblin_fight","races":["orc"],"stages":["child"],"eras":["demon_lord"],"weight":6,"text":"Lũ Goblin nhơ nhuốc tấn công bãi săn, và bạn dùng tay không xé xác tên đầu sỏ để thị uy trước bộ lạc. Định mệnh đã chọn bạn trở thành nỗi khiếp sợ của bóng tối hèn nhát.","effects":{"health":-3,"joy":5}},{"id":"orc_child_smash_magic","races":["orc"],"stages":["child"],"weight":5,"require":{"below":{"INT":5}},"text":"Nhặt được một cây đũa phép tỏa sáng, bạn nhổ bọt khinh bỉ và bẻ gãy nó thành hai mảnh vụn nát. Tín ngưỡng vinh quang của tộc Orc tuyệt đối không có chỗ cho những trò ma pháp mị dân.","effects":{"joy":3,"flags":["magic_hater"]}},{"id":"orc_child_foraging","races":["orc"],"stages":["child"],"eras":["dark_age"],"once":false,"weight":5,"text":"Giữa kỷ nguyên tăm tối, bạn lặn lội trong Đầm Lầy Tử Khí tìm kiếm thi thể quái thú để nhét đầy dạ dày réo gọi. Khúc tráng ca của sự sống ngoan cường vẫn nảy mầm từ trong tuyệt vọng và đói khát.","effects":{"health":5,"joy":-3}},{"id":"orc_teen_first_raid","races":["orc"],"stages":["teen"],"eras":["holy_war"],"once":false,"weight":6,"text":"Trong trận càn quét đầu tiên tại biên giới Thánh Quang, ngọn lửa tử thù nhuộm đỏ màn đêm vô tận. Lưỡi búa của bạn gặt hái sinh mạng, thắp lên điềm báo về một Huyết Kỵ Sĩ uy phong.","effects":{"wealth":15,"health":-5,"flags":["warborn"]}},{"id":"orc_teen_tame_wolf","races":["orc"],"stages":["teen"],"weight":6,"require":{"STR":4},"text":"Giữa cơn bão tuyết xé thịt, bạn đánh gục và quỳ gối khuất phục một con Sói Tuyết khổng lồ ngạo nghễ. Kẻ thống trị dã thú đã trỗi dậy, ghi tên mình vào thần thoại của vùng thảo nguyên.","effects":{"AGI":2,"flags":["beast_master"]}},{"id":"orc_teen_tusk_pierce","races":["orc"],"stages":["teen"],"weight":5,"text":"Pháp sư bộ lạc dùng búa đập xuyên qua cặp nanh lòi của bạn những chiếc khuyên rèn từ Huyết Kim rực lửa. Đau đớn tột cùng khắc sâu lời thề máu mủ của một chiến binh trưởng thành.","effects":{"health":-5,"joy":5}},{"id":"orc_teen_mercenary","races":["orc"],"stages":["teen"],"eras":["peace"],"once":false,"weight":4,"text":"Thương Đoàn Sói Bạc thuê bạn làm tấm khiên thịt dẹp đường qua Dãy Núi Răng Cưa hiểm trở. Những đồng tiền xu cẩm thạch lấp lánh không tài nào xoa dịu được dòng máu bạo kích cuộn trào.","effects":{"wealth":10,"joy":-3}},{"id":"orc_teen_gladiator_scout","races":["orc"],"stages":["teen"],"weight":5,"text":"Một kẻ tuyển mộ từ Đấu Trường Huyết Sa ngỏ lời mua bạn với giá rẻ mạt, nhưng bạn hất hàm nhổ toẹt vào chân hắn. Linh hồn kiêu hãnh của bạn thuộc về chiến trường tự do, không phải chiếc lồng sắt hôi hám.","effects":{"joy":5,"wealth":-5}},{"id":"orc_teen_honor_duel","races":["orc"],"stages":["teen"],"weight":7,"text":"Một chiến binh khổng lồ lớn tuổi hơn lăng mạ danh dự gia đình bạn giữa vòng tròn lửa trại rực cháy. Bầu không khí quánh đặc lại, chờ đợi quyết định sống còn từ kẻ kế thừa định mệnh.","choices":[{"label":"Gầm lên thách đấu sinh tử","check":{"stat":"STR","target":6},"success":{"text":"Cơn điên bạo kích bùng nổ, bạn đập vỡ sọ gã khổng lồ chỉ bằng một đòn búa tạ chí mạng. Cả bộ lạc phủ phục trước sức mạnh nguyên thủy vĩ đại của bạn.","effects":{"joy":10,"flags":["honorable"]},"moment":"Giành chiến thắng lẫy lừng trong trận huyết đấu danh dự tuổi thiếu niên."},"fail":{"text":"Sức vóc non nớt không thể đọ lại sự lão luyện, bạn bị gã vặn gãy cổ giữa tiếng cười nhạo tàn nhẫn của bộ lạc.","death":"Bỏ mạng thảm khốc ở tuổi {age} vì bảo vệ danh dự trong một trận chiến không cân sức."}},{"label":"Nhẫn nhục nuốt hận","text":"Bạn cắn nát môi rớm máu, cúi đầu lùi lại trong tiếng la ó khinh miệt của đồng loại. Danh dự dũng sĩ đã mất, nhưng mạng sống vẫn còn thoi thóp đợi ngày rửa hận.","effects":{"joy":-15,"flags":["coward"]}}]},{"id":"orc_adult_vanguard","races":["orc"],"stages":["adult"],"eras":["holy_war"],"weight":6,"require":{"flags":["warborn"]},"text":"Được phong làm đội trưởng tiên phong, bạn dẫn dắt hàng trăm kỵ binh cưỡi sói càn quét Đồng Bằng Thánh Quang. Dấu ấn hủy diệt của bạn in hằn vĩnh viễn lên chương sử thi đẫm máu của nhân loại.","effects":{"STR":1,"wealth":20}},{"id":"orc_adult_smash_shield","races":["orc"],"stages":["adult"],"once":false,"weight":5,"require":{"flags":["honorable"]},"text":"Với một tiếng gầm uy phong, bạn vung búa tạ nát bấy tấm khiên phép thuật của gã Kỵ sĩ rởm đời. Sức mạnh tuyệt đối của cơ bắp vạch trần sự yếu đuối tận cùng của thứ ma pháp hèn nhát.","effects":{"joy":5,"health":-3}},{"id":"orc_adult_elf_slaughter","races":["orc"],"stages":["adult"],"weight":5,"text":"Một toán Tuần Lâm Trọng Vệ tinh linh bị bạn bẻ gãy cổ bằng tay không khi chúng phục kích trong Đại Ngàn Lục Bảo. Tuyệt đối không có sự xót thương nào trong từ điển của một chiến binh Orc vĩ đại.","effects":{"AGI":1,"health":-3}},{"id":"orc_adult_arena_fight","races":["orc"],"stages":["adult"],"once":false,"weight":5,"require":{"flags":["gladiator"]},"text":"Bạn vươn tay xé xác mãnh thú tại Đấu Trường Huyết Sa giữa tiếng hò reo điên cuồng của lũ quý tộc khát máu. Từng đồng Huyết Kim lạnh lẽo vứt xuống chân đều nhuốm màu sinh tử tàn bạo.","effects":{"wealth":15,"health":-8}},{"id":"orc_adult_reject_magic","races":["orc"],"stages":["adult"],"eras":["dark_age"],"weight":5,"text":"Sứ giả Hắc Nguyệt Hội dâng lên hắc ám ma pháp đổi lấy lòng trung thành, nhưng bạn đáp trả bằng một cú đấm nát mặt. Kẻ mang da sắt xương đồng không bao giờ cầu xin sự ban ơn từ tà thần.","effects":{"joy":5,"INT":-1,"flags":["rebel"]}},{"id":"orc_adult_festival_brawl","races":["orc"],"stages":["adult"],"eras":["peace"],"once":false,"weight":4,"text":"Lễ hội Lửa Trại biến thành bãi chiến trường đẫm máu khi bạn đập vỡ chum rượu lúa mạch lên đầu gã Orc tộc khác. Niềm vui nguyên thủy nhất trên lục địa luôn bắt đầu bằng men say và những cú đấm cuồng nộ.","effects":{"joy":10,"health":-5}},{"id":"orc_adult_blood_brotherhood","races":["orc"],"stages":["adult"],"weight":5,"text":"Bạn uống cạn máu quỷ Manticore từ một chiếc sọ người để gia nhập Huyết Hội. Khế ước hắc ám hòa vào nhịp tim, ban cho bạn sức mạnh của những kẻ cuồng chiến không biết lùi bước.","effects":{"STR":1,"health":-3,"flags":["blood_brother"]}},{"id":"orc_adult_prison_break","races":["orc"],"stages":["adult"],"eras":["peace"],"weight":6,"require":{"flags":["gladiator"]},"text":"Bạn giật tung xiềng xích, dùng tay không nghiền nát lồng ngực gã cai ngục để trốn khỏi Đấu Trường. Bầu trời tự do nhuốm màu máu đỏ đánh dấu sự hồi sinh của một ác thú xổ lồng.","effects":{"AGI":1,"joy":10,"flags":["freed"],"unflags":["gladiator"]}},{"id":"orc_adult_mate_fight","races":["orc"],"stages":["adult"],"weight":5,"text":"Sau một trận vật lộn đẫm máu gãy cả xương sườn, bạn giành được trái tim của chiến binh mạnh nhất bộ lạc. Sự kết hợp thô bạo này hứa hẹn sẽ sinh ra những mầm mống hủy diệt cho lục địa Aethelgard.","effects":{"STR":1,"joy":10,"health":-5,"flags":["partner"]}},{"id":"orc_adult_challenge_officer","races":["orc"],"stages":["adult"],"weight":7,"text":"Tên thủ lĩnh Huyết Hội ra lệnh cho bạn quỳ xuống liếm gót giày của hắn trước toàn quân. Huyết quản hoang dã sôi sục, hối thúc bạn chứng minh nguyên tắc vàng: kẻ mạnh nhất định đoạt tất cả.","choices":[{"label":"Rút rìu bổ đôi đầu hắn","check":{"stat":"STR","target":9},"success":{"text":"Lưỡi rìu xẻ dọc cơ thể kẻ ngạo mạn, máu nóng văng khắp mặt bạn. Tiếng gầm thét tàn bạo của bạn vang lên, chính thức phế truất gã thủ lĩnh để đoạt lấy quyền lực.","effects":{"STR":2,"joy":15,"flags":["rebel"]},"moment":"Tàn sát thủ lĩnh Huyết Hội để đoạt quyền chỉ huy."},"fail":{"text":"Hắn quá nhanh nhẹn, né tránh cú bổ và đâm xuyên thanh đại kiếm qua ngực bạn trong một cái chớp mắt.","death":"Chết tức tưởi ở tuổi {age} vì đánh giá sai sức mạnh của kẻ bề trên."}},{"label":"Cắn răng quỳ gối khuất phục","text":"Bạn quỳ gối trong tiếng cười man rợ của đồng loại, ghim chặt mối nhục này vào tận xương tủy. Dù bảo toàn được mạng sống, linh hồn kiêu hãnh của bạn đã bị chà đạp tàn nhẫn.","effects":{"joy":-10,"STR":-1}}]},{"id":"orc_middle_lead_tribe","races":["orc"],"stages":["middle"],"weight":6,"require":{"flags":["warchief"]},"text":"Ngồi trên ngai vàng kết từ hàng trăm xương sọ, cái nhìn sắc lạnh của bạn đủ sức khiến những chiến binh cộm cán nhất phải run rẩy. Bạn đang ở đỉnh cao quyền lực của một Tù trưởng vĩ đại.","effects":{"joy":10,"wealth":15}},{"id":"orc_middle_demon_clash","races":["orc"],"stages":["middle"],"eras":["demon_lord"],"weight":7,"text":"Một tên Ma Tộc Thượng Đẳng cười nhạo vũ khí thô sơ của bạn, để rồi bị chiếc búa tạ nghiền nát lớp sừng kiêu hãnh. Bạo kích của tộc Orc đã chứng minh sức mạnh tuyệt đối trước bóng tối vực thẳm.","effects":{"STR":1,"health":-5,"joy":5}},{"id":"orc_middle_assassination_survive","races":["orc"],"stages":["middle"],"once":false,"weight":4,"text":"Sát thủ của Hội Bóng Đêm đột nhập lều định cắt cổ bạn trong lúc ngủ. Bạn bừng tỉnh vặn gãy cổ hắn chỉ bằng một tay, biến xác gã thành bữa sáng béo bở cho bầy sói.","effects":{"health":-3,"AGI":1}},{"id":"orc_middle_siege_sanctus","races":["orc"],"stages":["middle"],"eras":["holy_war"],"weight":6,"require":{"flags":["warborn"]},"text":"Bạn vác thanh cự kiếm xông lên tuyến đầu công thành Sanctus, mặc kệ hỏa tiễn của Thánh Vệ Quân rạch nát da thịt. Tiếng gầm của bạn át cả tiếng sấm, mở đường cho quân đoàn xé toạc phòng tuyến loài người.","effects":{"STR":2,"health":-10,"wealth":20}},{"id":"orc_middle_plunder_caravan","races":["orc"],"stages":["middle"],"eras":["peace"],"once":false,"weight":5,"text":"Đoàn buôn của Thương Đoàn Sói Bạc lọt vào ổ phục kích; bạn nghiền nát vệ sĩ của chúng như những con bọ. Vàng bạc rơi lả tả trên đất nhưng với bạn, mùi máu tươi mới là chiến lợi phẩm tuyệt vời nhất.","effects":{"wealth":20,"joy":5}},{"id":"orc_middle_witch_curse","races":["orc"],"stages":["middle"],"eras":["dark_age"],"weight":5,"text":"Một mụ phù thủy từ Đầm Lầy Tử Khí buông lời nguyền rủa trước khi chết, khiến máu trong huyết quản bạn sôi lên những cơn đau bạo hành. Lời nguyền hắc ám ăn mòn sức lực của một chiến binh vĩ đại.","effects":{"health":-10,"LUCK":-2}},{"id":"orc_middle_victory_feast","races":["orc"],"stages":["middle"],"once":false,"weight":4,"text":"Bữa tiệc ăn mừng chiến thắng ngập ngụa thịt nướng khét lẹt và rượu mạch ủ trong sọ động vật. Bạn nhai chóp chép miếng đùi lợn rừng gân guốc, tận hưởng niềm vui nguyên thủy nhất của sinh giới.","effects":{"health":5,"joy":5,"wealth":-3}},{"id":"orc_middle_unify_clans","races":["orc"],"stages":["middle"],"weight":5,"require":{"flags":["warchief"]},"text":"Bằng những cuộc viễn chinh tàn bạo, bạn đè bẹp các bộ lạc hoang dã khác và ép họ tuyên thệ dưới lá cờ máu. Lần đầu tiên trên Thảo Nguyên Gió Hú, tộc Orc hợp nhất thành một cơn bão khổng lồ.","effects":{"STR":1,"joy":10,"flags":["great_khan"]}},{"id":"orc_middle_warchief_usurp","races":["orc"],"stages":["middle"],"weight":7,"require":{"notFlags":["warchief"]},"text":"Lão Tù trưởng già khụy gối ho ra máu sau một cuộc đi săn kiệt sức. Cơ hội ngàn năm có một để soán ngôi đã điểm, khơi dậy dã tâm độc tài trong lòng bạn.","choices":[{"label":"Tung đòn kết liễu hòng đoạt quyền","check":{"stat":"AGI","target":9},"success":{"text":"Lưỡi rìu chớp nhoáng của bạn phạt ngang cổ lão. Không một kẻ nào dám lên tiếng phản đối khi bạn giơ cao chiếc thủ cấp đẫm máu, chính thức lên ngôi Tù trưởng vĩ đại.","effects":{"joy":20,"flags":["warchief"]},"moment":"Soán ngôi Tù trưởng bằng một nhát rìu định mệnh."},"fail":{"text":"Dù già yếu, kinh nghiệm sinh tử của lão vẫn thừa sức đỡ được đòn lén lút và vung búa đập nát đầu bạn ngay tắp lự.","death":"Bỏ mạng ở tuổi {age} vì âm mưu phản nghịch bất thành."}},{"label":"Đỡ lão dậy, sắm vai trung thần","text":"Bạn nuốt dã tâm vào trong, đỡ lão đứng lên và thề bồi lòng trung thành mù quáng. Dù an toàn, sự hèn nhát giả tạo này khiến tâm can bạn day dứt sự nhục nhã khôn cùng.","effects":{"joy":-8,"flags":["coward"]}}]},{"id":"orc_elder_reject_deposition","races":["orc"],"stages":["elder"],"weight":6,"require":{"flags":["warchief"]},"text":"Lũ chiến binh trẻ tuổi tụ tập đòi phế truất bạn khỏi ngai vị vì tuổi tác già nua. Chỉ bằng một tiếng gầm phẫn nộ và cái vung rìu cắt đôi tên cầm đầu, bạn khẳng định quyền lực của chúa sơn lâm.","effects":{"STR":1,"joy":5}},{"id":"orc_elder_broken_tusks","races":["orc"],"stages":["elder"],"once":false,"weight":5,"text":"Gặm một khúc xương thú cứng tảng, chiếc nanh kiêu hãnh của bạn bất ngờ gãy gập làm đôi. Dấu hiệu nghiệt ngã của tuổi già đang gặm nhấm thứ cơ bắp từng làm nên huyền thoại.","effects":{"health":-5,"joy":-5}},{"id":"orc_elder_mentor","races":["orc"],"stages":["elder"],"weight":5,"text":"Bạn ngồi bên đống lửa trại, quăng một thanh kiếm hoen gỉ cho đám Orc non nớt để chúng tự cắn xé nhau. Việc truyền lại di sản đẫm máu cho thế hệ sau là niềm an ủi cuối cùng của tuổi xế chiều.","effects":{"INT":1,"joy":5}},{"id":"orc_elder_demon_recruiter","races":["orc"],"stages":["elder"],"eras":["demon_lord"],"weight":5,"text":"Quân Đoàn Hủy Diệt ngỏ ý ban cho bạn tuổi trẻ vĩnh cửu nếu chịu thần phục Ma Vương. Bạn nhổ toẹt ngụm máu vào mặt tên sứ giả, giữ vững danh dự của một chiến binh từ chối việc bẻ cong đầu gối.","effects":{"joy":5,"health":-3,"flags":["honorable"]}},{"id":"orc_elder_plague_survivor","races":["orc"],"stages":["elder"],"eras":["dark_age"],"weight":6,"text":"Dịch bệnh thối rữa càn quét qua lều trại, cướp đi sinh mạng của vô số tráng sĩ trẻ. Bằng sức sống da sắt xương đồng ngoan cường, tấm thân già cỗi của bạn vẫn lầm lỳ từ chối vòng tay tử thần.","effects":{"health":-10,"STR":-1,"LUCK":1}},{"id":"orc_elder_final_march","races":["orc"],"stages":["elder"],"weight":6,"text":"Cảm nhận được ngọn lửa sinh mệnh sắp tàn, bạn khoác lên mình bộ giáp nứt nẻ và một mình bước vào trận bão tuyết. Bạn ra đi tìm kiếm một cái chết vinh quang giữa chiến trường, đúng với bản ngã loài Orc.","effects":{"joy":10,"health":-10}},{"id":"orc_elder_last_stand","races":["orc"],"stages":["elder"],"weight":7,"text":"Hàng vạn kỵ binh Thánh Vệ Quân bao vây bạn trên đỉnh Đảo Tro Tàn rực lửa. Không còn đường lui, định mệnh vĩ đại trao cho bạn cơ hội để dệt nên tráng ca đẫm máu cuối cùng trong đời.","choices":[{"label":"Kích hoạt Cơn điên bạo kích, tử chiến đến cùng","check":{"stat":"STR","target":10},"success":{"text":"Gạt đi gánh nặng tuổi tác, bạn nghiền nát hàng trăm hiệp sĩ, đứng sừng sững trên núi xác chết như một vị hung thần bất diệt.","effects":{"joy":25,"flags":["legendary_orc"]},"moment":"Chạm tới vinh quang tột đỉnh trong trận tử chiến cuối cùng."},"fail":{"text":"Xương cốt rệu rã không thể theo kịp ý chí. Vô số mũi giáo xuyên thủng cơ thể, kết liễu bạn khi tiếng gầm chưa kịp thoát khỏi cuống họng.","death":"Gục ngã hiên ngang ở tuổi {age} dưới cơn mưa giáo mác của loài người."}},{"label":"Bỏ chạy nhục nhã qua khe núi hẹp","text":"Bạn vứt bỏ vũ khí, lê tấm thân già nua luồn lách qua các khe đá để trốn chạy tử thần. Bạn giữ được mạng sống thoi thóp, nhưng vĩnh viễn mang danh kẻ hèn nhát bị lưu đày.","effects":{"joy":-20,"flags":["exiled","coward"]}}]},{"id":"s_eye","races":["slime"],"stages":["infant"],"weight":10,"text":"Giữa khối nhầy vô tri, một con mắt mờ đục chậm rãi hình thành. Hình ảnh đầu tiên bạn thấy về thế giới là tám chiếc chân lông lá của một con nhện hang.","effects":{"INT":1}},{"id":"s_footsteps","races":["slime"],"stages":["infant"],"weight":8,"text":"Mặt đất rung lên dưới những bước chân khổng lồ. Bạn rút mình vào khe đá, học bài học đầu tiên của kẻ đứng cuối chuỗi thức ăn: ẩn mình là sống.","effects":{"AGI":1}},{"id":"s_lab_notes","races":["slime"],"stages":["infant","child"],"weight":12,"require":{"flags":["magic_slime"]},"text":"Những mảnh ma lực hỗn loạn từ bình thí nghiệm vỡ vẫn vương trong cơ thể bạn. Thỉnh thoảng, bạn chợt hiểu những điều mà một khối nhầy lẽ ra không thể hiểu.","effects":{"INT":1}},{"id":"s_moss","races":["slime"],"stages":["child","teen","adult"],"once":false,"weight":3,"text":"Bạn trườn qua thảm rêu ẩm và hấp thụ từng sợi xanh mướt. Khối thân thể nhỏ bé lớn thêm một chút, và cơn đói tạm lắng xuống.","effects":{"health":6}},{"id":"s_rat_bones","races":["slime"],"stages":["child"],"weight":7,"text":"Bạn nuốt trọn bộ xương của một con chuột hầm ngục. Lần đầu tiên, cơ thể lỏng lẻo của bạn có được thứ gì đó giống như một bộ khung.","effects":{"STR":1}},{"id":"s_ms_capture","races":["slime"],"stages":["child","teen"],"weight":10,"text":"Một bàn tay đeo găng da tóm gọn lấy bạn. Gã Mạo hiểm giả nhìn bạn với nụ cười của kẻ vừa tìm được món hời.","choices":[{"label":"Giả chết","check":{"stat":"LUCK","target":5},"success":{"text":"Bạn tan thành một vũng nước vô hồn. Gã chửi thề, chùi tay vào áo rồi bỏ đi.","effects":{"joy":5}},"fail":{"text":"Gã không bị lừa. Hắn bóp mạnh cho đến khi bạn vỡ ra một nửa.","effects":{"health":-30}}},{"label":"Phun axit rồi trốn","check":{"stat":"AGI","target":5},"success":{"text":"Dòng axit bắn thẳng vào mắt gã. Trong tiếng gào thét, bạn trườn qua khe đá và biến mất.","effects":{"AGI":1},"moment":"Thoát khỏi tay Mạo hiểm giả"},"fail":{"text":"Axit chỉ làm cháy xém đôi găng. Gã ném bạn vào tường đá.","effects":{"health":-25}}},{"label":"Chịu làm sủng vật","text":"Bạn bị nhốt vào một chiếc bình thủy tinh. Mất đi tự do, nhưng mỗi ngày đều có thức ăn rơi xuống từ trên cao.","effects":{"health":15,"joy":-10,"flags":["tamed_pet"]},"moment":"Trở thành sủng vật trong bình"}]},{"id":"s_split","races":["slime"],"stages":["teen"],"weight":9,"text":"Cơ thể bạn rung lên dữ dội. Bản năng nguyên thủy thì thầm rằng bạn có thể tách làm đôi.","choices":[{"label":"Phân bào","text":"Bạn tách làm hai. Một nửa của bạn trôi đi về phía bóng tối và không bao giờ quay lại.","effects":{"health":-15,"joy":5,"flags":["split"]},"moment":"Phân bào lần đầu"},{"label":"Kìm lại","text":"Bạn giữ mình nguyên vẹn, và khối thân thể đặc quánh thêm một phần.","effects":{"STR":1}}]},{"id":"s_ms_elemental","races":["slime"],"stages":["teen","adult"],"weight":10,"text":"Bạn vô tình nuốt phải một Tinh thể Nguyên tố nằm lăn lóc giữa đống đổ nát. Nó bỏng rát, và nó đang đòi hỏi bạn phải chọn.","choices":[{"label":"Hấp thụ Lõi Lửa","text":"Ngọn lửa hòa vào thân thể bạn, nhuộm nó thành sắc đỏ cam rực cháy. Bạn đã trở thành Slime Lửa.","effects":{"STR":2,"INT":1,"flags":["fire_slime"]},"moment":"Tiến hóa thành Slime Lửa"},{"label":"Hấp thụ Bọc Độc","text":"Độc tố len lỏi vào từng giọt nhầy. Mọi thứ bạn chạm vào đều bắt đầu thối rữa: bạn là Slime Độc.","effects":{"STR":1,"AGI":1,"flags":["poison_slime"]},"moment":"Tiến hóa thành Slime Độc"},{"label":"Nhả ra","text":"Bạn nhổ tinh thể ra trong đau đớn. Dù không tiến hóa, cơ thể bạn trở nên dẻo dai hơn bao giờ hết.","effects":{"health":20}}]},{"id":"s_rookie","races":["slime"],"stages":["teen","adult"],"once":false,"weight":3,"text":"Một Mạo hiểm giả tập sự vung kiếm chém vào bạn. Lưỡi kiếm xuyên qua cơ thể lỏng của bạn như xuyên qua nước.","effects":{"AGI":1,"health":-3}},{"id":"s_speech","races":["slime"],"stages":["adult"],"weight":8,"require":{"INT":5},"text":"Bạn học được cách rung cơ thể thành âm thanh. Lời đầu tiên bạn nói ra thế gian là \"đói\".","effects":{"INT":2,"flags":["speech"]},"moment":"Cất lời đầu tiên"},{"id":"s_named","races":["slime"],"stages":["adult"],"weight":10,"require":{"flags":["speech"]},"text":"Một cô bé lạc đường gặp bạn trong rừng sâu và gọi bạn là {name}. Bạn dẫn cô bé về tới bìa rừng, và giữ cái tên ấy mãi mãi.","effects":{"joy":15},"moment":"Được một cô bé đặt tên"},{"id":"s_ms_core","races":["slime"],"stages":["adult","middle"],"weight":9,"text":"Một gã thợ săn quái vật đã nhận ra lõi ma lực ẩn sâu trong cơ thể bạn. Mũi giáo của hắn nhắm thẳng vào nó.","choices":[{"label":"Tạo vỏ đá","text":"Bạn hút đất đá vào người, bao bọc lõi bằng một lớp vỏ cứng. Mũi giáo gãy đôi.","effects":{"STR":2,"AGI":-1,"flags":["stone_shell"]}},{"label":"Tách thành giọt nhỏ","text":"Bạn vỡ thành hàng chục giọt nhầy và chạy tán loạn. Phải rất lâu sau bạn mới gom lại được mình.","effects":{"health":-20,"AGI":1}},{"label":"Bóp nghẹt hắn","check":{"stat":"STR","target":6},"success":{"text":"Bạn quăng mình lên mặt hắn và siết chặt. Khi mọi thứ lặng yên, bạn tiêu hóa luôn cả bộ giáp của hắn.","effects":{"STR":2,"health":15},"moment":"Nuốt chửng một thợ săn quái vật"},"fail":{"text":"Mũi giáo xuyên qua người bạn, sượt qua lõi chỉ trong gang tấc.","effects":{"health":-35}}}]},{"id":"s_ms_mimic","races":["slime"],"stages":["adult","middle"],"weight":7,"text":"Giữa căn phòng bỏ hoang của hầm ngục, một chiếc rương báu nằm mở nắp, trống rỗng và mời gọi.","choices":[{"label":"Chui vào rương","text":"Bạn trườn vào và hòa làm một với lớp gỗ mục. Kẻ tham lam tiếp theo mở nắp sẽ không bao giờ ra ngoài nữa: bạn đã thành Mimic.","effects":{"wealth":15,"STR":1,"flags":["mimic"]},"moment":"Tiến hóa thành Mimic"},{"label":"Hòa tan chiếc rương","text":"Bạn nuốt trọn gỗ và sắt. Một bữa ăn thịnh soạn hiếm hoi.","effects":{"health":10,"STR":1}},{"label":"Trườn đi","text":"Bạn bỏ qua chiếc rương và tiếp tục hành trình vô tận trong bóng tối.","effects":{}}]},{"id":"s_mini_boss","races":["slime"],"stages":["middle"],"weight":8,"text":"Khối thân thể của bạn giờ lấp kín cả một gian phòng. Các Mạo hiểm giả bắt đầu gọi tầng ngục này bằng tên của bạn.","effects":{"STR":2,"joy":5},"moment":"Trở thành Mini-Boss của hầm ngục"},{"id":"s_king","races":["slime"],"stages":["ancient"],"weight":10,"text":"Bạn đã sống lâu hơn cả những vương triều trên mặt đất. Trong các truyền thuyết, người ta bắt đầu gọi bạn là Vua Bùn Nhão.","effects":{"joy":10,"flags":["slime_king"]},"moment":"Được gọi là Vua Bùn Nhão"},{"id":"s_lake","races":["slime"],"stages":["ancient"],"once":false,"weight":3,"text":"Bạn nằm yên dưới đáy một hồ ngầm suốt nhiều thập kỷ. Những đàn cá mù lặng lẽ bơi xuyên qua cơ thể bạn.","effects":{"joy":3,"health":5}},{"id":"slime_infant_bug","races":["slime"],"stages":["infant"],"weight":6,"text":"Bản năng nguyên thủy mách bảo bạn phủ lên xác một con nhện héo hon, dịch vị axit chậm rãi hòa tan lớp vỏ ngoài cứng nhắc. Hương vị đầu tiên của sinh mệnh thật tanh tưởi nhưng tràn trề sức sống mãnh liệt.","effects":{"STR":1,"health":5}},{"id":"slime_infant_sun","races":["slime"],"stages":["infant"],"eras":["dark_age"],"once":false,"weight":4,"text":"Bầu trời u ám che khuất vầng thái dương thiêu đốt, cho phép khối thân thể yếu ớt của bạn thong thả trườn bò trên nền đất lạnh. Định mệnh bao dung ban cho bạn bóng tối để ấp ủ mầm mống tai ương.","effects":{"joy":5,"health":2}},{"id":"slime_infant_puddle","races":["slime"],"stages":["infant"],"once":false,"weight":5,"text":"Bạn ngâm mình trong một vũng nước đọng dưới hầm ngục, vô thức hấp thụ độ ẩm để mở rộng khối lượng một cách chậm chạp. Sự lớn lên thầm lặng này chính là bước đệm cho những tham vọng nuốt chửng cả thế gian.","effects":{"health":5,"STR":1}},{"id":"slime_child_trap","races":["slime"],"stages":["child"],"weight":6,"text":"Một lưỡi dao sắc lẹm từ bẫy sập xẻ dọc cơ thể bạn làm đôi, nhưng chỉ chốc lát sau hai nửa nhầy nhụa lại ngoan ngoãn quyện vào nhau. Không một gông cùm hay cạm bẫy trần tục nào có thể chia cắt sự vĩnh hằng của bạn.","effects":{"AGI":1,"joy":2}},{"id":"slime_child_rust","races":["slime"],"stages":["child"],"weight":7,"text":"Dịch vị của bạn hòa tan một thanh đoản kiếm rỉ sét bám đầy oán khí, phần mạt sắt hòa quyện tạo nên lớp vảy cứng cáp bên ngoài màng nhầy. Bạn đã khoác lên mình lớp giáp đầu tiên để nghênh đón bão táp trên lục địa.","effects":{"STR":2,"health":10,"flags":["stone_shell"]}},{"id":"slime_child_skull","races":["slime"],"stages":["child"],"eras":["holy_war"],"weight":5,"text":"Tiếng hành quân rúng động của Thánh Vệ Quân buộc bạn phải vội vã chui rúc vào một hộp sọ cháy đen để ẩn náu. Sự phẫn nộ vô hình nhen nhóm trong hạt nhân của bạn trước sức mạnh áp đảo của thế lực Ánh Sáng.","effects":{"LUCK":1,"joy":-5}},{"id":"slime_child_rat","races":["slime"],"stages":["child"],"once":false,"weight":5,"text":"Một con chuột hầm ngục đói khát cắn xé mảng thân thể của bạn, ép bạn phải vất vả luồn lách qua những khe nứt hẹp để trốn thoát. Sự yếu ớt hiện tại chỉ là phép thử khắc nghiệt của vận mệnh.","effects":{"health":-5,"AGI":1}},{"id":"slime_child_shroom","races":["slime"],"stages":["child"],"weight":6,"require":{"below":{"INT":5}},"text":"Bạn nuốt chửng những cây nấm phát quang ma thuật, cảm nhận các hạt tinh thể mana hòa tan vào cốt lõi vô tri của mình. Linh hồn bạn như bừng tỉnh, lần đầu tiên đón nhận tia sáng tri thức mờ ảo của Aethelgard.","effects":{"INT":2,"flags":["magic_slime"]}},{"id":"slime_child_kick","races":["slime"],"stages":["child"],"eras":["holy_war"],"weight":5,"require":{"notFlags":["stone_shell"]},"text":"Chiếc ủng bọc thép của một kỵ sĩ vội vã hất văng bạn vào bức tường đá, khiến hình hài dẻo quẹo bẹp dúm không thương tiếc. Nỗi đau đớn vô hình khắc sâu vào bản năng sinh tồn hèn mọn của một sinh vật bị ruồng bỏ.","effects":{"health":-10,"joy":-10}},{"id":"slime_teen_bat","races":["slime"],"stages":["teen"],"weight":6,"text":"Bóng đen xẹt qua, bạn kịp vươn màng nhầy dính chặt lấy một con dơi mù, thong thả dùng axit hấp thụ sinh lực của nó. Khả năng săn mồi của bạn đã vươn lên một tầm cao mới giữa bóng tối vĩnh hằng.","effects":{"AGI":2,"health":8}},{"id":"slime_teen_poison","races":["slime"],"stages":["teen"],"eras":["dark_age"],"weight":8,"require":{"flags":["blood_slime"]},"text":"Không khí ô nhiễm và chướng khí nồng nặc đã biến đổi dịch vị của bạn thành một thứ kịch độc sủi bọt tím lịm. Bạn giờ đây không chỉ là kẻ nhặt rác hèn mọn, mà đã trở thành mầm mống tử thần gieo rắc tai ương.","effects":{"STR":3,"flags":["poison_slime"]},"moment":"Tiến hóa thành Slime Độc"},{"id":"slime_teen_coin","races":["slime"],"stages":["teen"],"eras":["peace"],"once":false,"weight":4,"text":"Một đồng Cẩm Thạch lấp lánh rơi rớt từ túi thương nhân vô tình bị bạn cuốn vào trong cơ thể trong suốt. Mặc dù vô giá trị với quái vật, nó lại khiến lõi của bạn óng ánh một vệt sáng kỳ lạ lôi cuốn.","effects":{"wealth":5,"LUCK":1}},{"id":"slime_teen_demon_army","races":["slime"],"stages":["teen"],"eras":["demon_lord"],"weight":7,"text":"Tiếng tù và bằng xương vang vọng, ma khí từ Quân Đoàn Hủy Diệt thôi thúc bản năng tăm tối của bạn nhập bọn cùng bầy quái vật. Dù chỉ là tấm bia đỡ đạn xàng xĩnh, bạn vẫn khao khát được chìm trong huyết nhục kẻ thù.","effects":{"STR":2,"joy":5}},{"id":"slime_teen_cannibal","races":["slime"],"stages":["teen"],"weight":6,"require":{"flags":["magic_slime"]},"text":"Bản năng tàn bạo trỗi dậy, bạn trườn tới bọc lấy và nuốt chửng một con Slime đồng loại đang run rẩy. Khối lượng và ma lực của nó dung hợp hoàn hảo với bạn, khẳng định quy luật cá lớn nuốt cá bé tàn nhẫn.","effects":{"health":15,"INT":1}},{"id":"slime_teen_alchemist","races":["slime"],"stages":["teen"],"weight":9,"text":"Một gã pháp sư kiêu ngạo từ Tháp Ngà Ma Pháp đã giam bạn vào lồng kính, chuẩn bị chiết xuất lõi để làm thuốc nổ. Vòng xoáy sinh tử đặt bạn trước quyết định dốc sức chống cự hay ẩn nhẫn chờ thời.","choices":[{"label":"Tích tụ ma lực phá vỡ kính","check":{"stat":"INT","target":6},"success":{"text":"Bạn tập trung cường hóa hạt nhân, tung ra một vụ nổ nhỏ phá nát lồng kính và tẩu thoát giữa làn khói mù mịt. Một quyền năng vô danh đang dần nảy mầm trong cơ thể nhầy nhụa của bạn.","effects":{"INT":2,"LUCK":1},"moment":"Trốn thoát ngoạn mục khỏi Pháp sư Tháp Ngà"},"fail":{"text":"Sức ép ma lực thảm hại, lồng kính không mảy may sứt mẻ. Lưỡi dao mổ lạnh lẽo của pháp sư xuyên thẳng qua lõi, kết thúc kiếp sống bọt bèo của một quái vật vô danh.","death":"Bị chiết xuất lõi ma lực trên bàn thí nghiệm ở tuổi {age}."}},{"label":"Tự phân rã giả chết","text":"Bạn chủ động làm lỏng cơ thể, biến thành một vũng nước đục ngầu vô hồn dưới đáy lồng kính. Gã pháp sư bực dọc đổ bạn ra cống ngầm, vô tình thả một hiểm họa khôn lường về lại màn đêm.","effects":{"health":-10,"AGI":2}}]},{"id":"slime_adult_cleaner","races":["slime"],"stages":["adult"],"eras":["peace"],"once":false,"weight":5,"text":"Bạn trôi dạt dưới đáy hầm ngục, lẳng lặng tiêu hóa vô số xác quái vật và rác rưởi do các Mạo hiểm giả để lại. Một công việc nhơ nhuốc nhưng lại vun đắp cho sự tồn tại vĩnh cửu của loài tà vật vô danh.","effects":{"health":15,"wealth":5}},{"id":"slime_adult_acid_lake","races":["slime"],"stages":["adult"],"weight":6,"require":{"flags":["poison_slime"]},"text":"Dịch vị kịch độc của bạn ăn mòn cả một mảng đá tảng, tạo thành một vũng lầy sủi bọt tử khí. Kẻ thù trần tục giờ đây chỉ cần bước sai một nhịp cũng đủ tan xương nát thịt dưới cái ôm nhầy nhụa.","effects":{"STR":2,"joy":5}},{"id":"slime_adult_torch","races":["slime"],"stages":["adult"],"eras":["holy_war"],"weight":7,"text":"Một toán Thánh Vệ Quân vung đuốc lửa hòng thiêu rụi bạn, nhưng lớp màng nhầy dẻo dai giờ đã ngậm đủ nước để xì xèo dập tắt đi ngọn lửa nhỏ nhoi. Định mệnh chứng minh rằng ánh sáng tàn lụi dẫu cố rực rỡ đến mấy cũng hóa vô vọng.","effects":{"health":-5,"STR":1}},{"id":"slime_adult_defense","races":["slime"],"stages":["adult"],"weight":6,"require":{"flags":["stone_shell"]},"text":"Các mạt sắt và khoáng thạch hấp thụ bao năm kết tủa thành một lớp vỏ bọc kiên cố quanh lõi của bạn. Lưỡi gươm thép của lũ thợ săn chém vào chỉ kịp tóe lửa trước khi gãy vụn trong sự tuyệt vọng tột cùng.","effects":{"STR":2,"AGI":-1}},{"id":"slime_adult_drown","races":["slime"],"stages":["adult"],"once":false,"weight":5,"text":"Cơ thể đồ sộ của bạn ập xuống, bao trùm và nhấn chìm một tên lục lọi mộ phần xấu số. Tiếng la hét nghẹn ngào chìm vào tĩnh lặng, dâng hiến sinh lực tươi mới cho sự trưởng thành bất tận của bạn.","effects":{"STR":1,"health":15}},{"id":"slime_adult_knight","races":["slime"],"stages":["adult"],"weight":8,"text":"Một Hiệp sĩ bạc của Bình Minh Hội gầm lên dữ dội, vung thanh đại kiếm rực sáng ma pháp ánh sáng nhằm chẻ đôi cốt lõi của bạn. Uy áp từ thứ sức mạnh thiêng liêng rọi thẳng vào cội nguồn tà ác.","choices":[{"label":"Luồn lách phản công","check":{"stat":"AGI","target":7},"success":{"text":"Bạn hóa lỏng tức thời, trượt qua khe hở của bộ giáp và đổ lượng lớn axit thẳng vào bên trong. Lưỡi kiếm sáng lòa rớt xuống nhường chỗ cho những tiếng thét xé lòng.","effects":{"STR":2,"wealth":20},"moment":"Phục kích tan chảy Hiệp sĩ bạc Bình Minh Hội"},"fail":{"text":"Thân xác nặng nề khiến bạn không kịp né tránh, thanh đại kiếm mang sức mạnh Thánh Quang chẻ đôi cơ thể và nghiền nát hạt nhân. Ánh sáng chói lòa đã gột rửa sự tồn tại dơ bẩn này.","death":"Bị Hiệp sĩ bạc thanh tẩy hạt nhân ở tuổi {age}."}},{"label":"Gồng mình đỡ đòn","check":{"stat":"STR","target":8},"success":{"text":"Lớp vỏ nhầy vỡ nát nhưng đã kịp kẹp chặt lấy thanh đại kiếm, giật phăng nó khỏi tay kẻ thù. Kẻ đi săn kiêu hãnh cuối cùng lại trở thành con mồi tay không tấc sắt run rẩy trước cái chết.","effects":{"STR":3,"health":-10},"moment":"Tước đoạt đại kiếm của Hiệp sĩ ánh sáng"},"fail":{"text":"Sức lực của quái vật tầm trung không thể chống lại phép thuật thiêng liêng, lưỡi kiếm nghiền nát lõi ma lực của bạn thành cát bụi.","death":"Bị thanh tẩy hạt nhân ở tuổi {age}."}},{"label":"Tách nhỏ bỏ chạy","text":"Bạn lập tức phân tán thành hàng chục khối nhầy nhỏ xíu tản mác vào các khe đá tối tăm. Giữ lấy mạng sống mọn mèn luôn là bài học vỡ lòng của sinh vật bọt bèo.","effects":{"health":-15,"joy":-5}}]},{"id":"slime_middle_miniboss","races":["slime"],"stages":["middle"],"eras":["demon_lord"],"weight":7,"text":"Khối lượng của bạn giờ đây đã lấp kín cả một hành lang ngầm tại Dãy Núi Răng Cưa, buộc Quân Đoàn Hủy Diệt phải nể nang. Bạn đã vươn mình từ một sinh vật hèn kém thành chúa tể vô danh của một phương bóng tối.","effects":{"INT":2,"joy":10,"flags":["slime_miniboss"]}},{"id":"slime_middle_split","races":["slime"],"stages":["middle"],"weight":6,"require":{"flags":["slime_miniboss"]},"text":"Theo bản năng, bạn rùng mình rũ bỏ hàng vạn mảnh nhầy, tạo ra một đợt bùng phát Slime càn quét khắp các tầng hầm ngục. Dù không có liên kết huyết thống, sự tồn tại tràn lan này chính là quyền uy tuyệt đối của bạn.","effects":{"health":-20,"LUCK":2,"flags":["split"]}},{"id":"slime_middle_mimic_puddle","races":["slime"],"stages":["middle"],"once":false,"weight":5,"text":"Bạn nới lỏng toàn bộ cơ thể, trải dài tĩnh lặng như một mặt hồ ngầm thanh khiết để giăng bẫy những kẻ khát nước. Định mệnh ưu ái những ác thú biết giấu nanh vuốt dưới vẻ ngoài bình yên nhất.","effects":{"AGI":1,"health":10}},{"id":"slime_middle_chest","races":["slime"],"stages":["middle"],"weight":6,"require":{"flags":["magic_slime"]},"text":"Không màng tới chìa khóa, bạn trực tiếp nuốt trọn một rương báu bằng đồng hòng tiêu hóa kho báu bên trong. Những đồng Huyết Kim lạnh lẽo va đập rộn rã trong cốt lõi như một bản nhạc tà ác ngợi ca sự tham lam.","effects":{"wealth":30,"STR":1}},{"id":"slime_middle_goblin","races":["slime"],"stages":["middle"],"weight":5,"text":"Một bầy Goblin xui xẻo đi lạc vào lãnh địa của bạn và lập tức bị bức tường nhầy nhụa xanh thẫm ập xuống ồ ạt. Tiếng xương vỡ vụn hòa cùng tiếng gào khóc biến thành món tráng miệng ngọt ngào cho sự phàm ăn bất tận.","effects":{"health":25,"STR":2}},{"id":"slime_middle_adventurers","races":["slime"],"stages":["middle"],"weight":9,"text":"Một tổ đội Mạo hiểm giả cấp cao phá vỡ phòng tuyến hầm ngục, gã pháp sư của họ giương gậy phép chuẩn bị thi triển Bão Lửa diện rộng. Sinh mạng ngót nghét mấy trăm năm của bạn đứng trước ngã rẽ sinh tử rực hồng.","choices":[{"label":"Hấp thụ ma lực lửa","check":{"stat":"INT","target":9},"success":{"text":"Bạn liều lĩnh mở toang lõi, nuốt trọn cơn bão lửa đang cuộn trào và chuyển hóa nó thành năng lượng tàn phá
