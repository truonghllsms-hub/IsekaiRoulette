],"hazard":0.015,"mult":{"STR":0.6,"INT":1.1,"AGI":1.4,"LUCK":1},"tags":["monster","humanoid"],"stages":[{"id":"infant","name":"Quỷ đỏ nhí","start":0},{"id":"child","name":"Tiểu yêu chọc phá","start":5},{"id":"teen","name":"Tay sai khế ước","start":10},{"id":"adult","name":"Quỷ đưa tin","start":18},{"id":"middle","name":"Tiểu quỷ xảo quyệt","start":25},{"id":"elder","name":"Lão quỷ trụi cánh","start":33}],"desc":"Sinh vật nhỏ bé có làn da đỏ hoặc xám, sở hữu đôi cánh dơi, sừng ngắn và chiếc đuôi nhọn hoắt. Imp không có sức mạnh vật lý nổi trội, nhưng nổi tiếng với trí tuệ ranh ma, thích chơi khăm và khả năng luồn lách để sinh tồn giữa những kẻ mạnh hơn."},{"id":"orc","name":"Chằn tinh","weight":2,"lifespan":[40,45],"hazard":0.012,"mult":{"STR":1.5,"INT":0.6,"AGI":0.9,"LUCK":0.9},"tags":["monster","humanoid"],"stages":[{"id":"infant","name":"Orc non nớt","start":0},{"id":"child","name":"Tân binh bộ lạc","start":4},{"id":"teen","name":"Chiến binh máu nóng","start":10},{"id":"adult","name":"Huyết Kỵ Sĩ","start":16},{"id":"middle","name":"Tướng lĩnh chiến trường","start":26},{"id":"elder","name":"Tù trưởng già cỗi","start":36}],"desc":"Thân hình to lớn vượt trội so với con người, cơ bắp cuồn cuộn với làn da xanh thẫm, xám hoặc đỏ rực cùng cặp nanh lòi ra đầy đe dọa. Orc bạo lực, cục cằn nhưng lại rất thẳng thắn. Chúng cực kỳ trọng danh dự chiến binh, tuyệt đối khinh bỉ pháp thuật, những trò đánh lén và sự hèn nhát."},{"id":"minotaur","name":"Ngưu đầu nhân","weight":1.5,"lifespan":[60,70],"hazard":0.006,"mult":{"STR":1.7,"INT":0.6,"AGI":0.8,"LUCK":0.9},"tags":["monster","humanoid"],"stages":[{"id":"infant","name":"Bê con cuồng nộ","start":0},{"id":"child","name":"Kẻ lạc lối","start":7},{"id":"teen","name":"Đấu sĩ sừng nhọn","start":14},{"id":"adult","name":"Ác thú gác cổng","start":23},{"id":"middle","name":"Bạo chúa Mê cung","start":35},{"id":"elder","name":"Lão ngưu mù lòa","start":53}],"desc":"Quái vật có cơ thể vạm vỡ của một đấu sĩ khổng lồ và chiếc đầu của một con bò tót hung tợn. Chúng đi bằng hai chân, cao gấp đôi con người, mang cặp sừng sắc lẹm và hơi thở sực mùi máu thịt. Dù có sức mạnh thể chất áp đảo, Minotaur lại có nhược điểm chí mạng là sự mù màu và trí tuệ có phần hạn chế khi lên cơn cuồng nộ."},{"id":"troll","name":"Khổng lồ ngốc","weight":0.8,"lifespan":[60,80],"hazard":0.005,"mult":{"STR":1.8,"INT":0.4,"AGI":0.6,"LUCK":1},"tags":["monster","humanoid"],"stages":[{"id":"infant","name":"Bục thịt nhão","start":0},{"id":"child","name":"Troll nhí ném đá","start":8},{"id":"teen","name":"Kẻ đòi nợ cầu đường","start":16},{"id":"adult","name":"Tai họa rừng sâu","start":26},{"id":"middle","name":"Troll đá tảng","start":40},{"id":"elder","name":"Hóa thạch","start":60}],"desc":"Sinh vật hình người khổng lồ, cao 3-4 mét, hôi hám, da sần sùi bám đầy rêu hoặc nấm mốc. Trí tuệ của Troll chỉ ngang một đứa trẻ chập chững, thích làm theo bản năng: ăn mọi thứ chuyển động, đánh rắm, ngủ ngáy to. Nỗi kinh hoàng của chúng đến từ khả năng hồi phục sinh học gần như bất tử nếu không bị đốt cháy."},{"id":"ghoul","name":"Ngạ quỷ","weight":0.5,"lifespan":null,"hazard":0.002,"lastStep":100,"genderless":true,"mult":{"STR":1.2,"INT":0.6,"AGI":1,"LUCK":0.7},"tags":["monster","humanoid","undead","immortal"],"stages":[{"id":"infant","name":"Xác chết thức tỉnh","start":0},{"id":"child","name":"Ác quỷ thèm thịt","start":11},{"id":"teen","name":"Thợ săn đêm","start":51},{"id":"adult","name":"Tai ương nghĩa trang","start":151},{"id":"middle","name":"Ghoul chúa","start":301},{"id":"elder","name":"Khô cốt diệt vong","start":1000}],"desc":"Xác chết được hồi sinh bằng tà thuật tăm tối, hoàn toàn vô tri. Dù tay chân rữa nát và bốc mùi, Ghoul lại sở hữu móng vuốt sắc lẹm mang đầy mầm bệnh hoại tử. Chúng di chuyển thoăn thoắt vào ban đêm và là cơn ác mộng của những lữ khách đi lạc."},{"id":"dragon","name":"Rồng","weight":0.5,"lifespan":[15000,30000],"hazard":0.00004,"mult":{"STR":2,"INT":1.6,"AGI":1.1,"LUCK":0.7},"tags":["monster","legend"],"stages":[{"id":"infant","name":"Trứng rồng","start":0},{"id":"child","name":"Ấu long","start":100},{"id":"teen","name":"Phi long","start":500},{"id":"adult","name":"Cự long","start":2000},{"id":"middle","name":"Cổ long","start":5000},{"id":"elder","name":"Thủy tổ long","start":9000}],"desc":"Thực thể khổng lồ mang sức mạnh của các nguyên tố nguyên thủy, có thể dài đến hàng trăm mét và sải cánh che khuất cả mặt trời. Rồng mang trong mình sự kiêu ngạo tột đỉnh, lớp vảy của chúng miễn nhiễm với hầu hết phép thuật, và hơi thở có sức mạnh xóa sổ cả một quốc gia trong nháy mắt."},{"id":"high_demon","name":"Ma tộc thượng đẳng","weight":0.2,"lifespan":[20000,50000],"hazard":0.00003,"mult":{"STR":1.8,"INT":1.8,"AGI":1.4,"LUCK":0.6},"tags":["monster","humanoid","legend"],"stages":[{"id":"infant","name":"Hạt giống tai ương","start":0},{"id":"child","name":"Ma tướng trẻ tuổi","start":500},{"id":"teen","name":"Kẻ chinh phạt","start":2000},{"id":"adult","name":"Bạo chúa Vực thẳm","start":5000},{"id":"middle","name":"Ma Vương","start":7000},{"id":"elder","name":"Thực thể tà ác","start":9000}],"desc":"Dòng dõi quý tộc bậc nhất của Ma giới, sở hữu vẻ ngoài toát lên sự áp đảo. Chúng có thể mang hình dáng một ác quỷ khổng lồ đáng sợ, hoặc một nam/nữ nhân tuyệt mỹ với cặp sừng oai vệ. Lời nói của chúng là luật lệ, cái nhìn của chúng mang theo sự tuyệt vọng."}],"eras":[{"id":"peace","name":"Thời Bình","weight":40,"hazard":0.8,"perTurn":{"joy":1},"text":"Lục địa Aethelgard đang trong Thời Bình. Thương lộ rộn ràng, tiếng cười vang trong những lễ hội mùa màng.","change":"Bánh xe vận mệnh xoay chuyển. Khói lửa lắng xuống, và Thời Bình trở lại với Aethelgard."},{"id":"holy_war","name":"Chiến Tranh Tuyến Đầu","weight":30,"hazard":1.4,"perTurn":{},"text":"Đó là thời Chiến Tranh Tuyến Đầu. Cờ hiệu các vương quốc tung bay trên những cánh đồng nhuốm máu.","change":"Tiếng tù và chiến trận vang lên khắp bốn phương. Aethelgard bước vào thời Chiến Tranh Tuyến Đầu."},{"id":"dark_age","name":"Kỷ Nguyên Tăm Tối","weight":20,"hazard":1.6,"perTurn":{"health":-2},"text":"Đó là Kỷ Nguyên Tăm Tối. Dịch bệnh và nạn đói phủ bóng lên vạn vật, và tà giáo thì thầm trong những ngõ hẻm.","change":"Mây đen kéo đến từ Vực Thẳm. Mùa màng héo úa, dịch bệnh lan tràn: Kỷ Nguyên Tăm Tối đã bắt đầu."},{"id":"demon_lord","name":"Ma Vương Giáng Thế","weight":10,"hazard":1.8,"perTurn":{},"text":"Đó là thời Ma Vương Giáng Thế. Bầu trời nhuộm đỏ, và cả thế giới đứng bên bờ vực sụp đổ.","change":"Mặt đất rung chuyển, Cửa Ngục Than Khóc mở toang. Ma Vương đã giáng thế."}],"origins":[{"id":"generic_common","races":[],"weight":70,"name":"Xuất thân bình thường","text":"Bạn chào đời là một {race}. Thế giới không để ý lắm.","effects":{}},{"id":"generic_hard","races":[],"weight":25,"name":"Xuất thân khắc nghiệt","text":"Bạn chào đời là một {race} giữa mùa đói. Tiếng khóc đầu tiên của bạn rất nhỏ.","effects":{"health":-10,"STR":1}},{"id":"generic_lucky","races":[],"weight":5,"name":"Sinh ra dưới sao lành","text":"Bạn chào đời là một {race} đúng đêm sao băng. Bà đỡ bảo đó là điềm lành.","effects":{"LUCK":2,"joy":10}},{"id":"beastman_beast_nomad","races":["beastman"],"weight":20,"name":"Con Của Gió Hú","text":"Tiếng gió rít qua Thảo Nguyên Gió Hú là khúc hát ru đầu đời của bạn. Định mệnh vạch sẵn một cuộc đời tự do, sải bước dưới bầu trời rộng lớn.","effects":{"AGI":2,"joy":10,"flags":["nomad_blood"]}},{"id":"beastman_beast_arena","races":["beastman"],"weight":15,"name":"Sôi Sục Huyết Sa","text":"Bạn cất tiếng khóc chào đời giữa mùi máu và cát bụi của Đấu Trường Huyết Sa. Từ trong nôi, bạn đã thuộc về vòng lặp sinh tử vô tận.","effects":{"STR":2,"joy":-15,"wealth":-10,"flags":["arena_born"]}},{"id":"beastman_beast_forest","races":["beastman"],"weight":20,"name":"Mầm Non Đại Ngàn","text":"Sinh ra dưới bóng râm của Cây Thế Giới Yggdrasil, hơi thở của Đại Ngàn Lục Bảo nuôi dưỡng sinh lực cuộn trào trong bạn.","effects":{"health":20,"LUCK":1,"flags":["forest_child"]}},{"id":"beastman_beast_merchant","races":["beastman"],"weight":15,"name":"Bánh Xe Bạc","text":"Cha mẹ bạn là những lính đánh thuê hộ tống Thương Đoàn Sói Bạc. Tiếng xóc đồng xu là âm thanh êm tai nhất những ngày thơ ấu.","effects":{"wealth":25,"INT":1,"flags":["merchant_guard"]}},{"id":"beastman_beast_wolf_raised","races":["beastman"],"weight":10,"name":"Đứa Con Của Sói","text":"Bị bỏ rơi ở bìa rừng, bạn được một bầy sói tinh linh cưu mang. Dòng máu thú nhân hòa nhịp hoàn hảo với bản năng hoang dã nguyên thủy.","effects":{"STR":1,"AGI":1,"INT":-1,"flags":["wolf_raised"]}},{"id":"beastman_beast_underworld","races":["beastman"],"weight":15,"name":"Bóng Tối Thủ Đô","text":"Sinh ra trong khu ổ chuột hôi hám dưới chân thủ đô Sanctus phồn hoa. Bạn học cách sinh tồn từ bóng tối trước khi biết ánh sáng là gì.","effects":{"AGI":1,"health":-10,"LUCK":2,"flags":["slum_rat"]}},{"id":"beastman_beast_cultist","races":["beastman"],"weight":8,"name":"Dị Đoan Hắc Nguyệt","text":"Một biểu tượng quái gở được khắc lên trán bạn ngay khi cắt rốn. Cha mẹ bạn là những tín đồ cuồng nhiệt của Hắc Nguyệt Hội.","effects":{"INT":2,"joy":-20,"flags":["dark_moon_mark"]}},{"id":"beastman_beast_swamp","races":["beastman"],"weight":12,"name":"Đóa Hoa Chướng Khí","text":"Mở mắt giữa Đầm Lầy Tử Khí, cơ thể nhỏ bé của bạn đã sớm quen với chất độc chết người lẩn khuất trong từng hơi thở.","effects":{"health":15,"STR":-1,"flags":["swamp_resist"]}},{"id":"beastman_beast_dwarf_adopted","races":["beastman"],"weight":10,"name":"Nôi Lửa Lò Rèn","text":"Một thợ rèn lùn tốt bụng ở Dãy Núi Răng Cưa đã nhặt bạn về từ một vụ sạt lở. Hơi nóng của lò rèn hun đúc cơ bắp bạn từ tấm bé.","effects":{"STR":2,"wealth":10,"flags":["forge_adopted"]}},{"id":"beastman_beast_ranger","races":["beastman"],"weight":15,"name":"Truyền Nhân Tuần Lâm","text":"Chiếc nôi của bạn được đan từ rễ cây và dây leo trong doanh trại Tuần Lâm Trọng Vệ. Đôi mắt bạn bẩm sinh đã sắc lẹm như mũi tên.","effects":{"AGI":2,"STR":1,"flags":["ranger_blood"]}},{"id":"beastman_beast_cursed","races":["beastman"],"weight":5,"name":"Ấn Chú Hủy Diệt","text":"Một tai nạn ma thuật đã để lại tàn dư của Quân Đoàn Hủy Diệt trong mạch máu bạn. Bạn mạnh mẽ phi thường nhưng luôn kề cận rủi ro.","effects":{"STR":3,"LUCK":-2,"health":-15,"flags":["demon_tainted"]}},{"id":"beastman_beast_lumina","races":["beastman"],"weight":5,"name":"Vạt Nắng Thánh Quang","text":"Hiếm có một Thú nhân nào được sinh ra trong ánh sáng thanh tẩy của Giáo hội Thánh Quang, nhưng bạn là một ngoại lệ được nữ thần chở che.","effects":{"INT":2,"LUCK":1,"joy":10,"flags":["lumina_blessed"]}},{"id":"demon_vuc_tham","races":["demon"],"weight":20,"name":"Đáy Vực Phân Tầng","text":"Bạn mở mắt giữa biển dung nham sôi sục của Vực Thẳm Phân Tầng. Hơi nóng thiêu đốt lớp vảy non nớt, đánh thức bản năng sinh tồn tàn khốc.","effects":{"STR":2,"joy":-10,"flags":["con_cua_vuc"]}},{"id":"demon_dao_tro_tan","races":["demon"],"weight":15,"name":"Bụi Đảo Tro Tàn","text":"Tiếng sấm gầm gừ chào đời bạn giữa Đảo Tro Tàn hoang vắng. Từng nhịp thở đầu tiên của bạn đã vương đầy tro bụi và mùi lưu huỳnh tĩnh mịch.","effects":{"health":-5,"STR":1,"INT":1}},{"id":"demon_hac_nguyet","races":["demon"],"weight":15,"name":"Tế Đàn Hắc Nguyệt","text":"Bạn sinh ra giữa tiếng tụng ca cuồng tín của Hắc Nguyệt Hội. Bạn được tôn thờ như một sứ giả mang theo hình bóng bóng đêm vĩ đại.","effects":{"INT":2,"wealth":10,"flags":["thanh_tu_hac_nguyet"]}},{"id":"demon_chien_truong","races":["demon"],"weight":10,"name":"Tàn Tích Chiến Cuộc","text":"Máu và nước mắt hòa quyện nơi Đồng Bằng Thánh Quang sau một trận thánh chiến. Bạn thoi thóp trong lồng ngực đã lạnh ngắt của người mẹ ma tộc.","effects":{"LUCK":1,"health":-10,"flags":["tre_mo_coi"]}},{"id":"demon_rung_luc_bao","races":["demon"],"weight":10,"name":"Góc Tối Đại Ngàn","text":"Một nhánh rễ mục nát của Cây Thế Giới Yggdrasil che chở bạn khỏi ánh mặt trời. Dòng ma lực tự nhiên len lỏi vào huyết mạch tà ác của bạn.","effects":{"AGI":1,"health":5,"flags":["con_lai_tu_nhien"]}},{"id":"demon_dam_lay","races":["demon"],"weight":10,"name":"Bùn Lầy Tử Khí","text":"Trứng của bạn nở giữa vùng lầy ngập ngụa chướng khí độc hại. Những sinh vật hôi thối vây quanh mầm sống mang đầy sát khí là bạn.","effects":{"STR":1,"AGI":1,"wealth":-5}},{"id":"demon_lo_ren","races":["demon"],"weight":10,"name":"Bóng Tối Lò Rèn","text":"Tiếng búa nện chát chúa ở Dãy Núi Răng Cưa là khúc hát ru của bạn. Sinh ra trong cũi sắt, định mệnh của bạn gắn liền với gông cùm hoặc bạo loạn.","effects":{"STR":1,"joy":-15,"flags":["no_le_nguoi_lun"]}},{"id":"demon_quy_toc","races":["demon"],"weight":10,"name":"Nôi Huyết Kim","text":"Bạn được bọc trong nhung lụa dệt từ chỉ Huyết Kim tại sào huyệt của một Ma tướng. Dòng máu cao quý chảy rần rật, đòi hỏi sự hoàn mỹ tuyệt đối.","effects":{"INT":1,"wealth":20,"flags":["dong_mau_quy_toc"]}},{"id":"dragon_origin_pure","races":["dragon"],"weight":50,"name":"Đỉnh Hỏa Ngục","text":"Bạn nằm trong quả trứng được ấp bởi dung nham của Đảo Tro Tàn, dưới sự canh gác của Rồng Mẹ. Bạn sinh ra mang dòng máu thuần chủng và sự kiêu ngạo tuyệt đối.","effects":{"STR":3,"INT":3,"AGI":3,"flags":["pure_dragon"]}},{"id":"dragon_origin_stolen","races":["dragon"],"weight":30,"name":"Bị đánh cắp","text":"Quả trứng của bạn bị một tổ đội Anh hùng đánh cắp, lén lút ấp bằng lò rèn nhân tạo. Bạn nở ra giữa bầy loài người hèn mọn, bị chúng xích lại nhằm biến thành vũ khí chiến tranh.","effects":{"STR":2,"LUCK":-2,"flags":["stolen_egg"]}},{"id":"dragon_origin_half","races":["dragon"],"weight":20,"name":"Trứng rồng lai","text":"Sinh ra từ sự lai tạp giữa Rồng và quái thú. Bạn không có đôi cánh hoàn chỉnh mà chỉ là Rồng Đất (Wyrm), sức mạnh kém hơn nhưng lại mang bản tính hoang dại đẫm máu.","effects":{"INT":-1,"AGI":2,"flags":["half_dragon"]}},{"id":"dragon_dragon_origin_abyss","races":["dragon"],"weight":50,"name":"Trứng Rồng Vực Thẳm","text":"Bánh xe định mệnh khẽ xoay, linh hồn bạn vượt qua cõi Hư Vô để giáng xuống một bệ đá cổ xưa sâu trong Vực Thẳm Phân Tầng. Quả trứng của bạn rực sáng ma lực, báo hiệu sự ra đời của một thực thể mang sức mạnh nguyên thủy vô song.","effects":{"STR":2,"INT":1,"flags":["pure_dragon","proud"]}},{"id":"dragon_dragon_origin_yggdrasil","races":["dragon"],"weight":50,"name":"Hơi Thở Đại Ngàn","text":"Giữa những rễ cây khổng lồ của Đại Ngàn Lục Bảo, vòm trời sấm sét rền vang đón chào sinh mệnh bạn hội tụ trong quả trứng cổ đại. Định mệnh đã xướng tên một bạo chúa kiêu hãnh chuẩn bị thống trị bầu trời Aethelgard.","effects":{"health":20,"LUCK":2,"wealth":5,"flags":["pure_dragon"]}},{"id":"dwarf_lo_ren_vinh_cuu","races":["dwarf"],"weight":20,"name":"Hậu duệ Lò Rèn Vĩnh Cửu","text":"Bạn cất tiếng khóc chào đời giữa tiếng đe búa vang rền của Lò Rèn Vĩnh Cửu. Nhiệt lượng từ nham thạch đã sớm truyền vào huyết quản một sức sống mãnh liệt.","effects":{"STR":1,"wealth":10,"flags":["huyet_mach_tho_ren"]}},{"id":"dwarf_ke_bi_ruong_bo","races":["dwarf"],"weight":10,"name":"Kẻ lưu vong Đầm Lầy Tử Khí","text":"Sinh ra trong màn sương độc vĩnh hằng của Đầm Lầy Tử Khí, cha mẹ bạn là những kẻ bị bộ tộc ruồng bỏ. Sự khởi đầu tăm tối đánh dấu một số phận bấp bênh.","effects":{"LUCK":-1,"health":-5,"wealth":-10,"flags":["con_cua_ke_luu_vong"]}},{"id":"dwarf_con_buon_soi_bac","races":["dwarf"],"weight":15,"name":"Mầm non Thương Đoàn Sói Bạc","text":"Được sinh ra trên thùng hàng xóc nảy của Thương Đoàn Sói Bạc, tiếng leng keng của Đồng Cẩm Thạch là bài hát ru đầu tiên bạn nghe thấy.","effects":{"INT":1,"wealth":15,"flags":["nhay_ben_thuong_mai"]}},{"id":"dwarf_mo_coi_huyet_sa","races":["dwarf"],"weight":10,"name":"Cô nhi Đấu Trường Huyết Sa","text":"Bạn mở mắt giữa cát bụi tanh mùi máu của Đấu Trường Huyết Sa. Khát vọng sinh tồn mãnh liệt hằn sâu vào một tâm hồn hoang dại thiếu vắng tình thương.","effects":{"STR":2,"joy":-10,"flags":["chien_binh_nhi"]}},{"id":"dwarf_gia_toc_khai_khoang","races":["dwarf"],"weight":25,"name":"Con nhà thợ mỏ Răng Cưa","text":"Bạn sinh ra dưới những vòm hang sâu thẳm của Dãy Núi Răng Cưa, nơi bụi đá và bóng tối hòa quyện thành sinh mệnh vững chãi như bàn thạch.","effects":{"STR":1,"health":5}},{"id":"dwarf_tu_si_nhat_duoc","races":["dwarf"],"weight":10,"name":"Đứa trẻ được Thánh Quang cưu mang","text":"Một giáo sĩ Thánh Quang đã nhặt được bạn trước thềm giáo đường phủ đầy tuyết. Dưới ánh sáng ấm áp của Nữ thần Lumina, bạn lớn lên với trái tim trong sáng.","effects":{"INT":1,"joy":10,"flags":["an_dien_thanh_quang"]}},{"id":"dwarf_no_le_hac_nguyet","races":["dwarf"],"weight":5,"name":"Tù binh Hắc Nguyệt Hội","text":"Bóng tối ngột ngạt của hầm ngục tà giáo là nơi bạn cất tiếng khóc đầu tiên. Lời nguyền Hắc Nguyệt in hằn lên da thịt, dự báo một chuỗi ngày bi kịch.","effects":{"LUCK":-2,"health":-5,"flags":["dau_an_hac_am"]}},{"id":"dwarf_lang_thang_gio_hu","races":["dwarf"],"weight":5,"name":"Dân du mục Thảo Nguyên Gió Hú","text":"Làn gió cắt da cắt thịt của thảo nguyên đã thổi bùng ngọn lửa sống lẻ loi trong lều bạt rách nát. Bạn bắt đầu cuộc đời như một con thú nhỏ nhanh nhẹn.","effects":{"AGI":2,"wealth":-10}},{"id":"elf_elf_royal_seed","races":["elf"],"weight":10,"name":"Nụ Hoa Hoàng Tộc","text":"Bạn sinh ra từ một nụ hoa khổng lồ phát sáng trên đỉnh Cây Thế Giới Yggdrasil. Số mệnh vĩ đại đã được khắc sâu vào linh hồn bạn ngay từ khoảnh khắc mở mắt.","effects":{"INT":2,"joy":5,"flags":["royal_blood"]}},{"id":"elf_elf_ranger_camp","races":["elf"],"weight":15,"name":"Doanh Trại Tuần Lâm","text":"Tiếng cung nẻ rền vang là âm thanh đầu tiên bạn nghe thấy khi chào đời tại tiền đồn của Tuần Lâm Trọng Vệ. Dòng máu chiến binh dũng cảm chảy rần rần trong huyết quản bạn.","effects":{"STR":1,"AGI":1,"flags":["ranger_born"]}},{"id":"elf_elf_sanctus_exile","races":["elf"],"weight":10,"name":"Kẻ Lưu Đày Sanctus","text":"Cha mẹ bạn bị Giáo hội Thánh Quang xua đuổi, buộc phải hạ sinh bạn giữa Thảo Nguyên Gió Hú lạnh lẽo. Nghèo đói bủa vây, nhưng ngọn lửa sinh tồn trong bạn lại bùng cháy mãnh liệt.","effects":{"wealth":-15,"health":-5,"STR":1,"flags":["exiled"]}},{"id":"elf_elf_yggdrasil_root","races":["elf"],"weight":15,"name":"Lá Vàng Rơi","text":"Bạn rơi xuống từ một chiếc lá tàn úa của Yggdrasil và được bầy hươu thần cưu mang. Tự nhiên giang tay che chở cho sinh mệnh nhỏ bé bị bỏ rơi này.","effects":{"joy":10,"LUCK":1,"flags":["nature_child"]}},{"id":"elf_elf_magic_anomaly","races":["elf"],"weight":10,"name":"Kết Tinh Ma Thuật","text":"Không giống những đứa trẻ bình thường, nôi của bạn được bao bọc bởi Lõi Mana lấp lánh tự kết tinh. Phép thuật quá lớn vắt kiệt thể lực của một sinh linh chưa thành hình.","effects":{"INT":2,"health":-10,"flags":["mana_anomaly"]}},{"id":"elf_elf_holy_war_orphan","races":["elf"],"weight":15,"name":"Cô Nhi Chiến Hỏa","text":"Tiếng khóc của bạn vang lên giữa đống đổ nát khi Quân Đoàn Hủy Diệt tàn sát quê nhà. Sự cô độc và mất mát khắc sâu vào số phận của một cô nhi chiến tranh.","effects":{"STR":1,"joy":-15,"flags":["war_orphan"]}},{"id":"elf_elf_merchant_child","races":["elf"],"weight":10,"name":"Hậu Duệ Thương Đoàn","text":"Bạn cất tiếng khóc chào đời trên cỗ xe ngựa nạm Huyết Kim của Thương Đoàn Sói Bạc. Tiếng đồng xu leng keng trở thành lời ru định mệnh của bạn.","effects":{"wealth":20,"LUCK":1,"flags":["merchant_born"]}},{"id":"elf_elf_moon_touched","races":["elf"],"weight":15,"name":"Dấu Ấn Hắc Nguyệt","text":"Ra đời vào đêm huyết nguyệt che khuất bầu trời, trên trán bạn hằn lên ấn chú mờ ảo của Hắc Nguyệt Hội. Bạn mang một vẻ đẹp ma mị nhưng đầy rẫy hiểm nguy.","effects":{"INT":1,"LUCK":-1,"flags":["dark_mark"]}},{"id":"ghoul_origin_graveyard","races":["ghoul"],"weight":50,"name":"Nghĩa trang hoang tàn","text":"Giữa đêm khuya thanh vắng, bàn tay rữa nát của bạn phá vỡ lớp đất tơi xốp bò lên mặt đất. Xung quanh chỉ có tiếng quạ kêu và bia mộ đổ nát.","effects":{"STR":1,"INT":-2,"flags":["undead_curse"]}},{"id":"ghoul_origin_massgrave","races":["ghoul"],"weight":30,"name":"Hố chôn tập thể","text":"Thức tỉnh giữa hàng ngàn cái xác thối rữa của một cuộc Thánh chiến đẫm máu. Oán khí dày đặc giúp bạn cử động linh hoạt hơn.","effects":{"AGI":2,"LUCK":-1,"flags":["mass_grave"]}},{"id":"ghoul_origin_experiment","races":["ghoul"],"weight":20,"name":"Bàn thí nghiệm Tử linh","text":"Bạn được đánh thức bởi ma thuật đen của một Tử linh sư điên rồ. Bạn bị khâu chắp vá từ nhiều mảnh xác và bị buộc tội phải nghe lời hắn.","effects":{"STR":2,"INT":-1,"flags":["necromancer_puppet"]}},{"id":"ghoul_blood_battlefield","races":["ghoul"],"weight":20,"name":"Chiến trường đẫm máu","text":"Xung đột ma thuật tàn phá Thảo Nguyên Gió Hú, để lại hàng vạn xác chết vương vãi đẫm máu. Từ trong bùn lầy tử khí, linh hồn bạn bị kéo giật về cõi trần bằng một tà thuật cấm kỵ.","effects":{"STR":2,"AGI":1,"health":-5,"flags":["undead_curse"]}},{"id":"ghoul_dark_altar","races":["ghoul"],"weight":20,"name":"Tế đàn hắc ám","text":"Ngọn lửa Hắc Nguyệt bùng cháy trên bàn tế, vắt kiệt sinh mệnh của hàng chục kẻ dị giáo để gọi hồn một ác quỷ. Bánh xe định mệnh khẽ xoay, bạn mở bừng đôi mắt đỏ ngòm giữa tiếng tụng niệm rợn người.","effects":{"INT":-2,"LUCK":-1,"health":10,"flags":["necromancer_puppet"]}},{"id":"goblin_origin_forest_newbie","races":["goblin"],"weight":30,"name":"Bụi rậm Rừng Tân Thủ","text":"Bạn ra đời dưới một tán lá mục ngoài bìa rừng - bãi thực hành của các Mạo hiểm giả cấp thấp. Nếu biết nằm im lẩn trốn, bạn sẽ có một tuổi thơ an toàn, no đủ với quả mọng và ếch nhái, tỉ lệ chết yểu thấp hơn hẳn dưới hầm ngục.","effects":{"LUCK":1,"STR":1,"flags":["forest_goblin"]}},{"id":"goblin_origin_trash","races":["goblin"],"weight":25,"name":"Đống rác Hầm ngục","text":"Bạn chui ra từ bọc nhầy ném giữa đống rác hôi thối ở tầng nông Vực Thẳm. Bản năng gào thét bạn phải nhai nát mẩu xương khô bên cạnh trước khi bị thằng nhãi da xanh khác cướp mất.","effects":{"STR":1,"wealth":-10,"flags":["dungeon_scavenger"]}},{"id":"goblin_origin_royal","races":["goblin"],"weight":20,"name":"Hang Ổ Tù Trưởng","text":"Bạn là con của Tù trưởng, được vứt cho miếng thịt chuột ôi thiu. Đám Goblin xung quanh nhìn bạn với ánh mắt thèm thuồng tàn độc, chực chờ bạn lơ là để xé xác.","effects":{"STR":2,"wealth":5,"flags":["hated","chief_son"]}},{"id":"goblin_origin_ambush","races":["goblin"],"weight":15,"name":"Bia tập chém Tân thủ","text":"Tiếng khóc của bạn vang lên ngay lúc một nhóm Mạo hiểm giả tuổi teen đang thực hành vung kiếm. Mẹ bạn thẳng tay ném bạn vào bụi gai làm mồi nhử rồi cắm đầu chạy trốn.","effects":{"AGI":2,"LUCK":-2,"flags":["orphan"]}},{"id":"goblin_origin_shaman","races":["goblin"],"weight":7,"name":"Đứa con của Pháp Sư","text":"Bạn sinh ra với vết bớt phát sáng lờ mờ. Lão Pháp sư già khú của bầy lập tức xách cổ bạn về để làm cu li lau chùi đũa phép và nếm thử thuốc độc.","effects":{"INT":2,"STR":-1,"flags":["shaman_apprentice"]}},{"id":"goblin_origin_mutant","races":["goblin"],"weight":3,"name":"Đột biến dị thường","text":"Vừa bóc màng nhầy, bạn đã sở hữu cơ bắp cuồn cuộn hơn hẳn đồng loại. Bạn lập tức bóp cổ con quái nhí bên cạnh để thị uy sức mạnh tuyệt đối của mình.","effects":{"STR":3,"INT":-2,"flags":["hobgoblin_blood"]}},{"id":"high_demon_origin_royal","races":["high_demon"],"weight":70,"name":"Ngai vàng rỉ máu","text":"Kế thừa vương quyền từ thuở lọt lòng, bạn ra đời trong cung điện tăm tối nhất Ma giới. Lõi ma lực nguyên thủy trong người bạn đủ sức san phẳng một ngọn núi. Mọi sinh linh thấp kém xung quanh tự động run rẩy quỳ rạp.","effects":{"STR":3,"INT":3,"AGI":3,"wealth":10,"flags":["royal_demon"]}},{"id":"high_demon_origin_void","races":["high_demon"],"weight":30,"name":"Vực Thẳm Hư Vô","text":"Bạn không có cha mẹ. Bạn được sinh ra từ sự tích tụ oán khí và hàng vạn linh hồn bị nguyền rủa tại tận cùng địa ngục. Không có ai che chở, bạn phải tự mình chứng minh sức mạnh diệt vong.","effects":{"INT":4,"LUCK":2,"flags":["void_born"]}},{"id":"high_demon_hd_origin_blood_moon","races":["high_demon"],"weight":20,"name":"Trăng Máu Vực Thẳm","text":"Dưới ánh trăng đỏ rực của Vực Thẳm Phân Tầng, bạn hóa hình từ hàng vạn linh hồn oán hận. Quyền năng tột đỉnh chảy trong huyết quản, báo hiệu một kỷ nguyên hỗn mang mới sắp bắt đầu trên lục địa Aethelgard.","effects":{"INT":2,"STR":1,"joy":-10,"flags":["void_born","royal_demon"]}},{"id":"human_brothel_bastard","races":["human"],"weight":15,"name":"Con của kỹ nữ","text":"Tiếng nhạc xập xình và mùi hương phấn rẻ tiền chào đón bạn đến với thế giới. Định mệnh của bạn chập chững bắt đầu từ vũng bùn lầy nhơ nhuốc nhất của xã hội loài người.","effects":{"STR":1,"wealth":-10,"joy":-5,"flags":["poor","slum"]}},{"id":"human_hunter_steppes","races":["human"],"weight":15,"name":"Con thợ săn Thảo Nguyên","text":"Lọt lòng giữa tiếng gió rít cuồng nộ qua Thảo Nguyên Gió Hú, bạn lớn lên bằng sữa thú và máu của những cuộc đi săn. Đôi mắt bạn mang hình bóng của những con đại bàng khao khát tự do.","effects":{"AGI":2,"health":15,"flags":["hunter_blood"]}},{"id":"human_mercenary_spawn","races":["human"],"weight":15,"name":"Trẻ trại lính Sói Bạc","text":"Sinh ra trong ánh lửa trại rực hồng của Thương Đoàn Sói Bạc, tiếng va chạm binh khí là lời ru đầu đời của bạn. Sinh mệnh này ngay từ đầu đã thuộc về những bản hợp đồng nhuốm máu.","effects":{"STR":1,"AGI":1,"wealth":5,"flags":["mercenary_camp"]}},{"id":"human_swamp_refugee","races":["human"],"weight":10,"name":"Tị nạn Đầm Lầy Tử Khí","text":"Mở mắt nhìn đời giữa chướng khí mịt mù, gia đình bạn là những kẻ bám víu vào sự sống một cách tuyệt vọng. Sinh tồn là bài học duy nhất và tàn khốc nhất mà thế giới ban tặng.","effects":{"LUCK":-1,"health":-10,"flags":["refugee","poor"]}},{"id":"human_cultist_seed","races":["human"],"weight":10,"name":"Hạt giống Hắc Nguyệt Hội","text":"Bạn được sinh ra trên một tế đàn rực lửa đen, mang trên mình kỳ vọng vặn vẹo của tà giáo. Bóng tối dưới Vực Thẳm Phân Tầng đã thì thầm tên bạn ngay từ khi mới lọt lòng.","effects":{"INT":2,"joy":-15,"flags":["cultist_kin","dark_aura"]}},{"id":"human_tower_servant","races":["human"],"weight":15,"name":"Con người hầu Tháp Ngà","text":"Chào đời dưới bóng râm uy nghi của Tháp Ma Pháp Bạch Ngà, bạn chỉ là kẻ thấp hèn quét bụi cho những pháp sư vĩ đại. Dẫu vậy, khao khát chạm tay vào bầu trời ma thuật vẫn âm ỉ cháy.","effects":{"INT":1,"wealth":-5,"flags":["educated","servant"]}},{"id":"human_sanctus_merchant","races":["human"],"weight":20,"name":"Thương gia nhỏ Sanctus","text":"Tiếng Đồng Cẩm Thạch lanh canh chào đón bạn đến với khu chợ sầm uất của thủ đô Sanctus thiêng liêng. Dòng máu con buôn tính toán chảy rần rật trong từng huyết quản bé nhỏ.","effects":{"INT":1,"LUCK":1,"wealth":15,"flags":["merchant_kin"]}},{"id":"imp_origin_hellborn","races":["imp"],"weight":40,"name":"Vạc Dầu Sôi Ma Giới","text":"Bạn trồi lên từ một vạc dầu sùng sục dưới đáy Ma giới. Kẻ chào đón bạn là cái đạp như trời giáng của một tên canh ngục khổng lồ.","effects":{"STR":1,"AGI":1,"flags":["hellborn"]}},{"id":"imp_origin_summon","races":["imp"],"weight":40,"name":"Vòng Tròn Triệu Hồi","text":"Vừa mở mắt, bạn đã thấy mình đứng giữa một vòng tròn ma thuật rực sáng trên nhân giới. Một tên Pháp sư già khú đang nhìn bạn với nụ cười đắc ý.","effects":{"INT":1,"LUCK":-1,"flags":["familiar_pet"]}},{"id":"imp_origin_unbound","races":["imp"],"weight":20,"name":"Tro tàn Khế ước","text":"Bạn sinh ra từ tàn tro của một khế ước bị đốt cháy do chủ nhân cũ đột tử. Bạn mang trong mình sự ranh mãnh và hoàn toàn tự do, không chịu khuất phục ai.","effects":{"INT":1,"AGI":1,"flags":["unbound_imp"]}},{"id":"imp_under_demon_table","races":["imp"],"weight":15,"name":"Gầm Bàn Ác Quỷ","text":"Ngay khi mở mắt, bạn đã thấy mình cuộn tròn dưới gầm chiếc bàn đá nhuốm máu của một Đại Ác Quỷ. Sinh mệnh bé nhỏ của bạn bắt đầu giữa những tiếng gầm thét rung chuyển Vực Thẳm Phân Tầng.","effects":{"STR":-1,"AGI":2,"flags":["hellborn"]}},{"id":"imp_mage_glass_jar","races":["imp"],"weight":15,"name":"Bình Ngâm Tháp Ngà","text":"Linh hồn bạn bị cưỡng ép giáng xuống bên trong một bình thủy tinh ngâm dung dịch lục nhạt tại Tháp Ngà. Bánh xe định mệnh trớ trêu đã trói buộc sinh linh bóng tối vào sự tò mò tàn nhẫn của loài người.","effects":{"INT":2,"STR":-2,"flags":["familiar_pet"]}},{"id":"kobold_origin_overworld","races":["kobold"],"weight":40,"name":"Mỏ hoang Sườn Núi","text":"Bạn cất tiếng khóc chào đời tại một hầm mỏ cạn kiệt thuộc Rừng Tân Thủ. Không có quái vật lớn, nhưng Mạo hiểm giả người phàm thường xuyên ghé qua đây để cày cấp. Cửa sinh tồn của bạn là phải đào thật sâu.","effects":{"AGI":1,"LUCK":1,"flags":["overworld_kobold"]}},{"id":"kobold_origin_dungeon_miner","races":["kobold"],"weight":30,"name":"Đáy mỏ tăm tối Vực Thẳm","text":"Bạn ra đời giữa tiếng đục đẽo chát chúa của tầng ngục ngầm. Cha mẹ nhét ngay vào tay bạn một cái xẻng gãy thay vì bình sữa.","effects":{"STR":1,"AGI":1,"flags":["dungeon_miner"]}},{"id":"kobold_origin_dwarf_slave","races":["kobold"],"weight":20,"name":"Cũi sắt Người Lùn","text":"Bạn mở mắt trong lồng sắt của tộc Dwarf. Chúng đập gãy một ngón chân của bạn và xích bạn lại như một con chó săn chuyên dùng để dò mìn trong hầm ngục.","effects":{"AGI":2,"LUCK":-2,"flags":["dwarf_slave"]}},{"id":"kobold_origin_dragon_blessed","races":["kobold"],"weight":10,"name":"Gần hang Rồng Cổ Đại","text":"Tổ của bạn vô tình nằm sát vách hang Rồng. Hơi nóng và ma lực tản ra khiến lớp vảy non của bạn đỏ rực lên đầy kiêu hãnh.","effects":{"STR":2,"INT":1,"flags":["dragon_blessed"]}},{"id":"kobold_kobold_sulfur_nest","races":["kobold"],"weight":20,"name":"Tổ ấp Quặng Lưu Huỳnh","text":"Mùi lưu huỳnh hăng hắc khắc sâu vào buồng phổi nhỏ bé của bạn ngay từ hơi thở đầu tiên. Bánh xe định mệnh xoay vần, linh hồn bạn tái sinh thành một cẩu đầu nhân dạt trôi nơi đáy vực dung nham rực đỏ.","effects":{"AGI":1,"health":-5,"flags":["dungeon_miner"]}},{"id":"lizardman_origin_swamp","races":["lizardman"],"weight":60,"name":"Bãi đẻ trứng ngập nước","text":"Bạn tự đập vỡ vỏ trứng trong một vũng bùn lầy lội. Bản năng sinh tồn buộc bạn phải lặn ngay xuống nước trước khi bị lũ chim quỷ tha đi.","effects":{"AGI":1,"STR":1,"flags":["swamp_born"]}},{"id":"lizardman_origin_slave","races":["lizardman"],"weight":20,"name":"Nô lệ trốn chạy","text":"Mẹ bạn là một nô lệ bị bắt. Bạn sinh ra trong xiềng xích nhưng đã trốn thoát thành công vào đầm lầy thiêng nước độc.","effects":{"AGI":2,"LUCK":-1,"flags":["escaped_slave"]}},{"id":"lizardman_origin_poison","races":["lizardman"],"weight":15,"name":"Hồ nước độc","text":"Quả trứng của bạn bị rơi xuống vùng nước nhiễm nọc độc của Boss hầm ngục. Bạn nở ra với lớp vảy tím rực rỡ và máu mang độc tính cao.","effects":{"STR":-1,"INT":1,"flags":["poison_blood"]}},{"id":"lizardman_origin_blessed","races":["lizardman"],"weight":5,"name":"Tế đàn Rắn","text":"Quả trứng của bạn được ấp bằng máu hiến tế ngay trên Tế đàn. Bạn sinh ra mang theo phước lành của Tà thần.","effects":{"INT":2,"LUCK":1,"flags":["snake_blessed"]}},{"id":"lizardman_hatchery_of_culling","races":["lizardman"],"weight":20,"name":"Hố Bùn Huyết Lục","text":"Bạn vỡ vỏ trong hố bùn sâu thẳm, nơi hàng ngàn con non phải cắn xé nhau để giành quyền sống sót. Bánh xe định mệnh nhuốm máu ngay từ khoảnh khắc bạn cất tiếng rít đầu tiên, định hình một linh hồn tàn nhẫn.","effects":{"STR":2,"health":-10,"flags":["swamp_born","poison_blood"]}},{"id":"minotaur_origin_maze","races":["minotaur"],"weight":60,"name":"Tâm điểm Mê cung","text":"Bạn ra đời tại căn phòng trung tâm của một mê cung cổ đại. Lời nguyền hầm ngục ngay lập tức đóng ấn lên bạn: bản năng thôi thúc bạn phải bảo vệ căn phòng này cho đến hơi thở cuối cùng.","effects":{"STR":2,"flags":["maze_guardian"]}},{"id":"minotaur_origin_torture","races":["minotaur"],"weight":20,"name":"Phòng tra tấn","text":"Mở mắt ra trong gông cùm của bọn Ma Tộc Thượng Đẳng. Chúng xỏ một chiếc vòng sắt đẫm máu qua mũi bạn để dễ bề điều khiển bạn như một cỗ máy chém.","effects":{"STR":2,"LUCK":-2,"flags":["enslaved"]}},{"id":"minotaur_origin_gladiator","races":["minotaur"],"weight":15,"name":"Đấu trường sinh tử","text":"Bạn lọt lòng ngay trên nền cát nhuốm máu của Đấu Trường Huyết Sa. Xung quanh là tiếng hò reo khát máu của con người đang chờ bạn lớn lên để làm bia tập chém.","effects":{"STR":1,"AGI":1,"flags":["gladiator_bull"]}},{"id":"minotaur_origin_cult","races":["minotaur"],"weight":5,"name":"Tế đàn dị giáo","text":"Làn khói nhang mờ ảo bao phủ ngày bạn ra đời. Một nhóm cuồng tín thuộc Hắc Nguyệt Hội quỳ rạp dưới chân bạn, tôn vinh bạn là hiện thân của Bạo lực thiêng liêng.","effects":{"INT":1,"wealth":5,"flags":["cult_god"]}},{"id":"minotaur_day_vuc_tham","races":["minotaur"],"weight":20,"name":"Đáy Vực Thẳm","text":"Bạn vỡ ối sinh ra giữa bùn lầy và xương trắng dưới tầng sâu nhất của Vực Thẳm Phân Tầng. Vận mệnh lập tức ban cho bạn dòng máu cuồng nộ để gác cổng bóng tối.","effects":{"STR":2,"wealth":-10,"flags":["maze_guardian"]}},{"id":"minotaur_tan_tich_co","races":["minotaur"],"weight":15,"name":"Tàn tích đền thờ cổ","text":"Tiếng gầm chào đời của bạn vang vọng giữa những bức tượng thần thánh đã sụp đổ rêu phong. Một sinh mệnh dị giáo được nuôi dưỡng bằng hận thù, định sẵn sẽ nhuốm máu đại ngàn.","effects":{"STR":1,"health":10,"flags":["cult_god"]}},{"id":"orc_origin_warborn","races":["orc"],"weight":40,"name":"Sinh ra trong khói lửa","text":"Bạn cất tiếng khóc chào đời giữa một chiến trường đẫm máu, dưới chân là xác của Mạo hiểm giả. Mùi sắt gỉ và nhịp trống tử chiến định hình nên tâm hồn bạo lực của bạn.","effects":{"STR":3,"INT":-1,"flags":["warborn"]}},{"id":"orc_origin_royal","races":["orc"],"weight":30,"name":"Dòng máu Tù trưởng","text":"Là con của Warchief đương nhiệm, bạn được nhồi nhét tư tưởng thống trị ngay từ khi lọt lòng. Với bạn, mọi kẻ yếu hơn đều là rác rưởi.","effects":{"STR":2,"wealth":10,"flags":["royal_blood"]}},{"id":"orc_origin_gladiator","races":["orc"],"weight":20,"name":"Nô lệ giác đấu","text":"Mở mắt trong cũi sắt lạnh lẽo của Đấu trường Huyết Sa. Con người ném thịt sống vỗ béo bạn chỉ để xem bạn xé xác đồng loại mua vui cho giới quý tộc.","effects":{"AGI":2,"STR":1,"LUCK":-2,"flags":["gladiator"]}},{"id":"orc_origin_blessed","races":["orc"],"weight":10,"name":"Đứa con của Tà Thần","text":"Bạn sinh ra với làn da đỏ rực kỳ dị thay vì màu xanh truyền thống. Lão Pháp sư (Shaman) của bộ lạc quỳ gối tuyên bố bạn là sứ giả mang cơn thịnh nộ của Chiến thần.","effects":{"STR":2,"INT":1,"flags":["blessed_orc"]}},{"id":"orc_lone_survivor","races":["orc"],"weight":20,"name":"Mầm Mống Tàn Lụi","text":"Bộ lạc của bạn bị tàn sát trong một đêm tuyết lạnh, chỉ còn bạn thoi thóp dưới xác mẹ nơi Rừng Tân Thủ. Huyết mạch hoang dã bùng cháy, buộc bạn phải sống sót để đối mặt với định mệnh vĩ đại chờ đợi phía trước.","effects":{"STR":2,"wealth":-10,"flags":["orphan_orc"]}},{"id":"slime_origin_puredrip","races":["slime"],"weight":40,"name":"Cặn ma lực đọng lại","text":"Bạn sinh ra từ một vũng nước nhỏ giọt trên trần hầm ngục. Không có ký ức, chỉ có cơn đói thôi thúc bạn trườn đi tìm thức ăn.","effects":{"INT":1,"STR":-1,"flags":["pure_slime"]}},{"id":"slime_origin_corpse","races":["slime"],"weight":30,"name":"Nuôi dưỡng bằng xác thối","text":"Hình thành ngay trên cái xác đang phân hủy của một Mạo hiểm giả xui xẻo. Dòng máu tanh tưởi là bữa ăn định hình cơ thể bạn.","effects":{"STR":1,"LUCK":-1,"flags":["blood_slime"]}},{"id":"slime_origin_experiment","races":["slime"],"weight":20,"name":"Bình thí nghiệm vỡ","text":"Thức tỉnh trên sàn đá lạnh lẽo sau khi một bình thí nghiệm của Pháp sư bị đập vỡ. Quanh bạn là những mảnh kính và ma lực hỗn loạn.","effects":{"INT":2,"AGI":-1,"flags":["magic_slime"]}},{"id":"slime_origin_mimic","races":["slime"],"weight":10,"name":"Đáy rương rỗng","text":"Mở mắt dưới đáy một chiếc rương gỗ mục nát bị lãng quên. Bóng tối và sự chật hẹp khơi dậy bản năng bắt chước đồ vật của bạn.","effects":{"LUCK":1,"wealth":5,"flags":["mimic_potential"]}},{"id":"slime_demon_corpse","races":["slime"],"weight":10,"name":"Máu Thịt Ác Quỷ","text":"Bánh xe định mệnh khẽ xoay, bạn tỉnh giấc giữa vũng máu đen ngòm của một Ác ma vừa gục ngã tại Vực Thẳm Phân Tầng. Thể xác nhầy nhụa của bạn thành hình từ chính sự tà ác và oán hận còn sót lại trên chiến trường.","effects":{"STR":2,"health":15,"flags":["blood_slime"]}},{"id":"troll_origin_bridge","races":["troll"],"weight":50,"name":"Dưới gầm cầu đá","text":"Khởi đầu truyền thống, bạn sinh ra trong mùi ẩm mốc dưới gầm một cây cầu lớn, kế thừa 'doanh nghiệp' thu phí cầu đường của gia đình.","effects":{"STR":2,"INT":-2,"flags":["bridge_troll"]}},{"id":"troll_origin_swamp","races":["troll"],"weight":30,"name":"Đầm lầy hôi thối","text":"Bạn chui ra từ lớp bùn đặc quánh, da dẻ trơn tuột và hôi rình. Đồ ăn yêu thích đầu đời là xác thối.","effects":{"STR":1,"AGI":-1,"flags":["swamp_troll"]}},{"id":"troll_origin_ice","races":["troll"],"weight":20,"name":"Đỉnh núi tuyết","text":"Bạn là một Troll Tuyết hiếm hoi với lớp lông trắng muốt. Bạn kháng được cái lạnh cắt da cắt thịt nhưng lại cực kỳ sợ hãi ngọn lửa.","effects":{"STR":1,"LUCK":-1,"flags":["ice_troll"]}},{"id":"troll_troll_origin_cave","races":["troll"],"weight":20,"name":"Hang động ẩm mốc","text":"Bạn lọt lòng trong một hang động mù mịt tại Dãy Núi Răng Cưa, không gian sặc sụa mùi nấm mốc. Bánh xe định mệnh khẽ xoay, đón chào một sinh linh vô tri nhưng bất diệt bước vào cõi trần thế.","effects":{"STR":1,"INT":-1,"flags":["cave_troll"]}},{"id":"troll_troll_origin_abyss","races":["troll"],"weight":20,"name":"Rìa Vực Thẳm","text":"Từ Vực Thẳm Phân Tầng, bạn ngoi lên mặt đất với làn da bám đầy bùn đen hôi thối. Một hành trình bạo lực và đẫm mùi bản năng trên lục địa Aethelgard linh thiêng chính thức bắt đầu.","effects":{"health":15,"AGI":-1,"flags":["scarred"]}},{"id":"troll_troll_origin_forest","races":["troll"],"weight":20,"name":"Rừng sâu tĩnh lặng","text":"Dưới bóng râm của Đại Ngàn Lục Bảo, bạn rơi cái uỵch xuống đống lá mục xốp mềm. Linh hồn bạn đã cập bến vùng đất ma pháp dưới hình hài của một sinh vật phàm tục và hoang dã nhất.","effects":{"STR":1,"joy":5,"flags":["magic_resist"]}},{"id":"vampire_origin_pure","races":["vampire"],"weight":40,"name":"Lâu đài Chân Tổ","text":"Bạn được sinh ra từ 'Nghi thức Huyết ấn' của một Huyết Vương. Bạn mang dòng máu thuần khiết, ngậm thìa bạc và nhìn mọi sinh vật khác bằng nửa con mắt.","effects":{"INT":2,"AGI":2,"flags":["pure_blood"]}},{"id":"vampire_origin_infected","races":["vampire"],"weight":30,"name":"Vết cắn trong ngõ hẻm","text":"Từng là con người, bạn bị một Vampire hạ cấp cắn rách cổ rồi bỏ mặc. Bạn thức tỉnh trong bùn nhơ, vật lộn với cơn khát máu và sự kinh tởm chính mình.","effects":{"STR":2,"LUCK":-2,"flags":["infected_vampire"]}},{"id":"vampire_origin_pact","races":["vampire"],"weight":20,"name":"Giao kèo quý tộc","text":"Bạn tự nguyện hiến dâng linh hồn và thể xác cho bóng tối để thoát khỏi bệnh tật tuổi già. Bạn có tài sản của con người nhưng bị đồng loại khinh bỉ.","effects":{"STR":-2,"wealth":10,"flags":["noble_pact"]}},{"id":"vampire_origin_cult","races":["vampire"],"weight":10,"name":"Tế đàn Hắc Nguyệt","text":"Bạn là vật thí nghiệm của giáo phái cuồng tín. Máu của bạn hòa lẫn với quỷ khí, cho phép bạn kháng lại một phần Thánh quang nhưng cơ thể bị biến dạng nhẹ.","effects":{"INT":1,"LUCK":1,"flags":["cult_vampire"]}},{"id":"vampire_vampire_origin_ivory_crypt","races":["vampire"],"weight":20,"name":"Hầm Mộ Bạch Ngà","text":"Tỉnh giấc trong một cỗ quan tài cẩm thạch dưới lòng Tháp Ma Pháp Bạch Ngà, bạn là một biến số cổ xưa vừa được giải trừ phong ấn. Bánh xe định mệnh khẽ xoay, huyết mạch kiêu hãnh cất tiếng gọi linh hồn bạn trỗi dậy từ cõi chết.","effects":{"STR":1,"INT":1,"wealth":15,"flags":["pure_blood"]}}],"names":{"human":{"male":["Aldric","Bram","Cedric","Dorian","Edwin","Felix","Garrett","Hugo","Ivo","Jasper","Kael","Lucan","Milo","Nolan","Oswin"],"female":["Alina","Brielle","Clara","Delia","Elsa","Freya","Greta","Hilde","Iris","Juna","Lena","Mira","Nora","Odette","Rosa"],"family":["Ashford","Brook","Carver","Dale","Fenwick","Holt","Marsh","Reed","Thorne","Wren"]},"goblin":{"male":["Grik","Snag","Grob","Mug","Zark","Krug","Snik","Gluk","Ruk","Zit"],"female":["Grika","Sna","Mugi","Zari","Kruka", Carmilla","Selene","Victoria","Elvira","Elizabeth","Lenore","Juliet","Drusilla","Morwen","Isolde"],"family":["Tepes","Bathory","Huyết Nguyệt","Bóng Đêm","Tội Lỗi"]}},"deaths":[{"id":"old_generic","kind":"old","text":"Bạn ra đi trong giấc ngủ, ở tuổi {age}. Không đau đớn gì."},{"id":"old_generic2","kind":"old","text":"Một sáng mùa thu, bạn không dậy nữa. Bạn {age} tuổi."},{"id":"old_human","kind":"old","races":["human"],"text":"Bạn mất ở tuổi {age}, trên chiếc giường đã nằm suốt ba mươi năm."},{"id":"old_goblin","kind":"old","races":["goblin"],"text":"Bạn chết già ở tuổi {age}. Với một goblin, đó là một kỳ tích."},{"id":"old_dragon","kind":"old","races":["dragon"],"text":"Bạn chìm vào giấc ngủ đông cuối cùng. Ngọn núi bạn nằm vẫn ấm thêm một nghìn năm nữa."},{"id":"health_generic","kind":"health","text":"Cơ thể bạn không chịu được nữa. Bạn mất ở tuổi {age}."},{"id":"health_fever","kind":"health","text":"Một cơn sốt kéo dài ba ngày. Đến ngày thứ tư, bạn không tỉnh lại."},{"id":"health_slime","kind":"health","races":["slime"],"text":"Cơ thể bạn khô dần rồi vỡ thành bột. Gió thổi bay bạn đi."},{"id":"violent_generic","kind":"violent","text":"Bạn gặp tai nạn và qua đời ở tuổi {age}."},{"id":"violent_bandit","kind":"violent","text":"Bọn cướp chặn đường bạn. Bạn không về nhà nữa."},{"id":"violent_monster","kind":"violent","races":["human","beastman","dwarf","elf"],"text":"Một con ma thú xuất hiện ở bìa rừng. Người ta chỉ tìm thấy đôi giày của bạn."},{"id":"violent_hero","kind":"violent","races":["goblin","kobold","orc","imp","slime","demon","high_demon","ghoul","troll","minotaur","lizardman"],"text":"Một mạo hiểm giả đi ngang qua. Họ được thêm điểm kinh nghiệm. Bạn thì không còn gì."},{"id":"violent_goblin_kin","kind":"violent","races":["goblin"],"text":"Anh em trong hang đánh nhau giành một miếng thịt. Bạn đứng quá gần."},{"id":"violent_slime_boot","kind":"violent","races":["slime"],"stages":["infant","child","teen"],"text":"Một chiếc ủng da giẫm thẳng lên bạn. Chủ nhân của nó còn không nhìn xuống."},{"id":"violent_slime_fire","kind":"violent","races":["slime"],"text":"Một pháp sư dùng cầu lửa. Bạn bốc hơi trước khi kịp hiểu chuyện gì."},{"id":"violent_vampire","kind":"violent","races":["vampire"],"text":"Bạn ngủ quên quá giờ. Ánh mặt trời tràn vào qua khe cửa."},{"id":"beastman_beast_old_1","races":["beastman"],"kind":"old","text":"Hơi thở của gió ngừng thổi, linh hồn bạn trở về vòng tay Tự Nhiên ở tuổi {age}, để lại một huyền thoại dài trên thảo nguyên."},{"id":"beastman_beast_health_1","races":["beastman"],"kind":"health","text":"Cơn bạo bệnh rút cạn sinh lực hoang dã, bạn gục ngã ở tuổi {age} trong tiếng gầm thét bất lực của bầy đàn."},{"id":"beastman_beast_violent_1","races":["beastman"],"kind":"violent","text":"Lưỡi kiếm kẻ thù xuyên qua lồng ngực bốc lửa, khép lại khúc tráng ca đẫm máu của bạn ở tuổi {age}."},{"id":"beastman_beast_violent_2","races":["beastman"],"kind":"violent","text":"Tai nạn thảm khốc tước đoạt đôi chân tự do, bạn bỏ mạng tại tuổi {age} dưới nanh vuốt nghiệt ngã của số phận."},{"id":"demon_demon_old","races":["demon"],"kind":"old","text":"Năm {age} tuổi, ngọn lửa sinh mệnh nơi lồng ngực tắt ngấm; linh hồn ma tộc của bạn tan biến vào hư vô, để lại một tượng đá sừng sững."},{"id":"demon_demon_health","races":["demon"],"kind":"health","text":"Căn bệnh phân rã vảy sừng cướp đi sinh mệnh bạn năm {age} tuổi; thân xác quật cường cuối cùng cũng hóa thành cát bụi."},{"id":"demon_demon_violent_holy","races":["demon"],"kind":"violent","text":"Thánh kiếm của Thánh Vệ Quân xuyên thấu trái tim bạn ở tuổi {age}; ánh sáng chói lòa thiêu rụi mọi ước vọng chưa thành."},{"id":"demon_demon_violent_abyss","races":["demon"],"kind":"violent","text":"Một quái thú Vực Thẳm cắn xé bạn thành từng mảnh năm {age} tuổi; định mệnh bi thảm khép lại giữa vũng máu tanh."},{"id":"dragon_death_epic","races":["dragon"],"kind":"violent","text":"Tuổi {age}, sau một trận chiến rung chuyển đất trời với Dũng giả vĩ đại nhất nhân loại, bạn gục ngã với thanh Thánh kiếm cắm xuyên tim. Sự sụp đổ của bạn báo hiệu một kỷ nguyên mới."},{"id":"dragon_death_poison","races":["dragon"],"kind":"health","text":"Cả cuộc đời vĩ đại lại kết thúc vô duyên ở tuổi {age}, khi một tên đạo chích lén bỏ kịch độc vào kho báu vàng của bạn hàng trăm năm ròng rã, khiến bạn chết trong giấc ngủ."},{"id":"dragon_death_dragon","races":["dragon"],"kind":"violent","text":"Trong cuộc chiến tranh giành lãnh thổ ở tuổi {age}, bạn bị một con Hắc Long to lớn hơn xé toạc cổ họng và nhai nuốt lõi ma lực."},{"id":"dragon_death_mountain","races":["dragon"],"kind":"old","text":"Đạt đến đỉnh cao của tuổi {age}, bạn mất đi hứng thú với thế giới. Bạn nhắm mắt ngủ một giấc dài vĩnh viễn, cơ thể khổng lồ dần hóa đá và rêu phong tạo thành một dãy núi hùng vĩ cho thế hệ sau."},{"id":"dragon_dragon_death_slayed","races":["dragon"],"kind":"violent","text":"Năm {age} tuổi, sinh mệnh kiêu hãnh của bạn vụt tắt dưới lưỡi gươm của một đội anh hùng huyền thoại, thân xác khổng lồ gục ngã trên đống kho báu."},{"id":"dragon_dragon_death_fade","races":["dragon"],"kind":"old","text":"Ở tuổi {age}, linh hồn cổ đại của bạn tự nguyện tan biến vào các chiều không gian, trả lại nguồn ma lực nguyên thủy vô tận cho lục địa."},{"id":"dwarf_tu_tran_gia","races":["dwarf"],"kind":"old","text":"Lửa sống lụi tàn như lò rèn cạn kiệt than hồng, bạn trút hơi thở cuối cùng trong thanh thản ở tuổi {age}."},{"id":"dwarf_chet_benh_tat","races":["dwarf"],"kind":"health","text":"Bụi phổi vỡ nát và cơn bạo bệnh tàn nhẫn đã quật ngã cơ thể kiên cường của {name}, khép lại sinh mệnh vào năm {age} tuổi."},{"id":"dwarf_chet_bao_luc","races":["dwarf"],"kind":"violent","text":"Một lưỡi sắc lạnh găm xuyên lồng ngực, máu người lùn nhuộm đỏ rực mặt đất khi {name} vừa tròn {age} tuổi."},{"id":"dwarf_chet_sap_ham","races":["dwarf"],"kind":"violent","text":"Hầm ngục sụt lở phong ấn {name} mãi mãi trong u tối, linh hồn tan biến vào lòng núi mẹ ở tuổi {age}."},{"id":"elf_elf_old_age","races":["elf"],"kind":"old","text":"Trải qua {age} năm tuế nguyệt chứng kiến biển xanh hóa nương dâu, linh hồn mòn mỏi của bạn tĩnh lặng tan biến thành những đốm sáng hòa vào Cây Thế Giới."},{"id":"elf_elf_mana_exhaustion","races":["elf"],"kind":"health","text":"Lõi ma lực trong cơ thể cạn kiệt ở tuổi {age}, thân xác yếu ớt của bạn vỡ vụn thành hàng ngàn mảnh pha lê lấp lánh rồi cuốn theo chiều gió."},{"id":"elf_elf_demon_slain","races":["elf"],"kind":"violent","text":"Nanh vuốt tàn độc của ma vật xé toạc sinh mệnh bạn ở tuổi {age}, máu tiên tộc nhuộm đỏ mảnh đất Aethelgard lạnh lẽo vô tình."},{"id":"elf_elf_magic_backfire","races":["elf"],"kind":"violent","text":"Một bùa chú cấm kỵ mất kiểm soát đã phát nổ ở tuổi {age}, nghiền nát cả thể xác lẫn linh hồn bạn thành tro bụi giữa cõi Hư Vô."},{"id":"ghoul_death_holy","races":["ghoul"],"kind":"violent","text":"Ở tuổi {age}, bạn bị một Giáo sĩ cấp cao phát hiện. Thánh quang rực rỡ từ cây thập tự thiêu rụi bạn thành một nhúm tro tàn không thể hồi sinh."},{"id":"ghoul_death_faded","races":["ghoul"],"kind":"health","text":"Tuổi {age}, cơn đói dai dẳng không được đáp ứng qua hàng thập kỷ khiến oán khí duy trì cơ thể bạn tan biến vào hư vô."},{"id":"ghoul_death_dismembered","races":["ghoul"],"kind":"violent","text":"Năm {age} tuổi, một nhóm Mạo hiểm giả băm vằm bạn đứt lìa tứ chi. Dù không chết ngay, bạn nằm thối rữa và bất động vĩnh viễn trên bãi cỏ."},{"id":"ghoul_death_material","races":["ghoul"],"kind":"violent","text":"Một tên Pháp sư tà ác mạnh hơn đã nghiền nát cơ thể bạn ở tuổi {age} chỉ để lấy 'Lõi tử linh' bên trong lồng ngực làm nguyên liệu giả kim."},{"id":"ghoul_holy_fire","races":["ghoul"],"kind":"violent","text":"Tia sáng thanh tẩy từ Kỵ sĩ Thánh Quang thiêu rụi thân xác mục nát của bạn thành tro tàn ở tuổi {age}."},{"id":"ghoul_starvation","races":["ghoul"],"kind":"health","text":"Ở tuổi {age}, bạn hoàn toàn cạn kiệt tà năng và tan thành cát bụi vì không tìm được máu thịt tươi để duy trì sự tồn tại."},{"id":"goblin_death_adventurer","races":["goblin"],"kind":"violent","text":"Năm {age} tuổi, bạn bị một Mạo hiểm giả tập sự chém bay đầu lấy tai đổi thưởng; cái chết của bạn chỉ đáng giá 2 đồng xu đồng."},{"id":"goblin_death_starvation","races":["goblin"],"kind":"health","text":"Lê lết qua tuổi {age}, dạ dày bạn quặn thắt rồi vỡ tung vì đã cố nhai đến hòn đá cuối cùng trong cơn đói gào thét."},{"id":"goblin_death_trap","races":["goblin"],"kind":"violent","text":"Năm {age} tuổi, bạn vô tình dẫm trúng chính cái bẫy gấu rỉ sét do mình giăng ra đêm qua, máu chảy cạn trước khi đồng loại kịp tới lột đồ bạn."},{"id":"goblin_death_old","races":["goblin"],"kind":"old","text":"Bạn cạn kiệt sinh lực ở tuổi {age}. Việc một Goblin chết già là điều hiếm hoi tới mức đám trẻ trong hang tưởng bạn là một loài quái vật bí ẩn."},{"id":"goblin_death_boss","races":["goblin"],"kind":"violent","text":"Ở tuổi {age}, bạn bị Tù trưởng nắm gáy ném thẳng vào mõm con Minotaur đang thịnh nộ để làm bao cát câu giờ."},{"id":"high_demon_death_holy_sword","races":["high_demon"],"kind":"violent","text":"Ở tuổi {age}, ánh sáng Thánh Kiếm của Dũng giả đã đâm xuyên qua ngực bạn. Ngai vàng sụp đổ, đế chế hắc ám tan vỡ, bạn chết đi để nhường chỗ cho hòa bình."},{"id":"high_demon_death_sealed","races":["high_demon"],"kind":"violent","text":"Năm {age} tuổi, thay vì giết bạn, Thần linh và Pháp sư đã hy sinh hàng ngàn mạng sống để phong ấn bạn vào lõi tinh cầu. Bạn tồn tại vĩnh viễn trong không gian tối tăm không có khái niệm thời gian."},{"id":"high_demon_death_betrayed","races":["high_demon"],"kind":"violent","text":"Tuổi {age}, trong lúc bạn đang suy yếu sau trận chiến với Thánh Quang, ba tên Ma Tướng thân tín nhất đã hợp sức xé xác bạn để chia nhau ngôi vị Ma Vương."},{"id":"high_demon_death_world_end","races":["high_demon"],"kind":"old","text":"Sống qua hàng ngàn năm đến tuổi {age}, ma lực của thế giới cạn kiệt, Vực thẳm sụp đổ. Không còn sức mạnh chống đỡ, cơ thể kiêu hãnh của bạn tự phân rã thành bụi không gian."},{"id":"high_demon_hd_death_light","races":["high_demon"],"kind":"violent","text":"Cột sáng thiêng liêng từ Tháp Ma Pháp Bạch Ngà đâm xuyên qua lõi ác quỷ của bạn, thiêu rụi triều đại hắc ám ở tuổi {age}."},{"id":"human_human_old_age","races":["human"],"kind":"old","text":"Thời gian, kẻ thù duy nhất mà nhân loại không thể dùng gươm giáo đánh bại, cuối cùng cũng đóng lại trang sử thi của bạn ở tuổi {age}."},{"id":"human_human_sickness","races":["human"],"kind":"health","text":"Ngọn lửa sinh mệnh mong manh của con người vụt tắt vì bạo bệnh, để lại một linh hồn vương vấn trần gian khi bạn mới bước sang tuổi {age}."},{"id":"human_human_violent_blade","races":["human"],"kind":"violent","text":"Một nhát chém chí mạng vô tình xé toạc sinh mệnh, kết thúc giấc mộng chinh phạt dang dở của bạn vào năm {age} tuổi."},{"id":"human_human_violent_monster","races":["human"],"kind":"violent","text":"Móng vuốt ma vật xé rách lồng ngực bạn, dòng máu đỏ thẫm nhuộm đẫm mặt đất vỡ vụn, đánh dấu sự hy sinh tàn khốc năm {age} tuổi."},{"id":"imp_death_contract_break","races":["imp"],"kind":"violent","text":"Ở tuổi {age}, chủ nhân bị ám sát khiến khế ước trói buộc vỡ vụn, kéo theo linh hồn bạn bị xé nát thành ngàn mảnh nhỏ."},{"id":"imp_death_crushed","races":["imp"],"kind":"violent","text":"Năm {age} tuổi, bạn mải bay lượn trêu chọc và bị một tên Khổng lồ vung tay đập nát bét như đập một con ruồi."},{"id":"imp_death_fire_fade","races":["imp"],"kind":"health","text":"Lửa địa ngục trong huyết quản bạn cạn kiệt do sống quá lâu ở nhân giới. Tuổi {age}, cơ thể bạn hóa thành một nắm tro tàn lạnh lẽo."},{"id":"imp_death_purified","races":["imp"],"kind":"violent","text":"Năm {age} tuổi, trong lúc lẻn vào nhà thờ ăn cắp, bạn lỡ tay chạm vào Thánh giá. Ánh sáng Lumina lập tức bốc hơi bạn."},{"id":"imp_death_old_rich","races":["imp"],"kind":"old","text":"Sống thọ đến {age} tuổi, bạn rụng hết cánh và sừng. Bạn chìm vào giấc ngủ vĩnh hằng êm ái trên đống tiền vàng ăn cắp được cả đời."},{"id":"kobold_death_adventurer","races":["kobold"],"kind":"violent","text":"Năm {age} tuổi, bạn bị một thanh gươm của Mạo hiểm giả thực tập đâm xuyên bụng ngoài Rừng Tân Thủ. Chúng reo hò vì vừa hoàn thành nhiệm vụ hướng dẫn."},{"id":"kobold_death_collapse","races":["kobold"],"kind":"violent","text":"Năm {age} tuổi, một tảng đá hàng tấn sập xuống đè nát bạn thành tương. Một cái chết quá đỗi bình thường của nghề thợ mỏ."},{"id":"kobold_death_trap","races":["kobold"],"kind":"violent","text":"Ở tuổi {age}, chứng lú lẫn khiến bạn bước nhầm vào bãi mìn nổ do chính mình đặt tháng trước. Cơ thể bạn văng tung tóe khắp vách hang."},{"id":"kobold_death_lung_disease","races":["kobold"],"kind":"health","text":"Phổi của bạn bị hủy hoại hoàn toàn bởi bụi quặng quỷ và khí độc, bạn ho ra máu đen và lịm đi ở tuổi {age}."},{"id":"kobold_death_old","races":["kobold"],"kind":"old","text":"Tuổi {age}, bạn nhắm mắt bên chiếc cuốc chim đã mòn vẹt. Vượt qua tỉ lệ tử vong 75%, linh hồn bạn kiêu hãnh bay về miền đất của loài Rồng."},{"id":"lizardman_death_skinned","races":["lizardman"],"kind":"violent","text":"Năm {age} tuổi, bạn bị một nhóm Mạo hiểm giả bắt được. Chúng lột sống lớp vảy sừng của bạn để đem về thành phố chế tác áo giáp kháng phép."},{"id":"lizardman_death_freeze","races":["lizardman"],"kind":"health","text":"Là sinh vật máu lạnh, một đợt bão tuyết ập đến đột ngột khi bạn {age} tuổi khiến bạn chết cóng trước khi kịp tìm hang trú ẩn."},{"id":"lizardman_death_poison_dragon","races":["lizardman"],"kind":"violent","text":"Tuổi {age}, bạn cả gan thách thức một con Rồng Đầm Lầy và bị nọc độc cấp cao hơn của nó dung giải nội tạng."},{"id":"lizardman_death_old","races":["lizardman"],"kind":"old","text":"Bạn hòa mình vào bùn lầy tĩnh lặng ở tuổi {age}. Lớp vảy của bạn rụng xuống, nuôi dưỡng thế hệ nòng nọc tiếp theo."},{"id":"minotaur_death_guard","races":["minotaur"],"kind":"violent","text":"Ở tuổi {age}, bạn đứng chết trân với hàng chục thanh kiếm ghim trên người. Bạn đã không lùi một bước nào khỏi cánh cửa phòng báu vật."},{"id":"minotaur_death_horn","races":["minotaur"],"kind":"violent","text":"Năm {age} tuổi, một gã Dũng giả xảo quyệt đã lợi dụng điểm mù để chặt đứt cặp sừng kiêu hãnh của bạn, khiến bạn chảy máu đến chết trong đau đớn."},{"id":"minotaur_death_lost","races":["minotaur"],"kind":"health","text":"Trí nhớ suy giảm ở tuổi {age}, bạn tự đi lạc vào một khu vực mê cung chưa từng biết tới, kiệt sức và chết khát giữa bốn bức tường vô hình."},{"id":"minotaur_death_arena","races":["minotaur"],"kind":"violent","text":"Tuổi {age}, bạn gục ngã dưới chân hàng vạn khán giả vô cảm sau khi kiệt sức vì phải giết hàng trăm nô lệ liên tiếp."},{"id":"minotaur_death_old","races":["minotaur"],"kind":"old","text":"Bạn nhắm mắt xuôi tay trên đống xương khô của những kẻ thách thức ở tuổi {age}. Mê cung rơi vào tĩnh lặng chờ một Minotaur mới ra đời."},{"id":"minotaur_minotaur_die_battle","races":["minotaur"],"kind":"violent","text":"Năm {age} tuổi, thân xác vạm vỡ của bạn đổ gục dưới hàng vạn mũi giáo, khép lại bản anh hùng ca đẫm máu của một quái thú kiêu hãnh."},{"id":"minotaur_minotaur_die_starvation","races":["minotaur"],"kind":"health","text":"Năm {age} tuổi, bạn chết mòn trong góc tối của mê cung vắng lặng, cơn đói gặm nhấm đi chút kiêu hãnh cuối cùng của loài ác thú."},{"id":"orc_death_glory","races":["orc"],"kind":"violent","text":"Năm {age} tuổi, bạn gục ngã sau khi vung nhát rìu cuối cùng, thân thể ghim hàng chục mũi tên và giáo mác của kỵ binh. Bộ lạc sẽ hát vang tên bạn muôn đời."},{"id":"orc_death_duel","races":["orc"],"kind":"violent","text":"Trong một cuộc quyết đấu giành quyền lực ở tuổi {age}, bạn bị một chiến binh trẻ tuổi và khát máu hơn chặt đứt đầu. Ngai vàng luôn đổi chủ."},{"id":"orc_death_magic","races":["orc"],"kind":"violent","text":"Khinh thường ma thuật mỏng manh, bạn lao thẳng vào cơn bão lửa của một Kỵ sĩ ma pháp ở tuổi {age} và hóa thành tro bụi."},{"id":"orc_death_poison","races":["orc"],"kind":"health","text":"Năm {age} tuổi, bạn thổ huyết gục ngã vì bị hạ độc vào bình rượu thịt. Đây là một cái chết đớn hèn, nhục nhã nhất mà bạn từng căm ghét."},{"id":"orc_death_old_shame","races":["orc"],"kind":"old","text":"Sống dai dẳng đến {age} tuổi là một vết nhơ với bất kỳ Orc nào. Bạn chết già một cách yếu ớt trên giường, không có lấy một vinh quang hay tiếng gươm đao đưa tiễn."},{"id":"slime_death_sunlight","races":["slime"],"kind":"health","text":"Năm {age} tuổi, bạn trườn nhầm lên mặt đất giữa ban ngày. Ánh nắng gay gắt thiêu đốt khiến bạn bốc hơi thành một vệt cặn khô khốc."},{"id":"slime_death_magic_fire","races":["slime"],"kind":"violent","text":"Một quả cầu lửa của tên Pháp sư đã nung sôi và thiêu rụi hoàn toàn cơ thể lỏng lẻo của bạn ở tuổi {age}."},{"id":"slime_death_core_smashed","races":["slime"],"kind":"violent","text":"Năm {age} tuổi, một gã thợ rèn vung búa đập vỡ nát lõi ma lực giấu sâu trong cơ thể bạn. Bạn vỡ vụn thành bọt nước vô tri."},{"id":"slime_death_frozen","races":["slime"],"kind":"health","text":"Mùa đông khắc nghiệt dưới hầm ngục đóng băng cơ thể bạn thành một khối đá ở tuổi {age}, trước khi bị một kẻ qua đường dẫm nát."},{"id":"slime_death_mana_depleted","races":["slime"],"kind":"health","text":"Đạt đến {age} tuổi, ma lực duy trì lõi của bạn cạn kiệt. Bạn dần mờ đi và tĩnh lặng thấm vào lòng đất, kết thúc một vòng đời."},{"id":"troll_death_fire","races":["troll"],"kind":"violent","text":"Tuổi {age}, một tổ đội Pháp sư đã đốt rụi bạn thành tro bụi bằng ngọn lửa ma thuật, cách duy nhất để ngăn bạn hồi phục sinh lực."},{"id":"troll_death_choke","races":["troll"],"kind":"health","text":"Đang nhai ngấu nghiến một cỗ xe ngựa ở tuổi {age}, bạn vô tình cắn trúng lưỡi mình, nuốt bánh xe khiến bạn nghẹn thở đến chết."},{"id":"troll_death_sunlight","races":["troll"],"kind":"health","text":"Lỡ bước ra ngoài lúc bình minh ở tuổi {age}, ánh sáng mặt trời gay gắt ngay lập tức biến bạn thành một bức tượng đá vĩnh cửu."},{"id":"troll_death_old","races":["troll"],"kind":"old","text":"Bạn chìm vào giấc ngủ dài ở tuổi {age}. Cỏ cây rêu phong phủ kín cơ thể khổng lồ của bạn, biến bạn thành một ngọn đồi xanh mướt mãi mãi."},{"id":"troll_troll_death_fire","races":["troll"],"kind":"violent","text":"Một quả cầu lửa rực sáng của pháp sư thiêu rụi hoàn toàn lớp da rêu phong, bạn vĩnh viễn hóa thành tro bụi ở tuổi {age}."},{"id":"troll_troll_death_starve","races":["troll"],"kind":"violent","text":"Bị mắc kẹt giữa hẻm núi chật hẹp vì cơ thể quá khổ, bạn kiệt sức và chết đói một cách tức tưởi ở tuổi {age}."},{"id":"vampire_death_sun","races":["vampire"],"kind":"violent","text":"Do bất cẩn tính sai thời gian đi săn hoặc bị kẻ thù giam giữ đến bình minh, bạn gào thét khi da thịt hóa thành tro bụi dưới ánh nắng ở tuổi {age}."},{"id":"vampire_death_stake","races":["vampire"],"kind":"violent","text":"Năm {age} tuổi, trong lúc đang ngủ ngày say giấc, một Thợ săn ma cà rồng đã lẻn vào cắm phập chiếc cọc gỗ tẩm nước thánh xuyên qua tim bạn."},{"id":"vampire_death_starve","races":["vampire"],"kind":"health","text":"Bị giam cầm trong hầm ngục phong ấn pháp thuật, không có giọt máu tươi nào trong hàng chục năm. Ở tuổi {age}, bạn khô héo đi và hóa thành một xác ướp."},{"id":"vampire_death_purify","races":["vampire"],"kind":"violent","text":"Dám thách thức Giáo hoàng, tuổi {age}, linh hồn dơ bẩn của bạn bị ánh sáng Thánh Quang tinh khiết bốc hơi hoàn toàn, không thể luân hồi."},{"id":"vampire_death_old","races":["vampire"],"kind":"health","text":"Ở tuổi {age}, sống quá lâu khiến bạn đánh mất mọi khao khát. Bạn nhắm mắt lại trong cỗ quan tài êm ái phủ rèm nhung đỏ, quyết định vĩnh viễn không tỉnh dậy."}],"epitaphs":[{"id":"ep_generic1","text":"Chỉ {pct}% linh hồn được đầu thai làm {race}. Bạn là một trong số đó, và bạn đã sống {age} năm."},{"id":"ep_generic2","text":"{name}, {race}, {age} tuổi. Thế giới vẫn quay. Nhưng có một vài người nhớ đến bạn."},{"id":"ep_generic3","text":"Trong số mọi linh hồn đầu thai năm đó, {pct}% trở thành {race}. Đây là câu chuyện của một trong số họ."},{"id":"ep_goblin","races":["goblin"],"text":"Hầu hết goblin không sống đủ lâu để có tên. Bạn có tên: {name}."},{"id":"ep_slime","races":["slime"],"text":"Một slime không để lại mộ. Nhưng có một vũng nước, ở đâu đó, mang hình dáng của bạn."},{"id":"ep_human","races":["human"],"text":"{name}. Sinh ra, lớn lên, yêu thương, rồi ra đi. Một đời người."}],"fillers":[{"stages":["infant"],"text":"Bạn ngủ, ăn, rồi lại ngủ."},{"stages":["infant"],"text":"Bạn lớn thêm một chút."},{"stages":["child"],"text":"Bạn chơi đến tận khi trời tối."},{"stages":["child"],"text":"Một năm trôi qua với những trò nghịch ngợm nhỏ."},{"stages":["teen"],"text":"Bạn hay nghĩ về những nơi rất xa."},{"stages":["teen"],"text":"Bạn cao hơn, và bướng hơn."},{"stages":["adult"],"text":"Ngày nối ngày. Bạn làm việc, ăn, ngủ."},{"stages":["adult"],"text":"Một năm bình thường."},{"stages":["middle"],"text":"Bạn nhận ra mình bắt đầu nói giống cha mẹ."},{"stages":["middle"],"text":"Thời gian trôi nhanh hơn trước."},{"stages":["elder"],"text":"Bạn ngồi phơi nắng nhiều hơn."},{"stages":["elder"],"text":"Bạn nhớ chuyện cũ rõ hơn chuyện hôm qua."},{"stages":["ancient"],"text":"Vài thập kỷ trôi qua. Bạn không đếm nữa."},{"stages":["ancient"],"text":"Những gương mặt quen lần lượt biến mất."},{"races":["slime"],"text":"Bạn trôi chậm qua sàn đá."},{"races":["slime"],"text":"Bạn hấp thụ một ít bụi. Không ngon lắm."}],"jobs":[{"id":"warrior","name":"Kiếm sĩ","stat":"STR","combat":true,"tags":["civil"],"desc":"Dựa vào Sức mạnh. Thu nhập khá, nguy hiểm cao","require":{"STR":6},"alt":{"STR":4,"anyFlags":["mercenary_camp","chien_binh_nhi","arena_born","warborn","gladiator","hunter_blood"],"hint":"Sức mạnh 4 và lớn lên giữa binh đao"},"ranks":["Tân binh","Kiếm sĩ","Hiệp sĩ","Kiếm sư","Thánh Kiếm"],"income":[1.5,2.2,3.2,4.5,6],"promoXp":[3,5,8,12],"promoTarget":[6,8,10,13],"hazard":2,"gains":{"STR":0.3,"AGI":0.1},"start":"Bạn nhận thanh kiếm sắt đầu tiên từ tay viên đội trưởng. Nó nặng hơn bạn tưởng, và lạnh như lời thề.","promo":["Viên đội trưởng gọi bạn ra giữa sân tập: \"Đánh ngã ta, và ngươi sẽ không còn là tân binh.\"","Một hiệp sĩ già để ý đến đường kiếm của bạn. Ông đề nghị một thử thách: giữ cổng thành một mình suốt đêm trăng máu.","Đấu Trường Huyết Sa mở giải đấu tuyển Kiếm sư. Chỉ người cuối cùng còn đứng mới được ghi danh.","Giáo hội Thánh Quang loan báo: thanh Thánh Kiếm trong đền cổ đang chờ một bàn tay xứng đáng rút nó khỏi đá."],"quiet":["Những năm ấy bạn đứng gác, tuần tra và vung kiếm. Mỗi vết sẹo mới là một bài học.","Bạn theo đoàn quân qua nhiều thành trì. Thanh kiếm của bạn đã mẻ, rồi được rèn lại, mấy lần.","Tiếng kim loại va nhau trong sân tập trở thành bài hát quen thuộc nhất đời bạn."]},{"id":"mage","name":"Pháp sư","stat":"INT","combat":true,"tags":["civil"],"desc":"Dựa vào Trí tuệ. Khởi đầu nghèo, về sau quyền lực","require":{"INT":8},"alt":{"INT":5,"anyFlags":["educated","mana_anomaly","magic_slime"],"hint":"Trí tuệ 5 và từng được học hành"},"ranks":["Học đồ","Pháp sư","Ma đạo sư","Đại pháp sư","Hiền giả"],"income":[0.6,1.8,3.2,5,7],"promoXp":[4,6,9,14],"promoTarget":[7,9,11,14],"hazard":1.3,"gains":{"INT":0.35},"start":"Cánh cổng Tháp Ngà Ma Pháp khép lại sau lưng bạn. Từ hôm nay, mực và mana sẽ là máu thịt của bạn.","promo":["Vị giáo sư già trao cho bạn một quả cầu thủy tinh trống rỗng: \"Thắp sáng nó bằng ý chí của ngươi.\"","Hội đồng Tháp Ngà yêu cầu bạn trình bày một phép thuật do chính mình sáng tạo trước toàn thể pháp sư.","Một cuốn ma thư cổ bị phong ấn từ thời Đại Dịch Miasma được giao cho bạn giải mã. Kẻ thất bại thường mất trí.","Các Hiền giả triệu bạn lên đỉnh tháp. Thử thách cuối cùng: đối diện với chính linh hồn mình trong Gương Hư Vô."],"quiet":["Những năm ấy trôi qua giữa giá sách và vòng tròn ma pháp. Ngón tay bạn nhuộm màu mực vĩnh viễn.","Bạn thử nghiệm, thất bại, rồi thử nghiệm tiếp. Trần phòng thí nghiệm đã cháy đen ba lần.","Mana chảy trong bạn mỗi năm một thuần thục hơn, như dòng suối tìm được lòng sông."]},{"id":"rogue","name":"Thích khách","stat":"AGI","combat":true,"tags":["civil"],"desc":"Dựa vào Nhanh nhẹn. Kiếm nhiều, sống ngoài vòng pháp luật","require":{"AGI":7},"alt":{"AGI":4,"anyFlags":["slum","slum_rat","poor","orphan","tre_mo_coi","war_orphan"],"hint":"Nhanh nhẹn 4 và lớn lên nơi đầu đường xó chợ"},"ranks":["Đạo chích","Thích khách","Bóng Đêm","Sát thủ bậc thầy","Chúa tể Hội Bóng Đêm"],"income":[1.8,2.8,4,5.5,7],"promoXp":[3,5,8,12],"promoTarget":[6,8,10,13],"hazard":2.2,"gains":{"AGI":0.3,"LUCK":0.05},"start":"Một bàn tay đeo găng đen đặt lên vai bạn trong con hẻm tối. Hội Bóng Đêm đã để mắt đến bạn từ lâu.","promo":["Hội Bóng Đêm giao bài kiểm tra đầu tiên: lấy chiếc nhẫn khỏi ngón tay một quan thu thuế khi hắn còn đang ngủ.","Một hợp đồng nặng ký được thả xuống bàn bạn: một tên buôn nô lệ được canh giữ bởi mười vệ binh.","Để được gọi là Sát thủ bậc thầy, bạn phải đột nhập vào lâu đài của một bá tước và để lại lá bài đen trên gối hắn.","Chúa tể Hội Bóng Đêm đã già. Hắn để lại một câu đố: kẻ nào tìm ra hắn trước bình minh sẽ thừa kế chiếc ghế."],"quiet":["Những năm ấy bạn sống về đêm. Mái nhà Sanctus là con đường, và bóng tối là tấm áo choàng.","Túi tiền bạn nặng dần, nhưng giấc ngủ thì nhẹ như lá. Bạn luôn ngồi quay lưng vào tường.","Bạn học cách bước không thành tiếng, thở không thành hơi, và quên đi những khuôn mặt."]},{"id":"cleric","name":"Giáo sĩ","stat":"INT","combat":true,"tags":["civil"],"desc":"Dựa vào Trí tuệ. An toàn, được kính trọng, có thể cứu đồng đội","require":{"INT":6,"notFlags":["dark_aura","cultist_kin","demon_tainted","dau_an_hac_am","dark_mark"]},"alt":{"INT":3,"anyFlags":["lumina_blessed","an_dien_thanh_quang"],"notFlags":["dark_aura","cultist_kin"],"hint":"được Thánh Quang ban phúc từ lúc sinh"},"excludeRaces":["vampire"],"ranks":["Tu sinh","Tư tế","Linh mục","Giám mục","Thánh nhân"],"income":[0.8,1.3,2,3,4],"promoXp":[3,6,9,14],"promoTarget":[6,8,10,13],"hazard":0.8,"gains":{"INT":0.2,"LUCK":0.1},"start":"Bạn quỳ trước tượng Nữ thần Lumina, khoác lên mình tấm áo trắng của Giáo hội Thánh Quang.","promo":["Một trận dịch nhỏ bùng phát ở làng bên. Giáo hội cử bạn đến: chữa được, bạn sẽ được phong Tư tế.","Một linh hồn quỷ ám đứa con gái của trưởng làng. Bạn được giao làm lễ trừ tà, lần đầu tiên một mình.","Hội đồng Giám mục mở cuộc biện luận thần học. Bạn phải bảo vệ đức tin của mình trước những bộ óc sắc sảo nhất.","Thánh tích trong đền Sanctus chỉ phát sáng trước người được Nữ thần chọn. Đêm nay, đến lượt bạn chạm vào nó."],"quiet":["Những năm ấy bạn rửa vết thương, ban phép lành và nghe những lời xưng tội nặng trĩu.","Chuông nhà thờ điểm giờ cho từng ngày của bạn. Đức tin như ngọn nến, cần được che chở trước gió.","Bạn đi khắp các làng mạc chữa bệnh. Người ta gọi bạn bằng cái tên trìu mến của riêng họ."]},{"id":"smith","name":"Thợ rèn","stat":"STR","combat":false,"tags":["civil"],"desc":"Dựa vào Sức mạnh. Thu nhập ổn định, ít nguy hiểm","require":{"STR":5},"alt":{"STR":2,"anyFlags":["forge_adopted","huyet_mach_tho_ren"],"hint":"dòng máu thợ rèn"},"ranks":["Thợ phụ","Thợ rèn","Thợ cả","Bậc thầy lò rèn","Huyền thoại Lò Rèn Vĩnh Cửu"],"income":[1.2,2,2.8,4,5.5],"promoXp":[4,6,9,13],"promoTarget":[5,7,9,12],"hazard":0.9,"gains":{"STR":0.3},"start":"Lò rèn phả hơi nóng vào mặt bạn. Người thợ cả ném cho bạn chiếc búa: \"Đập. Đến khi nào tay ngươi biết nghe lời.\"","promo":["Thợ cả giao bạn rèn một con dao đi săn từ đầu đến cuối, không ai giúp. Lưỡi dao phải cắt được sợi tóc.","Một kỵ sĩ đặt bộ giáp ngực. Nếu nó đỡ được nhát rìu thử, tên bạn sẽ được khắc lên tường xưởng.","Người lùn ở Dãy Núi Răng Cưa thách bạn cùng rèn trong một cuộc thi. Chưa người ngoại tộc nào thắng họ.","Một khối Tinh Thiết từ trời rơi xuống. Nhà vua muốn một thanh kiếm từ nó, và chỉ một người được thử."],"quiet":["Tiếng búa của bạn vang lên mỗi sớm mai. Năm tháng trôi qua trong lửa đỏ và tro đen.","Bạn rèn lưỡi cày cho nông dân, móng ngựa cho lính, và đôi khi, một thanh kiếm đẹp đến nao lòng.","Hai cánh tay bạn rắn như sắt. Khách hàng đến từ những vùng ngày càng xa."]},{"id":"merchant","name":"Thương nhân","stat":"INT","combat":false,"tags":["civil"],"desc":"Dựa vào Trí tuệ, cần vốn. Giàu nhanh nhất nếu gặp thời","require":{"INT":5,"wealth":35},"alt":{"INT":3,"anyFlags":["merchant_kin","merchant_born","nhay_ben_thuong_mai","merchant_guard"],"hint":"sinh ra trong nhà buôn"},"ranks":["Người bán rong","Chủ sạp","Thương gia","Đại thương gia","Thương vương"],"income":[1.2,2.5,4,6,8.5],"promoXp":[3,5,8,12],"promoTarget":[6,8,10,13],"hazard":1,"gains":{"INT":0.15,"LUCK":0.15},"start":"Bạn đẩy chiếc xe hàng đầu tiên ra chợ. Mấy cuộn vải, ít muối, và một giấc mộng rất lớn.","promo":["Một lô hàng gia vị từ phương xa cập bến. Nếu bạn dám dốc hết vốn, có thể bạn sẽ có một sạp hàng riêng.","Thương Đoàn Sói Bạc mời bạn tham gia một chuyến hàng xuyên Thảo Nguyên Gió Hú. Lời gấp mười, rủi ro cũng vậy.","Hội đồng thương nhân Sanctus mở đấu giá độc quyền muối cho cả vùng. Những con cáo già nhất đều có mặt.","Nhà vua cần một khoản vay để nuôi quân. Ai cho vay sẽ có quyền kiểm soát thương lộ của cả vương quốc."],"quiet":["Những năm ấy bạn mua rẻ bán đắt, đếm tiền dưới ánh nến và mặc cả với cả thế giới.","Đoàn xe hàng của bạn lăn bánh qua nhiều mùa. Có năm lãi to, có năm suýt trắng tay.","Bạn học được rằng mọi thứ đều có giá. Có những thứ cái giá ấy làm bạn mất ngủ."]},{"id":"farmer","name":"Nông dân","stat":"STR","combat":false,"tags":["civil"],"desc":"Không cần điều kiện. Bình yên, nghèo nhưng đủ sống","ranks":["Tá điền","Nông dân","Chủ trại","Địa chủ","Hào phú"],"income":[1,1.4,2,3,4.2],"promoXp":[4,7,10,15],"promoTarget":[4,6,8,10],"hazard":0.7,"gains":{"STR":0.2},"start":"Bạn nhận một mảnh ruộng nhỏ ở rìa làng. Đất đen, ẩm và thơm, như đang chờ bạn.","promo":["Mùa màng năm ấy bội thu. Nếu bạn khéo tính, số thóc dư đủ để mua lại mảnh ruộng mình đang thuê.","Một cơn hạn hán quét qua vùng. Nếu bạn đào được con kênh dẫn nước kịp mùa, ruộng nhà bạn sẽ thành trang trại lớn nhất làng.","Lãnh chúa rao bán vùng đất hoang phía đông. Biến nó thành ruộng tốt là việc
