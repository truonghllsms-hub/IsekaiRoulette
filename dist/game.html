c chiến thần thánh, một nhóm Mạo hiểm giả xông vào hang sâu với thứ ánh sáng chói lòa. Bằng hàm răng ố vàng và sự điên cuồng, bạn cắm ngập dao vào cổ họng gã pháp sư trẻ tuổi.","effects":{"STR":2,"joy":10,"wealth":8}},{"id":"goblin_adult_breed","races":["goblin"],"stages":["adult"],"weight":8,"text":"Bản năng duy trì nòi giống bùng lên trong bóng tối nhớp nháp của hang ổ, nơi bầy đàn bấu víu vào nhau. Bạn để lại vô số mầm mống dị hợm, giao phó sinh mạng chúng cho quy luật chọn lọc nghiệt ngã của vực sâu.","effects":{"health":-5,"joy":5,"flags":["partner"]}},{"id":"goblin_adult_sacrilege","races":["goblin"],"stages":["adult"],"weight":5,"require":{"flags":["hated"]},"text":"Nhân danh sự đố kỵ bẩm sinh, bạn đập phá một bệ thờ Nữ thần Lumina bị bỏ hoang ở ven bìa rừng. Cảm giác báng bổ thần linh mang lại cho linh hồn ti tiện của bạn một sự thỏa mãn đến tột độ.","effects":{"joy":8,"LUCK":-1}},{"id":"goblin_adult_rank","races":["goblin"],"stages":["adult"],"weight":7,"require":{"STR":4},"text":"Bạn thách đấu một gã to xác để tranh đoạt vị trí đội trưởng trinh sát của bầy. Bằng một cú cắn lén vào yết hầu, bạn bước lên xác hắn, khẳng định vị thế máu lạnh trong hang động.","effects":{"STR":1,"wealth":10,"flags":["hobgoblin_blood"]}},{"id":"goblin_adult_escort","races":["goblin"],"stages":["adult"],"weight":6,"require":{"flags":["chief_son"]},"text":"Lão Tù Trưởng ục ịch với chiếc vương miện bằng sọ thú yêu cầu bạn hộ tống hắn qua khu rừng tử khí. Từng bước đi của bạn mang theo sứ mệnh bảo vệ kẻ độc tài của bộ tộc, dẫu lòng tràn ngập sát tâm.","effects":{"AGI":1,"joy":-5,"wealth":5}},{"id":"goblin_adult_scavenge","races":["goblin"],"stages":["adult"],"once":false,"weight":4,"text":"Bạn đào bới cật lực trong núi rác khổng lồ của một thành trì loài người vừa bị đánh sập. Vận mệnh đôi khi ưu ái ban cho những sinh vật hèn mọn một mẩu pho mát mốc hay một đồng xu gỉ.","effects":{"wealth":3,"health":-2}},{"id":"goblin_adult_meatshield","races":["goblin"],"stages":["adult"],"eras":["demon_lord"],"weight":10,"text":"Quân Đoàn Hủy Diệt tràn qua vương quốc, và một gã Chỉ huy Orc tàn bạo tóm lấy bạn làm lá chắn thịt để đỡ đòn ma pháp của Thánh Vệ Quân. Bóng tối vĩ đại của Ma Vương bao trùm, ép bạn vào khoảnh khắc sinh tử định mệnh.","choices":[{"label":"Vùng vẫy né tránh","check":{"stat":"AGI","target":6},"success":{"text":"Bạn ranh mãnh luồn qua nách gã Orc, để tia sáng thần thánh thiêu rụi hắn trong khi bạn cắm đầu tẩu thoát thành công.","effects":{"AGI":1,"wealth":15},"moment":"Thoát chết ngoạn mục khỏi bàn tay của cả phe Thiện lẫn phe Ác."},"fail":{"text":"Chuyển động chậm chạp khiến bạn hứng trọn Quả cầu lửa thiêng, đau đớn tan biến thành tro bụi rác rưởi.","death":"Chết cháy ở tuổi {age} khi bị ép làm lá chắn thịt cho tà ác."}},{"label":"Cuộn tròn cam chịu","text":"Phép thuật sượt qua da lưng bạn, để lại vết sẹo bỏng rát, nhưng bạn vẫn giữ được mạng sống hèn mọn nhờ lớp mỡ và bùn đất.","effects":{"health":-15,"joy":-10}}]},{"id":"goblin_adult_shaman","races":["goblin"],"stages":["adult"],"weight":6,"require":{"INT":3},"text":"Bạn lén nhìn trộm nghi thức Hắc Nguyệt Hội và bất chợt cảm nhận được dòng chảy mana đen tối. Một tia lửa ma quỷ lóe lên trên đầu ngón tay sần sùi, đánh thức ma pháp sư tiềm năng trong bạn.","effects":{"INT":2,"joy":5,"flags":["shaman"]}},{"id":"goblin_adult_beast","races":["goblin"],"stages":["adult"],"once":false,"weight":5,"text":"Một con sói hoang sắp chết đói nhe nanh đe dọa, nhưng bạn ném cho nó khúc xương còn dính chút thịt thối. Đôi mắt hoang dại của nó dịu lại, chấp nhận trở thành nanh vuốt của bạn trong màn đêm.","effects":{"AGI":1,"STR":1,"flags":["tamed_pet"]}},{"id":"goblin_adult_mine","races":["goblin"],"stages":["adult"],"eras":["peace"],"once":false,"weight":7,"text":"Bạn bị bắt làm phu phen đào bới Lõi Mana trong Vực Thẳm Phân Tầng cho bọn Orc. Lưng còng xuống vì roi vọt, nhưng thỉnh thoảng bạn vẫn giấu được vài vụn tinh thể lấp lánh vào khố.","effects":{"health":-5,"wealth":8,"joy":-3}},{"id":"goblin_middle_survivor","races":["goblin"],"stages":["middle"],"weight":8,"text":"Xung quanh bạn, những kẻ cùng lứa đã bỏ mạng gần hết vì gươm đao và bệnh tật. Bạn gom lũ ấu tể da xanh lại, khàn giọng dạy chúng cách giả chết để sống sót trước Thánh Vệ Quân.","effects":{"INT":1,"joy":5}},{"id":"goblin_middle_injury","races":["goblin"],"stages":["middle"],"weight":9,"require":{"below":{"health":60}},"text":"Một nhát kiếm oan nghiệt từ Tuần Lâm Trọng Vệ đã vĩnh viễn tước đi con mắt trái của bạn. Máu đen chảy dài trên khuôn mặt già nua, nhắc nhở bạn về cái giá của việc sinh tồn tại Đại Ngàn Lục Bảo.","effects":{"health":-15,"AGI":-1,"LUCK":-1}},{"id":"goblin_middle_revolt","races":["goblin"],"stages":["middle"],"weight":10,"require":{"flags":["hobgoblin_blood"]},"text":"Tù trưởng hiện tại đã béo phệ và ốm yếu, mùi của sự rệu rã kích thích dã tâm lật đổ trong bạn. Trong đêm trăng máu, bạn siết chặt con dao tẩm độc tiến về phía ngai vàng bằng đá rêu phong.","choices":[{"label":"Ám sát chớp nhoáng","check":{"stat":"AGI","target":7},"success":{"text":"Cổ họng lão đứt phăng trước khi kịp la lên, bầy đàn kinh hãi quỳ rạp dưới chân Tù trưởng mới là bạn.","effects":{"wealth":20,"joy":15,"flags":["chief"]},"moment":"Tự tay đoạt lấy vương miện rỉ sét bằng một nhát dao đoạt mạng."},"fail":{"text":"Lão già tỉnh giấc kịp thời và giáng một cú chùy nát bét lồng ngực bạn.","death":"Bị Tù trưởng đương nhiệm đập nát sọ ở tuổi {age} vì mưu phản thất bại."}},{"label":"Bỏ thuốc độc âm thầm","text":"Bạn lén bỏ nấm độc vào máng ăn của lão, nhưng lão đã nếm thử và bắt một kẻ khác chết thay, kế hoạch lật đổ tạm thời đổ vỡ.","effects":{"joy":-5,"wealth":-5}}]},{"id":"goblin_middle_garbage_god","races":["goblin"],"stages":["middle"],"eras":["dark_age"],"weight":6,"text":"Khi nạn đói càn quét, bạn tuyệt vọng dựng lên một cái bệ thờ từ xương vụn để cầu nguyện Nữ thần Rác Rưởi. Một con chuột béo ngậy từ đâu rơi xuống bệ, thắp lên niềm tin mù quáng trong mắt bầy đàn.","effects":{"health":8,"joy":10}},{"id":"goblin_middle_guide","races":["goblin"],"stages":["middle"],"weight":7,"text":"Thương Đoàn Sói Bạc bị lạc vào Đầm Lầy Tử Khí, và bạn đàm phán để dẫn đường cho họ đổi lấy Tinh Bạc. Vừa đi bạn vừa mỉm cười ranh mãnh, cẩn thận lách qua mép những vũng bùn lầy chết chóc.","effects":{"wealth":15,"INT":1}},{"id":"goblin_middle_betrayal","races":["goblin"],"stages":["middle"],"weight":8,"require":{"LUCK":4},"text":"Để giữ lại cái mạng già, bạn rạp mình chỉ điểm vị trí hang ổ của bầy đàn cho đám lính đánh thuê. Tiếng gào thét của đồng loại vang lên phía sau lưng, còn bạn thì run rẩy đếm những đồng xu lạnh lẽo.","effects":{"wealth":20,"joy":-10,"flags":["traitor"]}},{"id":"goblin_middle_magic_relic","races":["goblin"],"stages":["middle"],"once":false,"weight":5,"text":"Nhặt được một cuộn giấy ma pháp rách nát từ Tháp Ngà, bạn cố gắng đánh vần những cổ ngữ phát sáng. Đầu bạn đau như búa bổ, nhưng một lượng tri thức vụn vặt đã kịp khắc sâu vào não bộ tối tăm.","effects":{"INT":2,"health":-5}},{"id":"goblin_middle_veteran","races":["goblin"],"stages":["middle"],"eras":["holy_war"],"weight":6,"text":"Cuộc chiến dai dẳng giữa Ma Vương và Thánh Quang biến bạn thành một kẻ lão luyện trong việc hôi của xác chết. Bạn thản nhiên lột chiếc huy hiệu mạ vàng từ một hiệp sĩ vừa ngã xuống giữa vũng bùn.","effects":{"wealth":12,"AGI":1}},{"id":"goblin_middle_cannibal","races":["goblin"],"stages":["middle"],"once":false,"weight":5,"require":{"flags":["cannibal"]},"text":"Lương thực lại cạn kiệt. Khứu giác nhạy bén của bạn hướng về phía những kẻ đang bị thương nặng trong góc hang, và bữa tối ác mộng lại tiếp diễn để duy trì sinh mệnh tàn tạ của bạn.","effects":{"health":10,"joy":-8}},{"id":"goblin_middle_shaman_ritual","races":["goblin"],"stages":["middle"],"weight":6,"require":{"flags":["shaman"]},"text":"Bạn vẽ những pháp trận ngoằn ngoèo bằng máu giun đất, tự phong mình là Pháp Sư tối cao của bầy. Dù chỉ là chút ma lực vay mượn rẻ mạt, lũ Goblin ngu muội vẫn rạp mình tôn kính bạn như thần linh.","effects":{"joy":15,"LUCK":1}},{"id":"goblin_elder_record","races":["goblin"],"stages":["elder"],"weight":10,"text":"Vượt qua mốc tuổi thọ ngắn ngủi của giống loài, da bạn nhăn nheo như vỏ cây khô và rụng sạch nanh. Lũ Goblin trẻ nhìn bạn bằng ánh mắt kính sợ, coi bạn như một hóa thạch sống hiếm hoi của vực thẳm.","effects":{"LUCK":2,"health":-5}},{"id":"goblin_elder_dragon_memory","races":["goblin"],"stages":["elder"],"weight":8,"text":"Trong cơn mê sảng tuổi già, ký ức về cái bóng khổng lồ của Cổ Long lướt qua Đảo Tro Tàn năm xưa lại ùa về. Sự run rẩy nguyên thủy khắc sâu vào tận xương tủy, nhắc nhở bạn rằng sinh mệnh này rốt cuộc vẫn chỉ là hạt bụi.","effects":{"joy":-10,"INT":1}},{"id":"goblin_elder_sacrifice","races":["goblin"],"stages":["elder"],"eras":["demon_lord"],"weight":7,"text":"Ma Vương giáng thế cần sinh khí để phục hồi, và những lão Goblin vô dụng như bạn bị lùa vào pháp trận hiến tế. Bạn nhìn ngọn lửa hắc ám cắn nuốt cơ thể mình, thanh thản đón nhận cái kết đã định sẵn từ khi lọt lòng.","effects":{"health":-25,"joy":-5}},{"id":"hd_siblings","races":["high_demon"],"stages":["infant"],"weight":10,"text":"Trong cung điện tăm tối, chỉ một hậu duệ được phép kế vị. Khi bạn mở mắt lần đầu, hai người anh em đã nằm bất động bên cạnh.","effects":{"STR":1,"INT":1}},{"id":"hd_blood_pact","races":["high_demon"],"stages":["infant","child"],"weight":8,"text":"Bạn lập khế ước máu đầu tiên với một con quái vật hầm ngục. Nó quỳ xuống, và bạn hiểu rằng mọi sinh linh rồi cũng sẽ quỳ như thế.","effects":{"INT":2},"moment":"Khế ước máu đầu tiên"},{"id":"hd_cult","races":["high_demon"],"stages":["child"],"weight":8,"text":"Bạn gieo những lời thì thầm vào giấc mơ của loài người. Không lâu sau, Hắc Nguyệt Hội ra đời và tôn thờ bạn như một vị thần.","effects":{"INT":1,"wealth":20,"flags":["cult_lord"]},"moment":"Khai sinh Hắc Nguyệt Hội"},{"id":"hd_ms_holy_war","races":["high_demon"],"stages":["teen","adult"],"weight":10,"text":"Tham vọng của bạn đã chạm tới đỉnh điểm. rk","races":["human"],"stages":["infant"],"weight":6,"text":"Bàn tay bé xíu của bạn vô tình chạm vào một mảnh Lõi Mana vụn vỡ, khiến nó lóe lên ánh sáng xanh huyền bí. Ma lực nguyên thủy từ thuở khai thiên lập địa dường như đã ghi nhận sự tồn tại của một dị nhân tương lai.","effects":{"INT":1,"joy":5,"flags":["mana_affinity"]}},{"id":"human_infant_plague_survivor","races":["human"],"stages":["infant"],"eras":["dark_age"],"weight":7,"text":"Cơn đại dịch đen tối quét qua vương quốc cướp đi sinh mạng hàng ngàn đứa trẻ, nhưng bạn đã kiên cường vượt qua cơn sốt ác tính. Ngọn lửa sống sót hừng hực bốc lên từ đống tro tàn của sự tuyệt vọng, rèn giũa một cơ thể dẻo dai.","effects":{"STR":1,"health":-5,"flags":["plague_survivor"]}},{"id":"human_infant_wolf_howl","races":["human"],"stages":["infant"],"once":false,"weight":5,"text":"Trong đêm đen, tiếng sói tru từ Thảo Nguyên Gió Hú vọng về khiến bạn giật mình thao thức. Bản năng hoang dã trỗi dậy trong huyết quản, vẫy gọi bạn hướng về những vùng đất chưa ai khai phá.","effects":{"joy":-3,"AGI":1}},{"id":"human_infant_crying_night","races":["human"],"stages":["infant"],"once":false,"weight":6,"text":"Bạn gào khóc suốt đêm dài, xé toạc bầu không khí tĩnh mịch và khiến những người chăm sóc mệt nhoài. Dù chỉ là một sinh linh bé nhỏ, bạn đã biết cách bắt cả thế giới phải lắng nghe tiếng nói của mình.","effects":{"health":3,"joy":-2}},{"id":"human_infant_war_siren","races":["human"],"stages":["infant"],"eras":["holy_war"],"weight":7,"text":"Tiếng kèn hiệu triệu của Thánh Vệ Quân gầm rú vang rền khắp các nẻo đường thủ đô Sanctus. Rung chấn của chiến tranh dội vào tận nôi, in hằn bóng hình của những thanh gươm giáo mác vào tâm trí non nớt.","effects":{"STR":1,"joy":-5,"flags":["war_child"]}},{"id":"human_infant_strange_mark","races":["human"],"stages":["infant"],"weight":5,"text":"Trên vai bạn xuất hiện một vết bớt kỳ lạ có hình dáng giống hệt Cây Thế Giới Yggdrasil. Những tín đồ Tự Nhiên Giáo tin rằng bạn là một mầm non được rừng thẳm lựa chọn cho một sứ mệnh lớn lao.","effects":{"LUCK":1,"flags":["yggdrasil_mark"]}},{"id":"human_infant_demon_aura","races":["human"],"stages":["infant"],"eras":["demon_lord"],"weight":8,"text":"Bầu trời chuyển màu rực đỏ khi Ma Vương tỉnh giấc, một luồng sát khí lạnh lẽo quét qua cái nôi khiến bạn nín bặt. Bóng đen thống trị Aethelgard đã gửi một lời chào chết chóc đến thế hệ tương lai của nhân loại.","effects":{"health":-8,"joy":-10}},{"id":"human_infant_merchant_bribe","races":["human"],"stages":["infant"],"require":{"flags":["merchant_kin"]},"weight":5,"text":"Một đối tác làm ăn của gia đình nhét vào tay bạn một Đồng Cẩm Thạch sáng lấp lánh như món quà hối lộ. Bạn nắm chặt đồng tiền, bản năng tích lũy của loài người sớm được đánh thức.","effects":{"wealth":5,"INT":1}},{"id":"human_infant_first_step_choice","races":["human"],"stages":["infant"],"weight":12,"text":"Bạn lẫm chẫm tập đi những bước đầu tiên trong đời. Trước mặt bạn là một thanh kiếm gỗ sứt mẻ của binh lính và một vòng tay người thân đang giang rộng chờ đón.","choices":[{"label":"Lao về phía thanh kiếm gỗ","check":{"stat":"AGI","target":3},"success":{"text":"Bạn chập chững bước tới và tóm chặt lấy cán kiếm, đôi mắt sáng rực tham vọng chiến đấu. Định mệnh chiến binh đã khắc sâu vào linh hồn bạn.","effects":{"STR":1,"flags":["weapon_interest"]}},"fail":{"text":"Đôi chân non nớt vấp ngã sóng soài, trán đập xuống sàn nhà đau điếng. Tham vọng quá lớn đôi khi phải trả giá bằng máu và nước mắt.","effects":{"health":-5,"joy":-5}}},{"label":"Ngã vào vòng tay an toàn","text":"Bạn cười khúc khích và ngã vào lòng người lớn, tận hưởng sự bao bọc ấm áp. Sự cẩn trọng này sẽ là khiên chắn giúp bạn sinh tồn trên lục địa đầy rẫy hiểm nguy.","effects":{"joy":5,"health":5}}]},{"id":"human_child_street_rat","races":["human"],"stages":["child"],"require":{"flags":["poor"]},"weight":6,"text":"Bạn luồn lách qua khu chợ đông đúc và nẫng thành công một Đồng Cẩm Thạch từ túi của tay quý tộc béo ngậy. Thế giới này không từ bi, kẻ khôn ngoan và nhanh tay mới là kẻ có được cái ăn.","effects":{"AGI":1,"wealth":3,"flags":["thief_skill"]}},{"id":"human_child_church_choir","races":["human"],"stages":["child"],"weight":7,"text":"Bạn tham gia dàn đồng ca của Giáo hội Thánh Quang, hát những bản thánh ca ca ngợi Nữ thần Lumina. Dưới những mái vòm vĩ đại, đức tin của loài người đan xen thành một lá chắn tinh thần vững chắc.","effects":{"INT":1,"joy":5,"flags":["choir_member"]}},{"id":"human_child_merchant_caravan","races":["human"],"stages":["child"],"eras":["peace"],"weight":6,"text":"Đoàn xe ngựa cồng kềnh của Thương Đoàn Sói Bạc đi ngang qua thị trấn, mang theo lụa là và hương liệu từ tít tận Đảo Tro Tàn. Kỷ nguyên hòa bình phô bày những kỳ quan mà tiền bạc có thể mang lại.","effects":{"LUCK":1,"joy":8}},{"id":"human_child_mud_fight","races":["human"],"stages":["child"],"once":false,"weight":5,"text":"Cùng lũ trẻ con trong xóm, bạn tham gia vào một cuộc ném bùn nảy lửa sau cơn mưa đầu mùa Nảy Mầm. Tiếng cười vang vọng xua tan đi bóng tối u ám thường trực trên bầu trời Aethelgard.","effects":{"STR":1,"joy":10,"health":-3}},{"id":"human_child_magic_trick","races":["human"],"stages":["child"],"require":{"flags":["mana_affinity"]},"weight":8,"text":"Bạn vô tình vận sức và khiến một chiếc lá khô bay lơ lửng trên lòng bàn tay. Bí mật về sức mạnh ma thuật chảy trong huyết quản nhân loại đã hé lộ một tia sáng kỳ diệu.","effects":{"INT":1,"joy":5}},{"id":"human_child_refugee_march","races":["human"],"stages":["child"],"eras":["holy_war"],"weight":9,"text":"Dòng người tị nạn lê bước trong hoảng loạn khi chiến sự lan đến Đồng Bằng Thánh Quang. Đôi chân nhỏ bé rướm máu vì đường dài, nhưng bạn học được cách cắn răng chịu đựng nghịch cảnh.","effects":{"STR":1,"health":-10,"joy":-15}},{"id":"human_child_starving_days","races":["human"],"stages":["child"],"eras":["dark_age"],"weight":7,"text":"Nạn đói hoành hành, gia đình bạn phải tước vỏ cây và luộc rễ cỏ để qua cơn bình. Sinh mệnh của bạn treo lơ lửng trên sợi chỉ mỏng manh của số phận bạc bẽo.","effects":{"health":-15,"STR":-1}},{"id":"human_child_nature_whisper","races":["human"],"stages":["child"],"require":{"flags":["yggdrasil_mark"]},"weight":6,"text":"Trong giấc mơ, những rễ cây khổng lồ của Đại Ngàn Lục Bảo uốn lượn và thì thầm gọi tên bạn. Cổ ngữ của tinh linh dệt nên một vòng kết giới mờ nhạt bảo vệ tâm trí bạn khỏi ác mộng.","effects":{"INT":1,"health":5}},{"id":"human_child_demon_scout","races":["human"],"stages":["child"],"eras":["demon_lord"],"weight":9,"text":"Đang chơi trốn tìm, bạn bắt gặp một con tiểu quỷ thám báo đẫm máu đang thoi thóp giấu mình sau bụi rậm. Ánh mắt tàn độc của loài ma vật in sâu vào ký ức tuổi thơ, một lời cảnh báo về cuộc chiến đẫm máu sắp tới.","effects":{"AGI":1,"joy":-10,"flags":["saw_demon"]}},{"id":"human_child_sickle_practice","races":["human"],"stages":["child"],"once":false,"weight":5,"text":"Bạn vác chiếc liềm cùn ra đồng giúp người lớn gặt lúa mì dưới cái nắng gắt của mùa Lửa Trại. Từng giọt mồ hôi rơi xuống đất mẹ đã hun đúc nên sức chịu đựng phi thường của bạn.","effects":{"STR":1,"health":5,"wealth":2}},{"id":"human_child_story_hero","races":["human"],"stages":["child"],"once":false,"weight":6,"text":"Ngồi bên đống lửa, một gã mạo hiểm giả cụt tay kể về những chiến công hiển hách của Bình Minh Hội. Lời ca tụng vinh quang anh hùng thổi bùng ngọn lửa khát vọng phiêu lưu trong lồng ngực bạn.","effects":{"joy":8,"flags":["hero_dream"]}},{"id":"human_child_lost_woods","races":["human"],"stages":["child"],"weight":7,"text":"Bạn mải đuổi theo một con bướm phát sáng và lạc sâu vào ranh giới hiểm ác của Đầm Lầy Tử Khí. Phải nhờ đến sự may mắn tột độ, bạn mới trốn thoát khỏi đám sương mù ăn mòn xương cốt.","effects":{"LUCK":1,"health":-8,"joy":-5}},{"id":"human_child_noble_bullying","races":["human"],"stages":["child"],"require":{"notFlags":["noble"]},"weight":6,"text":"Một đám trẻ con quý tộc cậy thế đã đẩy bạn ngã nhào xuống vũng bùn dơ dáy chỉ vì bạn dám ngẩng đầu nhìn chúng. Sự phẫn nộ trước ách thống trị giai cấp đã gieo mầm mống nổi loạn vào trái tim bạn.","effects":{"STR":1,"joy":-8,"flags":["hate_nobles"]}},{"id":"human_child_noble_etiquette","races":["human"],"stages":["child"],"require":{"flags":["noble"]},"weight":6,"text":"Gia sư nghiêm khắc dùng thước kẻ gõ vào tay bạn, ép bạn phải học cách nhấp trà sao cho chuẩn mực của giới tinh hoa Sanctus. Quyền lực đi kèm với những sợi xích vô hình trói buộc tuổi thơ.","effects":{"INT":1,"joy":-10,"flags":["etiquette_trained"]}},{"id":"human_child_stargazing","races":["human"],"stages":["child"],"once":false,"weight":5,"text":"Nằm dài trên mái nhà ngắm nhìn bầu trời rải rác những vì sao Tinh Bạc, bạn chợt nhận ra nhân loại nhỏ bé dường nào giữa vũ trụ bao la. Tâm hồn bạn tìm thấy một khoảnh khắc bình yên hiếm hoi giữa thế giới điên đảo.","effects":{"INT":1,"joy":10}},{"id":"human_child_blacksmith_watch","races":["human"],"stages":["child"],"weight":6,"text":"Lò Rèn Vĩnh Cửu tỏa ra sức nóng hầm hập, phô diễn nghệ thuật rèn đúc vũ khí rực lửa của nhân loại và người lùn. Đôi mắt bạn không thể rời khỏi những lưỡi gươm thép đang thành hình, khao khát một ngày được tự tay vung chúng chém gục ác quỷ.","effects":{"STR":1,"joy":5}},{"id":"human_child_beggar","races":["human"],"stages":["child"],"require":{"flags":["poor"]},"weight":5,"text":"Cái bụng đói meo ép bạn quỳ gối trước cổng nhà thờ Thánh Quang xin từng mảnh vụn bánh mì thừa. Sự tủi nhục sớm rèn luyện cho bạn sự nhẫn nhịn sắt đá trước hiện thực tàn khốc của xã hội loài người.","effects":{"joy":-5,"wealth":3}},{"id":"human_child_rat_catching","races":["human"],"stages":["child"],"once":false,"weight":5,"text":"Bạn được thuê bắt chuột cống trong hầm chứa lúa mạch của lão trưởng làng. Công việc bẩn thỉu nhưng mang lại những đồng Cẩm Thạch quý giá giúp một kiếp người nhỏ bé có thể sống sót thêm vài ngày.","effects":{"AGI":1,"wealth":4}},{"id":"human_child_ruins_explore","races":["human"],"stages":["child"],"weight":6,"text":"Lẻn vào phế tích cũ kỹ ở ngoại ô thị trấn, bạn đào bới đất đá và nhặt được một mảnh Tinh Bạc xỉn màu. Một tia sáng của nữ thần may mắn vừa mỉm cười giữa vô vàn rủi ro rình rập trên lục địa.","effects":{"INT":1,"LUCK":1,"wealth":10}},{"id":"human_child_harvest_festival","races":["human"],"stages":["child"],"eras":["peace"],"weight":7,"text":"Lễ hội Lửa Trại thắp sáng Đồng Bằng Thánh Quang, người dân hân hoan nhảy múa quanh đống lửa ăn mừng vụ mùa bội thu. Bạn được hòa mình vào niềm vui hội hè hiếm hoi của nhân loại trước khi giông bão thời đại ập đến.","effects":{"joy":10,"health":5}},{"id":"human_child_military_draft_see","races":["human"],"stages":["child"],"eras":["holy_war"],"weight":7,"text":"Từng đoàn lính trẻ tuổi bị áp giải ra tuyến đầu, ánh mắt họ trống rỗng dưới lá cờ hiệu của Thánh Vệ Quân. Khung cảnh ấy gieo vào tâm trí non nớt của bạn một nỗi kinh hoàng tột độ về sự tàn khốc của chiến tranh.","effects":{"joy":-10,"health":-3}},{"id":"human_child_climbing_tree","races":["human"],"stages":["child"],"once":false,"weight":5,"text":"Bạn thoăn thoắt trèo lên ngọn cây sồi già nhất làng để bắt chim non, thỏa mãn bản tính tò mò khám phá. Đôi tay trầy xước rướm máu nhưng đổi lại là niềm tự hào chiến thắng vặt vãnh của tuổi thơ.","effects":{"AGI":1,"health":-3,"joy":5}},{"id":"human_child_reading_book","races":["human"],"stages":["child"],"require":{"flags":["educated"]},"weight":6,"text":"Những ngón tay nhỏ bé lần theo từng dòng chữ cổ trên trang giấy da cừu ố vàng của thư viện. Trí tuệ của tiền nhân đang rỉ tai bạn những bí mật vĩ đại bị vùi lấp của lục địa Aethelgard.","effects":{"INT":1,"joy":5}},{"id":"human_child_fever_survive","races":["human"],"stages":["child"],"eras":["dark_age"],"weight":7,"text":"Mùa Lá Héo mang theo cơn sốt rét run người, cướp đi sinh mạng của nhiều bạn bè đồng trang lứa. Bạn một lần nữa gồng mình đánh lừa tử thần, thân thể tuy gầy gò nhưng ý chí sống còn càng thêm mãnh liệt.","effects":{"health":-10,"STR":1,"joy":-5}},{"id":"human_child_yggdrasil_leaf","races":["human"],"stages":["child"],"require":{"flags":["yggdrasil_mark"]},"weight":6,"text":"Một chiếc lá ngọc lục bảo rực rỡ từ Đại Ngàn Lục Bảo cuốn theo chiều gió vô tình rơi trúng tay bạn. Năng lượng sinh mệnh êm ái xoa dịu những vết thương, như một lời chúc phúc tĩnh lặng từ mẹ thiên nhiên.","effects":{"LUCK":1,"health":15}},{"id":"human_child_stray_dog","races":["human"],"stages":["child"],"weight":8,"text":"Một con chó hoang khổng lồ, sùi bọt mép với đôi mắt đỏ ngầu chặn ngang hẻm nhỏ khi bạn đang ôm ổ bánh mì vừa xin được.","choices":[{"label":"Cầm gậy gỗ đánh đuổi","check":{"stat":"STR","target":4},"success":{"text":"Bạn nhắm mắt phang một gậy chí mạng vào mõm khiến con ác thú kêu ăng ẳng rồi cụp đuôi bỏ chạy. Mầm mống của một dũng sĩ kiên cường đã sớm nảy nở trong hình hài nhỏ bé.","effects":{"STR":1,"joy":8}},"fail":{"text":"Con chó điên xé nát khúc gỗ rồi ngoạm chặt lấy cánh tay bạn, để lại một vết sẹo gớm ghiếc và nỗi ám ảnh kinh hoàng.","effects":{"health":-15,"joy":-10}}},{"label":"Ném bánh mì để tẩu thoát","text":"Bạn cay đắng ném bữa ăn quý giá xuống bùn để đánh lạc hướng con thú. Cuộc sống đường phố đã dạy bạn rằng đôi khi lùi bước là cách duy nhất để giữ lại mạng sống.","effects":{"wealth":-3,"joy":-5,"health":-3}}]},{"id":"human_child_river_drowning","races":["human"],"stages":["child"],"weight":9,"text":"Một đứa trẻ con quý tộc trượt chân ngã xuống dòng sông cuộn xiết ở rìa thành phố. Bọn người hầu hoảng loạn gào thét trên bờ nhưng không một kẻ nào dám liều mạng nhảy xuống.","choices":[{"label":"Liều mình nhảy xuống dòng nước","check":{"stat":"AGI","target":5},"success":{"text":"Bằng sự nhanh nhẹn đáng kinh ngạc, bạn luồn lách qua dòng nước hung hãn và kéo được đứa bé lên bờ an toàn. Hành động dũng cảm này mang về cho bạn một khoản hậu tạ kếch xù.","effects":{"AGI":1,"wealth":20,"flags":["noble_favor"]},"moment":"Trở thành ân nhân của một gia tộc quyền quý từ thuở nhỏ."},"fail":{"text":"Bản lĩnh không đủ để chống lại sức mạnh của thiên nhiên, bạn bị dòng nước xoáy hung dữ kéo tuột xuống đáy bùn sâu thẳm.","death":"Dòng nước lạnh giá vùi lấp tiếng kêu cứu tuyệt vọng, vĩnh viễn khép lại sinh mệnh ngắn ngủi của bạn ở tuổi {age}."}},{"label":"Chỉ đứng nhìn và hô hoán","text":"Bạn chọn sự an toàn, trơ mắt nhìn thân ảnh nhỏ bé kia bị dòng sông nuốt chửng. Tiếng khóc than ám ảnh khắc sâu vào tâm khảm bạn một sự bất lực chua xót.","effects":{"joy":-10}}]},{"id":"human_child_steal_food","races":["human"],"stages":["child"],"weight":7,"text":"Trên sạp hàng của gã thương nhân bụng bự có bày biện một chùm quả hạch đỏ mọng. Dạ dày bạn đang réo lên những hồi trống cồn cào báo hiệu giới hạn của cơn đói.","choices":[{"label":"Chớp thời cơ ăn cắp","check":{"stat":"AGI","target":4},"success":{"text":"Đôi tay thoăn thoắt cuỗm lấy thức ăn, bạn lẩn ngay vào đám đông như một bóng ma. Sinh tồn là kỹ năng trui rèn sắc bén nhất mà đường phố Aethelgard dạy bạn.","effects":{"AGI":1,"health":8,"flags":["thief_skill"]}},"fail":{"text":"Gã thương nhân tóm gọn cổ tay bạn và giáng xuống một trận đòn nhừ tử ngay giữa chợ. Nỗi đau thể xác tàn nhẫn nhắc nhở bạn về cái giá phải trả của sự liều lĩnh.","effects":{"health":-10,"joy":-8}}},{"label":"Cắn răng chịu đói bỏ đi","text":"Bạn bước đi với cái bụng rỗng tuếch, quyết giữ lại chút lòng tự trọng mỏng manh còn sót lại. Ở thế giới hỗn mang này, đạo đức đôi khi là thứ trang sức xa xỉ nhất.","effects":{"health":-6,"joy":-3,"flags":["honest"]}}]},{"id":"human_teen_growth_spurt","races":["human"],"stages":["teen"],"weight":6,"text":"Cơ thể thiếu niên của bạn vươn lên mạnh mẽ như loài cỏ dại sau mưa, gân cốt cứng cáp và vững chãi dần theo năm tháng. Lồng ngực bạn tràn trề sinh lực, sẵn sàng đối mặt với những thử thách sinh tử của một kiếp người.","effects":{"STR":1,"health":15}},{"id":"human_teen_demon_attack","races":["human"],"stages":["teen"],"eras":["demon_lord"],"weight":8,"text":"Tiền đồn ngoại ô bất ngờ bị vây hãm bởi Quân Đoàn Hủy Diệt, bóng cánh dơi che khuất cả mặt trời. Bạn buộc phải cầm lấy lưỡi hái thô sơ, lao vào hàng ngũ phòng thủ đẫm máu giữa cơn tuyệt vọng gào thét.","effects":{"STR":1,"health":-15,"joy":-10}},{"id":"human_teen_tavern_brawl","races":["human"],"stages":["teen"],"once":false,"weight":6,"text":"Chỉ vì một ánh nhìn khiêu khích trong quán rượu sặc mùi bia rẻ tiền, bạn không ngần ngại lao vào cuộc ẩu đả long trời lở đất. Những cú đấm bầm dập và máu mũi tuôn rơi dường như là thú vui hoang dại của tuổi trẻ.","effects":{"STR":1,"health":-5,"joy":5}},{"id":"human_teen_first_love","races":["human"],"stages":["teen"],"weight":8,"text":"Trái tim bạn loạn nhịp trước nụ cười tỏa nắng của một người bạn đồng trang lứa dưới bóng râm của cây sồi già. Tình yêu đầu đời nở rộ, trong trẻo, thuần khiết và rực rỡ như tia nắng bình minh trên Thảo Nguyên Gió Hú.","effects":{"joy":15,"flags":["first_love"]},"moment":"Biết rung động với mối tình đầu trong sáng thuở thiếu thời."},{"id":"human_teen_hunter_trap","races":["human"],"stages":["teen"],"require":{"flags":["hunter_blood"]},"weight":6,"text":"Vận dụng những kỹ năng sinh tồn được truyền thừa, bạn giăng bẫy thành công một con hươu sừng bạc quý hiếm. Chiến lợi phẩm khổng lồ này mang lại một khoản thu nhập kha khá và sự nể trọng trong giới thợ săn.","effects":{"AGI":1,"wealth":15}},{"id":"human_teen_sanctus_pilgrimage","races":["human"],"stages":["teen"],"eras":["peace"],"weight":7,"text":"Theo bước dòng người hành hương, bạn đặt chân đến thủ đô Sanctus phồn hoa rực rỡ dưới ánh nắng ôn hòa. Đứng trước sự tráng lệ của nền văn minh vĩ đại, lồng ngực bạn trào dâng một niềm kiêu hãnh khôn tả.","effects":{"INT":1,"joy":12}},{"id":"human_teen_ivory_tower_test","races":["human"],"stages":["teen"],"require":{"flags":["mana_affinity"]},"weight":9,"text":"Tháp Ma Pháp Bạch Ngà mở đợt kiểm tra tư chất định kỳ, và quả cầu pha lê bừng sáng dữ dội khi những ngón tay bạn vừa chạm vào. Bánh xe số mệnh chệch hướng, chính thức mở ra con đường trở thành một pháp sư cao quý.","effects":{"INT":2,"joy":10,"flags":["mage"]},"moment":"Chính thức bước chân vào thế giới của ma pháp huyền bí."},{"id":"human_teen_sword_training","races":["human"],"stages":["teen"],"once":false,"weight":5,"text":"Những buổi vung kiếm gỗ lặp đi lặp lại hàng ngàn lần đến rách cả da tay dưới cái nắng cháy da thịt. Khổ luyện đẫm mồ hôi và máu là con đường duy nhất để một con người bình phàm có thể chạm tới ngưỡng cửa sức mạnh phi thường.","effects":{"STR":1,"health":3}},{"id":"human_teen_mercenary_work","races":["human"],"stages":["teen"],"require":{"flags":["mercenary_camp"]},"weight":7,"text":"Nhận hợp đồng hộ tống đầu tiên từ Thương Đoàn Sói Bạc, bạn chính thức nếm mùi máu tanh của nghề lính đánh thuê. Lưỡi kiếm trong tay bạn từ nay không vung lên vì công lý, mà vì sức nặng của những đồng Huyết Kim.","effects":{"wealth":18,"health":-6,"flags":["job"]}},{"id":"human_teen_join_guild","races":["human"],"stages":["teen"],"weight":10,"text":"Bình Minh Hội đang dán cáo thị tuyển mộ tân binh tại quảng trường trung tâm. Những bộ giáp sáng bóng và ánh mắt kiêu hãnh của các bậc tiền bối như thổi bùng ngọn lửa vinh quang trong lồng ngực bạn.","choices":[{"label":"Ghi danh tham gia bài thi thể lực","check":{"stat":"STR","target":6},"success":{"text":"Bạn gồng mình trụ vững qua loạt đòn kiểm tra khắc nghiệt, vinh dự nhận lấy huy hiệu đồng của hội. Bầu trời phiêu lưu vô tận chính thức rộng mở trước mắt một mạo hiểm giả trẻ tuổi.","effects":{"STR":1,"wealth":5,"flags":["adventurer","job"]},"moment":"Gia nhập Bình Minh Hội, bắt đầu con đường mạo hiểm giả."},"fail":{"text":"Gã giám khảo lực lưỡng đánh gục bạn chỉ sau ba chiêu, ném bạn ra ngoài giữa những tiếng cười nhạo mỉa mai. Giấc mộng anh hùng tạm thời gãy cánh trong ê chề.","effects":{"health":-10,"joy":-12}}},{"label":"Tự biết thân phận và quay đi","text":"Bạn ngậm ngùi lùi bước, tự nhận thức được sự mỏng manh của cơ thể phàm nhân trước thế giới tàn khốc. Đôi khi, giữ mạng làm một dân thường sống qua ngày lại là phước báu lớn nhất.","effects":{"joy":-5,"flags":["civilian"]}}]},{"id":"human_teen_cult_temptation","races":["human"],"stages":["teen"],"weight":9,"text":"Trong một đêm sương mù dày đặc, một tu sĩ khoác áo choàng đen của Hắc Nguyệt Hội bất thần chặn đường. Hắn chìa ra một cuộn giấy nhuốm máu, hứa hẹn ban cho quyền năng ma quỷ để đổi lấy lòng trung thành.","choices":[{"label":"Chấp nhận nghi thức bóng tối","check":{"stat":"INT","target":6},"success":{"text":"Tâm trí kiên định giúp bạn chống chọi được sự cắn rứt của tà khí, hấp thu thành công sức mạnh hắc ám mà không mất đi lý trí. Bạn đang bước chân vào một ranh giới cực kỳ nguy hiểm nhưng đầy quyền lực.","effects":{"INT":2,"health":-5,"flags":["dark_magic"]},"moment":"Chạm tay vào quyền năng hắc ám của Hắc Nguyệt Hội."},"fail":{"text":"Tà khí quá hắc ám tràn vào đại não khiến bạn rơi vào trạng thái phát điên trong nhiều ngày. Phải nhờ đến ma thuật thanh tẩy của nhà thờ mới giữ lại được mạng sống tàn tạ.","effects":{"health":-20,"INT":-1,"joy":-15}}},{"label":"Rút vũ khí xua đuổi kẻ tà đạo","text":"Bạn kiên định với đức tin, lớn tiếng đe dọa khiến tên tu sĩ phải lẩn khuất vào màn sương. Hắn để lại một tràng cười nguyền rủa văng vẳng bên tai khiến bầu không khí thêm phần nghẹt thở.","effects":{"joy":-5,"LUCK":1}}]},{"id":"human_teen_bear_encounter","races":["human"],"stages":["teen"],"weight":10,"text":"Khi đang hái nấm sâu trong Rừng Thông Đen, một con gấu ma hóa khổng lồ đột ngột phá nát bụi rậm lao ra. Hàm răng lởm chởm đầy dãi nhớt của nó nhắm thẳng vào đầu bạn với tốc độ kinh hoàng.","choices":[{"label":"Rút dao găm liều mạng nghênh chiến","check":{"stat":"AGI","target":7},"success":{"text":"Nhanh như một tia chớp, bạn lách người né cú vồ chết chóc và đâm ngập lưỡi dao vào mắt con ác thú, khiến nó đau đớn gầm rú rồi bỏ chạy. Ranh giới sinh tử đã đánh thức hoàn toàn bản năng dã thú trong bạn.","effects":{"AGI":2,"LUCK":1,"joy":8}},"fail":{"text":"Lưỡi dao găm nhỏ bé gãy vụn khi chạm vào lớp da bọc thép cứng như đá của con quái vật rừng sâu.","death":"Cú vồ ngàn cân đập nát lồng ngực mảnh khảnh, dập tắt mọi hoài bão rực rỡ của tuổi trẻ vào năm bạn vừa tròn {age} tuổi."}},{"label":"Nín thở giả chết trên vũng bùn","text":"Bạn nằm rạp xuống bùn lầy, ép tim đập chậm lại vờ như một cái xác vô hồn. Con thú khịt mũi ngửi ngáp vài vòng rồi bỏ đi, để lại bạn run lẩy bẩy trong cơn sợ hãi tột độ kéo dài hàng giờ.","effects":{"health":-5,"joy":-12,"LUCK":1}}]},{"id":"human_teen_blacksmith_apprentice","races":["human"],"stages":["teen"],"weight":6,"text":"Bạn bắt đầu theo học nghề tại Lò Rèn Vĩnh Cửu, nhịp búa đập xuống đe vang lên đều đặn như nhịp tim của nhân loại. Từng thớ cơ bắp săn lại theo đốm lửa hồng, rèn luyện nên đôi tay vững chãi gánh vác tương lai.","effects":{"STR":1,"wealth":5,"flags":["smith","job"]},"moment":"Học nghề thợ rèn tại Lò Rèn Vĩnh Cửu."},{"id":"human_teen_clerk_desk","races":["human"],"stages":["teen"],"weight":6,"text":"Đống văn thư sổ sách ngập tràn trên bàn làm việc của tòa thị chính Sanctus rèn giũa sự cẩn trọng từng con chữ ở bạn. Trí tuệ sắc sảo dần hình thành từ những bảng thống kê thuế khóa và hiệp ước ngoại giao.","effects":{"INT":1,"wealth":4,"flags":["clerk","job"]},"moment":"Trở thành thư lại mẫn cán tại thủ đô Sanctus."},{"id":"human_teen_forest_hunt_danger","races":["human"],"stages":["teen"],"once":false,"weight":5,"text":"Trong một chuyến đi săn đơn độc giữa Đại Ngàn Lục Bảo, bạn vô tình sập bẫy của lâm tặc tàn ác. Sự nhạy bén giúp bạn tháo gỡ dây trói trong gang tấc trước khi màn đêm quái ác nuốt chửng.","effects":{"AGI":1,"health":-5}},{"id":"human_teen_arena_debut","races":["human"],"stages":["teen"],"eras":["demon_lord"],"weight":7,"text":"Tiếng hò reo inh ỏi tại Đấu Trường Huyết Sa vang lên khi bạn bước chân vào lôi đài tử chiến. Máu tuôn rơi dưới ánh đuốc bập bùng, mài giũa bản lĩnh sắt đá của một chiến binh sống sót.","effects":{"STR":1,"health":-8,"wealth":10}},{"id":"human_teen_starry_night_promise","races":["human"],"stages":["teen"],"require":{"flags":["first_love"]},"weight":6,"text":"Dưới bầu trời rải rác sao Tinh Bạc, bạn và người thương trao nhau lời hẹn ước sẽ cùng nhau vượt qua giông bão thời đại. Hơi ấm bàn tay nắm chặt là điểm tựa tinh thần vững chắc nhất giữa cõi đời bấp bênh.","effects":{"joy":12,"flags":["partner"]}},{"id":"human_teen_merchant_loss","races":["human"],"stages":["teen"],"require":{"flags":["merchant_kin"]},"weight":6,"text":"Một đoàn xe buôn của gia đình bị bọn cướp sa mạc tấn công, cướp sạch sành sanh hàng hóa quý giá. Cú sốc tài chính đầu đời đẩy gia đình bạn vào cảnh nợ nần túng quẫn.","effects":{"wealth":-20,"joy":-10,"flags":["poor"]}},{"id":"human_teen_ruin_trap","races":["human"],"stages":["teen"],"weight":9,"text":"Khi đang thám hiểm lăng mộ cổ trên Đảo Tro Tàn, đôi chân bạn vô tình giẫm phải một phiến đá lún xuống, kích hoạt cơ chế phóng ra hàng loạt mũi tên tẩm độc từ vách tường.","choices":[{"label":"Dùng khiên gỗ đỡ và nhảy lùi","check":{"stat":"AGI","target":6},"success":{"text":"Phản xạ xuất thần giúp bạn giơ khiên chắn ngang, những mũi tên cắm phập vào gỗ sát mặt. Kinh nghiệm sinh tử làm tăng thêm bản lĩnh của một kẻ mạo hiểm thực thụ.","effects":{"AGI":1,"LUCK":1,"wealth":15}},"fail":{"text":"Tốc độ không đủ nhanh để né tránh loạt sát khí, một mũi tên độc đâm thủng vai trái khiến máu đen phun xối xả.","effects":{"health":-20,"joy":-10}}},{"label":"Ném mình lao đại về phía trước","text":"Bạn nhắm mắt lao bổ qua khoảng trống hẹp, may mắn thoát khỏi làn mưa tên nhưng va đập mạnh vào cột đá khiến đầu óc quay cuồng.","effects":{"health":-10,"joy":-5}}]},{"id":"human_teen_dark_whisper_tempt","races":["human"],"stages":["teen"],"require":{"flags":["dark_magic"]},"weight":7,"text":"Thế lực hắc ám trong cơ thể bắt đầu phản chủ, thì thầm những lời xúi giục tàn độc trong các giấc ngủ mộng mị của bạn.","choices":[{"label":"Dùng ý chí áp chế sức mạnh tà ác","check":{"stat":"INT","target":7},"success":{"text":"Sự kiên định của trí tuệ con người đã thuần hóa được phần hồn ma quỷ, biến nguồn năng lượng hắc ám thành vũ khí độc lập dưới quyền kiểm soát của bạn.","effects":{"INT":2,"joy":5}},"fail":{"text":"Tâm trí bị lu mờ trước sức mạnh hủy diệt, bạn vô tình ra tay sát hại một người thân thiết trong lúc vô thức, để lại vết nhơ tâm lý vĩnh viễn không thể xóa nhòa.","effects":{"joy":-25,"INT":-1,"flags":["guilt"]}}},{"label":"Thuận theo dòng chảy hắc ám","text":"Bạn buông lỏng phòng thủ, chấp nhận để bản ngã bị bóp méo bởi ma lực tà giáo. Sức mạnh thể chất tăng vụt nhưng nhân tính ngày càng phai nhạt.","effects":{"STR":2,"joy":-15}}]},{"id":"human_teen_tax_collector_conflict","races":["human"],"stages":["teen"],"require":{"flags":["poor"]},"weight":8,"text":"Tên thu thuế của lãnh chúa ngang ngược xông vào nhà, tịch thu nồi niêu xoong chảo vì gia đình không còn tiền nộp thuế. Cơn phẫn nộ bùng cháy trong lồng ngực gã thiếu niên nghèo khó.","choices":[{"label":"Đứng lên đấm thẳng vào mặt tên thu thuế","check":{"stat":"STR","target":5},"success":{"text":"Cú đấm trời giáng khiến tên quan lại ngã ngửa làm rơi tút túi tiền. Bạn vơ lấy rồi cùng gia đình trốn chạy vào rừng sâu, chính thức trở thành kẻ ngoài vòng pháp luật.","effects":{"STR":1,"wealth":15,"flags":["outlaw"]},"moment":"Phản kháng quan lại, bước vào con đường ngoài vòng pháp luật."},"fail":{"text":"Bọn lính hộ vệ can thiệp kịp thời, giáng cho bạn một trận đòn nhừ tử rồi ném vào ngục tối tối tăm hôi hám.","effects":{"health":-15,"joy":-15}}},{"label":"Nhẫn nhịn quỳ lạy van xin","text":"Bạn cắn răng nuốt nhục cúi đầu xin xỏ, chấp nhận nhường lại chút tài sản mọn để đổi lấy sự bình yên giả tạo cho gia đình.","effects":{"joy":-12,"wealth":-5}}]},{"id":"human_adult_adventurer_routine","races":["human"],"stages":["adult"],"require":{"flags":["adventurer"]},"weight":7,"text":"Khoác lên mình bộ giáp da sờn vai, bạn nhận nhiệm vụ tiêu diệt bầy quái vật hoành hành ở ngoại ô Đồng Bằng Thánh Quang. Đời mạo hiểm giả là chuỗi ngày đong đếm sinh mệnh bằng những đồng Huyết Kim lạnh lẽo.","effects":{"STR":1,"wealth":12,"health":-5}},{"id":"human_adult_mage_study","races":["human"],"stages":["adult"],"require":{"flags":["mage"]},"weight":7,"text":"Hàng đêm chong đèn nghiên cứu những cổ thư cấm kỵ tại Tháp Ma Pháp Bạch Ngà, bạn dần lĩnh hội được những tầng ma pháp uy lực. Tri thức nhân loại là chiếc chìa khóa mở cánh cửa đến cõi vĩnh hằng.","effects":{"INT":2,"joy":8}},{"id":"human_adult_smith_work","races":["human"],"stages":["adult"],"require":{"flags":["smith"]},"weight":7,"text":"Từng tiếng búa đanh thép giáng xuống đe rèn nên những thanh bảo kiếm sắc bén phục vụ cho chiến tranh. Công việc vất vả nhưng mang lại sự kính trọng và thu nhập ổn định giữa thời buổi loạn lạc.","effects":{"STR":1,"wealth":15,"health":-3}},{"id":"human_adult_clerk_promotion","races":["human"],"stages":["adult"],"require":{"flags":["clerk"]},"weight":7,"text":"Nhờ sự mẫn cán và tài tính toán không sai một chữ, bạn được cất nhắc lên làm chủ quan tài chính của thành phố Sanctus. Quyền lực nằm gọn trong những con số và sổ sách.","effects":{"INT":1,"wealth":20,"joy":5}},{"id":"human_adult_marriage","races":["human"],"stages":["adult"],"require":{"flags":["partner"],"notFlags":["married"]},"weight":8,"text":"Dưới sự chứng kiến của người thân và bạn bè, bạn chính thức kết hôn với người mình yêu tại ngôi nhà nhỏ ven đô. Giữa lục địa đẫm máu này, việc xây dựng một mái ấm là minh chứng rực rỡ cho khát vọng sống của con người.","effects":{"joy":25,"wealth":-10,"flags":["married"]},"moment":"Kết hôn và xây dựng tổ ấm riêng."},{"id":"human_adult_holy_war_conscription","races":["human"],"stages":["adult"],"eras":["holy_war"],"weight":8,"text":"Chiến Tranh Tuyến Đầu bùng nổ quy mô lớn, sắc lệnh trưng binh ép bạn phải từ bỏ gia đình để ra trận tuyến phía bắc. Áo giáp sắt lạnh toát đè nặng lên đôi vai của một người trưởng thành.","effects":{"STR":1,"health":-10,"joy":-12,"flags":["frontline_soldier"]}},{"id":"human_adult_plague_outbreak","races":["human"],"stages":["adult"],"eras":["dark_age"],"weight":8,"text":"Dịch bệnh hắc tử thần lan rộng khắp
