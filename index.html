<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luân Hồi Dị Giới</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;1,400&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <audio id="bgm" src="audio/bgm.mp3" loop preload="none"></audio>
    <button id="btn-music" class="music-toggle" type="button" title="Nhạc nền: Adventure – Alexander Nakarada (royalty-free)" aria-label="Bật/tắt nhạc nền">♪</button>
    <!-- Start -->
    <section id="screen-start" class="screen">
      <p class="eyebrow">Một linh hồn vừa rời khỏi thế giới cũ</p>
      <h1>Luân Hồi Dị Giới</h1>
      <p class="lede">Bạn không được chọn mình sẽ là ai. Bạn chỉ được chọn mình sẽ sống thế nào.</p>
      <button id="btn-start" class="btn primary">Đầu thai</button>
      <details class="odds">
        <summary>Tỉ lệ đầu thai</summary>
        <ul id="odds-list"></ul>
      </details>
      <div id="past-lives"></div>
    </section>

    <!-- Reveal -->
    <section id="screen-reveal" class="screen" hidden>
      <p class="eyebrow">Bạn là</p>
      <h1 id="reveal-name"></h1>
      <p class="race-line">thuộc chủng tộc <b id="reveal-race"></b></p>
      <p id="reveal-gloss" class="gloss"></p>
      <p id="reveal-odds" class="lede"></p>
      <p id="reveal-origin" class="origin"></p>
      <ul id="reveal-family" class="family" hidden></ul>
      <p id="reveal-desc" class="lede"></p>
      <button id="btn-begin" class="btn primary">Bắt đầu cuộc đời</button>
    </section>

    <!-- Life -->
    <section id="screen-life" class="screen" hidden>
      <div class="hud-wrap" id="hud-wrap">
      <header class="hud">
        <div id="hud-sprite" class="sprite-hud" aria-hidden="true" hidden><div class="sprite-frame"></div></div>
        <div class="who">
          <span id="hud-name" class="name"></span>
          <span id="hud-meta" class="meta"></span>
        </div>
        <div class="age">
          <span id="hud-age" class="age-num"></span>
          <span id="hud-stage" class="meta"></span>
        </div>
      </header>
      <div class="bars" id="hud-bars"></div>
      <div class="stats" id="hud-stats"></div>
      </div>
      <div class="profile" id="hud-profile"></div>
      <ol id="log" class="log" aria-live="polite"></ol>
      <div id="choices" class="choices"></div>
      <footer class="actions">
        <div id="focus-bar" class="focus-bar"></div>
        <button id="btn-next" class="btn primary wide"></button>
      </footer>
    </section>

    <!-- Death -->
    <section id="screen-death" class="screen" hidden>
      <figure id="life-card" class="life-card">
        <p class="lc-eyebrow">Luân Hồi Dị Giới · một kiếp người</p>
        <h2 id="lc-name"></h2>
        <p id="lc-line" class="lc-line"></p>
        <ul id="lc-marks" class="lc-marks"></ul>
        <blockquote id="lc-epitaph" class="lc-epitaph"></blockquote>
        <p id="lc-cause" class="lc-cause"></p>
      </figure>
      <div class="row lc-actions">
        <button id="btn-copy-life" class="btn" type="button">Sao chép cuộc đời</button>
        <button id="btn-save-card" class="btn" type="button">Lưu ảnh</button>
      </div>
      <p id="lc-note" class="meta center" hidden></p>
      <p class="eyebrow" hidden>Cuộc đời kết thúc</p>
      <h1 id="death-name" hidden></h1>
      <p id="death-meta" class="meta center" hidden></p>
      <p id="death-cause" class="cause" hidden></p>
      <blockquote id="death-epitaph" class="epitaph" hidden></blockquote>
      <div id="death-bio" class="bio" hidden></div>
      <ul id="death-profile" class="death-profile"></ul>
      <h2 class="small-head">Những khoảnh khắc</h2>
      <ul id="death-moments" class="moments"></ul>
      <div class="row">
        <button id="btn-again" class="btn primary">Đầu thai lần nữa</button>
        <button id="btn-review" class="btn">Xem lại cuộc đời</button>
      </div>
    </section>
  </main>

  <script src="engine.js"></script>
  <script src="data.js"></script>
  <script src="ui.js"></script>
</body>
</html>
